  - id: OBS-005
    title: Implement SLO definitions, burn-rate evaluation, and alert signal generation
    goal: Detect operational degradation with declared, versioned objectives while keeping final containment/deployment authority
      in owning controllers.
    implementation:
    - Define SLOs over authoritative metric/event/evidence mappings with scope, objective, window, error budget, slices/cohorts,
      missing-data semantics, and severity.
    - Implement multi-window burn-rate, threshold, freshness, and sequence evaluators as deterministic plugins; produce signed
      `SLOSignal`s.
    - Cover control-plane availability, trace/evidence durability, scheduler admission, inference/agent responsiveness, training
      checkpoint progress, eval completion, data freshness/quality, rollout health, and physical safety response.
    - Route signals to Incident/Deployment/Fleet with deduplication and reason/evidence refs; those services decide actions
      under policy.
    - Version SLO definitions and preserve historical evaluation so moving targets cannot rewrite incident history.
    anti_drift:
    - Do not let an observability alert directly deploy, kill, or approve.
    - Do not treat missing telemetry as healthy.
    - Do not define only platform SLOs and ignore agent behavior/safety/value indicators.
    integration:
    - Incident ingests signal; Deployment health consumes; Gate may require SLO evidence; Change governs definitions.
    validation:
    - G47, G66, G67, G70, G73, G75, G80, G87, and G88 test burn, missing data, duplicate alerts, and authority separation.
    dependencies:
    - OBS-004
    - INC-002
    - DEP-008
    gold_examples:
