    title: Validate exporter scale, cardinality, lag, and failure isolation at 1,000-device fleet size
    goal: Prove observability remains useful under mixed high-rate agent/training/physical traffic without destabilizing the
      runtime.
    implementation:
    - Build load fixtures for 1,000 heterogeneous nodes, persistent agent ticks, model calls, distributed collectives/checkpoints,
      data/eval jobs, deployments, and physical telemetry bursts.
    - Measure event-to-export lag, throughput, queue memory/disk, CPU/network overhead, drop/redaction counts, destination
      cost, and recovery after outage.
    - Enforce cardinality budgets and detect accidental run/action/percept IDs as metric labels before production.
    - Verify critical audit/event durability remains isolated from exporter overload and that local physical safety signals
      remain available offline.
    - Set explicit tested envelopes and degradation behavior; do not claim unbounded scale from one benchmark.
