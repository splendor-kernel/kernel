    title: Document and enforce observability non-authority and evidence conversion boundaries
    goal: Prevent external metrics, dashboards, or alerts from quietly becoming kernel truth.
    implementation:
    - Mark every exported record as projection with source refs, transform version, freshness, aggregation, and redaction
      metadata.
    - Require any metric used by Gate/Deployment/Incident to be generated as or traceably converted into an EvidenceBundle/SLOSignal
      by an authorized evaluator—not scraped back from an external backend.
    - Define ingestion of external monitors as typed `ExternalSignal` with issuer/trust/uncertainty, never as direct state
      mutation.
    - Prohibit exporter credentials from submitting actions, work orders, approvals, gate decisions, deployments, or incident
      containment.
