  - id: OBS-002
    title: Implement subscription, filtering, transformation, and export receipts
    goal: Export selected records reliably without coupling kernel progress to external monitoring availability.
    implementation:
    - Define subscriptions by tenant/scope, record type, schema/version, fields, aggregation, rate, destination, retention,
      redaction profile, and delivery semantics.
    - Read through Event/Evidence/State query APIs or durable outbox cursors; never tail internal database tables as a public
      contract.
    - Transform deterministically, batch/compress, retry with bounded backoff, checkpoint cursor, and emit ExportReceipts
      including drops, redactions, lag, and destination acknowledgement.
    - Define at-least-once export with downstream deduplication IDs by default; support best-effort metrics and stronger audit
      export as separate profiles.
    - Apply backpressure/drop policy by priority so exporter failure cannot block required-before-effect kernel events.
    anti_drift:
    - Do not make an external SaaS outage stop local physical safety or core state commit unless an explicit audit policy
      requires it.
    - Do not silently drop critical audit records under metric pressure.
    - Do not claim exactly-once across arbitrary external backends without protocol support.
    integration:
    - Event/Evidence provide cursors; Secret Broker supplies destination credentials; Driver Registry loads exporter providers.
    validation:
    - Fault tests cover duplicate delivery, backend outage, cursor corruption, restart, schema change, overload, and priority
      isolation.
    - G14, G47, G66, G73, G75, and G87 exercise export degradation.
    dependencies:
    - OBS-001
    - EVT-006
    - SECR-003
    - DRREG-001
    gold_examples:
    - G14
    - G47
    - G66
    - G73
    - G75
    - G87
  - id: OBS-003
    title: Implement privacy, redaction, protected-eval, and secret-safe export controls
    goal: Prevent observability from becoming an uncontrolled data exfiltration path.
    implementation:
    - Classify telemetry fields by public/internal/sensitive/secret/protected-eval/personal/physical-location and bind export
      to DataUse/Authority policy.
    - Redact, hash/tokenize, bucket, aggregate, sample, or suppress fields before they leave the trusted boundary; destination
      trust class constrains allowed fields.
    - Detect credentials/tokens and raw percept/action/model outputs in logs/attributes using structured schema controls plus
      defense-in-depth scanners.
    - Protect small cohorts/rare slices and location trajectories using minimum aggregation/privacy policy; retain exact evidence
      only in authorized stores.
    - Record redaction decisions and make export configuration itself a governed change.
    anti_drift:
    - Do not rely on developers remembering not to log secrets.
    - Do not export protected evaluation prompts/answers or raw human feedback by default.
    - Do not claim irreversible anonymization from simple hashing.
    integration:
    - Data Use supplies purpose/destination policy; Secret Broker marks values; Evidence holds exact records; Change/Gate
      govern profiles.
    validation:
    - G09, G14, G38, G44, G64, G70, G73, G80, and G86 inject secrets, personal data, protected eval, small cohorts, and location
      data.
    dependencies:
    - OBS-002
    - DUC-001
    - SECR-006
    - FND-009
    gold_examples:
