- id: INT-008
  title: Compose the complete physical-AI and world-model runtime path
  goal: Prove domain-agnostic percept, belief/world, neuro-symbolic route, verified actuator, learning, simulation, and deployment
    primitives without claiming hard-real-time control.
  implementation:
  - Connect timestamped multi-modal perceptors with calibration/provenance/quality to a versioned world-state service supporting
