- id: NOV-006
  title: Implement the novelty, reproducibility, and claim-discipline protocol
  goal: Make research claims falsifiable and distinguish new systems evidence from reimplementation, integration, or speculation.
  implementation:
  - For each claimed contribution, state the mechanism, closest baselines/related systems, expected measurable difference,
    null hypothesis, scope, and what result would falsify or weaken the claim.
  - Pre-register primary/secondary metrics, hard roots, datasets/environments, protected suites, seeds, resource budget, stop
    rules, ablations, statistical analysis, and exclusion handling before final runs.
  - Require complete artifact/data/code/environment/config/evaluator/gate/deployment lineage and runnable gold manifests;
    publish failed/negative runs and deviations.
  - 'Separate claim tiers: implemented architecture, conformance demonstration, controlled experiment, multi-domain replication,
    real-world evidence, independent replication, and open hypothesis.'
  - Compare against strong component and system baselines, including manually orchestrated pipelines and existing distributed/runtime
    frameworks where relevant; do not choose strawmen.
  - Have independent reviewers/evaluators inspect protected evidence and claim wording for high-impact results; disclose conflicts,
    unavailable hardware, and simulator limitations.
  - 'Phrase the central target cautiously: evidence that a kernelized primitive substrate improves interoperability, controllability,
    reproducibility, and bounded evolution—not proof that Splendor solves general intelligence or value alignment.'
  anti_drift:
  - Do not use “first”, “solved”, “aligned”, “safe”, or “self-evolving” without defined scope/evidence.
  - Do not post-select metrics/seeds/ablations.
  - Do not treat a large architecture document as novelty evidence.
  - Do not suppress null/negative results.
  integration:
  - Evidence/Lineage/Gold runner and research artifacts; external literature review remains a maintained research process.
  validation:
  - NOV-001–NOV-005 each produce a claim matrix, preregistration, baselines, ablations, reproducibility package, limitations,
    and independent-review status.
  dependencies:
  - IMPR-010
  - INT-010
  - NOV-005
