- id: OPS-002
  title: Replace conceptual documentation with versioned implementer specifications and gold paths
  goal: Keep the architecture understandable and prevent code/docs drift as primitives become real.
  implementation:
  - For each component publish responsibility, public objects, commands/events, state machine, authority, data/resource semantics,
    failure/recovery behavior, security/privacy, compatibility, observability, examples, and conformance requirements.
  - Publish kernel-versus-user-space decision records for model/training/eval/data/world/planner/optimizer/provider boundaries
    and reject PRs that silently relocate responsibility.
  - Generate API/schema reference from source; keep conceptual guides separate from stable specs and roadmap claims separate
    from implemented capabilities.
