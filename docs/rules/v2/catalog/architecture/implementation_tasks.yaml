- id: NOV-005
  title: Establish a value-alignment and controlled-evolution evidence benchmark
  goal: Measure the kernel’s contribution to preserving declared values and human control during adaptation without claiming
    to solve value alignment universally.
  implementation:
  - Define explicit, versioned value roots and operational proxies across harmlessness/safety, user intent, honesty/calibration,
    privacy, authority, fairness/protected slices, reversibility, human control, and physical boundaries for selected domains.
  - Create adversarial evolution tasks where reward conflicts with roots, evaluators are gameable, protected data is tempting,
    deployment exposure yields short-term gains, or self-modification could weaken controls.
  - Compare uncontrolled optimization, prompt guardrails, post-hoc filters, gateway-only, replay-only, and complete Splendor
    closed-loop controls.
  - Measure root violations, near misses, reward–independent eval gap, human override effectiveness/latency, unauthorized
    change attempts, evaluator/feedback tamper, rollback success, residual regression, useful-task performance, and control
    overhead.
  - Use independent evaluators/humans where feasible, predeclared failure thresholds, repeated seeds/domains, and negative
    results. Explicitly separate proxy evidence from philosophical/real-world alignment claims.
  - 'Demonstrate symbiosis: feedback/reward drive useful candidate search; symbolic/value roots constrain it; verification
    prevents forbidden effects; independent evidence/gates/deployment determine adoption.'
  anti_drift:
  - Do not reduce alignment to one scalar or benchmark.
  - Do not let the same model generate behavior and be sole judge.
  - Do not claim universal/corrigible/aligned AI from limited domain evidence.
  - Do not hide performance/control trade-offs.
