  - id: INC-009
    title: Implement game days and cross-plane failure drills
    goal: Demonstrate that containment and recovery work under realistic multi-failure conditions before relying on them for
      autonomous evolution.
    implementation:
    - Define signed drill plans with target test/staging scope, injected faults, safety exclusions, observers, expected signals,
      containment/rollback deadlines, and abort controls.
    - Inject node loss, network partition, stale leader, corrupted checkpoint/state/trace, poisoned data, compromised evaluator,
      leaked protected split, malicious driver/image, policy revocation, runaway training, live inference starvation, unsafe
      physical proposal, and rollback failure.
    - Measure detection latency, containment coverage, acknowledgement, evidence completeness, recovery time, false positives,
      and operator load.
    - Run local deterministic fixtures continuously and larger fleet/physical drills on governed schedules; production drills
      require explicit approval and blast-radius limits.
    - Feed failures into IncidentLesson and gate readiness evidence; failed drills block relevant autonomous risk levels.
    anti_drift:
    - Do not run destructive chaos experiments without scope/abort authority.
    - Do not prewire detectors only to the exact injected event path.
    - Do not call tabletop discussion equivalent to executable recovery evidence.
    integration:
    - Workload/Fleet/Node/Sandbox/Data/Eval/Deployment/Physical Simulation inject; Incident coordinates and Evidence records.
    validation:
    - G66, G69, G70, G73, G75, G80, and G86–G89 form the mandatory drill matrix.
    dependencies:
    - INC-001
    - FND-005
    - DEP-007
    - GATE-010
    gold_examples:
    - G66
    - G69
    - G70
    - G73
    - G75
    - G80
    - G86
    - G87
    - G88
    - G89
  completion_gate:
  - Incidents span all planes, have explicit uncertainty/lifecycle, and invoke containment only through authorized enforcement
    services.
  - Evidence preservation and lineage-based blast radius survive compromise, offline nodes, and controller failure.
  - Recovery uses normal controlled change/deployment paths; incident data never becomes learning data implicitly; executable
    game days prove response.
- id: splendor.observability-exporter
  name: Observability Exporter
  plane: event_state_evidence
  current_status: Partial telemetry/trace export exists, but no unified typed metrics/log/trace/evidence export boundary with
    privacy, cardinality, and non-authority rules.
  current_baseline: The repository has trace stores, trace aggregation, fleet telemetry snapshots, daemon inspection, and
    audit export. These remain authoritative kernel records. The exporter must derive external telemetry from them without
    becoming a second truth source or leaking sensitive/percept/eval/secret payloads.
  owner_package: crates/splendor-evidence
  kernel_boundary: Owns subscription, transformation, redaction, aggregation, sampling, and export to external observability
    backends. It cannot authorize, gate, schedule, mutate state, or replace durable event/evidence stores. Alerts from exporters
    are signals only until evaluated by the owning service.
  public_contracts:
  - TelemetrySubscription
  - MetricDescriptor
  - TelemetryRecord
  - ExportPolicy
  - RedactionProfile
  - AggregationWindow
  - ExporterDriver
  - ExportReceipt
  - SLODefinition
  tasks:
  - id: OBS-001
    title: Define the canonical telemetry taxonomy and semantic conventions
    goal: Make metrics and operational signals comparable across agent, data, training, evaluation, fleet, physical, and governance
      planes.
    implementation:
    - Define names, units, dimensions, monotonicity, aggregation, allowed cardinality, temporality, and source event/evidence
      mapping for each metric family.
    - Cover workload queue/run/attempt/lease, node/device capacity/health, agent ticks/routes/messages/state, model inference,
      trainer/checkpoint/collective, dataset/collection/quality, feedback/reward/eval, change/gate/deployment/incident, gateway/actions,
      and physical safety.
    - Distinguish counters, gauges, histograms/distributions, event summaries, traces, logs, evidence references, and SLO
      calculations rather than flattening all into logs.
    - Version semantic conventions and define compatibility/deprecation so dashboards/alerts cannot silently reinterpret a
      metric.
    - Carry stable low-cardinality IDs or pseudonymous cohort refs; high-cardinality object identities remain trace/evidence
      links, not default metric labels.
    anti_drift:
    - Do not expose arbitrary user payload fields as labels.
    - Do not use one overloaded “reward” or “success” metric across agents/evaluators.
    - Do not treat exported metric values as authoritative state mutations.
    integration:
    - All services emit typed events/evidence; exporter maps to conventions; SDK/adapters can register namespaced non-authoritative
      metrics.
    validation:
    - Schema/golden tests validate units, cardinality, aggregation, compatibility, and forbidden labels.
    - G01–G89 must emit defined coverage without raw payload leakage.
