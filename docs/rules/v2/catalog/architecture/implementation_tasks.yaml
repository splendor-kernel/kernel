    - G80
    - G86
    - G87
    - G88
    - G89
  - id: INC-005
    title: Implement lineage-based blast-radius and compromise propagation
    goal: Identify every model, dataset, evaluation, agent, deployment, or device that may inherit a compromised dependency.
    implementation:
    - Traverse forward and backward lineage from implicated data sources, code/images/drivers, model/checkpoints, reward/evaluator
      definitions, worker attestations, policy roots, secrets, and state migrations.
    - Intersect lineage with active deployment/agent/fleet inventory and historical exposure to produce affected, potentially
      affected, and cleared sets with reasons.
    - Invalidate or quarantine derived EvidenceBundles, candidates, ChangeSets, GateDecisions, and deployments according to
      policy; preserve immutable history.
    - Handle incomplete lineage conservatively and create follow-up evidence tasks rather than marking unknown descendants
      safe.
    - Update impact as late-arriving offline events or new compromise indicators arrive and reopen incidents when necessary.
    anti_drift:
    - Do not invalidate all artifacts globally when scoped evidence exists.
    - Do not clear a descendant solely because its metric looked normal.
    - Do not mutate historical gate decisions; attach invalidation status.
    integration:
    - Lineage provides graph; Artifact/Evidence/Gate/Deployment/Data Use apply quarantine/revocation.
    validation:
    - G39, G47, G64, G69, G70, G73, G76, G86–G89 cover poisoned data, compromised evaluator/worker/image, incomplete lineage,
      and late device sync.
    dependencies:
    - INC-004
    - LIN-005
    - EVID-005
    gold_examples:
    - G39
    - G47
    - G64
    - G69
    - G70
    - G73
    - G76
    - G86
    - G87
    - G88
    - G89
  - id: INC-006
    title: Implement investigation workspaces and controlled diagnostic workloads
    goal: Let humans and agents investigate safely without giving incident tooling uncontrolled access to production or protected
      evidence.
    implementation:
    - Create scoped investigation work orders with read-only evidence/data refs, bounded sandbox/network/tools, expiration,
      audit, and optional two-person access for sensitive material.
    - Run queries, replay/simulation, model/eval reproduction, code analysis, and device diagnostics as ordinary WorkloadSpecs
      under resource/data-use controls.
    - Support hypotheses, findings, confidence, disconfirming evidence, and causal graph updates as immutable investigation
      records.
    - Require gateway verification for any diagnostic action against a live service/device and default to simulation/read-only.
    - Separate agent-generated analysis from confirmed facts and human/external determinations.
    anti_drift:
    - Do not grant shell/database/cluster access simply because an incident is severe.
    - Do not let diagnostic workloads write to original data/state.
    - Do not use an LLM narrative as the root-cause fact record.
    integration:
    - Sandbox/Replay/Workload/Data Use/Authority provide bounded environment; Evidence records outputs.
    validation:
    - G19–G25, G47, G70, G75, G80, G86–G89 run reproducible investigation with denied privilege escalation and preserved uncertainty.
    dependencies:
    - INC-004
    - SBX-001
    - RPLY-004
    - AUTH-003
