- id: OPS-001
  title: Harden the complete system for production security, reliability, and supply chain
  goal: Ensure the research/runtime architecture can operate persistently without hidden privileged bypasses.
  implementation:
  - Threat-model every trust boundary and implement workload identity, mTLS, least privilege, secret leasing, key rotation,
    revocation, signed artifacts/policies/work orders/drivers, SBOM/provenance, and dependency vulnerability handling.
  - Run core services redundantly with explicit consistency, backup/restore, schema migration, disaster recovery, capacity
    planning, overload/backpressure, and region/node failure behavior.
  - Sandbox all untrusted user/plugin/provider code and enforce filesystem/network/device/data/cgroup/namespace/seccomp/container/Kubernetes
    policies appropriate to platform.
  - Implement security audit, tamper-evident events/evidence, protected-data access review, retention/deletion/legal hold,
    and incident response.
  - Perform penetration tests and adversarial driver/data/eval/worker/control-plane exercises; independently review high-risk
    physical and self-evolution paths.
  - Document tested support envelopes and unsupported claims; a development adapter or simulation is not production certification.
  anti_drift:
  - Do not defer security as deployment configuration only.
  - Do not let one control-plane compromise confer artifact, data, gate, and deployment authority.
  - Do not call encryption/containers alone a complete security model.
