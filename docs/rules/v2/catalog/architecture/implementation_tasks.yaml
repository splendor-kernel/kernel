  - id: INC-008
    title: Implement closure, lessons, policy updates, and gold regression extraction
    goal: Turn incidents into durable improvements without silently training on incident data or rewriting history.
    implementation:
    - 'Require closure criteria: containment complete/accepted residual scope, root/contributing causes with evidence confidence,
      exposure/harm assessment, recovery verification, outstanding actions, and accountable approvals.'
    - Create `IncidentLesson` objects proposing detector, constraint, eval slice, data quality check, gate clause, driver
      conformance, rollback drill, documentation, or architecture changes.
    - Route each proposed lesson through the appropriate ChangeSet and data-use process; incident data becomes training/eval
      data only after collection consent, purpose, minimization, split protection, and lineage are established.
    - Extract sanitized regression fixtures/gold scenarios that reproduce the failure without leaking secrets/protected eval
      answers or personal data.
    - Track action completion and recurrence statistics; reopening links to prior incident and invalidates overconfident closure
      assumptions.
    anti_drift:
    - Do not auto-add raw incident transcripts/sensor/user data to training corpora.
    - Do not force one root cause when evidence supports multiple/unknown causes.
    - Do not measure success only by ticket closure.
    integration:
    - Collection/Data Use/Data Operator/Eval/Change receive proposed lessons; Gold catalog gains versioned fixtures.
    validation:
    - G39, G47, G64, G69, G70, G73, G76, and G86–G89 produce sanitized regression cases and reject unauthorized training reuse.
    dependencies:
    - INC-007
    - COLL-006
    - DUC-002
    - CHG-001
    gold_examples:
    - G39
    - G47
    - G64
    - G69
