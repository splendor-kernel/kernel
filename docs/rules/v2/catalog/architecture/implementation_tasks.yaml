- id: NOV-003
  title: Run world-model and neuro-symbolic self-evolution experiments
  goal: Test whether explicit world state plus neural predictions, symbolic control, boundary verification, and feedback can
    evolve more safely and effectively than monolithic policy-only agents.
  implementation:
  - Build gridworld and simulated robotics environments with ground-truth state available only to evaluators, multi-modal/noisy
    perceptors, delayed outcomes, irreversible hazards, and distribution shifts.
  - 'Implement interchangeable world components: symbolic state graph, Bayesian belief, learned latent transition/predictor,
    memory/retrieval, and hybrid reconciler; all publish uncertainty/provenance.'
  - 'Implement route variants: neural-only, symbolic-only, post-hoc guardrail, and Splendor neuro-symbolic runtime with planner/solver/rules
    before gateway verification.'
  - Allow Improvement Controller to propose world schema/component, model, route, perceptor fusion, planner parameters, and
    data collection changes subject to compatibility/risk/gates.
  - Evaluate prediction/calibration/state consistency, planning success, constraint/safety violations, sample efficiency,
    recovery from percept fault, OOD shift, uncertainty-triggered abstention/HIL, and physical-action boundary behavior.
  - Run multi-cycle adaptation with protected environments/seeds and sim-to-real or hardware-in-loop evidence where available;
    rollback candidates that exploit simulator/evaluator artifacts.
  - Ablate world model, symbolic route, gateway verification, feedback, and explicit state to locate where gains/control arise.
  anti_drift:
  - Do not claim neuro-symbolic superiority from one environment.
  - Do not expose evaluator ground truth to the agent.
  - Do not let the learned model redefine hard environment/safety facts.
