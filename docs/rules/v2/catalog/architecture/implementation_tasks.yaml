    title: Implement dashboards, query views, and cost/chargeback as non-authoritative projections
    goal: Give operators usable fleet and evolution views while keeping exact decisions anchored in kernel evidence.
    implementation:
    - Provide versioned query/view definitions for fleet capacity, mixed workloads, persistent agents, data lineage/quality,
      feedback/reward/eval, training, improvement cycles, gates/deployments/incidents, and physical device safety.
    - Display source freshness, missing data, sampling/redaction, aggregation, policy version, and drill-down evidence refs
      on every decision-relevant view.
    - Compute resource/cost/carbon/energy estimates from leases and provider reports with units, uncertainty, and allocation
      policy; keep billing/financial authority external.
    - Provide comparative baseline/candidate and multi-cycle convergence views without exposing protected eval answers or
      allowing dashboard-selected metrics to redefine gates.
