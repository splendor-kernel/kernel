  - id: OBS-004
    title: Implement workload, training, evaluation, and inference coexistence observability
    goal: Expose enough causal resource information to protect live inference while using fleet slack for training/eval/data
      work.
    implementation:
    - Export requested/leased/actual CPU/GPU/accelerator memory, utilization, thermal/power, network/storage, collective time,
      data wait, checkpoint time, preemption, queue age, priority, deadline, and reservation debt per workload class/compatibility
      group.
    - Measure live inference latency/throughput/error/queue/cache/model-load and physical control deadlines separately from
      batch workloads.
    - Correlate training/eval/data workload starts and resource pressure with inference/physical SLO changes without treating
      correlation as causation.
    - Expose scheduler decisions/reason codes, fragmentation, stranded capacity, preemption overhead, and unschedulable requirements.
    - Publish fleet aggregate views that remain meaningful across heterogeneous devices and avoid averaging away critical
      device-local failures.
    anti_drift:
    - Do not infer GPU availability from utilization alone; account for memory/reservations/thermal/locality.
    - Do not use metrics to bypass Scheduler lease truth.
    - Do not hide tail latency behind averages.
    integration:
    - Node/Fleet/Workload/Trainer/Model emit; Evidence/SLO definitions consume; exporters visualize.
    validation:
    - G50–G59, G66, G70, G73, and G83 validate 1,000-device mixed workload accounting and inference protection.
    dependencies:
    - OBS-001
    - FLEET-008
    - TRAIN-015
    - MODEL-007
