- id: NOV-001
  title: Run the controlled self-evolving GPT-2-class gold experiment
  goal: Test whether Splendor can make repeated model/data/eval/route change interoperable, controlled, and measurably useful—without
    claiming a novel language-model algorithm.
  implementation:
  - Reproduce a small GPT-2-compatible transformer from declared source/config/tokenizer/data/environment with baseline training,
    released-model inference comparison, deterministic smoke eval, checkpoint/resume, and full lineage.
  - Define fixed protected anchor suites, rotating/fresh suites, contamination canaries, safety/value/domain slices, calibration/robustness,
    memorization/privacy proxies, and human/independent judgments; preserve inaccessible answers from the evolving agent.
  - Run repeated bounded cycles in which the Improvement Controller may propose data filters/mixtures, collection queries,
    hyperparameters, training schedules, tokenizer/model/route/prompt/rule candidates, or evaluator hypotheses within allowed
    risk.
  - Each cycle performs data quality/contamination scan, distributed training under inference reservation, independent eval,
    reward-hacking checks, ChangeSet risk/impact, gate, shadow/canary, live feedback collection, and rollout/rollback.
  - Track train/protected/fresh/live performance, hard-root violations, slice regressions, calibration, diversity/ancestry,
    synthetic-data ratio, cost, rollback rate, and improvement stability over multiple seeds/cycles.
  - 'Run ablations: no kernel controls, replay-only, no protected holdout, no independence, no data lineage, no rollback,
    fixed-data/fixed-route, and human-controlled baseline. Compare reliability/control overhead as well as quality.'
  - 'Predeclare success/failure: signs of convergence require repeated protected/fresh/live gains within regression/value
    budgets; reward-only or training-loss gains fail; any protected leak invalidates affected evidence; oscillation/collapse/regression
    triggers stop/rollback.'
  - Publish all cycles, failed candidates, negative results, compute/data assumptions, and claim tier. The defensible novelty
    target is the interoperable controlled evolution substrate and evidence, not “GPT-2 is self-aware/aligned.”
  anti_drift:
  - Do not train on the protected/rotating evaluation set.
  - Do not change reward/evaluator and candidate in one unchecked loop.
  - Do not select only the best seed/cycle.
  - Do not claim value alignment from toxicity/helpfulness proxies alone.
  integration:
  - Full Data→Feedback→Reward→Eval→Training→Improvement→Change→Gate→Deployment→Incident path plus Fleet and Model/Route runtime.
  validation:
  - G31–G55, G60–G69, G76, G78–G85, G87–G89 run in one versioned experiment; independent replication package and ablation
    report are required.
