  - id: INC-007
    title: Implement recovery plans, validation, and controlled unfreeze
    goal: Restore operation only when containment, repair, evidence, and policy requirements are satisfied.
    implementation:
    - Define RecoveryPlan with repair/replacement artifacts, data/state remediation, credential rotation, policy/root updates,
      rollback/forward deployment, affected scope, required validation, owners, and residual risk.
    - Execute recovery operations through normal ChangeSet/Gate/Deployment/Workload paths; emergency containment authority
      cannot silently become promotion authority.
    - Require post-recovery eval, conformance, integrity, SLO, safety/value, physical self-test, and monitoring evidence appropriate
      to incident class.
    - Unfreeze capabilities/scopes incrementally with new generation tokens and observe for recurrence during a defined monitoring
      window.
    - Keep unresolved or unreachable targets quarantined and document service degradation rather than declaring global recovery.
    anti_drift:
    - Do not close an incident because containment succeeded.
    - Do not bypass normal gates for the permanent fix except a narrowly documented emergency path with later reconciliation.
    - Do not restore revoked credentials or compromised artifacts.
    integration:
    - Change/Gate/Deployment execute fix; Secret/Authority rotate; Eval/Evidence validate; Fleet/Node reconcile.
    validation:
    - G47, G64, G70, G73, G75, G80, G86–G89 cover recovery, recurrence, partial fleet, emergency fix, and controlled unfreeze.
    dependencies:
    - INC-003
    - INC-005
    - CHG-001
    - GATE-001
    - DEP-001
