- id: INT-001
  title: Build the 0.1-to-vNext compatibility composition and migration path
  goal: Introduce the new planes without discarding the implemented state, trace, gateway, governance, messaging, placement,
    daemon, SDK, and physical foundations.
  implementation:
  - Create compatibility facades that map 0.1 Run/Tick/Percept/Action/Feedback/Reward/Trace/WorkOrder/Approval/Policy/Constraint/Verifier/Adapter
    objects into the vNext identity, event, workload, driver, evidence, and authority contracts.
  - Wrap the current LoopEngine tick as a governed `agent_tick` workload path before replacing internals; preserve current
    trace ordering and fail-before-side-effect behavior.
  - Wrap the current VerifiedActionGateway and filesystem/HTTP/robotics adapters behind Driver Gateway profiles without creating
    a second side-effect path.
  - Migrate SQLite state/trace implementations behind State/Event service APIs and add schema migration/dual-read fixtures
    with deterministic export/import.
  - Map current node/instance registry, placement v0, signed work order, remote message, policy cache, circuit breaker, escalation,
    and state handoff into the corresponding vNext services with explicit “foundation-only” capability flags.
  - Maintain one compatibility test suite that runs every existing example unchanged and a second that runs the same semantics
    through vNext APIs.
  - Deprecate old direct constructors only after equivalent vNext paths pass conformance, migration, and rollback tests; publish
    a field-by-field migration guide.
  anti_drift:
  - Do not rewrite the working baseline before adapters/facades prove semantic equivalence.
  - Do not preserve insecure local-only daemon behavior as a production compatibility promise.
  - Do not let compatibility wrappers become permanent second owners of policy/state.
  integration:
  - All core planes participate; daemon/CLI/SDK expose feature negotiation and old/new API versions.
  validation:
  - Every existing unit/integration/example test passes; exported old runs replay/inspect identically; side-effect denial
    and state-commit failure remain fail-closed.
