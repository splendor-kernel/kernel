- id: INT-007
  title: Compose the governed data–feedback–reward–eval–training–change loop
  goal: Make continual adaptation an interoperable process with explicit provenance, data purpose, protected evaluation, and
    candidate-only promotion.
  implementation:
  - Start from collection policies and percept/outcome/deployment/incident sources; create immutable records and dataset views
