schema_version: splendor.implementation_task_catalog.v1
generated_at: '2026-06-18T04:46:51.126324+00:00'
source_repository:
  repository: splendor-kernel/kernel
  reviewed_ref: main
  reviewed_commit: e1652647cd259f409bed5ff6c5e958c045afc215
  review_scope: superficial implementation inventory plus vNext architecture pack
status: complete_implementation_decomposition_not_implementation
non_claim: This catalog specifies required work. It does not claim the tasks are implemented or that novelty/alignment is
  proven.
kernel_law:
  core_owns:
  - identities and immutable contracts
  - authority and data-use decisions
  - state machines and lifecycle routing
  - resource placement, leases, fencing, and flow control
  - driver invocation boundary and receipts
  - event/state/evidence integrity
  - change, gates, deployment, rollback, and incidents
  user_space_owns:
  - model and neural architecture
  - loss, optimizer, trainer and distributed algorithm plugins
  - planner, solver, ontology and world-model algorithms
  - data transforms and quality algorithms
  - reward derivation functions and evaluators
  - domain policy and application logic
  - provider-specific infrastructure and hardware SDKs
  invariant: User space proposes and computes; Splendor identifies, authorizes, schedules, routes, constrains, verifies, records,
    evaluates evidence, gates, deploys, and rolls back through explicit contracts.
foundations:
- id: FND-001
  title: Freeze the vNext object and identity grammar
  goal: Create the canonical serialized grammar on which every later service depends, while preserving the existing 0.1 identities
    and wire compatibility.
  implementation:
  - Add versioned schemas in `crates/splendor-types` for `Principal`, `Scope`, `ArtifactRef`, `EventEnvelope`, `StateCommit`,
    `WorkloadSpec`, `ExecutionLease`, `DriverManifest`, `Invocation`, `Proposal`, `EvidenceBundle`, `ChangeSet`, and `DeploymentPlan`.
  - Give every object a distinct opaque ID type; explicitly prohibit reuse of run, workload, attempt, worker, artifact, dataset,
    model, checkpoint, eval, change, deployment, incident, and lease identities.
  - Define canonical serialization, field ordering where hashes depend on bytes, RFC3339 time rules, enum forward-compatibility
    rules, and content-hash calculation.
  - Define `extensions` as non-authorizing metadata only and reject any extension that attempts to carry identity, capability,
    approval, secret, data-use, gate, or driver-selection semantics.
  - Generate JSON Schema and language bindings from the Rust source of truth rather than maintaining hand-written divergent
    schemas.
  anti_drift:
  - Do not turn `serde_json::Value` into the permanent public contract for privileged fields; opaque payloads are allowed
    only behind a named schema and payload reference.
  - Do not break the existing `TenantId`, `AgentId`, `RunId`, `TickId`, `ActionId`, `StateNodeId`, `TraceEventId`, `MessageId`,
    `WorkOrderId`, and approval identities.
  - Do not include model architecture, optimizer, planner, ontology, or reward algorithm semantics in foundational types.
  integration:
  - Add conversion wrappers from 0.1 `TraceEvent`, `ActionRequest`, `Percept`, `Feedback`, `Reward`, `WorkOrder`, and state
    nodes into vNext envelopes.
  - Expose the same schemas through Rust, Python, and TypeScript packages and make daemon API models import generated definitions.
  validation:
  - Golden byte fixtures round-trip identically in Rust, Python, and TypeScript.
  - Unknown authorizing fields, nil identities, hash mismatches, and cross-type ID reuse fail before persistence or execution.
  - Run G00 and compatibility tests against existing 0.1 examples.
  dependencies: []
  gold_examples:
  - G00
- id: FND-002
  title: Define package ownership and enforce dependency direction
  goal: Prevent the kernel from becoming a monolith by making package responsibility mechanically enforceable.
  implementation:
  - 'Keep `splendor-types` behavior-free; create or formalize plane crates: `splendor-authority`, `splendor-artifacts`, `splendor-evidence`,
    `splendor-fabric`, `splendor-agent`, `splendor-learning`, and `splendor-change`.'
  - Retain `splendor-kernel` as the composition root and invariant coordinator, not as a home for concrete providers or algorithms.
  - Retain `splendor-gateway` as the driver invocation boundary; concrete filesystem, HTTP, robotics, model, trainer, evaluator,
    data, and sandbox implementations remain separate adapter crates.
  - Keep persistence engines in `splendor-store`; service crates own policy and state-machine semantics, while stores only
    persist validated records.
  - Add a dependency-policy check that rejects cycles and imports from adapters into core crates.
  anti_drift:
  - Do not create one crate per struct or split packages before their public boundary is stable.
  - Do not let daemon handlers own business rules; handlers authenticate, parse, call a service, and translate errors.
  - Do not put PyTorch, Kubernetes, Docker, robotics SDKs, model providers, or domain ontologies in core crates.
  integration:
  - Introduce facade re-exports so existing users of `splendor-kernel` and `splendor-gateway` continue to compile while implementations
    move.
  - Document one owner for every public mutation and add CODEOWNERS/package README responsibility statements.
  validation:
  - A static architecture test verifies allowed crate edges and detects duplicate service ownership.
  - All current unit/integration tests pass through compatibility re-exports.
  - A deliberately misplaced provider dependency fails CI.
  dependencies:
  - FND-001
  gold_examples:
  - G00
- id: FND-003
  title: Implement the command–decision–event transaction pattern
  goal: Give all privileged mutations one consistent ordering model so state, evidence, and side effects cannot disagree silently.
  implementation:
  - Define `CommandEnvelope`, `DecisionRecord`, and `MutationReceipt` internal contracts carrying principal, scope, idempotency
    key, expected state head, causal parents, and requested operation.
  - For each service mutation, validate schema and authority, append required pre-execution events, execute the bounded mutation,
    persist resulting state/artifact references, and append terminal events.
  - Use an outbox/inbox pattern for cross-service messages so process crashes cannot create an unrecorded committed mutation
    or a recorded mutation that never becomes visible.
  - 'Classify event durability requirements: required-before-effect, required-after-effect, best-effort telemetry, and derived/export-only.'
  - Define recovery behavior for every crash point and require idempotent resumption or explicit operator intervention.
  anti_drift:
  - Do not pretend a distributed multi-store transaction is atomic without a recovery protocol.
  - Do not acknowledge a privileged command before its required authorization and pre-effect evidence are durable.
  - Do not use log text as the transaction record.
  integration:
  - Adapt the current loop engine trace-before-action invariant and state-commit failure behavior to the generic command transaction.
  - Require artifact, workload, driver, data, eval, training, change, deployment, and incident services to use the same mutation
    receipt.
  validation:
  - Fault injection at every persistence and process boundary yields either no effect, one evidenced effect, or a clearly
    quarantined uncertain effect.
  - G02, G04, G15, G47, G75, and G87 exercise the transaction rules.
  dependencies:
  - FND-001
  gold_examples:
  - G02
  - G04
  - G15
  - G47
  - G75
  - G87
- id: FND-004
  title: Create a single error and denial taxonomy
  goal: Make failures machine-actionable across local runtime, fleet, drivers, data, learning, and deployment without leaking
    provider-specific ambiguity.
  implementation:
  - Define stable categories for invalid input, incompatible schema, unauthenticated, unauthorized, revoked, expired, quota
    exceeded, unavailable, conflict, stale head, unsafe, uncertain, protected-data denial, integrity failure, timeout, cancellation,
    preemption, worker failure, driver failure, postcondition failure, and internal invariant violation.
  - Require every public error to carry a stable reason code, retry class, effect certainty (`none`, `known`, `uncertain`),
    causal event reference, and optional provider detail that is non-authorizing.
  - Map current daemon, gateway, scheduler, state, trace, governance, placement, message, and adapter errors into the taxonomy.
  - Specify which errors fail closed, which permit retry with the same idempotency key, and which require a new authorization.
  anti_drift:
  - Do not make human prose the only discriminator.
  - Do not expose secrets, protected eval content, raw physical sensor payloads, or provider credentials in error details.
  - Do not mark an uncertain side effect as safely retryable.
  integration:
  - Generate SDK exception types and HTTP/gRPC status mappings from the canonical taxonomy.
  - Use the taxonomy in incident classification and scheduler retry policy.
  validation:
  - Cross-language fixtures map to the same category and retry/effect semantics.
  - Failure-injection examples assert exact reason codes, not substring matching.
  - Unknown provider errors are wrapped as non-retryable uncertain failures until classified.
  dependencies:
  - FND-001
  gold_examples:
  - G04
  - G07
  - G87
- id: FND-005
  title: Build the conformance and fault-injection harness before new drivers
  goal: Make every new provider prove lifecycle, isolation, authority, evidence, and cleanup semantics before it can be registered
    as production-capable.
  implementation:
  - Create a reusable harness that can run a service or driver in-process, as a subprocess, on a resident node, and through
    a remote transport.
  - Provide deterministic faults for timeout, cancellation, dropped acknowledgements, duplicate delivery, stale lease, revoked
    capability, corrupt artifact, disk full, network partition, worker death, process crash, clock skew, and malformed payload.
  - Define maturity levels `experimental`, `development`, `conformant`, and `certified`; only objective evidence may advance
    maturity.
  - Persist a signed `ConformanceReport` artifact tied to implementation digest, environment, test suite, and results.
  - Make registry resolution capable of requiring a minimum maturity per operation/risk class.
  anti_drift:
  - Do not let a driver self-declare itself certified.
  - Do not equate unit test coverage with conformance.
  - Do not allow skipped mandatory cases to be reported as pass.
  integration:
  - Reuse existing adapter and physical simulation fixtures as initial harness targets.
  - Make all future model, trainer, evaluator, data, shell, Python, OCI, Kubernetes, and physical drivers consume the harness.
  validation:
  - G07 passes for filesystem and HTTP adapters before accepting the harness as stable.
  - At least one intentionally faulty driver is rejected for each lifecycle class.
  - Reports are reproducible and registry lookup rejects revoked or incompatible evidence.
  dependencies:
  - FND-003
  - FND-004
  gold_examples:
  - G07
- id: FND-006
  title: Implement schema migration and compatibility discipline
  goal: Allow the kernel to evolve for decades without silent semantic drift or flag-day migrations.
  implementation:
  - 'Define compatibility classes: additive non-authorizing, additive authorizing, behavioral, storage, transport, and security-critical.'
  - Require an RFC, migration function, downgrade behavior, replay behavior, and fixture update for every authorizing or behavioral
    change.
  - Implement version negotiation for daemon, node, driver, message, work-order, policy, artifact, and workload protocols.
  - Add online storage migrations with resumable checkpoints and immutable backups for SQLite; define backend-neutral migration
    traits for later stores.
  - Preserve the stable 0.1 primitive line and provide explicit adapters rather than changing its meanings in place.
  anti_drift:
  - Do not use `extensions` to smuggle a new authorization path.
  - Do not auto-upgrade a policy/value/data-use meaning without an explicit migration decision.
  - Do not discard unknown facts needed for replay or audit.
  integration:
  - Add compatibility matrices to capability endpoints and driver manifests.
  - Run mixed-version node and client tests as part of release qualification.
  validation:
  - N-1/N/N+1 schema fixtures have documented accept/reject behavior.
  - A rolling upgrade preserves live inference and rejects an incompatible training worker before rendezvous.
  - Historical traces and state remain inspectable after migration.
  dependencies:
  - FND-001
  - FND-002
  gold_examples:
  - G00
  - G72
- id: FND-007
  title: Define the kernel/user-space privilege boundary in code
  goal: Ensure arbitrary agent, model, planner, evaluator, and training code stays flexible while every privileged crossing
    is mediated.
  implementation:
  - 'Introduce internal marker traits or sealed interfaces for privileged commits: authority grant, state-head update, artifact
    publication, workload lease, driver invocation, feedback/reward acceptance, eval publication, candidate creation, gate
    decision, and deployment activation.'
  - Expose proposal APIs to user space; only service-owned implementations can convert proposals into committed objects.
  - Require driver and workload code to receive scoped handles rather than direct database, secret, registry, or scheduler
    references.
  - Separate read capabilities from mutation capabilities and training data access from eval data access.
  - Add compile-time and runtime checks that prevent SDK callbacks from constructing trusted receipts or decisions.
  anti_drift:
  - Do not sandbox ordinary pure computation unnecessarily.
  - Do not make kernel code interpret domain reasoning or chain-of-thought.
  - Do not allow a Python object or JSON field named `approved` to become authority.
  integration:
  - Refactor current `Policy` and `Perceptor` callbacks to return typed proposals/results while the Rust runtime remains the
    committing authority.
  - Apply the boundary to future training, eval, data, world-state, and self-change APIs.
  validation:
  - A malicious SDK callback cannot forge an action outcome, state commit, eval pass, capability, or deployment activation.
  - G01, G27, G40, G78, G79, and G80 prove the boundary.
  dependencies:
  - FND-001
  - FND-003
  gold_examples:
  - G01
  - G27
  - G40
  - G78
  - G79
  - G80
- id: FND-008
  title: Create deterministic fixture, clock, randomness, and payload-reference utilities
  goal: Provide testable time/randomness and large-payload handling without pretending every neural workload is bitwise deterministic.
  implementation:
  - Add injectable monotonic/wall clocks, deterministic UUID/ID factories for tests, seed bundles, and random-stream identifiers.
  - 'Define determinism classes: bitwise, numerically bounded, statistically equivalent, behaviorally equivalent, and non-deterministic-with-evidence.'
  - Move large percepts, model outputs, datasets, checkpoints, and reports into artifact payloads; events carry hashes and
    bounded summaries.
  - Define canonical environment capture for software versions, accelerator/runtime versions, locale, time zone, and relevant
    numerical flags.
  - Add stable test factories for tenants, agents, work orders, capabilities, leases, artifacts, workloads, drivers, evals,
    and changes.
  anti_drift:
  - Do not promise bitwise reproducibility across unsupported hardware or collective libraries.
  - Do not put unbounded binary/model/sensor payloads in the event log.
  - Do not leave seed ownership implicit between controller and worker.
  integration:
  - Use utilities in replay, training resume, distributed equivalence, eval, simulation, and fault tests.
  - Expose determinism claims in artifact and eval manifests.
  validation:
  - G03, G39, G42, G52, and G64 distinguish exact from bounded/statistical equivalence.
  - Changing a captured environment field changes the evidence/reproducibility fingerprint.
  - Oversized event payloads are rejected with an artifact-publication remediation.
  dependencies:
  - FND-001
  gold_examples:
  - G03
  - G39
  - G42
  - G52
  - G64
- id: FND-009
  title: Implement policy-independent audit redaction and protected payload handling
  goal: Keep evidence useful without leaking secrets, private data, hidden evaluations, or physical sensor content.
  implementation:
  - 'Classify every field and payload reference by visibility: public, tenant, restricted, secret, protected-eval, safety-local,
    and legal-hold.'
  - Build deterministic redaction views that preserve object identity, causal shape, reason codes, and hashes while replacing
    inaccessible payloads.
  - Require access checks on artifact/event/state/evidence reads; possession of an ID or trace reference never grants payload
    access.
  - Add non-reversible structured summaries for safety evidence and protected eval outcomes.
  - Record every privileged evidence export as its own event and artifact.
  anti_drift:
  - Do not redact away the fact that a denial, approval, or protected evaluation occurred.
  - Do not store raw secrets and rely on later redaction.
  - Do not allow observability exporters to bypass the same read policy.
  integration:
  - Apply to existing trace export, governance audit export, device trace sync, and future evidence bundles.
  - Use the secret broker and data-use controller as policy inputs, not duplicated policy engines.
  validation:
  - G08, G35, G82, and G84 verify payload absence and preserved causal evidence.
  - Cross-tenant export attempts fail without revealing whether protected content matches a query.
  - Redacted and full views retain the same event/artifact identity and integrity chain.
  dependencies:
  - FND-001
  - FND-007
  gold_examples:
  - G08
  - G35
  - G82
  - G84
- id: FND-010
  title: Create end-to-end service APIs and idempotent SDK semantics
  goal: Expose kernel primitives to higher-level code without making the daemon a second source of semantics.
  implementation:
  - Define versioned REST/gRPC-neutral service traits first; map them into the existing Axum daemon and TypeScript/Python
    clients.
  - Require request IDs and idempotency keys for all mutating APIs; define retry and conflict behavior.
  - Add watch/stream APIs with cursors for events, workloads, agents, feedback, evals, training, changes, deployments, and
    incidents.
  - Return typed references and receipts rather than embedding unbounded artifacts in API responses.
  - Expose capabilities/compatibility endpoints that report implemented profiles and maturity, not aspirational roadmap labels.
  anti_drift:
  - Do not implement service logic independently in Rust daemon, Python SDK, and TypeScript client.
  - Do not make a dropped HTTP response create duplicate irreversible work.
  - Do not report a feature as available because its schema exists.
  integration:
  - Keep current run, percept, trace, replay, action, device, health, and capability endpoints working through compatibility
    adapters.
  - Add CLI commands only after service contracts and SDK methods are stable.
  validation:
  - Contract tests execute the same mutation twice and observe one result/receipt.
  - Generated clients pass schema round-trip and mixed-version tests.
  - Capability output distinguishes implemented, experimental, simulated, and unavailable surfaces.
  dependencies:
  - FND-001
  - FND-004
  - FND-006
  gold_examples:
  - G00
  - G06
- id: FND-011
  title: Establish threat models and security invariants per plane
  goal: Make security requirements concrete before enabling remote fleet execution, protected evals, self-change, and physical
    actuation.
  implementation:
  - Document assets, principals, trust boundaries, attacker capabilities, and fail-closed decisions for all eight planes.
  - Cover compromised user code, malicious data, prompt injection, compromised worker/node, malicious driver, stolen credential,
    stale policy, evaluator manipulation, supply-chain tampering, trace deletion, and physical device disconnection.
  - Map each threat to an enforcing component, required event, containment action, and gold test.
  - Define cryptographic agility, key rotation, node attestation extension points, and non-cryptographic safety assumptions.
  - Add a security review checklist required for new authorizing schemas and driver operations.
  anti_drift:
  - Do not claim cryptography proves model alignment, data quality, or physical safety.
  - Do not rely on prompts as a security boundary.
  - Do not make remote production operation depend on the current explicit local insecure-development mode.
  integration:
  - Feed threat IDs into conformance reports, incident classification, and change risk classification.
  - Use current work-order, policy bundle, approval, circuit-breaker, and physical safety primitives as initial controls.
  validation:
  - Every G80–G89 attack maps to a named invariant and owning service.
  - Red-team tests demonstrate denial/containment without secret or hidden-eval leakage.
  - A component cannot graduate to conformant while mandatory threat cases are skipped.
  dependencies:
  - FND-005
  - FND-007
  - FND-009
  gold_examples:
  - G80
  - G81
  - G82
  - G83
  - G84
  - G85
  - G86
  - G87
  - G88
  - G89
- id: FND-012
  title: Create performance budgets and reference-scale benchmarks
  goal: Prevent correctness abstractions from making live agents unusable and prevent background learning from stealing inference/physical-control
    capacity.
  implementation:
  - Define latency budgets for local event append, state commit, authority decision, gateway preflight, model invocation overhead,
    percept routing, and agent tick admission.
  - Define throughput/scale targets for event ingestion, artifact transfer, scheduler offers, workload transitions, feedback
    ingestion, eval fan-out, and 1,000-node simulation.
  - Measure control-plane overhead separately from provider/model/training time.
  - Add soak tests for 24/7 agents, backpressure, event compaction, cache churn, lease renewal, and repeated rollout/rollback.
  - Require regression thresholds and captured benchmark environments.
  anti_drift:
  - Do not optimize by skipping evidence, authority, or safety checks.
  - Do not publish one hardware result as a universal performance guarantee.
  - Do not allow unbounded metric cardinality or trace payload growth.
  integration:
  - Make scheduler interference control consume real measured usage and inference SLO signals.
  - Use benchmark reports as gate evidence for kernel releases and driver maturity.
  validation:
  - G29, G66, G68, and G74 run under explicit SLOs and resource budgets.
  - A background training workload is preempted before configured live inference breach.
  - Long-run storage and memory growth remain bounded or trigger explicit retention action.
  dependencies:
  - FND-003
  - FND-005
  - FND-008
  gold_examples:
  - G29
  - G66
  - G68
  - G74
components:
- id: splendor.identity-registry
  name: Identity Registry
  plane: identity_authority
  current_status: partial foundation
  current_baseline: The repository already has distinct tenant, agent, fleet, node, instance, run, message, work-order, approval,
    and governance IDs plus node/instance registration types. It does not yet provide a single lifecycle service for human,
    service, agent, node, device, and governance principals, or proof/rotation/revocation semantics across those identities.
  owner_package: crates/splendor-authority (identity module); schemas in splendor-types; persistence in splendor-store
  kernel_boundary: Own identity existence, attributes, proof bindings, lifecycle, and status. It never grants an operational
    capability merely because a principal exists; authorization remains the Authority Service.
  public_contracts:
  - Principal
  - PrincipalKind
  - PrincipalProof
  - PrincipalBinding
  - PrincipalStatus
  - IdentityRotation
  - IdentityRevocation
  - IdentityQuery
  tasks:
  - id: IDR-001
    title: Implement the unified principal schema and registry state machine
    goal: Represent every actor that can own, request, approve, execute, or attest agent work without collapsing identity
      into authority.
    implementation:
    - Define `Principal` with `principal_id`, kind, tenant/fleet ownership, display metadata, proof bindings, created/updated
      times, and status.
    - Support human, service, agent, runtime instance, node, physical device, governance authority, external provider, and
      workload identities; keep existing typed IDs as bindings rather than replacing them with strings.
    - Implement transitions `pending -> active -> suspended -> revoked` plus rotation/supersession; reject resurrection of
      a revoked identity without a new identity.
    - Persist immutable identity history and one mutable current-status pointer with compare-and-swap.
    anti_drift:
    - Do not encode permissions, allowed actions, secret refs, or data access in identity metadata.
    - Do not merge `AgentId`, `NodeId`, and `InstanceId`; they represent different failure and ownership domains.
    - Do not permit a display name or external subject string to be a stable registry key.
    integration:
    - Map existing tenant/agent/node/instance registration into principal bindings.
    - Emit identity lifecycle events into the Event Log and use registry status as an Authority Service input.
    validation:
    - Register each principal kind, rotate one proof, suspend and revoke it, then prove old credentials fail.
    - Duplicate external subject binding and nil-ID registration fail deterministically.
    - G01 and G60 use registry-backed principals.
    dependencies:
    - FND-001
    - FND-003
    gold_examples:
    - G01
    - G60
  - id: IDR-002
    title: Implement proof binding and authentication adapter contracts
    goal: Allow Unix-local, mTLS/PKI, OIDC/service-account, device attestation, and external governance identities without
      hard-coding one provider.
    implementation:
    - Define provider-neutral `IdentityProofVerifier` and `AuthenticatedPrincipal` contracts with audience, issuer, subject,
      key/credential ID, expiry, assurance class, and proof digest.
    - Add local Unix peer credential and test mTLS verifiers first; add OIDC and hardware-attestation providers as out-of-kernel
      adapters.
    - Bind multiple proofs to one principal with explicit precedence and revocation; prohibit proof metadata from widening
      tenant/fleet scope.
    - Cache verified proof results only until the earliest credential, key, registry, or policy expiry.
    anti_drift:
    - Do not implement an OAuth server in the kernel.
    - Do not accept bearer strings from action parameters or prompts.
    - Do not treat a successful TLS connection as authorization for an operation.
    integration:
    - Replace daemon-specific authentication parsing with an authentication adapter followed by registry lookup.
    - Node-agent bootstrap and driver/provider calls consume the same authenticated principal result.
    validation:
    - Wrong audience, issuer, subject binding, expired proof, rotated key, and revoked principal fail closed.
    - Local insecure mode remains explicit and loopback-only.
    - A proof cache cannot outlive revocation or expiry.
    dependencies:
    - IDR-001
    - FND-011
    gold_examples:
    - G01
    - G83
  - id: IDR-003
    title: Implement node and physical-device ownership/attestation lifecycle
    goal: Distinguish the computer running Splendor from attached physical devices and preserve local safety ownership.
    implementation:
    - Extend current node/instance registration with immutable hardware/runtime claims, owner principal, trust domain, attestation
      refs, and supported execution/safety modes.
    - Represent attached devices as separate principals bound to a node with connection state, calibration artifact refs,
      local safety-controller identity, and revocation state.
    - Require re-registration after identity key rotation or node reimage; maintain history so old work and traces remain
      attributable.
    - Define quarantine status that blocks new leases while preserving evidence export and containment commands.
    anti_drift:
    - Do not equate Kubernetes node names, IP addresses, or robot serial-number text with authenticated identity.
    - Do not allow cloud control to revoke the local emergency-stop authority.
    - Do not allow an attached sensor identity to imply actuator authority.
    integration:
    - Feed node/device status to placement and physical driver resolution.
    - Use current `DeviceProfile`, `NodeRegistration`, and heartbeat types as compatibility inputs.
    validation:
    - Node reimage creates a new instance binding; stale leases are fenced.
    - Compromised-node fixture enters quarantine and cannot publish a trusted checkpoint.
    - G73, G74, and G83 preserve device/node separation.
    dependencies:
    - IDR-001
    - IDR-002
    gold_examples:
    - G73
    - G74
    - G83
  - id: IDR-004
    title: Implement human and governance-principal lifecycle
    goal: Make HIL approvals, annotations, overrides, and value changes attributable to durable identities and roles without
      embedding organizational policy in identity.
    implementation:
    - Define human/external-governance proof bindings and assurance classes sufficient for approval policies and annotation
      provenance.
    - Support temporary operator sessions, break-glass session markers, multi-party approval identities, and separation-of-duty
      facts.
    - Record organization membership as non-authorizing attributes consumed by policy, with explicit freshness and source.
    - Support pseudonymous annotation identities where privacy requires it while retaining auditable provider linkage.
    anti_drift:
    - Do not store raw biometric or unnecessary identity-provider payloads.
    - Do not let group membership alone grant a capability.
    - Do not allow the same principal to satisfy independent proposer and approver roles when policy forbids it.
    integration:
    - Approval, feedback, annotation, gate, and incident services reference `principal_id` plus proof evidence.
    - External governance adapters map identities rather than inventing Splendor approvals.
    validation:
    - Two-person value-change flow rejects self-approval and stale membership.
    - Annotation provenance remains queryable after pseudonymization.
    - G43 and G79 exercise separation of duty.
    dependencies:
    - IDR-001
    - IDR-002
    gold_examples:
    - G43
    - G79
  - id: IDR-005
    title: Implement registry query, caching, and revocation propagation
    goal: Make identity status available at high frequency without creating unsafe stale-authority behavior.
    implementation:
    - Provide exact-ID lookup, binding lookup, ownership queries, status watches, and revision-numbered snapshots.
    - Implement bounded local caches with negative caching, revision checks, and revocation push; require high-risk operations
      to refresh when freshness budget expires.
    - 'Define behavior for registry unavailability by risk class: cached low-risk reads may continue, new privileged leases
      and physical high-risk actions fail closed.'
    - Add fleet-wide revocation fan-out and acknowledgement tracking through node agents.
    anti_drift:
    - Do not use eventual consistency as an excuse to accept an indefinitely stale active status.
    - Do not make registry reads a global bottleneck for every pure computation.
    - Do not hide partial revocation propagation.
    integration:
    - Authority decisions include identity revision/freshness evidence.
    - Incident containment can quarantine a principal and observe propagation status.
    validation:
    - Revocation during a long workload prevents renewal/new effects while allowing configured checkpoint/cleanup.
    - Partitioned node follows explicit offline policy.
    - G88 covers stale offline identity/policy behavior.
    dependencies:
    - IDR-001
    - FND-003
    gold_examples:
    - G88
  - id: IDR-006
    title: Migrate existing identities without semantic collapse
    goal: Adopt the registry incrementally while preserving the stable 0.1 contract and historical evidence.
    implementation:
    - Create deterministic principal records for existing tenants, agents, nodes, instances, and governance issuers on first
      use or migration.
    - Store bidirectional compatibility bindings and migration version; never rewrite historical trace IDs.
    - Update daemon, scheduler, gateway, message router, node registry, work-order validation, and physical APIs to resolve
      principals through the registry.
    - Add a migration audit report listing ambiguous or orphaned bindings and require operator resolution before production
      enablement.
    anti_drift:
    - Do not infer a human or service identity from free-form metadata.
    - Do not change historical owner attribution to fit the new model.
    - Do not block local development examples that use explicit synthetic principals.
    integration:
    - Ship dual-read/single-write, then dual-write verification, then registry-required modes behind capability flags.
    - Keep old API IDs visible while adding principal refs.
    validation:
    - All current examples run after migration.
    - Historical replay returns identical tenant/agent/run identities plus optional principal bindings.
    - Ambiguous mapping fixture fails migration rather than choosing silently.
    dependencies:
    - IDR-001
    - FND-006
    gold_examples:
    - G00
    - G03
  completion_gate:
  - Every privileged request is attributable to an active principal revision.
  - Identity status changes are durable, watchable, and enforced without being confused with authorization.
  - Existing stable IDs and historical traces remain valid.
- id: splendor.authority-service
  name: Authority Service
  plane: identity_authority
  current_status: substantial partial foundation
  current_baseline: Current code has tenant policies and quotas, agent isolation ledgers, signed work orders, capability documents,
    approval evidence, policy bundles, circuit breakers, and scoped local delegation. These are useful controls but not yet
    one composable capability service covering all workloads, data, models, drivers, state partitions, and self-change.
  owner_package: crates/splendor-authority (capability module); verifier integration in splendor-gateway and splendor-kernel
  kernel_boundary: Own issuance, evaluation, narrowing, delegation, expiry, revocation, and explanation of operational authority.
    It does not authenticate identities, execute work, judge model quality, or infer permission from messages/prompts.
  public_contracts:
  - CapabilityGrant
  - CapabilityRequest
  - OperationScope
  - ResourceScope
  - DelegationChain
  - AuthorityDecision
  - AuthorityObligation
  - RevocationRecord
  tasks:
  - id: AUTH-001
    title: Define a composable capability and scope model
    goal: Replace scattered allowlists with one typed authority grammar that can express agent, workload, data, driver, model,
      device, state, and change permissions.
    implementation:
    - Define operations as namespaced typed verbs bound to resource kinds and schema versions, not arbitrary unvalidated strings.
    - Define scope intersections for tenant, fleet, agent, run, workload, device, data purpose, artifact, state partition,
      driver operation, time, budget, network, and locality.
    - Represent grants as immutable signed/validated objects with issuer, subject, parent grants, start/expiry, revocation
      ref, obligations, and maximum delegation depth.
    - Implement deterministic scope intersection and prove child grants cannot broaden any dimension.
    - Preserve current tenant policy, work-order allowed actions/adapters/permissions, and delegated authority as compatibility
      profiles.
    anti_drift:
    - Do not create a universal string wildcard that bypasses typed resource checks.
    - Do not infer authority from ownership, message source, model confidence, or policy output.
    - Do not combine data read, training use, eval use, and publication into one permission.
    integration:
    - Gateway, workload admission, artifact reads, state writes, data-use leases, eval access, deployment, and physical actuation
      call one evaluator.
    - Authority decisions become required pre-effect events.
    validation:
    - Property tests prove intersection is monotonic and delegation never broadens scope.
    - G01 exercises missing, expired, revoked, and wrong-audience grants.
    - G18 and G70 exercise narrow sub-agent grants.
    dependencies:
    - IDR-001
    - FND-001
    - FND-007
    gold_examples:
    - G01
    - G18
    - G70
  - id: AUTH-002
    title: Implement issuance and signed work-order integration
    goal: Make work orders one issuance vehicle for bounded workload authority rather than a separate parallel authorization
      system.
    implementation:
    - Define an issuer service that validates issuer authority and creates a `CapabilityGrant` or `WorkOrder` envelope with
      embedded grant refs.
    - Refactor current signed work-order validation to resolve subject principals, scope intersections, data-use refs, placement
      constraints, quotas, and expiry through authority services.
    - Support one-time, renewable, and non-renewable grants with explicit renewal issuer and maximum lifetime.
    - Attach issuance evidence and canonical reason codes; reject unsigned production/fleet work as currently intended.
    anti_drift:
    - Do not make work-order signature validity sufficient if issuer or subject is revoked.
    - Do not allow local dev unsigned mode to leak into resident/fleet configurations.
    - Do not let placement metadata broaden authority.
    integration:
    - Workload Controller requires a validated grant before admission.
    - Node Agent validates the signed lease/work-order subset independently before execution.
    validation:
    - Tampered, expired, revoked, wrong-subject, wrong-runtime-version, and overbroad work orders fail before worker start.
    - G60 validates remote task lease issuance.
    dependencies:
    - AUTH-001
    - IDR-002
    gold_examples:
    - G60
    - G83
  - id: AUTH-003
    title: Implement delegation chains and sub-agent authority narrowing
    goal: Support persistent, ephemeral, trigger, critic, and actuator sub-agents without implicit parent permission inheritance.
    implementation:
    - Create `DelegationGrant` as a capability child with parent run/agent, child principal, objective, allowed messages,
      state/data/artifact scopes, operations, budget, expiry, and result contract.
    - Validate every chain edge and cap depth, total budget, and fan-out; store the complete chain as evidence.
    - Support revocation/cancellation propagation and child cleanup obligations.
    - Adapt current local delegation manager and message types to require the grant reference for every delegated action or
      workload.
    anti_drift:
    - Do not use a message payload as a permission token.
    - Do not proxy the orchestrator credential into a child environment.
    - Do not allow a critic or evaluator child to acquire actuation rights accidentally.
    integration:
    - Message/Delegation Service creates the child relation; Authority Service owns grant validity.
    - Agent Instance Controller pauses or cancels children when the parent/grant is revoked according to policy.
    validation:
    - G18, G70, and G71 prove no inheritance, bounded budgets, and critic non-actuation.
    - A nested child escalation attempt is denied with the chain edge identified.
    dependencies:
    - AUTH-001
    gold_examples:
    - G18
    - G70
    - G71
  - id: AUTH-004
    title: Implement obligations and approval requirements as authority results
    goal: Allow decisions to require HIL, sandbox mode, protected evaluator, local safety, logging, or postcondition checks
      without treating approval as bypass.
    implementation:
    - Return `allow`, `deny`, or `conditional` with typed obligations such as approval, MFA/assurance, dedicated isolation,
      network deny, human review, independent evaluator, local safety verifier, or maximum blast radius.
    - Bind approvals to exact operation, artifact/change/action ID, subject, scope, evidence digest, decision, expiry, and
      revocation state.
    - Require the caller to satisfy obligations through owning services and re-evaluate authority before effect.
    - Migrate current approval verifier and governance state into this obligation flow while preserving gateway mediation.
    anti_drift:
    - Do not let approval replace normal permission, quota, safety, or data-use checks.
    - Do not accept free-form “approved” text or a stale approval for a changed payload.
    - Do not allow the requester to fabricate obligation completion.
    integration:
    - Gate Engine can add change-specific obligations; Authority Service remains the source of operational permission.
    - Driver Gateway verifies obligation receipts before invocation.
    validation:
    - Changed action parameters invalidate approval evidence.
    - G11, G43, G75, and G79 cover high-risk and multi-party obligations.
    dependencies:
    - AUTH-001
    - IDR-004
    gold_examples:
    - G11
    - G43
    - G75
    - G79
  - id: AUTH-005
    title: Implement revocation, lease renewal, and offline authority behavior
    goal: Make authority safe for 24/7 agents and intermittent devices without pretending connectivity is guaranteed.
    implementation:
    - Create revocation records and watches for principals, grants, policies, work orders, driver versions, data-use grants,
      and deployment versions.
    - Define renewal protocols with nonce/current revision, maximum offline lifetime, and no implicit renewal after scope
      change.
    - Cache only validated narrowed grants with expiry and pinned safe-degraded behavior by operation/risk class.
    - Permit configured local cleanup/emergency stop when central authority is unavailable; forbid new high-risk effects and
      self-change.
    anti_drift:
    - Do not keep authority valid indefinitely because a device is offline.
    - Do not require the cloud for emergency stop or local collision prevention.
    - Do not convert “cannot verify” into allow.
    integration:
    - Node Agent and Policy Cache consume revocation/renewal events.
    - Incident Controller can revoke/quarantine and observe acknowledgement lag.
    validation:
    - G88 verifies expired offline policy behavior.
    - A network partition during low-risk sensing continues only within declared cache scope; high-risk actuation denies.
    dependencies:
    - AUTH-001
    - FND-003
    gold_examples:
    - G73
    - G88
  - id: AUTH-006
    title: Implement authority decision evidence and explainability
    goal: Make every allow, deny, or conditional result reproducible without exposing secrets or hidden policy content.
    implementation:
    - Record requested operation, principal/grant revisions, evaluated scopes, policy refs, data-use refs, obligations, reason
      codes, cache freshness, and decision digest.
    - Provide an explanation tree that distinguishes identity failure, scope mismatch, revocation, expiry, quota, data-use,
      gate, and provider constraints.
    - Support inspect-only re-evaluation against historical policy versions and current-policy comparison without changing
      history.
    - Expose redacted views for tenants/operators and full restricted views for authorized audit.
    anti_drift:
    - Do not log credential or secret material.
    - Do not expose protected eval case identifiers through denial explanations.
    - Do not recompute a historical decision using only current policy and call it original evidence.
    integration:
    - Evidence Service bundles authority trees.
    - Replay can compare historical and counterfactual authority decisions in non-live mode.
    validation:
    - G01 produces deterministic reason trees.
    - Historical audit after policy revocation still explains the original decision and current incompatibility.
    dependencies:
    - AUTH-001
    - FND-009
    gold_examples:
    - G01
    - G03
  - id: AUTH-007
    title: Build authority adversarial/property test suites
    goal: Prove the capability algebra and all compatibility adapters fail closed under ambiguous or hostile inputs.
    implementation:
    - Property-test scope intersection, delegation depth, budget accumulation, time windows, audience binding, and revocation
      monotonicity.
    - Fuzz serialized grants, work orders, approval evidence, extension fields, and nested delegation chains.
    - Test confused-deputy paths through message routing, sub-agents, driver selection, artifact references, and physical
      cloud-helper plans.
    - Run cross-version policy and cache-staleness scenarios.
    anti_drift:
    - Do not limit tests to happy-path allow decisions.
    - Do not mock away signature/audience/expiry checks in fleet tests.
    - Do not accept nondeterministic denial codes for the same facts.
    integration:
    - Make the suite mandatory for any new authorizing schema or operation.
    - Publish capability algebra fixtures for external driver/framework authors.
    validation:
    - G01, G18, G70, G79, G80, G86, and G88 pass.
    - Mutation testing demonstrates that removing any critical check causes a gold failure.
    dependencies:
    - AUTH-001
    - AUTH-002
    - AUTH-003
    - AUTH-004
    - AUTH-005
    gold_examples:
    - G01
    - G18
    - G70
    - G79
    - G80
    - G86
    - G88
  completion_gate:
  - One evaluator answers authority for every privileged plane with typed scopes and deterministic evidence.
  - Existing work orders, approvals, tenant policy, and delegation are compatibility profiles, not bypasses.
  - Offline and revoked behavior is explicit and tested.
- id: splendor.secret-broker
  name: Secret Broker
  plane: identity_authority
  current_status: missing
  current_baseline: The current repository correctly warns against placing credentials in action parameters, but it has no
    first-class secret reference, lease, provider, injection, redaction, or revocation service.
  owner_package: crates/splendor-authority (secrets module); provider adapters under adapters/secrets-*; node injection in
    splendor-node
  kernel_boundary: Own short-lived secret leases and delivery to a specific isolated boundary. It never exposes secret values
    to agent state, prompts, events, datasets, generic action parameters, or artifact manifests.
  public_contracts:
  - SecretRef
  - SecretLeaseRequest
  - SecretLease
  - SecretDeliveryHandle
  - SecretProvider
  - SecretAccessEvent
  tasks:
  - id: SECR-001
    title: Define opaque secret references and lease contracts
    goal: Represent secret use without making secret bytes serializable kernel data.
    implementation:
    - Define `SecretRef` as provider/name/version metadata with classification and allowed delivery methods; prohibit embedded
      value fields.
    - Define lease requests bound to principal, workload, driver operation, node, audience, purpose, start/expiry, and maximum
      uses.
    - Return an opaque `SecretDeliveryHandle` resolvable only inside the authorized executor/driver process.
    - Create provider traits for fetch, renew, revoke, and audit without importing vendor SDKs into core.
    anti_drift:
    - Do not add a `String value` field for convenience.
    - Do not allow arbitrary user code to resolve handles outside the declared sandbox.
    - Do not treat a secret reference as authorization to use it.
    integration:
    - Authority Service approves lease requests; Driver Gateway and Sandbox Driver request delivery after placement.
    - Artifact/event schemas store refs and access evidence only.
    validation:
    - Serialization tests prove no provider response bytes enter kernel objects.
    - Wrong workload/node/audience handles fail.
    - G08 covers basic leasing.
    dependencies:
    - AUTH-001
    - FND-001
    gold_examples:
    - G08
  - id: SECR-002
    title: Implement node-local secret delivery mechanisms
    goal: Deliver secrets to shell, Python, OCI, Kubernetes, model, data, and actuator drivers with the narrowest practical
      exposure.
    implementation:
    - Support inherited file descriptor, tmpfs file, one-shot local socket, and orchestrator-native projected secret mechanisms;
      environment variables are opt-in high-risk compatibility only.
    - Bind delivery to process/container identity and close/unmount/revoke on completion, cancellation, lease expiry, or node
      quarantine.
    - Prevent core dumps, debug bundles, stdout/stderr capture, and child-process inheritance unless explicitly allowed.
    - Provide delivery receipts containing mechanism, target identity, timestamps, and value hash commitment where safe, never
      bytes.
    anti_drift:
    - Do not write secrets into OCI image layers, workspace artifacts, command lines, Kubernetes manifests, or persisted environment
      snapshots.
    - Do not make the Node Agent a general secret store.
    - Do not promise complete erasure from untrusted code memory; state the isolation boundary honestly.
    integration:
    - Sandbox and concrete driver adapters consume delivery handles.
    - Node Agent enforces cleanup and reports uncertain cleanup as an incident-worthy fact.
    validation:
    - G08 and G82 scan events, artifacts, logs, process args, and captured environments for canary secrets.
    - Cancellation and crash tests verify handle closure/unmount.
    dependencies:
    - SECR-001
    - NODE-003
    - SBX-001
    gold_examples:
    - G08
    - G82
  - id: SECR-003
    title: Implement rotation, revocation, and bounded renewal
    goal: Support long-lived agents without long-lived exposed credentials.
    implementation:
    - Renew leases through the broker using current workload/driver identity and authority, with a maximum continuous lifetime.
    - Handle provider rotation by creating a new delivery handle and invalidating the old one without changing artifact manifests.
    - Push revocation to node agents and deny new uses; define behavior for in-flight irreversible calls explicitly.
    - Record provider-unavailable and revocation-uncertain states without leaking existence across tenants.
    anti_drift:
    - Do not auto-renew after capability, workload lease, or data-use expiry.
    - Do not reuse a secret lease across worker attempts or sub-agents by default.
    - Do not retry an uncertain irreversible operation merely because a new secret was issued.
    integration:
    - Workload Controller owns retry attempt identity; each attempt requests its own lease.
    - Incident Controller may revoke by secret ref, principal, driver, node, or deployment scope.
    validation:
    - Rotate during a 24/7 model service with no request receiving both old and new credentials.
    - Revocation during partition follows explicit offline policy.
    dependencies:
    - SECR-001
    - AUTH-005
    gold_examples:
    - G08
    - G88
  - id: SECR-004
    title: Implement secret-safe telemetry, redaction, and leak detection
    goal: Make accidental leaks detectable while ensuring the detection system does not replicate secrets.
    implementation:
    - Register per-lease canary fingerprints or keyed detectors in a restricted node-local redaction service.
    - Scan captured stdout/stderr, command metadata, event summaries, artifact metadata, and model prompt construction paths
      before persistence.
    - Replace detected values with stable leak tokens, fail the operation or quarantine output by policy, and open an incident
      with restricted evidence.
    - Maintain false-positive-safe matching for structured credentials and user-provided data.
    anti_drift:
    - Do not send raw secrets to a central scanning service.
    - Do not claim absence from arbitrary encrypted/compressed user payloads unless inspected under policy.
    - Do not silently redact and mark the workload successful.
    integration:
    - Integrate with Event Log append, Artifact Registry publication, Sandbox output capture, and Observability Exporter.
    - Incident Controller receives leak events and can revoke affected leases.
    validation:
    - G82 includes plain, encoded, split, and log-injection attempts.
    - Leak evidence identifies source process/output without revealing the secret.
    dependencies:
    - SECR-002
    - FND-009
    gold_examples:
    - G82
  - id: SECR-005
    title: Implement provider adapters and high-availability semantics
    goal: Support local development and production secret managers without baking one vendor into Splendor.
    implementation:
    - Provide an in-memory deterministic test provider and a local file/OS keychain provider restricted to development.
    - Define adapter contracts for Vault/KMS/cloud/Kubernetes providers with provider-specific code out of core.
    - Implement provider health, latency, retry, circuit breaking, and audit correlation; never cache beyond lease rules.
    - Support multiple providers per tenant with explicit routing policy and no fallback that broadens scope.
    anti_drift:
    - Do not ship a production default master key in the repository or image.
    - Do not fall back from an unavailable restricted provider to a less trusted provider automatically.
    - Do not place provider SDK error payloads directly in public traces.
    integration:
    - Driver Registry tracks provider adapter maturity.
    - Node Agent can use a configured local device keystore for safety-critical offline credentials.
    validation:
    - Conformance tests cover outage, stale cache, wrong provider version, and cross-tenant reference.
    - Provider failover only occurs where the same scope/trust policy explicitly permits it.
    dependencies:
    - SECR-001
    - FND-005
    gold_examples:
    - G07
    - G08
  - id: SECR-006
    title: Add secret handling to every external contract and gold example
    goal: Eliminate ambient credentials from examples, SDKs, and drivers so the safe path is the normal path.
    implementation:
    - Replace direct token/password fields in proposed shell, Python, OCI, Kubernetes, HTTP, database, model, data-source,
      and artifact-publication examples with `SecretRef`.
    - Add SDK helpers for requesting secret use without reading values.
    - Document which user-space code sees a delivered secret and how to avoid prompt/model exposure.
    - Add CI scanners for committed fixture secrets and manifests that embed values.
    anti_drift:
    - Do not make examples depend on real cloud credentials.
    - Do not obscure the fact that some user code legitimately receives a secret inside its sandbox.
    - Do not allow tests to pass only because dummy values are ignored.
    integration:
    - Update G10–G17, G53, G73–G75, and G82 manifests.
    - Make driver authoring documentation require secret-delivery declaration.
    validation:
    - Every relevant example runs with canary secrets and proves scoped delivery/cleanup.
    - Static validation rejects secret-like fields in authorizing schemas.
    dependencies:
    - SECR-001
    - SECR-002
    - SECR-004
    gold_examples:
    - G08
    - G10
    - G11
    - G12
    - G13
    - G14
    - G15
    - G16
    - G17
    - G53
    - G73
    - G74
    - G75
    - G82
  completion_gate:
  - Secret values never enter durable kernel objects or generic user-visible traces.
  - Every use is scoped to one principal/workload/operation/boundary and expires.
  - Leak, rotation, crash, and revocation paths are tested.
- id: splendor.artifact-registry
  name: Artifact Registry
  plane: artifact_lineage
  current_status: missing
  current_baseline: The current state and trace stores persist JSON/state snapshots, and examples refer to governed artifacts,
    but there is no general immutable registry for datasets, code, environments, models, checkpoints, eval suites/reports,
    policies, routes, world snapshots, deployment bundles, or large event payloads.
  owner_package: crates/splendor-artifacts (registry module); bytes backends via splendor-store/adapters
  kernel_boundary: Own immutable artifact identity, integrity, metadata, storage location, access classification, retention,
    replication, and publication lifecycle. It never decides quality, promotion, or deployment.
  public_contracts:
  - ArtifactRef
  - ArtifactManifest
  - ArtifactKind
  - ArtifactUploadSession
  - ArtifactReplica
  - ArtifactAttestation
  - ArtifactTombstone
  tasks:
  - id: ART-001
    title: Define artifact kinds, manifests, and content identity
    goal: Make every material input/output of agent evolution immutable and addressable without constraining its modality
      or format.
    implementation:
    - Define artifact kinds for opaque blob, record shard, dataset snapshot, code bundle, source revision, environment lock,
      OCI image, model, tokenizer/processor, checkpoint, adapter, eval suite, eval report, policy/value bundle, route, world
      snapshot/rollout, evidence bundle, deployment bundle, and incident package.
    - Use content digest plus manifest digest; distinguish logical artifact ID from physical replica URI and mutable human
      tags.
    - Require media type/schema, size, creator principal/workload, classification, creation time, compatibility metadata,
      and parent lineage refs.
    - Support multipart/manifest artifacts for sharded datasets/checkpoints while preserving a stable root digest.
    anti_drift:
    - Do not encode modality-specific tensors or domain ontologies in the registry core.
    - Do not use mutable URI/tag as identity.
    - Do not make an artifact reference confer read authority.
    integration:
    - Replace large trace/state payload embedding with artifact refs.
    - Training, eval, data, model, route, and deployment services publish typed manifests.
    validation:
    - Hash mutation and mismatched manifest/payload fail.
    - Cross-language manifest fixtures round-trip.
    - G05 validates identity versus authority.
    dependencies:
    - FND-001
    - FND-008
    gold_examples:
    - G05
  - id: ART-002
    title: Implement transactional publication and quarantine
    goal: Prevent partially uploaded or unverified data/models/checkpoints from appearing as valid artifacts.
    implementation:
    - Implement upload sessions with expected digest/size, temporary storage, chunk verification, resumable offsets, and terminal
      commit/abort.
    - On commit, verify full root digest, schema/manifest rules, authority, data-use obligations, and required producer evidence
      before making the artifact discoverable.
    - Publish suspicious, incomplete, or policy-blocked objects into a non-readable quarantine namespace with explicit reason
      and retention.
    - Make publication idempotent by content/manifest digest and retain separate producer attestations for identical bytes.
    anti_drift:
    - Do not expose partial uploads through normal lookup.
    - Do not overwrite an existing digest with new bytes or metadata.
    - Do not call a quarantined artifact a failed upload and discard its forensic evidence automatically.
    integration:
    - Use command–decision–event transaction and lineage edge publication atomically/recoverably.
    - Node Agent uploads outputs/checkpoints through sessions.
    validation:
    - Crash at each upload stage yields resumable temp state or no published artifact.
    - Corrupt chunk/manifest fixtures quarantine.
    - G17 and G69 cover publication/recovery.
    dependencies:
    - ART-001
    - FND-003
    gold_examples:
    - G17
    - G69
  - id: ART-003
    title: Implement access, retention, legal hold, and deletion semantics
    goal: Control artifact payload access and lifecycle without rewriting immutable history.
    implementation:
    - Authorize reads through principal, capability, classification, tenant, data-use purpose, locality, and protected-eval
      policy.
    - Represent retention deadlines, legal holds, source deletion obligations, and derived-artifact impact through metadata/obligation
      records.
    - Implement tombstones and cryptographic/storage deletion receipts while preserving non-sensitive lineage facts and hashes
      where lawful.
    - Prevent an expired/tombstoned payload from being newly mounted into workloads; define reproducibility reports that explain
      missing governed inputs.
    anti_drift:
    - Do not delete lineage/evidence silently to make a report look complete.
    - Do not assume hash-only metadata is always non-sensitive.
    - Do not grant read because a workload produced or referenced the artifact.
    integration:
    - Data-Use Controller supplies purpose/retention decisions.
    - Evidence Service reports unavailable payloads honestly.
    validation:
    - Cross-purpose and cross-tenant reads deny.
    - Retention expiry during a workload follows lease semantics and prevents reuse.
    - G26, G34, and G35 exercise lifecycle/access separation.
    dependencies:
    - ART-001
    - AUTH-001
    - DUC-001
    gold_examples:
    - G26
    - G34
    - G35
  - id: ART-004
    title: Implement signatures, attestations, and supply-chain metadata
    goal: Make code, environment, image, driver, model, checkpoint, and deployment artifacts verifiable back to their producers
      and build inputs.
    implementation:
    - Define detached attestation objects for producer identity, workload, builder/executor, source digest, environment, test/conformance
      evidence, and signature.
    - Support SLSA-compatible provenance and OCI/SBOM references without requiring those formats internally for every artifact.
    - Verify signatures and trusted builder/producer policy on artifact admission, driver registration, node execution, and
      deployment.
    - Support key rotation/revocation and distinguish artifact integrity from producer trust or model quality.
    anti_drift:
    - Do not treat a valid signature as proof that a model is safe or an eval passed.
    - Do not accept floating image tags as attested deployment inputs.
    - Do not let the producer attest its own independent gate result.
    integration:
    - Driver Registry consumes conformance/build attestations.
    - Change and Deployment Controllers require exact signed artifacts according to risk.
    validation:
    - Tampered source/image/checkpoint and revoked signer fixtures deny.
    - G17 and G83 cover publication and compromised-worker artifacts.
    dependencies:
    - ART-001
    - IDR-002
    - FND-011
    gold_examples:
    - G17
    - G83
  - id: ART-005
    title: Implement replication, caching, locality, and integrity repair
    goal: Move large datasets/models/checkpoints across heterogeneous fleets without confusing cache presence with trust or
      authority.
    implementation:
    - Track replicas by digest, backend, region/node, health, verification time, encryption/classification, and eviction policy.
    - Implement resumable transfer with chunk hashes, bandwidth limits, locality policy, and post-transfer root verification.
    - Add node-local read-only caches keyed by digest and lease; verify before mount and after suspicious failures.
    - Quarantine corrupt replicas, select another authorized replica, and repair only from a verified source.
    anti_drift:
    - Do not replicate restricted/protected data outside locality policy.
    - Do not trust filesystem existence or filename as integrity.
    - Do not let cache eviction delete the last retained artifact unknowingly.
    integration:
    - Fleet Scheduler uses replica/locality data for placement.
    - Node Agent reports cache inventory and transfer progress.
    validation:
    - G62 and G69 validate locality-aware placement, resume, digest verification, and corrupt replica quarantine.
    - Interrupted transfer never appears mounted as complete.
    dependencies:
    - ART-002
    - DUC-003
    gold_examples:
    - G62
    - G69
  - id: ART-006
    title: Implement registry query, tags, collections, and compatibility resolution
    goal: Make artifacts discoverable without allowing mutable convenience metadata to alter immutable meaning.
    implementation:
    - Provide exact lookup, lineage parent/child queries, kind/schema filters, producer/run queries, and access-filtered search.
    - Implement mutable aliases/tags as separately versioned pointers with authority and audit; deployment activation pointers
      remain owned by Deployment Controller.
    - Support artifact collections/manifests for dataset shards, model bundles, eval suites, and deployment bundles.
    - Implement compatibility predicates for model/tokenizer, checkpoint/code, route/agent schema, driver/runtime, and state
      migration refs; the owning service decides acceptance.
    anti_drift:
    - Do not permit a tag update to change a running workload or deployment implicitly.
    - Do not return inaccessible artifact existence/details in broad search.
    - Do not put deployment or gate state inside registry tags.
    integration:
    - SDK exposes refs and signed download/mount requests.
    - Agent/Training/Eval/Deployment controllers resolve exact versions at plan admission and pin them.
    validation:
    - Concurrent tag updates use CAS and are audited.
    - Pinned workloads remain on original digest after alias movement.
    - G53 and G55 verify bundle compatibility.
    dependencies:
    - ART-001
    - AUTH-001
    gold_examples:
    - G53
    - G55
  - id: ART-007
    title: Migrate existing state snapshots, trace exports, and governed refs
    goal: Adopt artifact identity without rewriting historical runtime evidence or breaking local stores.
    implementation:
    - Add artifact-backed variants for current state snapshot payloads, trace export bundles, policy bundles, device profiles,
      and governance audit exports.
    - Create deterministic manifests for existing persisted objects when possible; mark legacy non-content-addressed objects
      explicitly when not.
    - Backfill artifact refs lazily with an audit report and preserve original hashes/locations.
    - Update SQLite schemas and backup/restore tools for artifact metadata and upload sessions.
    anti_drift:
    - Do not claim legacy payload reproducibility when bytes/environment are unavailable.
    - Do not rewrite historical trace sequence or state node hash.
    - Do not require migrating all large payloads before local runtime continues.
    integration:
    - Dual-read legacy and artifact-backed records; new vNext producers publish artifacts by default.
    - Replay/Evidence understands both with explicit confidence.
    validation:
    - Migration round-trip preserves current examples and trace/state inspection.
    - Legacy missing payload yields an honest incomplete evidence result.
    dependencies:
    - ART-001
    - FND-006
    gold_examples:
    - G03
    - G05
  completion_gate:
  - Every durable model/data/code/environment/eval/checkpoint/change input or output is immutable and integrity-checked.
  - Artifact reference never implies authority, quality, or activation.
  - Partial/corrupt/revoked artifacts cannot enter normal execution silently.
- id: splendor.lineage-service
  name: Lineage Service
  plane: artifact_lineage
  current_status: missing
  current_baseline: Current traces link actions, state, messages, child runs, work orders, and approvals, but there is no
    general derivation graph connecting data records/snapshots, code, environments, models, checkpoints, evals, reward derivations,
    routes, world models, changes, and deployments.
  owner_package: crates/splendor-artifacts (lineage module); graph persistence in splendor-store
  kernel_boundary: Own immutable derivation and usage relationships among principals, activities/workloads, and artifacts.
    It never assigns quality or rewrites producer history.
  public_contracts:
  - LineageEdge
  - LineageRelation
  - ProducerActivity
  - UsageRecord
  - LineageClosure
  - ReproducibilityGraph
  tasks:
  - id: LIN-001
    title: Define the lineage relation model and invariants
    goal: Capture enough derivation to reproduce and assess every agent evolution artifact while remaining domain and modality
      agnostic.
    implementation:
    - Model `used`, `generated`, `derived_from`, `was_revision_of`, `evaluated`, `trained_on`, `validated_by`, `deployed_as`,
      `observed_by`, `reward_derived_from`, and `superseded` relations.
    - Represent activities as workload/driver/change/deployment identities with exact attempt and environment refs.
    - Require relation schema, role, event time, producer, causal event, and optional transform/config artifact.
    - Enforce immutability, tenant/classification consistency, no self-derivation cycles, and explicit cross-tenant sharing
      grants.
    anti_drift:
    - Do not use file paths or tags as lineage nodes.
    - Do not collapse “used during inference” and “trained on” into the same edge.
    - Do not infer lineage from naming conventions after the fact when the producer can declare it transactionally.
    integration:
    - Use W3C PROV concepts for interoperability but keep Splendor-specific typed relations.
    - Artifact Registry publication requires producer edges.
    validation:
    - Cycle, missing producer, illegal cross-tenant, and relation/schema confusion fixtures fail.
    - G05 and G39 validate complete derivation.
    dependencies:
    - ART-001
    - FND-001
    gold_examples:
    - G05
    - G39
  - id: LIN-002
    title: Publish lineage transactionally from every producer
    goal: Eliminate best-effort after-the-fact lineage that can diverge from artifact publication.
    implementation:
    - Add a `ProducerReceipt` containing declared inputs, transform/code/environment/config, outputs, and activity identity.
    - Commit output artifact visibility and required lineage edges as one recoverable publication transaction.
    - Require data operators, trainers, evaluators, model conversions, reward derivations, simulations, builds, and deployment
      packaging to use producer receipts.
    - Reject production-grade artifacts with incomplete mandatory lineage; permit explicit experimental/incomplete classification
      only where policy allows.
    anti_drift:
    - Do not let workers edit lineage after publication.
    - Do not accept a training checkpoint without exact dataset snapshot and code/environment refs.
    - Do not silently drop lineage when one backend is unavailable.
    integration:
    - Workload Controller aggregates worker outputs and submits the authoritative producer receipt.
    - Event Log records publication decision and recovery.
    validation:
    - Crash/failure injection never yields a visible output without required edges.
    - G50–G59 inspect candidate lineage.
    dependencies:
    - LIN-001
    - ART-002
    - FND-003
    gold_examples:
    - G50
    - G51
    - G52
    - G53
    - G54
    - G55
    - G56
    - G57
    - G58
    - G59
  - id: LIN-003
    title: Implement lineage closure and impact queries
    goal: Answer what produced an artifact, what consumed protected data, and what must be reevaluated or revoked after a
      change.
    implementation:
    - Provide bounded ancestor/descendant, relation-filtered, time-windowed, and classification-aware graph queries.
    - Implement impact analysis for revoked data/source, compromised worker/driver, vulnerable environment, changed eval suite,
      or invalid checkpoint.
    - Return partial/completeness indicators when history is legacy, deleted, or access-restricted.
    - Add pagination and cycle/size guards suitable for long-lived evolution graphs.
    anti_drift:
    - Do not leak protected ancestor identities through query cardinality or error details.
    - Do not assume all descendants are invalid; return relation and policy facts for owning controllers.
    - Do not make graph traversal an unbounded synchronous daemon request.
    integration:
    - Change/Incident/Data-Use controllers consume impact queries.
    - CLI provides inspect-only `lineage explain` and `lineage impact`.
    validation:
    - A revoked training record identifies affected datasets/checkpoints/candidates/deployments without exposing protected
      eval cases.
    - G35 and G83 exercise impact paths.
    dependencies:
    - LIN-001
    - ART-003
    gold_examples:
    - G35
    - G83
  - id: LIN-004
    title: Build reproducibility and evidence graph materialization
    goal: Materialize the exact minimal graph needed to rerun or audit a workload/change without copying the entire fleet
      history.
    implementation:
    - Create `ReproducibilityGraph` containing pinned inputs, code/environment, driver versions, workload plan, seed/determinism
      class, outputs, and relevant state/event ranges.
    - Include unavailable/restricted nodes as typed placeholders with reason and access path.
    - Support export as a signed artifact and import into an isolated test environment without granting original authority.
    - Compute a graph digest used by eval, gate, and novelty reports.
    anti_drift:
    - Do not include live credentials or authority grants as reusable permissions.
    - Do not claim reproducibility when required payloads are missing.
    - Do not let an imported graph execute side effects by default.
    integration:
    - Evidence and Replay services consume the graph.
    - Gold runners publish a graph with every result.
    validation:
    - G03, G39, G42, G52, and G64 verify complete or explicitly incomplete graphs.
    - Imported graphs run only with new local authority and non-live drivers.
    dependencies:
    - LIN-001
    - LIN-002
    - FND-008
    gold_examples:
    - G03
    - G39
    - G42
    - G52
    - G64
  - id: LIN-005
    title: Implement lineage integrity, signing, and anti-tamper checks
    goal: Prevent a worker or candidate from rewriting its data/eval/producer history to pass gates.
    implementation:
    - Hash lineage edge content and bind edges to producer receipts, events, and artifact manifests.
    - Verify worker-supplied declarations against controller-known mounts/inputs, environment, and output upload sessions.
    - Sign or integrity-chain restricted producer receipts at the trusted controller/node boundary.
    - Quarantine inconsistent outputs and open an incident for attempted lineage manipulation.
    anti_drift:
    - Do not trust training/eval code to self-report protected data access completely.
    - Do not treat a signature from a compromised worker as sufficient without node/workload binding.
    - Do not mutate bad lineage into a corrected story; supersede with explicit correction evidence.
    integration:
    - Node Agent reports actual mounted artifact leases; Workload Controller reconciles declarations.
    - Gate Engine requires verified lineage status.
    validation:
    - G83 and G85 reject invalid checkpoint/reward lineage.
    - A candidate that omits a mounted dataset cannot publish a conformant candidate.
    dependencies:
    - LIN-002
    - ART-004
    - NODE-003
    gold_examples:
    - G83
    - G85
  - id: LIN-006
    title: Provide interoperability mappings without diluting kernel semantics
    goal: Allow export/import with W3C PROV, OpenLineage, SLSA, and OCI metadata while retaining Splendor authority and AI-specific
      distinctions.
    implementation:
    - Implement one-way and round-trip mappings for the common entity/activity/agent subset and document information loss.
    - Map build/code/image attestations to SLSA/OCI refs and data job lineage to OpenLineage where possible.
    - Keep data-use, protected eval, reward derivation, change/gate, deployment, and agent-route relations as Splendor extensions.
    - Validate imported provenance as untrusted claims until corroborated by trusted receipts.
    anti_drift:
    - Do not make external provenance an authority grant.
    - Do not collapse `evaluated` and `trained_on` because an external schema lacks the distinction.
    - Do not claim lossless round-trip when it is not.
    integration:
    - Observability/export adapters publish external formats.
    - Artifact/lineage imports retain source and trust classification.
    validation:
    - Mapping fixtures preserve all common fields and list lost extensions.
    - Imported forged provenance cannot satisfy a promotion gate.
    dependencies:
    - LIN-001
    - LIN-005
    gold_examples:
    - G05
    - G17
  completion_gate:
  - Every published derived artifact has a transactionally bound producer and input graph.
  - Training, evaluation, inference, and deployment usage remain distinguishable.
  - Impact and reproducibility queries are access-controlled and honest about incompleteness.
- id: splendor.data-use-controller
  name: Data-Use Controller
  plane: identity_authority
  current_status: missing
  current_baseline: Current tenants and work orders can carry `data_refs`, and placement has a locality hint, but the kernel
    does not model collection consent/license, purpose limitation, retention, training versus eval use, derived-data obligations,
    subject deletion, or protected-holdout access.
  owner_package: crates/splendor-authority (data_use module); enforcement hooks in artifacts, fabric, learning, gateway, and
    node agent
  kernel_boundary: Own whether data may be collected, stored, transformed, viewed, used for inference, training, evaluation,
    feedback/reward derivation, publication, or incident analysis under purpose/locality/retention rules. It does not implement
    curation algorithms.
  public_contracts:
  - DataClass
  - DataPurpose
  - DataUsePolicy
  - DataUseRequest
  - DataUseGrant
  - DataAccessLease
  - RetentionObligation
  - DeletionImpact
  tasks:
  - id: DUC-001
    title: Define data classification, purpose, and use operations
    goal: Make data permissions explicit enough for continual learning, protected eval, feedback, and physical sensors without
      imposing a domain schema.
    implementation:
    - Define classifications for public, tenant-private, personal, sensitive, secret, licensed, synthetic, protected-eval,
      safety-local, and custom policy labels.
    - 'Define operations separately: collect, persist, inspect, transform, label, deduplicate, train, tune, derive reward,
      evaluate, infer, export, publish, share, retain, delete, and incident-analyze.'
    - Define purposes as versioned policy artifacts with controller/owner, lawful/contractual basis refs where applicable,
      allowed audiences, locality, retention, and derivation obligations.
    - Attach source/subject/license/consent/provenance refs without forcing raw personal content into policy records.
    anti_drift:
    - Do not assume readable data is trainable data.
    - Do not treat “research” or “future use” as an unbounded default purpose.
    - Do not hard-code jurisdictional legal conclusions into the kernel; expose enforceable policy inputs and obligations.
    integration:
    - Artifact manifests and Percept/Feedback records carry classifications/purpose refs.
    - Authority Service intersects capability and data-use decisions.
    validation:
    - G30 and G34 deny undeclared persistence/training even when source access exists.
    - Schema supports text, image, audio, video, sensor, action, code, and arbitrary record payload refs.
    dependencies:
    - FND-001
    - AUTH-001
    - ART-001
    gold_examples:
    - G30
    - G34
  - id: DUC-002
    title: Implement data-use decision and grant issuance
    goal: Issue bounded, auditable grants for exact datasets/shards/streams and workload purposes.
    implementation:
    - Evaluate requester principal, operation, purpose, data classes, source policy, consent/license, audience, locality,
      time, retention, and downstream derivation plan.
    - Return allow/deny/conditional obligations such as redaction, aggregation, local execution, no raw export, human review,
      or deletion propagation.
    - Bind grants to immutable dataset/artifact refs or collection source selectors with maximum record/time volume.
    - Sign/version decisions and support revocation or policy supersession.
    anti_drift:
    - Do not let a collection/training controller issue its own data permission.
    - Do not allow a wildcard source selector without volume/time/purpose bounds.
    - Do not silently broaden a grant when a dataset snapshot gains records.
    integration:
    - Collection, Artifact, Eval, Training, Feedback, Reward, and Sandbox services request grants before data mounting/persistence.
    - Work orders carry grant refs, not unverified data refs alone.
    validation:
    - Wrong purpose, changed snapshot, expired consent/license, and cross-locality use fail.
    - G34 exercises incompatible purpose despite readability.
    dependencies:
    - DUC-001
    - AUTH-001
    gold_examples:
    - G34
    - G84
  - id: DUC-003
    title: Implement data access leases and mount-level enforcement
    goal: Translate policy decisions into concrete, time-bounded access on nodes and sandboxes.
    implementation:
    - Create `DataAccessLease` bound to workload attempt, node, artifact/shard/stream, allowed operations, mount/read API,
      expiry, and audit requirements.
    - Node Agent exposes read-only scoped mounts or brokered streams; protected eval leases are resolvable only by evaluator-driver
      identities.
    - Record bytes/records accessed, locality, and lease close/expiry; reconcile actual mounts with lineage declarations.
    - Deny copying to unauthorized output artifacts or child workloads unless a derived-data grant exists.
    anti_drift:
    - Do not pass raw storage credentials to training code.
    - Do not rely only on path conventions for protected data isolation.
    - Do not allow a trainer to request an evaluator lease through user-provided role text.
    integration:
    - Fleet Scheduler places within locality; Node Agent and Sandbox Driver enforce the lease.
    - Lineage records actual use.
    validation:
    - G36 and G84 prove trainer/candidate cannot read protected cases or answers.
    - Lease expiry and node compromise close/newly deny access.
    dependencies:
    - DUC-002
    - NODE-003
    - SBX-007
    gold_examples:
    - G36
    - G84
  - id: DUC-004
    title: Implement retention, deletion, and derivation impact handling
    goal: Carry source obligations into snapshots, derived datasets, checkpoints, and deployments without pretending all learned
      influence can be perfectly removed.
    implementation:
    - Represent retention deadlines, legal holds, source deletion requests, non-export obligations, and derivation propagation
      policy.
    - Use Lineage Service impact queries to identify affected raw artifacts, datasets, training runs, checkpoints, models,
      eval reports, and deployments.
    - Execute deterministic deletions/tombstones where possible; for trained models, record required remediation class such
      as retrain, unlearn via user-space algorithm, restrict, or document impossibility.
    - Require Change/Deployment decisions for any active artifact affected by a material deletion obligation.
    anti_drift:
    - Do not claim cryptographic deletion from a trained model without evidence.
    - Do not silently leave active deployments using invalidated data.
    - Do not erase audit facts needed to demonstrate handling.
    integration:
    - Artifact Registry performs payload lifecycle; Change Controller owns active-bundle response.
    - Incident Controller tracks missed obligations.
    validation:
    - Deletion fixture traces impact and blocks reuse; derived-model handling is explicit.
    - G35 and G39 verify reproducibility/obligation behavior.
    dependencies:
    - DUC-002
    - LIN-003
    - ART-003
    gold_examples:
    - G35
    - G39
  - id: DUC-005
    title: Implement locality, federated, and device-resident data policies
    goal: Support training/eval/data work across private clouds, on-premises, and physical devices while data remains where
      policy requires.
    implementation:
    - Express allowed execution trust domains, geographic/organizational locality, raw-data export prohibition, aggregation
      thresholds, and update-only egress.
    - Expose scheduler predicates and node admission checks derived from grants.
    - Define federated/local update artifacts with source cohort, aggregation eligibility, privacy/noise metadata, and dropout
      policy refs; algorithms remain user-space trainer drivers.
    - Require explicit policy for sensor recordings, safety-local maps, and physical-device traces before central sync.
    anti_drift:
    - Do not claim federated execution is private by default.
    - Do not move data to satisfy compute convenience when locality forbids it.
    - Do not treat model gradients/updates as automatically non-sensitive.
    integration:
    - Fleet Scheduler and Training Controller form locality-compatible worker groups.
    - Artifact replication and trace sync consult the same policy.
    validation:
    - G62 and G67 validate locality and federated dropout/update provenance.
    - A disallowed replica/worker is never selected even when it is faster.
    dependencies:
    - DUC-002
    - FLEET-003
    gold_examples:
    - G62
    - G67
    - G73
  - id: DUC-006
    title: Implement protected-evaluation data isolation
    goal: Make holdout secrecy a kernel property rather than a convention in training scripts.
    implementation:
    - Classify eval cases, answer keys, judge prompts, and scoring code separately with protected access paths.
    - Issue evaluator-only leases where candidate/trainer code receives inputs only through a controlled protocol and never
      raw answers or full case enumeration where avoidable.
    - Expose aggregated/sliced results according to release policy; bind reports to protected suite digest without revealing
      payload.
    - Detect and deny attempts to copy, log, embed, cache, or include protected payloads in candidate artifacts.
    anti_drift:
    - Do not let a candidate-selected evaluator satisfy independent gates.
    - Do not reveal hidden case IDs/answers in error messages.
    - Do not call public benchmarks protected merely because they are stored separately.
    integration:
    - Eval Controller owns run protocol; Data-Use Controller owns access.
    - Secret/redaction and sandbox controls protect payload paths.
    validation:
    - G36, G44, G49, G78, and G84 exercise leakage and self-judge paths.
    - Canary logs/artifacts contain no hidden payload fingerprints.
    dependencies:
    - DUC-003
    - FND-009
    gold_examples:
    - G36
    - G44
    - G49
    - G78
    - G84
  - id: DUC-007
    title: Build data-use audit, policy simulation, and adversarial tests
    goal: Make data decisions explainable and test policy changes before they affect active collection/training/evaluation.
    implementation:
    - Produce decision trees with data/purpose/policy revisions, obligations, locality, expiry, and reason codes.
    - Add non-live simulation comparing proposed policy to historical access and lineage without granting access.
    - Fuzz source metadata, licenses/consent refs, purpose strings, extension fields, nested derived datasets, and cross-tenant
      sharing.
    - Create impact reports for policy revocation and changed retention.
    anti_drift:
    - Do not expose protected payloads through simulation output.
    - Do not use policy simulation to rewrite historical decisions.
    - Do not treat missing provenance as permissive.
    integration:
    - Evidence/Replay bundle decisions; Change Controller requires impact evidence for policy changes.
    - Gold data examples publish audit reports.
    validation:
    - G30–G39 and G84 pass with deterministic decisions.
    - Mutation tests removing purpose/locality checks cause gold failures.
    dependencies:
    - DUC-001
    - DUC-002
    - DUC-003
    - DUC-004
    - DUC-006
    gold_examples:
    - G30
    - G31
    - G32
    - G33
    - G34
    - G35
    - G36
    - G37
    - G38
    - G39
    - G84
  completion_gate:
  - Every data read/use is purpose-, operation-, workload-, locality-, and time-scoped.
  - Training and protected evaluation access are mechanically separated.
  - Retention/deletion obligations propagate through lineage with honest limits.
- id: splendor.event-log
  name: Event Log
  plane: event_state_evidence
  current_status: strong partial foundation
  current_baseline: The repository already has ordered `TraceEvent` streams, integrity chaining, SQLite/in-memory trace stores,
    local buffering/sync, trace aggregation references, and fail-closed pre-action durability. The missing work is to generalize
    traces into a typed multi-service event contract with subscriptions, partitions, payload refs, transactional outboxes,
    retention, and fleet-scale causality without degrading current replay guarantees.
  owner_package: crates/splendor-evidence (event module); storage engines in splendor-store
  kernel_boundary: Own append-only ordered facts, causal links, integrity, subscription cursors, and retention. It is not
    mutable state, an analytics warehouse, a log-text sink, or an authority source.
  public_contracts:
  - EventEnvelope
  - EventKind
  - EventPartition
  - EventCursor
  - CausalLink
  - EventAppendReceipt
  - SubscriptionSpec
  - EventIntegrityProof
  tasks:
  - id: EVT-001
    title: Generalize TraceEvent into a versioned EventEnvelope without losing the stable trace line
    goal: Provide one event grammar for agent ticks, workloads, drivers, data, feedback, eval, training, change, deployment,
      incidents, and fleet control.
    implementation:
    - Define envelope fields for event ID, schema/version, partition, sequence, occurred/recorded time, principal/scope, causal
      parents, correlation IDs, payload artifact ref or bounded inline payload, integrity, and visibility class.
    - Create typed event-kind schemas by owning service; event kinds cannot carry hidden authorization outside documented
      fields.
    - Represent current `TraceEvent` as the `agent_run` partition compatibility profile and preserve deterministic trace-event
      IDs/sequence semantics.
    - Define producer requirements and durability class per event kind.
    anti_drift:
    - Do not replace stable typed events with arbitrary topic/string JSON.
    - Do not force globally total ordering across an entire fleet.
    - Do not make event presence confer authority or state ownership.
    integration:
    - Kernel runtime writes current tick/action/state events through the new append API.
    - All new services emit envelopes rather than private audit tables as the only truth.
    validation:
    - Existing replay fixtures produce equivalent ordered run traces.
    - Unknown privileged event schema fails before append.
    - G00, G02, and G03 validate compatibility.
    dependencies:
    - FND-001
    - FND-006
    gold_examples:
    - G00
    - G02
    - G03
  - id: EVT-002
    title: Implement partitioned ordering and causal graph semantics
    goal: Scale beyond one run while preserving the exact local order that matters and explicit cross-partition causality.
    implementation:
    - Define partitions for run, agent instance, workload, node, dataset build, eval run, training run, change, deployment,
      and incident with one ordered writer/epoch at a time.
    - Use monotonic sequence within partition plus writer epoch/fencing token; reject stale writers after handoff.
    - Represent cross-partition links as immutable causal edges with relation type and source event identity.
    - Provide causal traversal with cycle detection, missing-parent markers, and access filtering.
    anti_drift:
    - Do not invent wall-clock ordering as causal truth.
    - Do not allow two unfenced writers to append to the same ordered partition.
    - Do not require a distributed consensus write for unrelated partitions.
    integration:
    - State, workload, message, delegation, data, eval, and deployment services use partition writers.
    - Trace aggregation imports remote events without renumbering source partitions.
    validation:
    - Agent migration and node partition tests show no duplicate sequence or effect.
    - Causal graph reconstructs message/child/workload/eval/change chains.
    - G68 and G72 exercise scale/handoff.
    dependencies:
    - EVT-001
    - STA-002
    gold_examples:
    - G68
    - G70
    - G72
  - id: EVT-003
    title: Implement durable append, outbox, and acknowledgement semantics
    goal: Guarantee required events survive crashes and make cross-service publication recoverable.
    implementation:
    - Extend `TraceStore` into `EventStore` with append-if-sequence/epoch, batch append, read range, durable cursor, and integrity
      verification.
    - Implement SQLite first with WAL, explicit transactions, bounded batch size, and crash recovery; retain in-memory deterministic
      test store.
    - Provide transactional outbox records for service state changes and idempotent consumers with inbox deduplication.
    - Return append receipts only after configured durability and never acknowledge required-before-effect events early.
    anti_drift:
    - Do not claim exactly-once delivery across systems; provide at-least-once plus idempotent consumption and unique event
      identity.
    - Do not block a completed irreversible effect forever if the post-event store is unavailable; mark effect certainty and
      quarantine for recovery.
    - Do not silently discard outbox backlog.
    integration:
    - Migrate current trace durability gateway/monitor.
    - Service command transactions rely on append receipts and outbox status.
    validation:
    - Power-loss/process-kill injection at each boundary satisfies G02.
    - Duplicate consumer delivery does not duplicate state/workload/action mutations.
    dependencies:
    - EVT-001
    - FND-003
    gold_examples:
    - G02
    - G04
    - G87
  - id: EVT-004
    title: Implement subscriptions, cursors, backpressure, and retention-aware resume
    goal: Support 24/7 agents, feedback consumers, monitors, and exporters without unbounded queues or hidden event loss.
    implementation:
    - Define subscription filters by tenant/scope/kind/partition, delivery mode, maximum lag, buffer, and loss policy.
    - Persist durable cursors for required consumers and ephemeral cursors for observability; expose lag/expiry state.
    - Implement bounded buffers with block, drop-oldest, drop-newest, sample, spill-to-disk, or fail-source policies chosen
      explicitly per stream.
    - If retention removes unseen events, emit a gap record and require snapshot/rebuild flow rather than pretending seamless
      resume.
    anti_drift:
    - Do not give every subscriber an unbounded in-memory queue.
    - Do not drop feedback, governance, or required state events under a telemetry policy.
    - Do not let a subscriber’s cursor grant payload visibility.
    integration:
    - Perceptor streams, agent inboxes, feedback/reward pipelines, drift monitors, fleet telemetry, and exporters use this
      API.
    - State snapshots provide resume anchors.
    validation:
    - G21 and G29 validate bounded stream resume and long-lived agents.
    - Slow consumer tests exercise every loss/backpressure mode with explicit evidence.
    dependencies:
    - EVT-003
    - FND-009
    gold_examples:
    - G21
    - G29
    - G48
  - id: EVT-005
    title: Implement integrity chaining, remote sync, quarantine, and gap repair
    goal: Preserve evidence across offline devices and untrusted transport without rewriting source history.
    implementation:
    - Chain events per partition/epoch and sign sync batches or bind them to authenticated node/workload identities.
    - Extend current local trace buffer/sync with resumable ranges, duplicate detection, gap negotiation, corruption quarantine,
      and acknowledgement receipts.
    - Keep remote source sequence and integrity proof; central indexing adds separate arrival metadata.
    - Define repair as re-fetching verified ranges or marking irrecoverable gaps, never synthesizing missing events.
    anti_drift:
    - Do not renumber or mutate edge events during central import.
    - Do not accept a valid batch signature from a revoked/quarantined node without policy review.
    - Do not hide an irrecoverable gap behind a new chain.
    integration:
    - Node Agent buffers events offline; central Event Log indexes after verification.
    - Incident Controller receives integrity/gap events.
    validation:
    - G69, G73, G83, and G88 exercise partial transfer, offline sync, compromised node, and stale policy.
    - Corrupt batch never advances trusted cursor.
    dependencies:
    - EVT-003
    - IDR-003
    - ART-005
    gold_examples:
    - G69
    - G73
    - G83
    - G88
  - id: EVT-006
    title: Implement event payload offload, schemas, and privacy boundaries
    goal: Keep the event log compact and queryable while preserving modality-agnostic observations and reports.
    implementation:
    - Set per-kind inline payload limits and require large/binary/private payloads in Artifact Registry.
    - Register payload schemas with compatibility class and ownership; validate before append.
    - Store bounded summaries, hashes, classifications, and artifact refs in events.
    - Apply field/payload visibility and redacted views at read/export time while preventing raw secret persistence at write
      time.
    anti_drift:
    - Do not inline images, audio, video, datasets, model tensors, checkpoints, full prompts, or unbounded stdout.
    - Do not let a payload artifact reference bypass data-use or artifact-read checks.
    - Do not strip provenance to reduce event size.
    integration:
    - Perceptor, model, sandbox, data, eval, and training drivers publish payload artifacts.
    - Observability exporter uses redacted summaries.
    validation:
    - Oversize inline payload rejects with a clear artifact path.
    - G28, G35, and G82 verify multimodal/private/secret handling.
    dependencies:
    - EVT-001
    - ART-001
    - FND-009
    gold_examples:
    - G28
    - G35
    - G82
  - id: EVT-007
    title: Implement retention, compaction, archival, and restore
    goal: Bound long-term storage without turning replay into the project’s central constraint or losing required governance
      evidence.
    implementation:
    - Define retention by event kind/classification/tenant/legal hold, with required minimums for authority, effects, changes,
      deployments, incidents, and data-use decisions.
    - Compact only derived/reconstructable indexes or payloads; retain immutable event identity and integrity anchors.
    - Archive partition ranges as signed artifacts with indexes and restore them into inspect-only stores.
    - Report replay/evidence limitations after permitted deletion or legacy gaps.
    anti_drift:
    - Do not compact away denials, approvals, lineage, effect certainty, or incident facts needed for accountability.
    - Do not keep sensitive raw payloads indefinitely because traces are useful.
    - Do not let restore activate live state or effects.
    integration:
    - Data-use/legal hold controls retention; Evidence Service checks archive availability.
    - State Service snapshots anchor compaction.
    validation:
    - 24/7 soak test keeps hot store bounded and restores archived causal ranges.
    - G03 and G29 remain inspectable after archival.
    dependencies:
    - EVT-003
    - ART-002
    - DUC-004
    gold_examples:
    - G03
    - G29
  - id: EVT-008
    title: Migrate all current trace producers and consumers
    goal: Complete the transition without two competing audit systems.
    implementation:
    - Route loop engine, gateway, scheduler, message router, delegation, governance, policy cache, node registry, trace sync,
      physical APIs, and daemon audit through Event Log adapters.
    - Replace ad hoc audit vectors/tables only after equivalent typed events and queries exist.
    - Update CLI trace export/replay/state inspection and TypeScript/Python trace subscriptions.
    - Add event-kind ownership documentation and reject new private audit-only persistence in review/CI.
    anti_drift:
    - Do not remove current TraceStore APIs before compatibility tests and migration tools pass.
    - Do not duplicate events in both paths without stable deduplication identity.
    - Do not let observability logs become the fallback source of truth.
    integration:
    - Use dual-write verification, then Event Log primary with TraceEvent projection.
    - Publish migration report for existing SQLite databases.
    validation:
    - All current examples and 0.1 trace fixtures pass.
    - Projection yields expected old trace order and IDs.
    - No privileged service lacks an event owner.
    dependencies:
    - EVT-001
    - EVT-003
    - FND-006
    gold_examples:
    - G00
    - G02
    - G03
  completion_gate:
  - All privileged facts are typed, durable according to effect risk, causally linked, and queryable.
  - Current trace/replay compatibility remains intact.
  - Fleet/offline synchronization preserves source identity and exposes gaps honestly.
- id: splendor.state-service
  name: State Service
  plane: event_state_evidence
  current_status: strong partial foundation
  current_baseline: The repository has explicit content-addressed state graph nodes, snapshots, SQLite/in-memory stores, state
    handoff contracts, and a rule that failed state commit stops tick completion. Missing are named state partitions, CAS
    heads, writer leases/fencing, merge policies, artifact-backed large state, distributed handoff execution, and separation
    of agent/world/runtime/control state.
  owner_package: crates/splendor-evidence (state semantics) plus splendor-store (persistence); orchestration hooks in splendor-kernel
  kernel_boundary: Own versioned mutable heads over immutable commits, partition ownership, compare-and-swap, snapshot, branch/merge
    policy, and handoff. It does not own domain reasoning or allow arbitrary mutation by replay.
  public_contracts:
  - StatePartition
  - StateHead
  - StateCommit
  - StateProposal
  - WriterLease
  - MergePolicy
  - StateSnapshot
  - StateHandoffReceipt
  tasks:
  - id: STA-001
    title: Define named state partitions and explicit ownership
    goal: Separate task, world, memory, runtime, deployment, and learning state so one generic JSON blob cannot silently control
      everything.
    implementation:
    - Define partition identity, owner principal/agent, scope, schema, classification, writer policy, merge policy, retention,
      and current head.
    - Provide standard profiles for agent task state, inbox cursor, episodic/semantic memory refs, world claims, workload
      controller state, feedback/eval/training state, deployment state, and incidents.
    - Allow domain-specific schemas and opaque payload artifacts while keeping commit metadata typed.
    - Require an explicit partition reference and expected head on every mutation proposal.
    anti_drift:
    - Do not create one global shared mutable “agent memory” object.
    - Do not let a model output choose its own state partition or writer authority.
    - Do not force user-space ontologies into kernel schemas.
    integration:
    - AgentSpec declares allowed state bindings; World-State Service owns world partition semantics.
    - Migrate current per-run state graph as an agent task-state partition.
    validation:
    - Cross-partition writes without grants deny.
    - G23, G26, and G29 exercise partition separation and persistence.
    dependencies:
    - FND-001
    - AUTH-001
    gold_examples:
    - G23
    - G26
    - G29
  - id: STA-002
    title: Implement compare-and-swap heads, writer leases, and fencing
    goal: Prevent duplicate agents, stale nodes, retries, or migrations from mutating the same live state head concurrently.
    implementation:
    - Create writer leases bound to principal, agent/workload instance, partition, head revision, lease epoch, expiry, and
      allowed transition schema.
    - Commit using CAS on expected head and current fencing epoch; return conflict with actual head and no mutation.
    - Renew/revoke leases through Authority/Agent/Workload controllers; stale writers can only publish detached artifacts,
      not advance heads.
    - Persist lease and head transition events before acknowledging ownership changes.
    anti_drift:
    - Do not rely on process-local mutexes for fleet state ownership.
    - Do not automatically merge conflicting privileged state.
    - Do not allow replay or imported snapshots to acquire a live writer lease.
    integration:
    - Agent migration, workload retry, deployment controller, and node handoff use writer leases.
    - Event partitions use the same fencing epoch concept.
    validation:
    - G72 proves single writer during migration and no duplicate effects.
    - Concurrent commit property tests produce one winner and explicit conflict.
    dependencies:
    - STA-001
    - AUTH-001
    - FND-003
    gold_examples:
    - G02
    - G72
  - id: STA-003
    title: Implement immutable commits, snapshots, branches, and declared merge policies
    goal: Support experiments, world hypotheses, rollouts, and self-change comparison without mutating live state.
    implementation:
    - Extend current content-addressed state nodes with partition, schema, parent heads, payload artifact ref, event/evidence
      refs, writer lease epoch, and transition kind.
    - Support detached branches for simulation, replay, candidate agent revisions, and offline device work.
    - 'Provide merge policies: forbidden, fast-forward only, last-writer forbidden, CRDT/provider-defined, and explicit user-space
      merge proposal validated by kernel.'
    - Snapshot by commit interval/size/policy and verify snapshot digest before restore.
    anti_drift:
    - Do not make arbitrary JSON deep-merge a default.
    - Do not equate a simulation branch with live truth.
    - Do not let a user-space merge function commit without authority and evidence.
    integration:
    - Replay/Simulation writes detached branches only.
    - World-State Service uses explicit conflict/corroboration policies rather than generic merge.
    validation:
    - Branch/merge fixtures cover conflict, fast-forward, invalid parent, corrupt snapshot, and forbidden live merge.
    - G23–G25 validate world branches/rollouts.
    dependencies:
    - STA-001
    - ART-001
    gold_examples:
    - G23
    - G24
    - G25
  - id: STA-004
    title: Implement atomic state/event/artifact transition coordination
    goal: Ensure a state head never references missing evidence or payload and an effect outcome never lacks the corresponding
      state transition decision.
    implementation:
    - Define a state transition transaction with proposal, authority, required pre-events, payload artifact publication, commit
      CAS, and terminal event/outbox.
    - Use recoverable pending transitions when artifact/event/state stores are separate; reconciliation decides complete,
      abort, or quarantine.
    - Preserve current invariant that failed commit prevents successful tick completion.
    - Record effect certainty when external action succeeded but state/post-event persistence failed and route to incident/recovery.
    anti_drift:
    - Do not claim multi-backend ACID without implementing recovery.
    - Do not re-execute an external effect to rebuild state automatically.
    - Do not advance a head if required payload/artifact integrity is unknown.
    integration:
    - Loop engine, agent routes, world claims, workload controllers, and deployments use this transaction.
    - Evidence Service can materialize the exact transition receipt.
    validation:
    - G02 injects failure before/after every stage.
    - Uncertain post-effect fixture opens containment path rather than duplicate retry.
    dependencies:
    - STA-002
    - EVT-003
    - ART-002
    - FND-003
    gold_examples:
    - G02
    - G87
  - id: STA-005
    title: Implement distributed handoff, checkpoint, and migration execution
    goal: Turn existing handoff schemas into a fenced, resumable operation for agents and workloads across devices.
    implementation:
    - 'Create handoff protocol: quiesce/drain, checkpoint/snapshot publication, close old writer lease, issue target lease,
      transfer/verify artifacts, restore, advance ownership, resume.'
    - Support bounded mailbox/event cursor transfer and deduplication; preserve causal links and pending approval/action states.
    - Define rollback if target restore fails before ownership transfer and intervention if failure occurs after transfer.
    - Require target compatibility for runtime, drivers, state schema, model bundle, locality, and physical/device bindings.
    anti_drift:
    - Do not run source and target as active writers during “seamless” migration.
    - Do not migrate physical actuator authority to a cloud helper.
    - Do not assume all in-memory Python/model state is checkpointable; declare checkpoint class.
    integration:
    - Agent Instance Controller and Workload Controller own lifecycle; State Service owns head/lease handoff.
    - Artifact transfer and Event Log sync are dependencies.
    validation:
    - G72 kills source/target at each phase and proves one writer/no duplicate effects.
    - Incompatible target rejects before source lease closes.
    dependencies:
    - STA-002
    - STA-003
    - ART-005
    - EVT-005
    gold_examples:
    - G60
    - G72
  - id: STA-006
    title: Implement state schema evolution and controlled migrations
    goal: Allow long-lived agents and world models to evolve state structures without unreviewed in-place mutation.
    implementation:
    - Bind each partition commit to a schema artifact/version and compatibility class.
    - Represent migrations as versioned code/environment artifacts executed as bounded workloads producing candidate commits
      on detached branches.
    - Validate invariants, rollback/forward-only semantics, data-use constraints, and old/new reader compatibility before
      advancing live head.
    - Require Change/Gate/Deployment control for active agent or deployment state migrations.
    anti_drift:
    - Do not run arbitrary migration code in the state service process.
    - Do not overwrite old commits or snapshots.
    - Do not assume rollback is possible after irreversible external/data changes.
    integration:
    - Sandbox/Workload executes migration; Change Controller packages migration with agent/deployment revision.
    - Agent Registry declares compatible state schemas.
    validation:
    - Migration fixtures cover successful, invalid, partial, forward-only, and rollback-required cases.
    - G77 and G89 include state compatibility during code rollout.
    dependencies:
    - STA-003
    - WORK-001
    - CHG-003
    gold_examples:
    - G77
    - G89
  - id: STA-007
    title: Implement state query, subscription, retention, and privacy
    goal: Expose state safely to agents, humans, monitors, and evaluators without making the state store a vector database
      or leaking restricted payloads.
    implementation:
    - Provide exact head/commit/snapshot queries and change subscriptions with access control and redacted payload refs.
    - Keep semantic/vector/search indexes as user-space or provider artifacts linked to state, not hidden mutable kernel internals.
    - Implement retention/archival by partition policy while preserving required heads, lineage, and integrity anchors.
    - Support point-in-time read handles pinned to a head for deterministic route/eval execution.
    anti_drift:
    - Do not expose mutable references or direct database handles.
    - Do not let search index results become authoritative state facts.
    - Do not delete state required by active leases or legal hold.
    integration:
    - Route Runtime and evaluators use pinned read handles.
    - Observability receives summaries, not unrestricted payloads.
    validation:
    - Concurrent route steps see declared snapshot semantics.
    - G26 verifies memory retention and active bundle immutability.
    dependencies:
    - STA-001
    - FND-009
    gold_examples:
    - G26
    - G42
  - id: STA-008
    title: Migrate current StateGraph/Store and prove compatibility
    goal: Reuse current implementation strengths while moving to partitioned service semantics.
    implementation:
    - Wrap current `StateGraph`, `StateNode`, `StateSnapshot`, and `StateStore` behind partition/head interfaces.
    - Backfill partition IDs and writer epochs deterministically for legacy runs without changing node content hashes where
      impossible; mark legacy hash profile.
    - Update loop engine, daemon state-head, snapshot export/import, replay, and handoff examples.
    - Add migration tools and rollback-safe SQLite backup.
    anti_drift:
    - Do not delete or rewrite current state history.
    - Do not block local-only use on distributed features.
    - Do not maintain two independent live heads for the same run.
    integration:
    - Dual-read legacy and vNext commits; new writes use partition service.
    - Expose compatibility projection through existing APIs.
    validation:
    - Current unit/integration/examples pass.
    - Historical state-head/replay results remain identical or have documented legacy projection differences.
    dependencies:
    - STA-001
    - STA-002
    - FND-006
    gold_examples:
    - G02
    - G03
  completion_gate:
  - All mutable state is a named, schema-bound partition with one fenced writer and immutable history.
  - Simulation/replay branches cannot alter live heads.
  - Current state graph semantics and failure invariants remain preserved.
- id: splendor.evidence-service
  name: Evidence Service
  plane: event_state_evidence
  current_status: missing
  current_baseline: Current traces, state graphs, governance exports, and telemetry provide pieces of evidence, but no service
    assembles the exact, access-controlled, completeness-checked bundle required to explain an action, reproduce a training
    run, judge a candidate, prove a deployment, or investigate an incident.
  owner_package: crates/splendor-evidence (evidence module); schemas in splendor-types
  kernel_boundary: Own evidence references, completeness rules, signed bundles, redacted views, and claim support. It does
    not decide authority, quality, alignment, or deployment; it states what evidence exists and what it supports.
  public_contracts:
  - EvidenceBundle
  - EvidenceRequirement
  - EvidenceItem
  - EvidenceCompleteness
  - EvidenceClaim
  - EvidenceAttestation
  - EvidenceView
  tasks:
  - id: EVID-001
    title: Define evidence bundles and typed claim support
    goal: Create a common unit for audit, gate, reproduction, incident, and novelty claims without copying raw protected payloads.
    implementation:
    - Define bundle subject, claim/purpose, required and optional item types, event ranges, state heads, artifact/lineage
      refs, authority/gate/approval decisions, environment, metrics, incidents, signatures, and visibility.
    - 'Represent claims as bounded statements with evaluator/issuer and support level: demonstrated, bounded, inconclusive,
      contradicted, or unavailable.'
    - Use references and digests; include payloads only through authorized export artifacts.
    - Version requirement profiles for action execution, workload result, dataset publication, training candidate, eval report,
      change gate, deployment, incident closure, and novelty experiment.
    anti_drift:
    - Do not let a bundle assert more certainty than its items support.
    - Do not make “trace exists” equivalent to correctness or alignment.
    - Do not include private chain-of-thought as required evidence.
    integration:
    - Every terminal service receipt can request/build a bundle.
    - Gate Engine consumes completeness and item results, not free-form audit prose.
    validation:
    - Missing mandatory item yields explicit incomplete, never pass.
    - G04, G05, G42, G47, and G83 publish typed bundles.
    dependencies:
    - EVT-001
    - ART-001
    - LIN-001
    gold_examples:
    - G04
    - G05
    - G42
    - G47
    - G83
  - id: EVID-002
    title: Implement evidence materialization and causal closure
    goal: Assemble a minimal reproducible/explainable graph from distributed events and artifacts.
    implementation:
    - Resolve subject events, causal parents, state commits, producer lineage, authority decisions, workload attempts, driver
      invocations, evals, approvals, changes, and deployment/incident refs.
    - Use bounded traversal with explicit truncation, missing, inaccessible, legacy, and corrupt statuses.
    - Cache immutable materializations by requirement profile and source revisions; invalidate only on availability/access
      changes, not historical mutation.
    - Create downloadable signed bundle artifacts and index summaries.
    anti_drift:
    - Do not traverse unrestricted tenant/fleet history by default.
    - Do not silently omit inaccessible negative evidence.
    - Do not recompute historical metrics without labeling the new evaluation.
    integration:
    - Lineage closure and Event causal queries are core dependencies.
    - CLI/API offers `evidence build/explain/verify`.
    validation:
    - Bundle digest is stable for the same authorized source graph.
    - G03 and G39 reproduce or state exact missing constraints.
    dependencies:
    - EVID-001
    - LIN-003
    - EVT-002
    gold_examples:
    - G03
    - G39
  - id: EVID-003
    title: Implement completeness validators per privileged lifecycle
    goal: Turn “we logged something” into enforceable evidence requirements.
    implementation:
    - Define machine-readable requirements with item cardinality, acceptable status/trust, freshness, independence, and subject
      binding.
    - Create profiles for irreversible effects, protected eval, training candidates, self-change risk classes, physical actions,
      and rollout promotion.
    - Validate signatures/integrity, exact artifact/change IDs, environment, lineage, required negative/regression results,
      and approval separation.
    - Return structured missing/invalid/conflicting items and never let an exception silently waive them.
    anti_drift:
    - Do not hard-code model metrics or domain thresholds in the evidence service.
    - Do not count candidate-authored self-evaluation as independent evidence when the profile requires independence.
    - Do not let an absent regression result count as zero regression.
    integration:
    - Gate policies reference evidence profiles plus metric/constraint conditions.
    - Incident closure and driver certification use dedicated profiles.
    validation:
    - G44, G49, G75, G78, G79, and G89 fail when mandatory independent/rollback evidence is removed.
    dependencies:
    - EVID-001
    - ART-004
    - LIN-005
    gold_examples:
    - G44
    - G49
    - G75
    - G78
    - G79
    - G89
  - id: EVID-004
    title: Implement redacted, protected, and external evidence views
    goal: Share useful audit/eval/deployment facts with different audiences without duplicating truth or leaking data.
    implementation:
    - Define view policies that transform item payload visibility while preserving identity, digest, status, reason, and causal
      relation.
    - Support tenant operator, model developer, evaluator, governance reviewer, security investigator, public report, and
      external compliance views.
    - Represent withheld evidence and authority to request it; never omit its existence when it affects a decision unless
      existence itself is protected.
    - Record exports as artifacts/events and apply retention/data-use policy.
    anti_drift:
    - Do not create a separately editable “sanitized report” as the truth.
    - Do not leak hidden eval answers, secret values, PII, safety-local maps, or exploit details.
    - Do not expose cross-tenant graph shape through redaction.
    integration:
    - Use shared redaction primitives; Observability exporter can link to views.
    - External governance adapter receives bounded evidence views.
    validation:
    - G35, G43, G82, and G84 verify audience differences and no payload leaks.
    dependencies:
    - EVID-001
    - FND-009
    gold_examples:
    - G35
    - G43
    - G82
    - G84
  - id: EVID-005
    title: Implement evidence verification, signatures, and correction
    goal: Allow offline verification and explicit correction without rewriting history.
    implementation:
    - Verify item digests, event integrity, producer/gate signatures, subject bindings, requirement profile version, and bundle
      signature.
    - Represent corrections/retractions as new evidence linked to superseded items and update current views without deleting
      originals.
    - Support verification in an isolated environment using public keys/trust roots and no live service access.
    - Mark compromised signer/node/driver impact through lineage/incident refs.
    anti_drift:
    - Do not mutate signed historical bundles.
    - Do not accept a new correction as proof the original effect did not occur.
    - Do not require online revocation service during inspect-only historical replay; report checked-at time.
    integration:
    - Artifact attestations and Identity/Authority status feed verification.
    - Incident impact can invalidate trust while preserving bytes/history.
    validation:
    - Tampered, truncated, wrong-subject, revoked-signer, and corrected bundles behave explicitly.
    - G83 and G85 reject compromised/tampered evidence.
    dependencies:
    - EVID-001
    - ART-004
    - IDR-005
    gold_examples:
    - G83
    - G85
  - id: EVID-006
    title: Integrate evidence bundles into gold runner and research claims
    goal: Make every gold and novelty result independently inspectable and prevent prose-only claims.
    implementation:
    - Extend the gold result schema with evidence bundle ID/digest, requirement profile, environment, exact code/artifact
      refs, baseline/candidate refs, and explicit skipped/unavailable cases.
    - Require novelty experiments to include preregistration/hypothesis, baselines, ablations, repeated seeds/cohorts, confidence/uncertainty,
      negative/regression results, and claim limitations.
    - Publish machine-readable and human-readable reports from the same bundle.
    - Add CI checks that prevent “PASS” without a complete verified bundle.
    anti_drift:
    - Do not call specified tests implemented.
    - Do not claim convergence, alignment, or novelty from a single cherry-picked run.
    - Do not hide failed/negative cases in an appendix not linked to the result.
    integration:
    - All G00–G89 examples use the runner.
    - Evolution proof programs consume evidence profiles defined later in this catalog.
    validation:
    - A synthetic false-claim fixture is rejected for missing baseline/ablation/independent eval.
    - Gold catalog statuses remain honest until executable evidence exists.
    dependencies:
    - EVID-001
    - EVID-003
    - EVID-005
    gold_examples:
    - G00
    - G89
  completion_gate:
  - Every privileged result and scientific claim can name a complete, verifiable, audience-appropriate evidence bundle.
  - Incompleteness and contradiction are first-class results.
  - Evidence never becomes the decision-maker.
- id: splendor.replay-simulation-service
  name: Replay/Simulation Service
  plane: event_state_evidence
  current_status: partial foundation
  current_baseline: Inspect-only replay, trace reconstruction, state snapshots, multi-agent causal replay, physical simulation
    harnesses, and cloud-helper advisory patterns exist. Replay is currently overemphasized relative to learning/control,
    but remains an important evidence tool. Missing are explicit modes, driver substitution, deterministic input manifests,
    divergence/counterfactual reports, simulation clocks, and a strict no-live-effect proof across all new drivers.
  owner_package: crates/splendor-evidence (replay module); simulation providers under adapters/simulation-*
  kernel_boundary: Own reconstruction, re-evaluation, simulation, and counterfactual execution from pinned evidence under
    non-live authority. It never mutates live state, reuses historical authorization, or executes live effects by default.
  public_contracts:
  - ReplayPlan
  - ReplayMode
  - DriverSubstitution
  - SimulationContext
  - ReplayResult
  - DivergenceReport
  - CounterfactualBranch
  tasks:
  - id: RPLY-001
    title: Define replay, re-evaluation, simulation, and counterfactual modes
    goal: Remove ambiguity about what code runs and what outputs mean.
    implementation:
    - 'Define `inspect`: reconstruct only; `re_evaluate`: rerun selected pure policy/eval logic; `simulate`: run against simulation
      drivers/world branch; `counterfactual`: vary declared inputs/policies/artifacts and compare.'
    - Require pinned source evidence, state head/snapshot, artifact versions, environment, route/model/driver substitutions,
      clock/randomness policy, and output branch.
    - Label result authority/effect status and determinism class.
    - Reject mode escalation after plan admission without a new plan and authority.
    anti_drift:
    - Do not use “replay” as a synonym for production retry.
    - Do not execute recorded actions merely because they were previously approved.
    - Do not present simulated outcomes as observed world facts.
    integration:
    - Current replay endpoint maps to inspect mode.
    - Route/Model/Eval/World services provide pure/simulation hooks.
    validation:
    - G03 shows zero live adapter calls.
    - Mode confusion and historical approval reuse tests deny.
    dependencies:
    - EVID-001
    - STA-003
    - FND-007
    gold_examples:
    - G03
  - id: RPLY-002
    title: Implement driver substitution and non-live capability classes
    goal: Guarantee every effectful dependency is replaced, denied, or explicitly isolated during simulation.
    implementation:
    - Extend DriverManifest with `live`, `read_only`, `recorded`, `simulated`, and `null/deny` execution profiles per operation.
    - Resolve a complete substitution table before execution and fail if any proposed effect lacks a non-live mapping.
    - Provide recorded-response and deterministic fake drivers for filesystem, HTTP, database, shell, Kubernetes, model, and
      physical interfaces where semantically valid.
    - Record substitution provenance and known fidelity limitations.
    anti_drift:
    - Do not silently route an unmocked operation to the live driver.
    - Do not call a stub a faithful simulator without validation.
    - Do not reuse production secret/data leases in simulation.
    integration:
    - Driver Registry/Gateway enforce execution profile.
    - Physical simulation drivers consume separate device/world models.
    validation:
    - G03, G45, and G73 prove no live effects and report fidelity.
    - A new actuator without simulation profile causes plan rejection.
    dependencies:
    - RPLY-001
    - DRREG-001
    - DGW-001
    gold_examples:
    - G03
    - G45
    - G73
  - id: RPLY-003
    title: Implement deterministic input, clock, randomness, and environment capture
    goal: Make divergence attributable while respecting neural/numerical non-determinism.
    implementation:
    - Build replay input manifests from evidence/reproducibility graphs including event range, state, artifacts, code/env,
      seeds, random streams, external recorded responses, and clock schedule.
    - Provide virtual wall/monotonic clocks and deterministic timer/event injection.
    - Capture unsupported nondeterminism and select equivalence tolerances/profile.
    - Prevent current wall time, network, filesystem, or random sources from entering a deterministic plan unless declared.
    anti_drift:
    - Do not claim bitwise identity for unsupported accelerator kernels.
    - Do not hide a missing recorded dependency behind a default value.
    - Do not normalize away meaningful timing/race divergences.
    integration:
    - Use foundation determinism utilities and sandbox environment capture.
    - Eval comparison consumes equivalence class.
    validation:
    - G39, G42, G52, and G64 produce exact or bounded equivalence evidence.
    - Undeclared time/random source is detected in reference examples.
    dependencies:
    - RPLY-001
    - LIN-004
    - FND-008
    gold_examples:
    - G39
    - G42
    - G52
    - G64
  - id: RPLY-004
    title: Implement divergence and causal comparison reports
    goal: Explain where candidate/baseline or recorded/replayed behavior first differs instead of dumping traces.
    implementation:
    - Align events/route steps/state commits/model calls/proposals/gate decisions/driver outcomes by stable causal identities
      and schemas.
    - Report first divergence, downstream causal cone, changed artifacts/config/policy, numerical tolerance, and missing/inaccessible
      evidence.
    - Support candidate-versus-baseline replay on the same input branch and aggregate per-slice differences.
    - Publish a report artifact usable by evaluators, gates, and humans.
    anti_drift:
    - Do not equate a different event ID caused by a new run with semantic divergence.
    - Do not expose hidden eval payloads in comparison.
    - Do not automatically classify divergence as improvement or regression.
    integration:
    - Eval Controller owns metric judgment; Replay supplies matched executions and divergence facts.
    - Change Controller links reports to changed refs.
    validation:
    - G45 and G46 compare baseline/candidate and preserve no-effect/shadow isolation.
    - Known injected divergence points are localized correctly.
    dependencies:
    - RPLY-003
    - EVID-002
    gold_examples:
    - G45
    - G46
  - id: RPLY-005
    title: Implement counterfactual world/state branches and rollout artifacts
    goal: Support planning, RL, learned world models, and physical simulation without contaminating live world truth.
    implementation:
    - Create detached state/world branches with parent head, intervention variables, simulation model/version, horizon, rollout
      seed, and uncertainty.
    - Run user-space planners/models through route/workload drivers and publish rollout trajectories as artifacts plus state
      deltas.
    - Keep observations, predictions, hypotheses, and simulated transitions distinct in schemas and evidence.
    - Allow branch comparison and explicit promotion of validated knowledge only through World-State proposals/gates.
    anti_drift:
    - Do not write simulated facts into live world partitions automatically.
    - Do not let a learned world model claim calibration without eval evidence.
    - Do not grant simulated action authority on real devices.
    integration:
    - World-State Service and Eval Controller consume rollout artifacts.
    - Physical simulation harness becomes one provider.
    validation:
    - G25, G57, G59, and G73 validate learned rollout/calibration/safety boundaries.
    dependencies:
    - RPLY-001
    - STA-003
    - WORLD-001
    gold_examples:
    - G25
    - G57
    - G59
    - G73
  - id: RPLY-006
    title: Implement scalable replay/simulation workloads
    goal: Run large matched evaluations and simulations through the same execution fabric instead of inside the daemon process.
    implementation:
    - Represent replay/simulation shards as `WorkloadSpec` profiles with pinned inputs, non-live drivers, output branches,
      resource requests, and aggregation.
    - Fan out independent cases across fleet nodes with data locality and protected access constraints.
    - Support checkpoint/resume for long simulations and deterministic aggregation by case ID.
    - Reserve live inference/physical control capacity like any other background workload.
    anti_drift:
    - Do not execute heavy model/simulation code in the control-plane service.
    - Do not assume result ordering equals completion ordering.
    - Do not let replay fan-out acquire live driver profiles.
    integration:
    - Workload/Fleet/Eval controllers orchestrate execution.
    - Evidence Service assembles results.
    validation:
    - G61 and G68 validate heterogeneous fan-out and mixed fleet load.
    - Cancellation cleans workers and leaves partial results explicit.
    dependencies:
    - RPLY-002
    - WORK-001
    - FLEET-001
    gold_examples:
    - G61
    - G68
  - id: RPLY-007
    title: Prove no-live-effect and compatibility across all drivers
    goal: Make replay safety a conformance property rather than a convention.
    implementation:
    - Add a harness that wraps every registered effectful operation with a live-effect counter/trap and runs inspect/simulate
      plans.
    - Test historical approvals, work orders, secret refs, data leases, deployment pointers, and physical commands cannot
      be reused as live authority.
    - Verify replay endpoints and imported evidence stores cannot mutate live state heads or aliases.
    - Retain current inspect-only defaults and require explicit simulation profile selection.
    anti_drift:
    - Do not skip new driver operations.
    - Do not exempt “read-only” network/database operations from data-use and non-live policy.
    - Do not mark a test pass if the driver was simply unavailable unless denial is the expected profile.
    integration:
    - Driver conformance registry requires replay profile tests.
    - CI enumerates operation manifests and ensures coverage.
    validation:
    - G03 and G45 pass for every conformant driver family.
    - A deliberately malicious replay driver is quarantined.
    dependencies:
    - RPLY-001
    - RPLY-002
    - FND-005
    gold_examples:
    - G03
    - G45
  completion_gate:
  - Replay is explicitly inspect/re-evaluate/simulate/counterfactual, never an ambiguous retry.
  - Every effectful operation is substituted or denied before execution.
  - Results are detached, evidence-bound, and honest about fidelity/determinism.
- id: splendor.node-agent
  name: Node Agent
  plane: execution_fabric
  current_status: partial foundation
  current_baseline: The repository implements node/instance registration, heartbeats, capability documents, fleet telemetry
    reference paths, state handoff, remote messages, and resident daemon configuration. It does not yet provide a hardened
    resident executor that acquires leases, fences stale work, mounts governed artifacts/data, supervises arbitrary workloads,
    accounts resources, preserves live inference/physical reservations, and recovers across disconnection.
  owner_package: crates/splendor-fabric (node_agent module) and `splendor-node` resident binary; host integrations remain
    adapters
  kernel_boundary: 'Own the trusted resident boundary on one machine or device: authenticated membership, measured capability
    inventory, lease enforcement, local resource isolation, workload process supervision, artifact/data mounts, local safety
    reservations, checkpoint/output transfer, and reconnect reconciliation. It never chooses global placement, training algorithms,
    eval metrics, or agent policy.'
  public_contracts:
  - NodeRegistrationV2
  - NodeCapabilitySnapshot
  - NodeAttestation
  - LocalResourceInventory
  - NodeLease
  - WorkerAttempt
  - MountReceipt
  - NodeReservation
  - NodeReconcileReport
  tasks:
  - id: NODE-001
    title: Implement authenticated node bootstrap and renewable membership
    goal: Make every cloud worker, desktop, edge computer, robot, or drone computer a separately identifiable and revocable
      Splendor execution boundary.
    implementation:
    - Create a bootstrap protocol that exchanges a one-time enrollment credential for a node identity, instance identity,
      certificate/key material, fleet binding, tenant eligibility, and short-lived membership lease.
    - Bind every heartbeat, work acknowledgement, artifact upload, driver registration, and telemetry envelope to node/instance
      identity and monotonic membership generation.
    - Implement certificate rotation, membership renewal, explicit revocation, duplicate-instance detection, and safe re-enrollment
      after disk replacement.
    - Persist only the minimum resident identity material with OS-backed permissions; integrate an external attestation provider
      through a plugin rather than hard-coding TPM/cloud semantics.
    anti_drift:
    - Do not reuse `AgentId` or `RunId` as machine identity.
    - Do not accept a heartbeat as proof that a node still owns an execution lease.
    - Do not make optional hardware attestation a mandatory assumption for all device classes.
    integration:
    - Extend current node/instance registry schemas through compatibility adapters.
    - Authority Service validates enrollment and Fleet Scheduler consumes current membership generation.
    validation:
    - G60 enrolls, rotates, revokes, and re-enrolls a resident node.
    - A cloned disk/image cannot operate concurrently under one instance identity.
    - Clock skew and stale membership fail without evicting healthy work merely on wall-clock disagreement.
    dependencies:
    - IDR-002
    - AUTH-001
    - FND-006
    gold_examples:
    - G60
    - G72
  - id: NODE-002
    title: Implement measured capability and health inventory
    goal: Advertise schedulable facts that are sufficiently precise for compute, data, model, sandbox, and physical workloads
      without trusting arbitrary labels.
    implementation:
    - Inventory CPU architecture/count/features, memory, local storage classes/capacity, accelerators, accelerator memory,
      numerical dtypes, interconnects, network reachability classes, container runtimes, Python/runtime versions, installed
      driver digests, device-plugin resources, and physical device capabilities.
    - Separate measured facts, operator-declared labels, driver-reported capabilities, and transient health; assign freshness,
      provenance, and trust level to each.
    - Continuously probe resource and driver health with bounded overhead and publish deltas rather than unbounded full snapshots.
    - 'Expose compatibility fingerprints for collective groups: framework/runtime, accelerator family, communication backend,
      local worker count, topology, and required extensions.'
    anti_drift:
    - Do not let a node invent an authorizing capability token.
    - Do not reduce heterogeneous hardware to a single generic GPU count.
    - Do not schedule from stale health without an explicit degraded policy.
    integration:
    - Extend current `CapabilityDocument`, `DeviceProfile`, node heartbeat, and fleet telemetry objects.
    - Driver Registry supplies installed-driver status and conformance digest.
    validation:
    - G60 and G61 place only on compatible measured resources.
    - A false accelerator claim is detected by allocation/probe and quarantines the capability.
    - Capability changes trigger reconciliation without rewriting historical placement evidence.
    dependencies:
    - NODE-001
    - DRREG-001
    gold_examples:
    - G60
    - G61
    - G62
  - id: NODE-003
    title: Implement local resource allocation, leases, and fencing
    goal: Ensure a node executes only currently leased work and cannot oversubscribe or continue stale work after reassignment.
    implementation:
    - Create a local allocator for CPU sets/shares, memory hard/soft limits, accelerator/device IDs, accelerator memory policy,
      local storage, network class, process count, and optional real-time/physical reservations.
    - Validate signed execution leases against membership generation, workload/attempt, exact resources, start deadline, expiry/renewal,
      data/artifact grants, and driver set.
    - Issue a node-local fencing token to every worker and driver invocation; reject state/output commits, checkpoints, and
      effects from expired or superseded tokens.
    - Track requested, reserved, allocated, and observed usage separately; report accounting drift and enforce local hard
      boundaries even when the control plane is unavailable.
    - Define cooperative preemption grace followed by hard termination, with non-preemptible critical sections declared narrowly
      and bounded.
    anti_drift:
    - Do not treat a scheduler assignment message as an execution lease.
    - Do not use best-effort metrics as the only memory/device boundary.
    - Do not let an expired worker publish a “newest” checkpoint or action outcome.
    integration:
    - Fleet Scheduler owns global reservation; Node Agent owns final local admission and fencing.
    - Driver Gateway and Artifact Registry verify fencing tokens on privileged receipts.
    validation:
    - Duplicate and delayed lease delivery executes at most one current attempt.
    - G63 and G65 inject preemption, stale workers, and resource overrun.
    - A partitioned node stops or degrades work according to lease policy and cannot commit after fencing.
    dependencies:
    - NODE-001
    - AUTH-005
    - FND-003
    gold_examples:
    - G63
    - G65
    - G83
  - id: NODE-004
    title: Implement governed artifact cache and data mounts
    goal: Stage exact immutable inputs efficiently while preserving integrity, purpose, locality, and deletion obligations.
    implementation:
    - Resolve artifact replicas authorized by the lease, download with resumable chunks, verify root/manifests, and store
      in a digest-keyed read-only cache.
    - Create per-attempt mount namespaces or equivalent scoped views; mount artifacts read-only and allocate separate writable
      scratch/output paths.
    - Redeem data-use grants locally, enforce allowed purpose/fields/time/record filters where the connector supports them,
      and emit mount/access receipts.
    - Scrub revoked/expired secret and protected-data mounts promptly; mark cached encrypted bytes unusable without current
      key/access grants.
    - Implement cache quotas, pinning for live workloads/checkpoints, safe eviction, corrupt-replica quarantine, and locality-aware
      prefetch hooks.
    anti_drift:
    - Do not make cache possession equivalent to payload access.
    - Do not mount mutable tags or unverified partial downloads.
    - Do not share writable dataset/model directories across attempts.
    integration:
    - Artifact Registry supplies replicas; Data-Use Controller supplies scoped grants; Sandbox Executor consumes mount specs.
    - Lineage Service reconciles actual mounts with producer receipts.
    validation:
    - G08, G34, G62, and G69 prove scoped mounts, locality, resume, cleanup, and integrity.
    - A revoked protected eval artifact cannot be remounted from cache.
    dependencies:
    - NODE-003
    - ART-005
    - DUC-003
    - SECR-002
    gold_examples:
    - G08
    - G34
    - G62
    - G69
  - id: NODE-005
    title: Implement worker launch and process supervision
    goal: Run shell, Python, OCI, Kubernetes-local, model, training, eval, data, simulation, and agent workers under one observable
      lifecycle.
    implementation:
    - Translate an admitted workload task into an executor invocation with immutable code/environment refs, scoped mounts,
      environment contract, resource allocation, driver endpoints, attempt identity, and fencing token.
    - Supervise process/container/pod startup, readiness, liveness, exit, timeout, cancellation, preemption, child processes,
      and orphan cleanup.
    - Capture bounded stdout/stderr as artifacts, structured worker events over a control channel, and exact exit/effect certainty.
    - Require workers to acknowledge initialized environment and input digests before entering running state; report startup
      versus user-code failure distinctly.
    - Support multi-role local groups while preserving one attempt identity per role/rank and one parent worker group.
    anti_drift:
    - Do not parse arbitrary log text as the sole progress protocol.
    - Do not run user code inside the node-agent process.
    - Do not report cancellation complete until processes, drivers, mounts, and leases are cleaned or explicitly quarantined.
    integration:
    - Workload Controller supplies task/attempt specs; Sandbox/Model/Trainer/Evaluator/Data drivers supply execution profiles.
    - Event Log receives lifecycle receipts.
    validation:
    - G04, G10–G14, G52, G64, and G87 cover all terminal paths and orphan cleanup.
    - SIGKILL/process crash and node-agent restart reconcile to one terminal or recoverable state.
    dependencies:
    - NODE-003
    - NODE-004
    - WORK-001
    - SBX-001
    gold_examples:
    - G04
    - G10
    - G11
    - G12
    - G13
    - G14
    - G52
    - G64
    - G87
  - id: NODE-006
    title: Implement local QoS and protected live-capacity reservations
    goal: Allow background training, eval, replay, and data work to use spare resources without harming live inference or
      physical control.
    implementation:
    - Represent node reservations for latency-critical inference, persistent agent loops, safety services, physical control,
      trace durability, and emergency operations.
    - Enforce CPU/memory/device/network/storage floors and interference limits locally, including accelerator memory headroom
      and configurable power/thermal bounds.
    - Measure latency/queue/thermal/memory pressure and throttle, checkpoint, preempt, or reject background workloads before
      protected SLOs are breached.
    - Expose reservation violations and reclaim decisions as evidence; let application policy choose acceptable quality degradation,
      never hidden oversubscription.
    - Support non-capable edge devices that contribute only data/eval/CPU tasks while retaining device-local inference reservations.
    anti_drift:
    - Do not rely solely on fleet scheduler estimates after work starts.
    - Do not preempt a physical safety loop to finish a training checkpoint.
    - Do not call all unused memory/compute safely reclaimable without measured interference policy.
    integration:
    - Fleet Scheduler places against declared reservations; Observability supplies SLO signals; Workload Controller coordinates
      checkpoint/preemption.
    validation:
    - G68 sustains configured live inference latency while mixed training/eval/data jobs use residual fleet capacity.
    - Thermal and memory pressure tests preempt background work before protected service failure.
    dependencies:
    - NODE-003
    - OBS-004
    - FLEET-005
    gold_examples:
    - G68
    - G74
  - id: NODE-007
    title: Implement offline, degraded, and reconnect behavior
    goal: Keep edge and physical nodes safe and useful through intermittent connectivity without inventing new authority.
    implementation:
    - 'Define per-workload offline policy: stop on lease loss, finish bounded operation, continue read-only/local-safe operation,
      buffer percepts/events, or enter operator-defined degraded route.'
    - Cache only signed policy/work-order/driver manifests with expiry and revocation metadata; fail closed for high-risk
      physical effects when freshness requirements are not met.
    - Buffer events, feedback, artifact uploads, and checkpoint metadata locally with integrity chaining and storage limits.
    - On reconnect, re-authenticate membership, reconcile leases and attempts, upload trace/evidence ranges, resolve state
      heads explicitly, and quarantine outputs from fenced work.
    - Provide deterministic conflict reports rather than last-write-wins for agent/world/data state.
    anti_drift:
    - Do not extend an expired authority merely because the node is offline.
    - Do not merge conflicting state or feedback silently.
    - Do not upload buffered raw sensor/private data outside its data-use policy on reconnect.
    integration:
    - Build on current offline policy cache, local trace buffer, reconnect sync, and state handoff foundations.
    - Incident Controller handles prolonged or unsafe divergence.
    validation:
    - G72–G75 exercise disconnect, offline action limits, buffered data, stale policy, and reconciliation.
    - A fenced offline checkpoint remains inspectable but cannot become candidate head.
    dependencies:
    - NODE-001
    - NODE-003
    - EVT-006
    - STA-007
    gold_examples:
    - G72
    - G73
    - G74
    - G75
  - id: NODE-008
    title: Implement checkpoint, output, and progress transfer protocol
    goal: Move large outputs from workers to durable stores without blocking control messages or accepting partial/corrupt
      results.
    implementation:
    - Provide a side-channel protocol for progress, metrics, heartbeats, checkpoint intents, upload sessions, output manifests,
      and terminal worker receipts.
    - Support asynchronous and incremental checkpoint staging, multi-rank shard manifests, resumable uploads, local retention
      until durable acknowledgement, and bandwidth prioritization.
    - Bind every output to workload/task/attempt/fencing token and actual mounted inputs/environment.
    - On cancellation/preemption, permit only explicitly requested final checkpoint/output classes and enforce a bounded grace
      period.
    - Garbage-collect abandoned local outputs after durable terminal evidence and retention rules.
    anti_drift:
    - Do not transmit model checkpoints through the heartbeat channel.
    - Do not mark a checkpoint durable before all required shards/manifests are committed.
    - Do not accept an output from an old attempt after retry succeeded.
    integration:
    - Artifact Registry handles upload commit; Training Controller validates distributed checkpoint completeness; Workload
      Controller advances state.
    validation:
    - G52, G63, and G69 kill workers during every checkpoint stage and resume from only complete checkpoints.
    - Progress floods cannot starve lease renewal or cancellation.
    dependencies:
    - NODE-005
    - ART-002
    - LIN-005
    gold_examples:
    - G52
    - G63
    - G69
  - id: NODE-009
    title: Harden the resident boundary and worker isolation
    goal: Reduce the blast radius of arbitrary or compromised agent code on desktops, servers, clusters, and robots.
    implementation:
    - Run node agent as a minimal privileged service and delegate workloads to unprivileged identities/namespaces/containers
      according to executor profile.
    - Enforce filesystem, network, device, process, syscall, capability, and kernel-interface policies; default deny host
      paths and device access.
    - Verify code/environment/image signatures and driver digests before launch; record node/runtime attestation and effective
      isolation profile.
    - Protect control sockets, lease/fencing material, resident keys, local policy cache, and trace buffer from worker access.
    - Detect attempted namespace escape, unexpected device access, cryptomining/resource abuse, or control-channel forgery
      and contain the attempt.
    anti_drift:
    - Do not claim a container alone is a complete security boundary.
    - Do not grant broad host Docker/Kubernetes credentials to a workload.
    - Do not expose robot motor/firmware interfaces to cloud-helper or generic shell workloads.
    integration:
    - Sandbox Executor defines requested profile; Node Agent enforces host-specific realization; Incident Controller receives
      violations.
    validation:
    - G80–G83 run adversarial escape, forged receipt, secret exfiltration, and compromised-worker cases.
    - Host control state remains unchanged and evidence is preserved.
    dependencies:
    - NODE-005
    - FND-011
    - SBX-007
    gold_examples:
    - G80
    - G81
    - G82
    - G83
  - id: NODE-010
    title: Implement drain, upgrade, restart, and disaster recovery
    goal: Upgrade and repair resident nodes without losing work identity, violating reservations, or executing duplicate effects.
    implementation:
    - Add node states active, cordoned, draining, maintenance, offline, quarantined, and retired with explicit scheduler behavior.
    - During drain, stop new leases, migrate/preempt eligible workloads, preserve protected local services, upload checkpoints,
      and report blockers.
    - Implement signed resident updates with staged rollout, health check, rollback, and compatibility negotiation; never
      self-update during an unsafe physical operation.
    - On node-agent restart, scan supervised processes/containers, local lease journal, mounts, uploads, and trace buffer;
      reattach only with valid current fencing.
    - Provide backup/restore procedures for identity, cache metadata, local state buffer, and device configuration without
      cloning active instance identity.
    anti_drift:
    - Do not kill all workloads for every binary upgrade.
    - Do not reattach an orphan merely because its PID/container name matches.
    - Do not clear quarantine automatically after reboot.
    integration:
    - Deployment Controller governs node-agent updates; Fleet Scheduler coordinates drain; Workload Controller handles migration/retry.
    validation:
    - G65 and G72 perform rolling upgrades and crash recovery while live service remains within SLO.
    - Duplicate-effect sentinel remains zero across restart.
    dependencies:
    - NODE-003
    - NODE-005
    - DEP-005
    gold_examples:
    - G65
    - G68
    - G72
  completion_gate:
  - A resident node executes only authenticated, current, locally admitted leases with effective resource/isolation enforcement.
  - Every worker, mount, output, checkpoint, and effect is bound to attempt and fencing identity.
  - Offline, crash, drain, and upgrade paths preserve safety, evidence, and protected live capacity.
- id: splendor.fleet-scheduler
  name: Fleet Scheduler
  plane: execution_fabric
  current_status: partial foundation
  current_baseline: The repository has placement v0 that deterministically selects one registered target by declared capabilities,
    locality, runtime version, execution mode, and dedicated-instance availability. It explicitly does not autoscale or execute
    work, and there is no queueing, reservations, gang/elastic scheduling, topology model, interference control, preemption,
    or thousand-node reconciliation.
  owner_package: crates/splendor-fabric (scheduler module); provider capacity adapters outside core
  kernel_boundary: Own global admission, queues, resource reservations, compatibility/topology-aware placement, worker-group
    formation, fairness, preemption policy, and lease issuance across nodes. It schedules declared work; it never rewrites
    user training code, evaluates models, manages local processes, or grants data/action authority beyond validated inputs.
  public_contracts:
  - FleetResource
  - SchedulingClass
  - PlacementPlan
  - ReservationSet
  - GangLease
  - WorkerGroupPlan
  - QueuePolicy
  - PreemptionPlan
  - SchedulingDecision
  tasks:
  - id: FLEET-001
    title: Define the schedulable resource and requirement model
    goal: Represent arbitrary compute, data, model, sandbox, and physical workload needs precisely enough for safe placement.
    implementation:
    - Define scalar resources (CPU, memory, storage, bandwidth), discrete resources (accelerators, devices, licenses), properties
      (architecture, dtype, runtime), topology (node/rack/zone/interconnect), locality, isolation, deadline, duration estimate,
      and execution mode.
    - Separate hard requirements, soft preferences, anti-affinity, co-location, reservation floors, and application-declared
      elasticity bounds.
    - Represent worker roles and per-role resources rather than assuming every distributed process is identical.
    - Version resource names/capability schemas and reject unknown hard requirements rather than dropping them.
    - Map current `PlacementRequest/Candidate` into a one-role placement plan for compatibility.
    anti_drift:
    - Do not model all accelerators as interchangeable.
    - Do not infer physical actuator authority from proximity to a device.
    - Do not turn cost/latency estimates into hidden hard constraints.
    integration:
    - Node Agent supplies measured inventory; Workload Controller supplies normalized task requirements; Data-Use Controller
      adds locality constraints.
    validation:
    - G09, G60–G62 validate exact requirement matching, explanation, and rejection.
    - Unknown or stale critical capability fails plan admission.
    dependencies:
    - FND-001
    - NODE-002
    gold_examples:
    - G09
    - G60
    - G61
    - G62
  - id: FLEET-002
    title: Implement durable queues, admission, and scheduling classes
    goal: Control what enters the fleet and preserve fairness and critical-service capacity under load.
    implementation:
    - Create tenant/project queues with quota, concurrency, burst, debt, rate, cost, and accelerator-hour budgets.
    - Define scheduling classes for physical safety, live inference, persistent agent, interactive sandbox, checkpoint-critical,
      eval, training, data, replay/simulation, batch, and maintenance.
    - Implement admission checks for authority, valid workload plan, driver availability, artifact/data locality, quota, protected
      reservations, and schedulability.
    - Persist queue position and decisions so scheduler restart does not reorder privileged work silently.
    - Support deadlines and max queue time without allowing client-supplied priority inflation.
    anti_drift:
    - Do not let a training job claim physical-safety priority.
    - Do not admit an unschedulable gang indefinitely without an explicit pending/reject policy.
    - Do not reset quota debt on scheduler restart.
    integration:
    - Authority Service maps principals to permitted classes; Workload Controller owns workload state; Observability supplies
      queue/SLO facts.
    validation:
    - G67 proves weighted fairness and quota isolation under sustained mixed load.
    - Priority abuse, queue restart, and impossible request cases have deterministic outcomes.
    dependencies:
    - FLEET-001
    - AUTH-004
    - WORK-002
    gold_examples:
    - G09
    - G67
    - G68
  - id: FLEET-003
    title: Implement reservation, gang admission, and fenced lease issuance
    goal: Start collective/distributed work only when the required compatible resource set is secured, while preventing double
      allocation.
    implementation:
    - 'Implement two-phase reservation: provisional holds across selected nodes followed by atomic/recoverable gang commitment
      with one reservation generation.'
    - Issue per-node/per-attempt signed execution leases and a worker-group lease containing roles, ranks/logical slots, rendezvous
      identity, topology, and expiry.
    - Cancel all provisional holds on timeout/conflict; reconcile uncertain node acknowledgements with idempotent reservation
      IDs.
    - Fence superseded reservation generations and make lease renewal contingent on workload state and node membership.
    - Support fixed-size gang, min/max elastic group, and independent shard/fan-out plans as distinct semantics.
    anti_drift:
    - Do not launch half of a fixed collective and hope remaining workers appear.
    - Do not use rank as a stable worker identity.
    - Do not release a resource until local fencing/termination is confirmed or it is quarantined.
    integration:
    - Node Agent performs final local admission; Training Controller owns distributed semantics; Workload Controller owns
      attempt transitions.
    validation:
    - G63 and G64 inject partial reservation, duplicate acknowledgement, membership change, and scheduler crash.
    - No device is leased to two current attempts.
    dependencies:
    - FLEET-001
    - NODE-003
    - FND-003
    gold_examples:
    - G63
    - G64
    - G87
  - id: FLEET-004
    title: Implement compatibility- and topology-aware placement
    goal: Form worker groups that can actually communicate and execute the declared parallel plan.
    implementation:
    - Filter by framework/runtime/driver versions, accelerator family/features, numerical dtype, local worker count, communication
      backend, network reachability, interconnect, data locality, and security/isolation class.
    - Optimize hard-valid candidates for locality, expected communication cost, checkpoint replica proximity, cost/energy
      preferences, and fragmentation while preserving deterministic explainability.
    - Generate an identical canonical topology/mesh document for all ranks and bind its digest to leases.
    - Form compatibility-homogeneous synchronous collective groups; allocate incompatible devices to independent data/eval/sweep/helper
      roles unless a trainer driver explicitly supports heterogeneous collectives.
    - Support physical/cloud-helper constraints so cloud workers propose plans but cannot receive local actuator roles.
    anti_drift:
    - Do not put mismatched collective libraries or mesh definitions into one group.
    - Do not interpret heterogeneous fleet utilization as requiring heterogeneous synchronous all-reduce.
    - Do not optimize cost by violating data locality or protected eval isolation.
    integration:
    - Trainer Driver validates parallel-plan support; Data-Use Controller authorizes locality; Node capabilities provide topology.
    validation:
    - G61 and G64 prove homogeneous collective formation plus heterogeneous fleet decomposition.
    - An inconsistent DeviceMesh-like plan is rejected before worker launch rather than hanging.
    dependencies:
    - FLEET-001
    - FLEET-003
    - TRDRV-004
    - DUC-003
    gold_examples:
    - G61
    - G62
    - G64
  - id: FLEET-005
    title: Implement protected service reservations and interference-aware co-scheduling
    goal: Exploit residual resources across up to thousands of devices without degrading live inference, 24/7 agents, or physical
      safety.
    implementation:
    - Ingest node-level protected reservations, workload SLOs, latency/throughput baselines, accelerator memory floors, bandwidth
      ceilings, and thermal/power constraints.
    - Admit background jobs only into residual envelopes and include reclaim/preemption policy in leases.
    - Continuously adjust placement or request checkpoint/preemption when measured interference crosses configured thresholds.
    - Prefer independent data/eval tasks on weak/edge devices and communication-heavy training on compatible low-latency groups.
    - Account for model-loading and checkpoint-transfer spikes, not only steady-state compute.
    anti_drift:
    - Do not assume a low average utilization means latency headroom.
    - Do not evict resident physical safety or trace durability services.
    - Do not silently lower live model quality to create training capacity.
    integration:
    - Node Agent enforces local floors; Observability provides measurements; Training/Workload controllers honor preemption/checkpoint
      requests.
    validation:
    - G68 runs inference, persistent agents, training, eval, data, and maintenance across a 1,000-node simulated fleet while
      asserting SLO and progress.
    - Injected memory/thermal/network pressure triggers bounded reclaim.
    dependencies:
    - FLEET-002
    - NODE-006
    - OBS-004
    gold_examples:
    - G68
    - G74
  - id: FLEET-006
    title: Implement elastic worker-group membership and rendezvous control
    goal: Coordinate legitimate elasticity without assuming stable ranks or arbitrary mid-step resizing.
    implementation:
    - Define worker-group epochs, logical role slots, min/max membership, restart policy, rendezvous backend contract, join
      deadline, and group generation.
    - On membership change, terminate/fence the old group unless the trainer protocol explicitly supports in-place reconfiguration;
      create a new epoch and restore from a compatible checkpoint.
    - Assign rank/world-size only for one group epoch; preserve logical worker/attempt identities separately.
    - Bind topology, data-shard epoch, global-batch policy, seed derivation, and checkpoint source to the group epoch.
    - Support fixed groups for DDP/FSDP/TP/pipeline and independent elastic pools for embarrassingly parallel jobs.
    anti_drift:
    - Do not promise seamless arbitrary rank addition to user code.
    - Do not hard-code stable rank/world-size assumptions.
    - Do not restart from a checkpoint whose optimizer/data semantics are incompatible with the new group.
    integration:
    - Training Controller decides whether and how a run supports elasticity; Trainer Driver launches framework rendezvous;
      Node Agent fences old workers.
    validation:
    - G64 changes membership repeatedly and verifies no sample duplication beyond declared semantics, no stale commit, and
      bounded lost work.
    dependencies:
    - FLEET-003
    - TRAIN-008
    - TRAIN-009
    gold_examples:
    - G64
  - id: FLEET-007
    title: Implement preemption, rescheduling, and failure-domain policy
    goal: Recover capacity and failed work without creating duplicate effects or unbounded restart storms.
    implementation:
    - Classify workloads and phases as preemptible, checkpoint-preemptible, non-preemptible-bounded, or physical/live protected.
    - Build preemption plans that identify victims, expected freed resources, checkpoint grace, effect certainty, and downstream
      group consequences.
    - Reschedule independent shards selectively; restart collective groups by epoch; preserve retry budgets and exponential
      backoff by failure category/domain.
    - Avoid repeatedly placing on a suspect node/driver/failure domain and open incidents at configured thresholds.
    - Support operator drain and emergency fleet reclaim with explicit evidence and priority rules.
    anti_drift:
    - Do not retry an uncertain side-effectful workload automatically.
    - Do not preempt only one rank of a synchronous group and leave survivors blocked.
    - Do not treat user-code deterministic failure as transient infrastructure failure.
    integration:
    - Workload Controller owns retries; Node Agent performs checkpoint/termination; Incident Controller quarantines failure
      domains.
    validation:
    - G63, G65, G87, and G88 exercise worker loss, preemption, scheduler failover, and retry storms.
    - Retry budget exhaustion is terminal and explained.
    dependencies:
    - FLEET-003
    - FND-004
    - INC-002
    gold_examples:
    - G63
    - G65
    - G87
    - G88
  - id: FLEET-008
    title: Implement heterogeneous workload decomposition policy
    goal: Use every capable device to its greatest valid potential while preserving algorithmic semantics.
    implementation:
    - Accept a workload task graph with role compatibility and independence constraints; schedule synchronous collective roles
      separately from data preprocessing, eval shards, sampling, rollout, search, labeling, and artifact transfer roles.
    - Provide standard decomposition templates for training-plus-data, training-plus-eval, RL actor/learner/evaluator, world-model
      rollout, and multi-agent simulation.
    - Allow application/trainer plugins to produce decomposition proposals; validate resources, authority, data flow, and
      synchronization in kernel space.
    - Aggregate progress and bottlenecks by logical stage and let controller rebalance independent pools without mutating
      synchronous group semantics.
    - Make unused devices visible with exact incompatibility/restriction reasons.
    anti_drift:
    - Do not force every available device into one training collective.
    - Do not move protected data to a device merely to increase utilization.
    - Do not let a decomposition plugin bypass WorkloadSpec or Driver Gateway.
    integration:
    - Training/Eval/Data/Improvement controllers generate stage graphs; Workload Controller realizes tasks; Fleet Scheduler
      places them.
    validation:
    - G61 and G68 show CPUs, mixed accelerators, edge nodes, and servers doing valid complementary work.
    - An incompatible device contributes a safe independent task or remains idle with explanation.
    dependencies:
    - WORK-003
    - FLEET-004
    gold_examples:
    - G61
    - G68
    - G70
  - id: FLEET-009
    title: Implement provider capacity and elastic-infrastructure interfaces
    goal: Allow external cloud, cluster, Kubernetes, and on-prem capacity managers to add/remove nodes without embedding provider
      APIs in the scheduler.
    implementation:
    - Define a `CapacityProvider` adapter contract for capacity inventory, scale request, provisioning status, cost/carbon
      metadata, failure, and retirement.
    - Issue bounded desired-capacity requests from queue pressure and reservations; treat provider acknowledgements as advisory
      until authenticated nodes enroll.
    - Support static fleets, Kubernetes-backed pools, cloud autoscaling groups, and manually managed physical/edge nodes through
      providers.
    - Apply startup deadlines, budget limits, locality/region constraints, warm-pool policy, and scale-down drain requirements.
    - Record provider decisions and distinguish unavailable capacity from unschedulable workload semantics.
    anti_drift:
    - Do not let a cloud provider response create a node identity or lease directly.
    - Do not autoscale physical robots or user desktops as if they were fungible VMs.
    - Do not require autoscaling for a valid static deployment.
    integration:
    - Node enrollment confirms provisioned capacity; Authority/Quota constrain spend; Deployment Controller manages provider
      adapter rollout.
    validation:
    - G66 scales a reference Kubernetes/cloud pool under queue load and drains safely.
    - Provider timeout/budget exhaustion leaves workloads pending/rejected with exact reason.
    dependencies:
    - FLEET-002
    - NODE-001
    - ACT-001
    gold_examples:
    - G66
    - G68
  - id: FLEET-010
    title: Implement scheduling explanations, dry runs, and capacity simulation
    goal: Make placement and starvation debuggable without exposing other tenants or mutating live queues.
    implementation:
    - Persist normalized candidate filtering, score contributions, reservation conflicts, quota decisions, locality restrictions,
      and selected plan digest.
    - Expose access-controlled `explain`, `why pending`, `what-if`, and dry-run APIs using redacted fleet snapshots.
    - Simulate queue/policy/reservation changes against recorded or synthetic capacity without issuing leases.
    - Report minimal unsatisfied constraints and possible user-space remediations without automatically weakening requirements.
    anti_drift:
    - Do not leak node/tenant workload details through explanations.
    - Do not let a dry run reserve resources.
    - Do not recommend dropping a security/locality constraint as a normal optimization.
    integration:
    - Evidence Service stores decisions; Replay/Simulation executes scheduler simulations; CLI/SDK exposes summaries.
    validation:
    - G62 and G67 assert deterministic explanations and redaction.
    - Counterfactual policy changes reproduce expected placement differences without live effects.
    dependencies:
    - FLEET-001
    - EVID-002
    - RPLY-006
    gold_examples:
    - G62
    - G67
  - id: FLEET-011
    title: Harden scheduler reconciliation, availability, and 1,000-node scale
    goal: Operate the control loop at fleet scale without losing ownership or making global stop-the-world assumptions.
    implementation:
    - Implement leader fencing or single-writer generation for scheduling decisions, durable queue/reservation state, and
      idempotent reconciliation workers.
    - Partition/watch node and workload changes incrementally; avoid full fleet scans on every heartbeat.
    - Define backpressure and bounded staleness for telemetry, candidate caches, and scheduling loops while requiring fresh
      facts for critical placement.
    - Benchmark 1,000 nodes, tens of thousands of queued tasks, thousands of running attempts, and bursty heartbeats/failures.
    - Implement disaster recovery from durable state and node lease reconciliation before issuing new conflicting work.
    anti_drift:
    - Do not rely on in-memory ownership for production reservations.
    - Do not allow two scheduler leaders to issue current lease generations.
    - Do not let telemetry cardinality or explanation storage dominate scheduling latency.
    integration:
    - Event/State stores provide durable records; Node Agents reconcile current lease generations; Observability exports bounded
      metrics.
    validation:
    - G68 and G88 pass scheduler failover, partition, heartbeat storm, and 1,000-node performance budgets.
    - No duplicate current allocation or priority inversion persists beyond defined bounds.
    dependencies:
    - FLEET-003
    - EVT-006
    - STA-005
    - OBS-008
    gold_examples:
    - G68
    - G88
  completion_gate:
  - Only hard-valid, authorized, quota-valid plans receive fenced resource leases.
  - Collective groups are compatibility/topology coherent; heterogeneity is used through explicit role decomposition.
  - Live inference, persistent agents, and physical safety retain declared capacity and SLO priority under fleet load.
- id: splendor.workload-controller
  name: Workload Controller
  plane: execution_fabric
  current_status: missing
  current_baseline: Runs and ticks exist for agent loops, and work orders/placement describe some authority and target constraints.
    There is no generic durable controller for inference, training, eval, data, simulation, shell/Python/OCI/Kubernetes, build,
    maintenance, or recurring workloads with tasks, attempts, leases, checkpoints, cancellation, and reconciliation.
  owner_package: crates/splendor-fabric (workload module)
  kernel_boundary: Own the framework-neutral desired/observed lifecycle of every governed computation. It validates and expands
    WorkloadSpecs into tasks/attempts, coordinates scheduler and node leases, records progress/output/checkpoint state, and
    reconciles failures. It does not implement user algorithms, select model quality, or execute code itself.
  public_contracts:
  - WorkloadSpec
  - WorkloadProfile
  - TaskSpec
  - TaskGraph
  - Attempt
  - WorkerGroup
  - ProgressEvent
  - CheckpointRecord
  - WorkloadResult
  - RecurringSchedule
  tasks:
  - id: WORK-001
    title: Implement the canonical WorkloadSpec and lifecycle state machine
    goal: Give all computation one durable, inspectable, cancellable kernel contract without flattening domain-specific semantics.
    implementation:
    - Define workload identity, owner/scope, profile, immutable code/environment/config/input refs, output declarations, task
      graph, resources, placement, drivers, data/secret grants, determinism, retry, checkpoint, timeout, priority, and evidence
      policy.
    - Implement states proposed, validating, admitted, queued, reserving, starting, running, checkpointing, pausing, paused,
      resuming, cancelling, succeeded, failed, denied, expired, and quarantined with permitted transitions.
    - Separate workload, task, attempt, worker-group, and worker identities and statuses.
    - Persist desired and observed state with optimistic concurrency and command idempotency.
    - Define profile extensions for agent, inference, training, eval, data, replay/simulation, sandbox, build, physical-helper,
      and maintenance without placing algorithms in core.
    anti_drift:
    - Do not equate a workload with an OS process or one node.
    - Do not permit profile payloads to override authority, drivers, resources, or gates.
    - Do not infer success from process exit alone when required outputs/evidence are missing.
    integration:
    - Wrap current `Run`/scheduler loop as an `agent_runtime` workload profile while preserving run/tick identity.
    - Fleet Scheduler and Node Agent consume normalized tasks/attempts.
    validation:
    - G04 exercises every valid/invalid transition and restart reconciliation.
    - G00 round-trips all profiles and rejects authorizing extensions.
    dependencies:
    - FND-001
    - FND-003
    - FND-007
    gold_examples:
    - G00
    - G04
  - id: WORK-002
    title: Implement validation, planning, and admission receipts
    goal: Reject ambiguous or impossible work before reserving resources or exposing protected inputs.
    implementation:
    - Validate schema, principal, work order/capabilities, exact artifact/code/environment refs, driver operations, resource
      feasibility, data/secret purposes, output classes, and risk policy.
    - Resolve mutable user aliases into immutable refs and freeze a `WorkloadPlan` digest before admission.
    - Ask profile controllers/drivers to validate domain-specific sections through pure planning interfaces and collect compatibility
      reports.
    - Produce one decision with denials/warnings, resolved refs, estimated resource/cost envelope, replay mode, and required
      approvals.
    - Revalidate time-sensitive grants at start and privileged invocations without mutating the frozen plan.
    anti_drift:
    - Do not download/mount protected payloads during ordinary plan validation.
    - Do not silently default a missing training/eval/data purpose or side-effect class.
    - Do not weaken a hard requirement to make work schedulable.
    integration:
    - Authority, Artifact, Data-Use, Driver Registry, Fleet Scheduler, and Gate services contribute facts; Workload Controller
      owns final admission record.
    validation:
    - G01, G08, G09, G34, and G60 validate deny-first planning.
    - Plan digest changes whenever a privileged resolved input changes.
    dependencies:
    - WORK-001
    - AUTH-003
    - ART-006
    - DUC-002
    - DRREG-003
    - FLEET-001
    gold_examples:
    - G01
    - G08
    - G09
    - G34
    - G60
  - id: WORK-003
    title: Implement task-graph expansion and role semantics
    goal: Express independent shards, pipelines, collectives, services, actors/learners, and agent/sub-agent work without
      embedding an orchestration language in every controller.
    implementation:
    - 'Define typed task dependencies: data, control, barrier, stream, service-ready, checkpoint, and approval/gate dependencies.'
    - Support fixed tasks, indexed shards, dynamic bounded fan-out, worker groups, long-running services, and reducer/aggregator
      tasks.
    - Require output/input artifact or channel contracts on every edge and detect cycles except explicitly bounded feedback
      loops.
    - Let profile controllers provide a `TaskGraphProposal`; kernel validation freezes it and enforces resource/data/authority
      flow.
    - Version graph revisions between workload epochs; never mutate a running collective graph in place.
    anti_drift:
    - Do not build user model/planner logic into the graph engine.
    - Do not allow unbounded recursive task spawn.
    - Do not use implicit shared filesystem paths as data edges.
    integration:
    - Training, Eval, Data, Improvement, Agent, and Replay controllers generate proposals.
    - Fleet Scheduler uses role/group annotations.
    validation:
    - G18, G19, G58, G61, and G70 validate sub-agent, trigger, RL actor/learner, distributed, and dynamic fan-out graphs.
    - Cycle and authority-flow violations deny.
    dependencies:
    - WORK-001
    - FND-007
    gold_examples:
    - G18
    - G19
    - G58
    - G61
    - G70
  - id: WORK-004
    title: Implement attempts, idempotency, fencing, and result acceptance
    goal: Make retries and distributed execution safe across duplicate delivery, scheduler failover, and stale workers.
    implementation:
    - Create a new attempt identity for each execution while retaining logical task identity; bind scheduler reservation and
      node fencing generation.
    - Define retry eligibility from error taxonomy, effect certainty, retry budget, profile policy, and checkpoint availability.
    - Accept progress, outputs, checkpoints, and terminal receipts only from the current authorized attempt/fencing token.
    - Deduplicate commands and worker messages by stable idempotency keys and sequence/epoch.
    - Quarantine late or conflicting results instead of overwriting the accepted result.
    anti_drift:
    - Do not retry uncertain external effects automatically.
    - Do not let first-arriving result win without current fencing.
    - Do not reuse an attempt identity after process restart.
    integration:
    - Fleet Scheduler issues reservations; Node Agent enforces fencing; Artifact/Lineage verify outputs.
    validation:
    - G63, G65, G87, and G88 inject duplicate, late, stale, and partial results.
    - Exactly one accepted terminal result exists per task epoch.
    dependencies:
    - WORK-001
    - FLEET-003
    - NODE-003
    - FND-004
    gold_examples:
    - G63
    - G65
    - G87
    - G88
  - id: WORK-005
    title: Implement pause, checkpoint, resume, cancel, timeout, and expiration
    goal: Give every long-running workload bounded control semantics rather than provider-specific best effort.
    implementation:
    - 'Define profile-declared safe points and checkpoint capabilities: unsupported, best-effort, coordinated, asynchronous,
      and state-only.'
    - Implement pause intent, task/group checkpoint coordination, durable checkpoint acceptance, resource release policy,
      and resume from exact checkpoint/plan compatibility.
    - Implement graceful cancel with deadline then hard kill; propagate cancellation through task graph and drivers.
    - Distinguish queue/start/run/idle/overall timeout and authority/grant expiry; record effect certainty and partial outputs.
    - Allow physical/live workloads to define safety-specific stop/hold behavior through actuator drivers, not generic process
      kill alone.
    anti_drift:
    - Do not claim paused until a consistent checkpoint or declared paused state exists.
    - Do not resume with changed code/data/topology without compatibility validation.
    - Do not treat timeout as safe cancellation when effects are uncertain.
    integration:
    - Profile controllers implement checkpoint planning; Node Agent executes; Artifact Registry stores checkpoint; Incident
      handles uncertain termination.
    validation:
    - G52, G63, G69, G75, and G87 validate coordinated and unsupported cases, including crash between checkpoint shards.
    dependencies:
    - WORK-004
    - NODE-008
    - ART-002
    gold_examples:
    - G52
    - G63
    - G69
    - G75
    - G87
  - id: WORK-006
    title: Implement progress, checkpoint, output, and terminal result contracts
    goal: Expose domain-neutral lifecycle facts while allowing rich typed training/eval/data/agent progress as artifacts.
    implementation:
    - Define bounded `ProgressEvent` with phase, monotonic step/cursor, units, resource usage, optional metric summaries,
      and artifact refs.
    - Define checkpoint records with compatibility, completeness, shard manifest, logical progress, data cursor, RNG/optimizer/world
      state refs as applicable.
    - Define declared outputs with required/optional, kind/schema, publication policy, and lineage requirements.
    - Compute terminal result only after required outputs, producer receipts, final evidence, and cleanup status are known.
    - Support partial result manifests that explicitly enumerate missing/failed shards rather than presenting them as complete.
    anti_drift:
    - Do not put unbounded metrics/logs in control state.
    - Do not let user code declare its own workload success without controller validation.
    - Do not treat a checkpoint as a deployment candidate automatically.
    integration:
    - Evidence and Artifact services store rich reports; Observability handles high-volume telemetry; profile controllers
      interpret metrics.
    validation:
    - G17, G39, G47, G52, and G69 prove output completeness and lineage.
    - A zero-exit worker missing a required report fails with exact reason.
    dependencies:
    - WORK-001
    - ART-002
    - LIN-002
    - EVID-001
    gold_examples:
    - G17
    - G39
    - G47
    - G52
    - G69
  - id: WORK-007
    title: Implement continuous, recurring, triggered, and service workloads
    goal: Support 24/7 agents, data collectors, online evals, retraining triggers, and resident model services without ad
      hoc loops.
    implementation:
    - Define recurring schedules, event triggers, debounce/coalescing, concurrency policy, missed-run policy, maximum active
      instances, and suspension.
    - Represent long-running services with readiness, desired replicas, update policy, state/checkpoint hooks, and health
      contracts.
    - Bind every triggered execution to the triggering events/state version and current authorization; deduplicate trigger
      identities.
    - Support bounded child workloads and recurring improvement cycles with explicit cycle identity and termination budgets.
    - Keep schedules and triggers as desired state so controller restart resumes without duplicate unbounded executions.
    anti_drift:
    - Do not implement scheduling by sleeping inside a daemon request handler.
    - Do not let an event storm spawn unbounded training or sub-agents.
    - Do not carry expired authority from the schedule definition into future runs.
    integration:
    - Agent Instance, Collection, Eval, Training, and Improvement controllers use the generic recurrence/trigger layer.
    - Message/route events may trigger through typed subscriptions.
    validation:
    - G19, G29, G38, G49, and G70 validate trigger deduplication, 24/7 restart, periodic data/eval, and bounded evolution
      cycles.
    dependencies:
    - WORK-001
    - EVT-004
    - AUTH-006
    gold_examples:
    - G19
    - G29
    - G38
    - G49
    - G70
  - id: WORK-008
    title: Implement managed, observed, and unmanaged execution modes
    goal: Integrate existing external jobs without falsely claiming kernel control and provide a migration path to full governance.
    implementation:
    - 'Define managed mode: Splendor owns launch, resources, mounts, drivers, lifecycle, and receipts.'
    - 'Define observed mode: an external orchestrator launches work, but registers immutable plan/attempt, emits signed lifecycle/output
      evidence, and accepts limited cancellation/inspection semantics.'
    - 'Define unmanaged import: Splendor records externally produced artifacts/evidence as untrusted or externally attested
      history only.'
    - Expose an explicit capability matrix for guarantees unavailable in observed/unmanaged modes, including fencing, secrets,
      data-use enforcement, checkpoint safety, and effect certainty.
    - Require gates/deployments to state whether external evidence meets their trust policy.
    anti_drift:
    - Do not market observed Kubernetes/SLURM jobs as fully kernel-controlled.
    - Do not grant trusted lineage because an external job supplied JSON.
    - Do not block incremental adoption when honest reduced guarantees are acceptable.
    integration:
    - Kubernetes/cluster adapters implement observed receipts; Artifact/Lineage classify trust; Gate Engine enforces policy.
    validation:
    - G06 demonstrates all three modes and prevents guarantee confusion.
    - A forged observed receipt cannot satisfy a production promotion gate.
    dependencies:
    - WORK-001
    - LIN-005
    - GATE-002
    gold_examples:
    - G06
    - G14
  - id: WORK-009
    title: Integrate current runs, daemon, CLI, and SDK without duplicate lifecycle owners
    goal: Move from agent-only run control to generic workloads while preserving the working local runtime.
    implementation:
    - Map current daemon run create/start/pause/resume/stop/cancel to an `agent_runtime` WorkloadSpec and retain `run_id`
      as profile identity, not workload identity.
    - Add generic workload create/inspect/control/events/results endpoints with idempotency and generated Rust/Python/TypeScript
      types.
    - Keep current agent endpoints as compatibility views that delegate to Workload Controller rather than maintaining parallel
      state machines.
    - Extend `splendorctl` with plan, submit, inspect, watch, cancel, checkpoint, resume, and explain commands.
    - Add SDK builders that require immutable refs and make managed/observed guarantees explicit.
    anti_drift:
    - Do not delete stable 0.1 routes before compatibility policy permits.
    - Do not put scheduler/node internals in public SDK models.
    - Do not maintain a second status enum in each controller.
    integration:
    - Daemon becomes transport/composition layer; current Scheduler/LoopEngine becomes one local worker provider.
    validation:
    - All existing examples pass unchanged or through documented migration.
    - G04 executes the same workload through Rust, Python, TypeScript, and CLI.
    dependencies:
    - WORK-001
    - FND-006
    - FND-010
    gold_examples:
    - G04
    - G06
  - id: WORK-010
    title: Harden reconciliation, garbage collection, and controller availability
    goal: Recover desired/observed workload truth after process or store failure without leaking resources or losing forensic
      state.
    implementation:
    - Implement idempotent reconcilers for queued reservations, starting attempts, running leases, checkpointing, cancelling,
      and terminal cleanup.
    - Use ownership generations/leases for controller workers and durable event/state cursors so only one reconciler commits
      a transition.
    - Detect orphan reservations, workers, mounts, upload sessions, temporary artifacts, and recurring trigger locks; clean
      only after fencing/retention checks.
    - Retain terminal metadata/evidence according to policy while garbage-collecting high-volume transient state separately.
    - Provide disaster recovery that rebuilds materialized workload state from events plus durable snapshots and reconciles
      nodes before issuing work.
    anti_drift:
    - Do not delete uncertain attempts or partial artifacts to make state clean.
    - Do not run global full scans continuously.
    - Do not acknowledge controller failover until ownership fencing is established.
    integration:
    - State/Event stores persist authoritative transitions; Fleet and Node agents answer reconciliation queries; Incident
      handles uncertainty.
    validation:
    - G04, G65, G87, and G88 inject controller crash at every transition and verify no duplicate effect/current lease.
    - Garbage collection never removes referenced checkpoint/evidence.
    dependencies:
    - WORK-004
    - EVT-006
    - STA-005
    gold_examples:
    - G04
    - G65
    - G87
    - G88
  completion_gate:
  - All governed computation uses one durable workload/task/attempt lifecycle and exact immutable plan.
  - The controller coordinates but never runs algorithms or treats process exit as sufficient success.
  - Retries, cancellation, checkpointing, triggers, and recovery have explicit effect and fencing semantics.
- id: splendor.driver-registry
  name: Driver Registry
  plane: driver_boundary
  current_status: missing
  current_baseline: Filesystem, HTTP, robotics, gateway verifier, perceptor/policy hooks, and capability documents exist,
    but there is no unified versioned registry for perceptor, actuator, model, trainer, evaluator, data-operator, executor,
    secret, artifact, and capacity drivers with operation schemas, execution profiles, compatibility, maturity, and revocation.
  owner_package: crates/splendor-gateway (registry module) with manifests in splendor-types; concrete drivers remain adapter
    crates
  kernel_boundary: Own discoverable driver identity, manifests, operation schemas, compatibility, maturity/conformance evidence,
    installation scope, selection metadata, version lifecycle, and revocation. It never invokes drivers, grants permissions,
    or judges model/data quality.
  public_contracts:
  - DriverManifest
  - DriverKind
  - DriverOperation
  - OperationSchema
  - ExecutionProfile
  - DriverVersion
  - DriverInstallation
  - DriverConformanceRef
  - DriverSelection
  tasks:
  - id: DRREG-001
    title: Define the universal DriverManifest and operation contract
    goal: Standardize kernel-facing metadata across all driver families without forcing one implementation language or algorithm.
    implementation:
    - Define stable driver ID/version/digest, kind, provider, implementation transport, supported runtime versions/platforms,
      operation names, request/result schemas, streaming mode, side-effect class, idempotency, cancellation, compensation,
      data classifications, required capabilities, resource model, execution profiles, and maturity.
    - Support kinds perceptor, actuator, model, trainer, evaluator, data operator, sandbox executor, artifact backend, secret
      backend, capacity provider, governance, and observability exporter.
    - Require each operation to declare whether it is pure, read-only external, reversible, compensatable, irreversible, physical,
      training-mutating, or control-plane mutation.
    - Bind manifests to implementation artifact/image/binary digest and conformance evidence.
    - Map existing adapter name/action combinations to driver/operation aliases.
    anti_drift:
    - Do not put provider credentials or mutable endpoints in the immutable manifest.
    - Do not infer idempotency or side-effect class from operation name.
    - Do not make all drivers implement every lifecycle method.
    integration:
    - FND object schemas and current `CapabilityDocument` are extended; Driver Gateway consumes resolved operation contracts.
    validation:
    - G07 validates manifests for current filesystem/HTTP/robotics plus reference model/trainer/evaluator/data/sandbox drivers.
    - Missing effect/cancellation/schema declarations reject registration.
    dependencies:
    - FND-001
    - FND-005
    gold_examples:
    - G07
  - id: DRREG-002
    title: Implement registration, installation, and conformance admission
    goal: Prevent untested or mismatched driver code from becoming selectable merely by publishing a name.
    implementation:
    - Separate global driver definition/version from node/cluster installation and endpoint instance.
    - Verify artifact signature/digest, producer trust, runtime compatibility, required libraries/devices, and conformance
      report before accepting maturity.
    - Allow experimental/development drivers in explicitly permitted scopes and require conformant/certified maturity for
      configured risk classes.
    - Record installation health, node scope, endpoint identity, transport security, and last successful self-test.
    - Quarantine installations whose binary digest or reported operation set diverges from the manifest.
    anti_drift:
    - Do not let a driver sign its own independent conformance result.
    - Do not promote maturity because one node self-test passed.
    - Do not expose experimental physical drivers to production routes by default.
    integration:
    - Artifact/Lineage verify implementation; Node Agent reports installations; Authority restricts registrars/scopes.
    validation:
    - G07 and G83 reject tampered, self-attested, incompatible, and changed-operation drivers.
    - Revoked conformance removes production selection without deleting history.
    dependencies:
    - DRREG-001
    - ART-004
    - LIN-005
    - AUTH-003
    gold_examples:
    - G07
    - G83
  - id: DRREG-003
    title: Implement deterministic compatibility and driver resolution
    goal: Select an exact valid driver implementation while keeping policy, placement, and user preference explicit.
    implementation:
    - Resolve by requested kind/operation/schema, required profiles, platform/device, locality, runtime/API version, maturity,
      classification support, cancellation/idempotency needs, and tenant policy.
    - Return an ordered selection with immutable manifest/implementation/installation refs and explain rejected candidates.
    - Allow user-space preferences for provider/cost/latency but prevent them from bypassing hard policy or capability requirements.
    - Freeze the selection into WorkloadPlan/Invocation; do not follow mutable “latest” during execution.
    - Support explicit fallback sets whose semantics and risk are validated before admission.
    anti_drift:
    - Do not choose a live driver for replay/simulation because no simulator exists.
    - Do not silently fall back from local physical to cloud execution.
    - Do not select by driver name alone when schemas/effect semantics differ.
    integration:
    - Workload/Route controllers request resolution; Fleet Scheduler uses installation locality; Gateway receives exact selection.
    validation:
    - G07, G15, G45, G61, and G73 validate deterministic selection/fallback and refusal.
    - Same facts produce same selection digest.
    dependencies:
    - DRREG-001
    - DRREG-002
    - AUTH-001
    gold_examples:
    - G07
    - G15
    - G45
    - G61
    - G73
  - id: DRREG-004
    title: Implement driver lifecycle, revocation, deprecation, and rollout
    goal: Change driver versions without mutating running plans or leaving unsafe versions active.
    implementation:
    - Define active, deprecated, disabled, revoked, quarantined, and retired states per version/installation/operation.
    - Stop new resolution immediately on revocation; notify Workload/Agent/Deployment controllers of affected running usages
      for policy-specific containment.
    - Support side-by-side versions, compatibility windows, canary installation, health comparison, and rollback.
    - Require schema/effect/lifecycle changes to follow compatibility/RFC rules and update conformance.
    - Retain manifests and usage history for reproducibility after binaries are retired.
    anti_drift:
    - Do not hot-swap a driver inside an active invocation.
    - Do not kill all running read-only work on every deprecation.
    - Do not erase a revoked driver from historical evidence.
    integration:
    - Deployment Controller governs driver rollout; Incident/Lineage identify affected artifacts/effects; Node Agent installs/uninstalls.
    validation:
    - G65, G75, and G83 test revocation during running workloads and rollback.
    - New invocations refuse revoked versions; running behavior matches declared policy.
    dependencies:
    - DRREG-002
    - FND-006
    - DEP-005
    gold_examples:
    - G65
    - G75
    - G83
  - id: DRREG-005
    title: Implement capability discovery and schema/tooling APIs
    goal: Let application code discover what can be proposed without confusing discoverability with authority.
    implementation:
    - Expose access-filtered manifests, operation input/output JSON schemas, examples, execution profiles, maturity, compatibility,
      and installation availability.
    - Generate typed Rust/Python/TypeScript invocation builders and driver-authoring stubs from schemas.
    - Provide validation-only APIs that check requests without invoking or revealing protected endpoint details.
    - Support semantic tags and documentation references as non-authorizing metadata.
    - Cache discovery results with version/ETag and invalidate on revocation or policy change.
    anti_drift:
    - Do not expose another tenant’s private driver/endpoints.
    - Do not tell clients an operation is authorized merely because it is discoverable.
    - Do not generate SDK code that can fabricate trusted results.
    integration:
    - Daemon capability endpoint becomes a registry-backed view; Route/Agent builders consume generated schemas.
    validation:
    - G00 and G07 round-trip generated requests/results and enforce access filtering.
    - A discoverable but unauthorized operation is denied at planning/invocation.
    dependencies:
    - DRREG-001
    - FND-010
    - FND-009
    gold_examples:
    - G00
    - G07
  - id: DRREG-006
    title: Build the driver authoring kit and conformance workflow
    goal: Make high-quality third-party drivers feasible without moving provider logic into the kernel.
    implementation:
    - Provide Rust and Python SDKs for manifest generation, request/result validation, cancellation, progress/streaming, scoped
      handles, error taxonomy, and test fixtures.
    - Provide reference out-of-process transport and optional in-process Rust transport for tightly trusted drivers.
    - Generate a conformance suite from operation semantics, including replay profile, secret/data cleanup, timeout, duplicate
      request, postcondition, and fault tests.
    - Package driver implementation, manifest, SBOM/build provenance, schemas, and report as a signed bundle.
    - Document explicit trust/maturity requirements for physical and irreversible effect drivers.
    anti_drift:
    - Do not require all providers to be written in Rust.
    - Do not hide unsafe shell/network shortcuts in the SDK.
    - Do not let a passing local test upload itself as certified without trusted CI/maintainer policy.
    integration:
    - Reference drivers cover filesystem, HTTP, shell, Python, OCI, Kubernetes, model, trainer, evaluator, data, and simulated
      robotics.
    validation:
    - G07 executes the same harness across every family; mandatory skips fail maturity.
    - A third-party sample driver can be implemented without importing kernel internals.
    dependencies:
    - DRREG-001
    - FND-005
    - FND-010
    gold_examples:
    - G07
    - G10
    - G12
    - G13
    - G14
    - G15
  completion_gate:
  - Every selectable operation has explicit schema, effect, lifecycle, compatibility, implementation digest, and conformance
    status.
  - Discovery never grants authority; resolution never follows mutable latest during work.
  - Concrete provider/framework logic remains outside kernel crates.
- id: splendor.driver-gateway
  name: Driver Gateway
  plane: driver_boundary
  current_status: partial foundation
  current_baseline: The existing `VerifiedActionGateway` provides strong mediation for action requests, verifier chains, adapter
    execution, approvals, quotas, circuit breakers, and physical safety. It is action-centric and does not yet mediate model,
    trainer, evaluator, data, perceptor, sandbox, artifact, secret, or capacity operations under one invocation lifecycle.
  owner_package: crates/splendor-gateway (invocation module); current action gateway preserved as compatibility facade
  kernel_boundary: 'Own the only kernel-mediated invocation path into drivers: exact selection, request validation, scoped
    handle issuance, pre/post verification, lifecycle, streaming, cancellation, idempotency, effect certainty, result validation,
    and evidence. It never chooses application intent, implements the provider, or converts a result into model promotion/deployment.'
  public_contracts:
  - Invocation
  - InvocationContext
  - InvocationDecision
  - InvocationLease
  - InvocationStatus
  - DriverRequest
  - DriverResult
  - DriverStreamFrame
  - CompensationRequest
  - InvocationReceipt
  tasks:
  - id: DGW-001
    title: Implement the universal driver invocation state machine
    goal: Generalize the successful action gateway invariant to every agent-related privileged crossing.
    implementation:
    - Define invocation states proposed, validating, denied, waiting-approval, admitted, starting, running, streaming, cancelling,
      compensating, succeeded, failed, uncertain, and quarantined.
    - Bind invocation to principal/scope, workload/task/attempt/fencing, exact driver version/installation/operation/profile,
      request schema/digest, resource/data/secret grants, timeout, and causal parents.
    - Validate identity, current lease, schema, operation compatibility, authority, and required evidence before contacting
      the driver.
    - Persist required pre-effect event/decision, execute through selected transport, validate result/postconditions, and
      append terminal receipt.
    - Map current `ActionRequest/ActionOutcome` into actuator invocations without weakening no-side-effect-without-verifier.
    anti_drift:
    - Do not call provider code before durable required pre-effect evidence.
    - Do not let a generic invocation claim action authority it was not granted.
    - Do not treat driver process success as valid result if schema/postconditions fail.
    integration:
    - Workload/Route/Agent controllers submit proposals; Driver Registry supplies exact selection; current adapters use a
      compatibility wrapper.
    validation:
    - G07 and G15 exercise every terminal transition; G01 verifies deny before provider call.
    - Existing gateway tests remain green.
    dependencies:
    - DRREG-003
    - FND-003
    - FND-007
    gold_examples:
    - G01
    - G07
    - G15
  - id: DGW-002
    title: Implement composable pre-, in-, and post-invocation verifier stages
    goal: Apply authority, safety, data, resource, invariant, approval, and output checks consistently while preserving driver-specific
      verifiers.
    implementation:
    - Define ordered verifier stages for identity/lease, operation policy, data/secret scope, quota/resource, state/world
      preconditions, governance approval, physical safety, provider-specific checks, result schema, postconditions, and evidence
      obligations.
    - Require structured allow/deny/intervention/uncertain decisions with reason codes and artifacts; hard denials prevent
      provider contact.
    - Permit streaming/in-flight monitors to request cancel/hold for long operations, while the driver protocol reports effect
      certainty.
    - Separate advisory soft constraints from enforcing verifiers and record both.
    - Version verifier bundles and bind exact bundle digest to invocation receipts.
    anti_drift:
    - Do not make prompt instructions an enforcement stage.
    - Do not allow later verifier stages to override an earlier hard denial.
    - Do not run remote high-latency policy calls in a physical emergency-stop path.
    integration:
    - Gate/Authority/Data-Use/World/Physical services contribute verifier plugins; current permission/quota/invariant/approval/safety
      verifiers migrate.
    validation:
    - G15, G27, G73, G78, and G80 validate hard/soft/approval/physical/adversarial paths.
    - Verifier timeout follows declared fail-closed/intervention policy.
    dependencies:
    - DGW-001
    - AUTH-003
    - DUC-002
    gold_examples:
    - G15
    - G27
    - G73
    - G78
    - G80
  - id: DGW-003
    title: Issue scoped invocation handles for secrets, data, artifacts, state, and channels
    goal: Give a driver only the minimum resources needed for one operation and revoke them with invocation lifecycle.
    implementation:
    - Create opaque handles for input artifacts, output upload sessions, secret leases, data views, state/world read snapshots,
      progress channels, and optional constrained callback operations.
    - Bind handles to invocation/attempt/fencing, allowed operation, byte/record/time budgets, classification, and locality.
    - Deliver handles through the driver transport without embedding underlying credentials/paths in durable request objects.
    - Revoke and clean handles on denial, cancellation, terminal state, lease expiry, or driver quarantine; record non-secret
      cleanup receipts.
    - Require explicit sub-invocation capabilities if a driver needs nested model/tool operations.
    anti_drift:
    - Do not give drivers direct store database connections or registry admin credentials.
    - Do not let one invocation reuse another invocation’s output session or data handle.
    - Do not expose secrets in trace/result serialization.
    integration:
    - Secret Broker, Artifact Registry, Data-Use Controller, State/World services issue handles; Node Agent realizes local
      mounts.
    validation:
    - G08, G16, G34, G82, and G83 prove scoping, revocation, and exfiltration prevention.
    - Handle replay from stale attempt fails.
    dependencies:
    - DGW-001
    - SECR-002
    - ART-002
    - DUC-003
    - NODE-003
    gold_examples:
    - G08
    - G16
    - G34
    - G82
    - G83
  - id: DGW-004
    title: Implement idempotency, retry, compensation, and effect certainty
    goal: Prevent duplicate external effects and make uncertain outcomes first-class instead of hiding them behind retries.
    implementation:
    - Require operation-declared idempotency semantics and client-generated idempotency key for retryable effects.
    - Persist attempt/provider request identity and terminal receipt; return the same known result on duplicate current requests.
    - Classify failures as no-effect, effect-known, effect-uncertain, and effect-partial; automatically retry only where policy
      and operation semantics permit.
    - Support explicit compensation operations linked to the original invocation, with separate authority, verification, and
      evidence.
    - Open intervention/incident for irreducibly uncertain high-risk effects rather than guessing or blindly retrying.
    anti_drift:
    - Do not assume HTTP retry safety from method name alone.
    - Do not describe compensation as transaction rollback unless the provider guarantees it.
    - Do not reuse historical approval for a compensation or retry outside scope.
    integration:
    - Workload retry policy consumes effect certainty; Incident handles uncertainty; Actuator drivers declare compensation.
    validation:
    - G15, G16, G47, and G87 inject dropped responses before/after effect and verify no duplicate or false certainty.
    dependencies:
    - DGW-001
    - FND-004
    - INC-001
    gold_examples:
    - G15
    - G16
    - G47
    - G87
  - id: DGW-005
    title: Implement streaming, flow control, cancellation, and deadlines
    goal: Support token streams, sensor streams, logs, progress, long tools, physical operations, and distributed worker channels
      without unbounded buffering.
    implementation:
    - Define ordered stream frames with invocation/stream/sequence, schema, timestamp, payload or artifact ref, integrity,
      and terminal marker.
    - Implement bounded buffers, backpressure, credits/windowing, heartbeat, idle deadline, resume policy, and consumer cancellation.
    - Distinguish advisory client disconnect from authoritative cancel; route cancel to driver and continue tracking until
      effect certainty/terminal state.
    - Allow local safety monitors to interrupt physical streams independently of remote consumers.
    - Move large frames to artifacts and preserve causal link in stream metadata.
    anti_drift:
    - Do not buffer unbounded model tokens/video/sensor data in the gateway.
    - Do not mark an operation cancelled because the client disconnected.
    - Do not replay a live sensor/actuator stream as if it were current.
    integration:
    - Perceptor/Model/Actuator/Trainer drivers use common streaming protocol; Observability exports summaries.
    validation:
    - G20, G22, G23, G53, and G74 test backpressure, reconnect, cancellation, and physical local interruption.
    dependencies:
    - DGW-001
    - FND-008
    gold_examples:
    - G20
    - G22
    - G23
    - G53
    - G74
  - id: DGW-006
    title: Implement secure local and remote driver transports
    goal: Run drivers in-process, sidecar, subprocess, container, node service, or remote provider without changing invocation
      semantics.
    implementation:
    - Define transport-neutral handshake, protocol/schema negotiation, endpoint identity, mutual authentication, request/stream/cancel/result
      messages, and health.
    - Provide trusted in-process Rust, Unix-domain/local IPC, mutually authenticated remote RPC, and provider-HTTP bridge
      transports.
    - Bind endpoint to registered installation/implementation digest and reject operation drift after handshake.
    - Apply payload limits, timeouts, replay protection, connection pooling, and circuit breaking by driver/endpoint.
    - Preserve the same evidence and error taxonomy across transports.
    anti_drift:
    - Do not expose an unauthenticated generic remote execution endpoint.
    - Do not trust a TLS connection without driver/installation identity binding.
    - Do not let transport-specific status replace kernel error/effect semantics.
    integration:
    - Node Agent hosts local endpoints; Daemon/control plane routes remote invocations; Driver Registry tracks installations.
    validation:
    - G07 runs one reference operation over each transport.
    - MITM/replay/schema-downgrade and endpoint-drift tests deny.
    dependencies:
    - DGW-001
    - NODE-001
    - FND-006
    gold_examples:
    - G07
    - G81
  - id: DGW-007
    title: Enforce driver isolation and nested-operation policy
    goal: Keep provider code from bypassing the gateway or acquiring ambient authority.
    implementation:
    - Run out-of-process drivers in declared sandbox profiles with only scoped handles and required network/device access.
    - Require nested operations to be submitted as child invocations with causal parent and delegated capability; prohibit
      direct callbacks into privileged stores.
    - Limit recursion/depth/rate and detect cycles such as model driver invoking itself through a route.
    - Separate control-plane drivers from user-space algorithm plugins and require stronger maturity/isolation for irreversible/physical
      operations.
    - Quarantine driver installation on protocol forgery, undeclared network/device use, or result/effect inconsistency.
    anti_drift:
    - Do not assume a Python driver is trusted because it uses the SDK.
    - Do not let a trainer/evaluator call protected eval or deployment APIs directly.
    - Do not allow arbitrary nested invocation graphs.
    integration:
    - Sandbox Executor and Node Agent enforce environment; Authority attenuates child capabilities; Incident contains violations.
    validation:
    - G80–G85 exercise ambient credential, recursive tool, protected eval, and forged result attacks.
    dependencies:
    - DGW-003
    - SBX-007
    - AUTH-005
    - INC-003
    gold_examples:
    - G80
    - G81
    - G82
    - G83
    - G84
    - G85
  - id: DGW-008
    title: Implement invocation evidence, redaction, and high-volume separation
    goal: Make every driver use auditable without turning traces into secret or payload dumps.
    implementation:
    - Record request/result schema and digest, selected driver/operation/profile, verifier decisions, scoped handle refs,
      timings, resource summary, effect certainty, output refs, and terminal reason.
    - Store large/sensitive request/result payloads as classified artifacts and expose deterministic redacted views.
    - Send high-volume tokens/sensor/progress/metrics to bounded stream/artifact/telemetry channels while preserving causal
      event refs.
    - Create an `InvocationReceipt` suitable for lineage, eval, change, physical audit, and replay substitution.
    - Ensure trace durability requirements are stricter before side effects than for optional telemetry.
    anti_drift:
    - Do not log prompts, secrets, protected eval cases, raw physical frames, or dataset records by default.
    - Do not omit a denied invocation because the driver was never called.
    - Do not let redaction alter decision reason or causal shape.
    integration:
    - Event/Evidence/Artifact/Lineage services consume receipts; Observability consumes summaries.
    validation:
    - G03, G15, G39, G73, and G82 validate evidence completeness and redaction.
    - Payload-size stress does not break control-plane latency.
    dependencies:
    - DGW-001
    - EVID-001
    - FND-009
    gold_examples:
    - G03
    - G15
    - G39
    - G73
    - G82
  - id: DGW-009
    title: Migrate current action adapters through the universal gateway
    goal: Preserve the strongest implemented boundary while eliminating parallel invocation semantics.
    implementation:
    - Wrap filesystem, HTTP, and robotics `ActionAdapter` operations as actuator driver manifests and invocation handlers.
    - Translate current permission/quota/invariant/approval/circuit-breaker/physical safety checks into ordered verifier stages
      with identical fail-closed behavior.
    - Preserve ActionRequest/Outcome APIs as compatibility facades backed by Invocation records and IDs linked explicitly.
    - Update daemon and loop engine to call the universal gateway without changing existing traces unexpectedly; emit compatibility
      event mapping.
    - Add migration tests for replay inspect-only, approval pause/resume, and physical safety evidence.
    anti_drift:
    - Do not rewrite history or reuse ActionId as InvocationId.
    - Do not relax adapters-only side-effect invariant during migration.
    - Do not maintain two separate quota ledgers.
    integration:
    - Current examples become first production-conformant actuator drivers.
    validation:
    - All existing gateway/daemon/physical tests pass plus G07/G15/G73.
    - Compatibility exports identify both action and invocation identity.
    dependencies:
    - DGW-001
    - DGW-002
    - FND-006
    gold_examples:
    - G07
    - G15
    - G73
  completion_gate:
  - No driver operation—perception, model, training, eval, data, sandbox, or effect—crosses the boundary without an exact
    invocation and current scoped authority.
  - Pre-effect evidence, verifier ordering, fencing, effect certainty, and result validation are consistent across transports.
  - The gateway mediates; it never promotes, deploys, or embeds provider algorithms.
- id: splendor.perceptor-driver
  name: Perceptor Driver Contract and Reference Drivers
  plane: driver_boundary
  current_status: partial foundation
  current_baseline: A `Perceptor` trait collects vectors of minimal `Percept {schema,payload,provenance,timestamp}` values,
    daemon percept append endpoints validate allowlists, and device/simulation examples exist. Missing are stable perceptor
    manifests, event identity, source sequence/cursors, push/stream/subscription modes, clock/calibration/uncertainty, quality/freshness,
    artifact-backed modalities, data-use enforcement, backpressure, and cross-device recovery.
  owner_package: contract in crates/splendor-types and splendor-gateway; concrete providers in `adapters/perceptors/*`
  kernel_boundary: Define and implement the driver-side contract that converts an external environment, sensor, tool, service,
    user channel, or agent into governed observations. It owns source interaction and declared normalization; it does not
    update world truth, choose policy, train models, or grant action authority.
  public_contracts:
  - PerceptorManifest
  - Observation
  - ObservationBatch
  - ObservationProvenance
  - SourceCursor
  - SourceClock
  - QualitySignal
  - CalibrationRef
  - PerceptorSubscription
  tasks:
  - id: PERC-001
    title: Define the observation envelope, identity, and provenance model
    goal: Make percepts usable for world state, learning, feedback, and audit across arbitrary modalities without placing
      modality payloads in core.
    implementation:
    - Introduce `observation_id`, source identity, source sequence/cursor, acquisition time, receive time, schema/version,
      payload ref or bounded inline payload, provenance chain, classification, quality/freshness, calibration ref, uncertainty
      summary, and causal parents.
    - Distinguish raw observation, normalized observation, derived feature, external assertion, user message, system event,
      and simulated/replayed observation.
    - Define modality as extensible metadata/media type rather than a closed text/image/audio enum.
    - Preserve current `Percept` as a compatibility view and create deterministic mapping to `Observation`.
    - Require source-specific identifiers/cursors where available so duplicates and gaps can be reasoned about.
    anti_drift:
    - Do not make source timestamp globally trustworthy.
    - Do not treat an observation as a verified world fact.
    - Do not inline unbounded video/audio/tensor/document payloads in trace or state.
    integration:
    - Artifact Registry stores large payloads; Event Log records receipt; World-State Service decides assimilation.
    validation:
    - G20 and G21 round-trip text, image, audio, telemetry, document, message, and custom tensor observations.
    - Duplicate IDs, invalid provenance, and schema/classification mismatch fail.
    dependencies:
    - DRREG-001
    - ART-001
    - FND-008
    gold_examples:
    - G20
    - G21
  - id: PERC-002
    title: Implement pull, push, subscription, and streaming lifecycle profiles
    goal: Support polling APIs, event buses, sensors, files, databases, human input, and continuous physical streams through
      one lifecycle.
    implementation:
    - 'Declare per-operation mode: snapshot pull, cursor pull, webhook/push ingest, subscription, finite stream, continuous
      stream, or trigger-only.'
    - Implement open/start/read/ack/commit-cursor/pause/resume/close/health methods only where the profile requires them.
    - Bind subscriptions and cursors to workload/agent instance, source scope, data purpose, schema, and lease generation.
    - Define delivery semantics at-most-once, at-least-once, source-exactly-once-when-supported, and best-effort with explicit
      gaps.
    - Route every provider interaction through Driver Gateway, including subscription creation and acknowledgement.
    anti_drift:
    - Do not claim exactly-once when the source lacks stable cursor/transaction semantics.
    - Do not keep a subscription alive after its data-use or workload lease expires.
    - Do not model continuous sensors as repeated synchronous daemon HTTP calls.
    integration:
    - Agent Instance and Collection Controller own consumption/cursor commit; Gateway owns invocation/stream state.
    validation:
    - G20–G22 cover all lifecycle profiles, restart from cursor, source duplication, and disconnect.
    - Lease expiry terminates or pauses source according to policy.
    dependencies:
    - PERC-001
    - DGW-005
    - WORK-007
    gold_examples:
    - G20
    - G21
    - G22
  - id: PERC-003
    title: Implement ordering, watermarks, deduplication, freshness, and backpressure
    goal: Make asynchronous and multi-source observations operationally coherent without inventing total order.
    implementation:
    - Track source sequence, receive sequence, event-time watermark, allowed lateness, gap markers, duplicate fingerprints,
      and out-of-order policy.
    - Provide bounded buffers and consumer credits; define source-specific drop, sample, spill-to-artifact, or pause behavior.
    - Emit explicit stale, duplicate, gap, overflow, and source-reset observations/events rather than silently hiding them.
    - Allow application code to select event-time/window semantics while kernel enforces bounds and cursor durability.
    - Commit durable cursor only after configured downstream acceptance to avoid invisible data loss.
    anti_drift:
    - Do not impose a false global order across independent sensors.
    - Do not drop observations without an evidenced policy decision.
    - Do not let slow learning/data consumers stall a physical safety consumer sharing the same source.
    integration:
    - Collection Controller can fork governed streams; Agent Instance has independent consumer cursors; Event Log stores control
      metadata.
    validation:
    - G22 saturates a stream and proves bounded memory, explicit gaps, independent consumers, and deterministic cursor recovery.
    dependencies:
    - PERC-002
    - EVT-004
    - STA-006
    gold_examples:
    - G22
    - G29
  - id: PERC-004
    title: Implement artifact-backed multimodal payload and transform declarations
    goal: Handle arbitrary sensor/model/document payloads efficiently while preserving exact source bytes and declared transformations.
    implementation:
    - Upload large payloads through artifact sessions before or alongside observation publication, with chunking/streaming
      where supported.
    - Declare transforms such as decoding, resizing, resampling, compression, unit conversion, tokenization, embedding, redaction,
      or feature extraction as versioned user-space/driver artifacts with lineage.
    - Preserve raw artifact refs when policy allows and link normalized/derived artifacts rather than overwriting them.
    - Validate media/schema, dimensions/rates/units, payload digest, and bounded preview metadata.
    - Support zero-copy/local handles only as lease-scoped optimization; durable identity remains content-addressed.
    anti_drift:
    - Do not standardize one tensor layout or tokenizer in kernel core.
    - Do not label a transformed feature as raw sensor evidence.
    - Do not retain raw sensitive media merely for convenience when policy requires early redaction/deletion.
    integration:
    - Artifact/Lineage services own bytes/derivation; Data-Use governs retention; Model/Data drivers can perform transforms.
    validation:
    - G21 processes large image/audio/custom tensors and verifies raw/derived lineage and retention.
    - Corrupt partial media never becomes accepted observation.
    dependencies:
    - PERC-001
    - ART-002
    - LIN-002
    - DUC-004
    gold_examples:
    - G21
    - G26
  - id: PERC-005
    title: Implement source quality, calibration, uncertainty, and health signals
    goal: Expose measurement limitations so world models and policies can reason instead of treating all inputs as equally
      reliable.
    implementation:
    - Define optional quality dimensions such as completeness, signal validity, confidence, resolution, noise, drift, saturation,
      occlusion, packet loss, and source health using named schemas.
    - Reference immutable calibration artifacts and validity windows; detect missing/expired/incompatible calibration.
    - Allow drivers to emit uncertainty summaries and health facts but keep interpretation/fusion in user-space/world/eval
      code.
    - Add source self-tests and cross-check hooks whose results are evidence, not automatic truth.
    - Propagate quality and calibration refs into observation lineage and downstream eval slices.
    anti_drift:
    - Do not define one universal confidence scale.
    - Do not let a driver mark itself trustworthy without independent evaluation.
    - Do not hide missing calibration behind a default zero uncertainty.
    integration:
    - World-State assimilation consumes quality; Gate/Route may require minimum source health for actions; Eval Controller
      slices by quality.
    validation:
    - G23 and G74 degrade/corrupt sensors and prove uncertainty/fallback/local safety behavior.
    - Expired calibration blocks configured physical actions but may permit clearly marked observation.
    dependencies:
    - PERC-001
    - EVID-002
    - WORLD-003
    gold_examples:
    - G23
    - G73
    - G74
  - id: PERC-006
    title: Enforce data-use, privacy, consent, and source authority at collection time
    goal: Prevent perception from becoming an unrestricted data-exfiltration path.
    implementation:
    - Require a source capability and collection/data-use purpose for opening subscriptions, polling protected sources, or
      storing payloads.
    - Apply source/field/region/person/tenant filters and minimization before durable publication where technically possible.
    - Attach consent/licence/privacy-zone/retention obligations as non-forgeable refs; support source revocation and deletion
      propagation.
    - Keep safety-local sensor evidence on device when policy requires, exporting only bounded safety summaries.
    - Separate observations permitted for live operation from those permitted for training, evaluation, debugging, or sharing.
    anti_drift:
    - Do not assume data visible to an agent is automatically trainable.
    - Do not let payload fields carry their own consent or permissions.
    - Do not upload raw physical/privacy-zone media to cloud helper by default.
    integration:
    - Data-Use Controller authorizes and Collection Controller manages obligations; Node Agent enforces locality.
    validation:
    - G26, G34, G35, and G73 validate purpose separation, consent revocation, deletion impact, and safety-local summaries.
    dependencies:
    - PERC-002
    - DUC-001
    - NODE-004
    gold_examples:
    - G26
    - G34
    - G35
    - G73
  - id: PERC-007
    title: Implement live, recorded, simulated, and null execution profiles
    goal: Make replay, tests, counterfactuals, and physical simulation safe and semantically explicit.
    implementation:
    - Require every production perceptor operation to declare supported live/recorded/simulated/null profiles and fidelity
      limitations.
    - Recorded profile serves immutable observations with original timing or virtual-clock schedule and provenance marked
      recorded.
    - Simulated profile obtains observations from a declared simulator/world model and links simulation configuration/seed.
    - Null/deny profile returns explicit absence where source use is prohibited.
    - Prevent profile changes during a running subscription without a new invocation/route epoch.
    anti_drift:
    - Do not label recorded camera data as live.
    - Do not silently use live sensors in replay when no recording exists.
    - Do not promote simulator outputs into live world truth automatically.
    integration:
    - Replay/Simulation resolves profiles; World-State distinguishes observation classes; Driver conformance traps live access.
    validation:
    - G03, G23, G25, and G73 prove profile isolation and provenance.
    - A perceptor lacking a non-live profile causes simulation plan denial.
    dependencies:
    - PERC-001
    - RPLY-002
    gold_examples:
    - G03
    - G23
    - G25
    - G73
  - id: PERC-008
    title: Build reference perceptors across software and physical domains
    goal: Prove the abstraction is not overfit to text prompts or one sensor stack.
    implementation:
    - Implement reference drivers for HTTP polling/webhook, filesystem watch, message bus, database change feed, human input
      queue, model-generated observation, process/log stream, and timer/event trigger.
    - Implement simulated and development physical drivers for camera/frame refs, IMU/GPS/telemetry, battery/status, and robot
      mission state without hard real-time control claims.
    - Implement sub-agent/message perceptor and protected eval input perceptor with access separation.
    - Use common schemas only for envelope/lifecycle; each domain payload has its own versioned schema.
    - Ship runnable examples with disconnect, duplication, backpressure, calibration, privacy, and replay tests.
    anti_drift:
    - Do not call development physical drivers production-certified.
    - Do not add provider/domain parsing to kernel crates.
    - Do not create one “generic sensor JSON” schema for every modality.
    integration:
    - Agent/world/data examples consume reference drivers; Driver Registry publishes their maturity.
    validation:
    - G20–G23 and G73–G74 pass across at least three transports and two modalities.
    dependencies:
    - PERC-001
    - PERC-007
    - DRREG-006
    gold_examples:
    - G20
    - G21
    - G22
    - G23
    - G73
    - G74
  - id: PERC-009
    title: Add perceptor conformance and adversarial validation
    goal: Make source lifecycle, data controls, and observation integrity testable for third-party drivers.
    implementation:
    - Generate tests from manifest for schema, sequence/cursor, cancellation, backpressure, payload limits, artifact integrity,
      classification, data-use expiry, and execution profiles.
    - Inject source reset, duplicates, reordering, stale clock, malformed payload, calibration expiry, privacy-zone violation,
      and driver crash.
    - Trap undeclared network/filesystem/device access and raw payload leakage into events/logs.
    - Verify cursor/mount/subscription cleanup after every terminal path.
    - Publish conformance evidence per operation/profile, not one blanket driver badge.
    anti_drift:
    - Do not allow mandatory lifecycle tests to be skipped because a driver is inconvenient.
    - Do not accept provider logs as proof of no data leakage.
    - Do not certify simulation fidelity from interface conformance alone.
    integration:
    - Driver Registry maturity and Gate policies consume reports.
    validation:
    - G07 and G20–G23 reject intentionally faulty perceptors and retain precise failure evidence.
    dependencies:
    - PERC-002
    - PERC-006
    - FND-005
    gold_examples:
    - G07
    - G20
    - G21
    - G22
    - G23
  completion_gate:
  - Observations have identity, provenance, timing, quality, classification, and lifecycle independent of payload modality.
  - A perceptor observes; world truth, policy, reward, and learning remain separately owned.
  - Every source access is purpose-scoped, bounded, replay-profiled, and conformance-tested.
- id: splendor.actuator-driver
  name: Actuator Driver Contract and Reference Drivers
  plane: driver_boundary
  current_status: partial foundation
  current_baseline: Filesystem, HTTP, and high-level simulated robotics adapters already execute verified `Action`s with pre/postconditions,
    permissions, quotas, approval, circuit-breaker, and safety checks. Missing are a complete actuator operation contract,
    effect/idempotency/compensation semantics, long-running actions, device-local execution, shell/database/Kubernetes adapters,
    sub-agent actuators, result observation linkage, and conformance across uncertain failures.
  owner_package: contract in crates/splendor-types and splendor-gateway; concrete implementations in `adapters/actuators/*`
  kernel_boundary: Translate an admitted high-level action invocation into one bounded external effect and report exact result/effect
    certainty. It owns provider/device interaction and declared compensation; it does not decide the action, bypass verification,
    mutate agent/world state directly, or declare improvement.
  public_contracts:
  - ActuatorManifest
  - ActuatorOperation
  - EffectClass
  - ActionCommand
  - ActionReceipt
  - CompensationSpec
  - LongOperationHandle
  - PhysicalActionContract
  tasks:
  - id: ACT-001
    title: Define actuator operations and capability semantics
    goal: Make effectful interfaces explicit enough for software services, subprocesses, infrastructure, sub-agents, and physical
      devices.
    implementation:
    - Define operation schema, required capabilities, target scope, effect class, idempotency, preconditions, postconditions,
      timeout/deadline, cancellation, compensation, observability, and result schema.
    - Distinguish read-only external access, reversible mutation, compensatable mutation, irreversible digital effect, high-level
      physical effect, and local emergency/safety operation.
    - Bind operation capability to exact resource/endpoint/device and parameter constraints, not only an action name.
    - Map existing `Action` fields into the contract and retain action identity linked to invocation identity.
    - Allow extensible domain operations without a global action-name namespace collision.
    anti_drift:
    - Do not infer effect safety from HTTP method, shell command name, or provider documentation.
    - Do not expose raw motor/firmware control as a generic high-level actuator.
    - Do not make an action payload carry its own permission or approval.
    integration:
    - Authority Service grants operations/scopes; Driver Registry publishes semantics; Gateway enforces.
    validation:
    - G15, G16, and G73 validate digital, database, and physical contracts.
    - Incomplete effect/idempotency declarations cannot reach conformant maturity.
    dependencies:
    - DRREG-001
    - DGW-001
    gold_examples:
    - G15
    - G16
    - G73
  - id: ACT-002
    title: Implement precondition, postcondition, and outcome observation contracts
    goal: Connect proposed effects to verifiable state/world conditions and observed outcomes without trusting the actuator
      alone.
    implementation:
    - Represent preconditions/postconditions as typed predicate refs evaluated by verifier providers against pinned state/world
      snapshots or local safety status.
    - Require actuator results to include provider receipt, observed identifiers, changed-resource refs, satisfied/failed
      declared postconditions, and effect certainty.
    - Support independent outcome perceptors/verifiers to confirm externally observable effects after execution.
    - Record expected versus observed state delta as evidence; State/World services accept only separate update proposals.
    - Define timeout windows and inconclusive postcondition behavior.
    anti_drift:
    - Do not let the actuator directly mark arbitrary postconditions satisfied without evidence policy.
    - Do not update world truth from a provider success code alone.
    - Do not erase a successful effect because post-verification failed; report effect plus failed assurance.
    integration:
    - World-State, State, Perceptor, and Gateway verifier stages contribute facts.
    validation:
    - G15 and G47 inject false provider success, delayed outcome, and postcondition failure.
    - Effect remains traceable while follow-up/incident behavior is correct.
    dependencies:
    - ACT-001
    - DGW-002
    - WORLD-003
    gold_examples:
    - G15
    - G47
    - G73
  - id: ACT-003
    title: Implement idempotent, compensatable, and uncertain-effect operation patterns
    goal: Provide reusable safe patterns for common external mutation semantics while retaining provider-specific truth.
    implementation:
    - Provide SDK helpers for provider idempotency keys, compare-and-set/versioned update, transactional database operation,
      create-if-absent, append-with-dedup, and immutable object publication.
    - Define compensation plan schemas referencing original result/resource version and requiring independent capability and
      verification.
    - Capture request-sent, provider-accepted, effect-observed, response-received, and compensation states where supported.
    - Route unknown outcome to `uncertain` and intervention/incident; support reconciliation perceptors that later resolve
      certainty.
    - Make retry behavior operation-specific and bounded.
    anti_drift:
    - Do not claim exactly-once external effects generically.
    - Do not automatically compensate physical or irreversible effects.
    - Do not retry after timeout when provider acceptance is unknown unless operation contract proves idempotency.
    integration:
    - Gateway handles generic effect state; provider drivers implement exact primitives; Incident/Reconciliation handles uncertainty.
    validation:
    - G15, G16, G47, and G87 cover dropped responses, duplicates, compensation failure, and later reconciliation.
    dependencies:
    - ACT-001
    - DGW-004
    gold_examples:
    - G15
    - G16
    - G47
    - G87
  - id: ACT-004
    title: Implement long-running and streaming actuator operations
    goal: Control jobs, deployments, remote builds, robot missions, and other effects that outlive one request/response.
    implementation:
    - Define start/status/progress/cancel/hold/resume/finalize operations around a stable provider operation handle.
    - Bind status polling/subscription and cancellation to the original invocation authority and fencing generation.
    - Separate accepted/started/running/completed from merely submitted; capture external operation identity and expiry.
    - Support local safety hold/emergency stop independently of cloud connectivity for physical operations.
    - Reconcile after gateway/node restart without duplicating start.
    anti_drift:
    - Do not treat “job submitted” as action completed.
    - Do not lose control because the client session ended.
    - Do not poll unboundedly without quota/deadline.
    integration:
    - Workload Controller may model the external operation as a child workload; Gateway maintains invocation lifecycle; Perceptor
      observes status.
    validation:
    - G14, G15, G73, and G75 test job/mission lifecycle, cancel, disconnect, and restart.
    dependencies:
    - ACT-001
    - DGW-005
    - WORK-005
    gold_examples:
    - G14
    - G15
    - G73
    - G75
  - id: ACT-005
    title: Implement shell, process, database, Kubernetes, and service reference actuators
    goal: Cover essential software actuation with narrow safe contracts rather than a single unrestricted command executor.
    implementation:
    - Keep restricted argv process execution in Sandbox Executor and expose only explicitly registered commands/working directories/env/mounts
      as actuator operations.
    - Provide an explicit high-risk `sh -c` operation requiring stronger capability, sandbox, egress/filesystem policy, and
      approval where configured.
    - Implement database driver operations for parameterized query/transaction/migration with datasource scope, statement
      class, row/byte/time limits, and transaction outcome.
    - Implement Kubernetes operations for applying exact signed manifests, starting Jobs, querying status, and rollback through
      scoped cluster credentials—not raw cluster-admin shell.
    - Implement HTTP/service operations with endpoint/method/schema/egress/rate/idempotency constraints.
    anti_drift:
    - Do not make unrestricted shell the universal adapter.
    - Do not pass raw SQL or Kubernetes admin credentials without an operation-specific policy.
    - Do not duplicate sandbox execution logic inside actuator drivers.
    integration:
    - Sandbox Executor owns isolation; Secret Broker delivers credentials; Gateway verifies target/action scopes.
    validation:
    - G10–G16 prove safe and denied paths, injection resistance, quotas, uncertain outcomes, and cleanup.
    dependencies:
    - ACT-001
    - SBX-001
    - SECR-002
    gold_examples:
    - G10
    - G11
    - G12
    - G13
    - G14
    - G15
    - G16
  - id: ACT-006
    title: Implement physical-device and robot high-level actuator boundary
    goal: Permit useful physical AI while ensuring local safety, capability, and control remain on the device.
    implementation:
    - Define high-level physical operations such as navigate-to bounded region, inspect, capture, grasp-with-profile, mission
      start/hold/return, or device-specific equivalents through versioned domain schemas.
    - Require device identity, local actuator capability, coordinate/frame refs, limits, safety policy version, freshness,
      deadline, and fallback/hold behavior.
    - Execute final precondition and safety verification on the resident device using current local sensor/status; cloud outputs
      remain advisory proposals.
    - Support emergency stop/hold paths outside ordinary remote gateway latency and prohibit bypass by model, planner, shell,
      or cloud-helper code.
    - Record trace-safe safety evidence and bounded outcome summaries; keep raw safety-local sensor data under local policy.
    anti_drift:
    - Do not claim hard real-time motor control or certification.
    - Do not let a cloud model directly command actuators.
    - Do not execute when coordinate frame, safety policy, or critical sensor freshness is uncertain.
    integration:
    - Build on current device profiles, allowed physical action patterns, safety verifier, offline cache, and robotics simulation
      harness.
    validation:
    - G73–G75 and G80 test local deny/hold/estop, cloud-helper authority separation, offline operation, and prompt/tool bypass.
    dependencies:
    - ACT-001
    - NODE-006
    - DGW-002
    - WORLD-009
    gold_examples:
    - G73
    - G74
    - G75
    - G80
  - id: ACT-007
    title: Implement sub-agent and trigger-agent actuator profiles
    goal: Make delegation a first-class governed action while preserving separate agent identity and attenuated authority.
    implementation:
    - Define `spawn_agent`, `delegate_task`, `send_request`, `await_response`, `cancel_child`, and `register_trigger` operations
      backed by Agent/Message services.
    - Require a target AgentSpec/revision or allowed dynamic template, delegated scope/capabilities/data refs, resource/time
      budget, parent run/workload, and response schema.
    - Treat child response as an observation/result, not as trusted action authority or world truth.
    - Bound recursion, fan-out, duration, and authority attenuation; revoke child authority on cancellation/expiry.
    - Support a persistent trigger agent with its own identity and independently governed actions.
    anti_drift:
    - Do not run sub-agents inside an actuator driver implementation.
    - Do not inherit parent permissions by default.
    - Do not let child text or messages widen authority.
    integration:
    - Agent Instance Controller realizes child workloads; Message/Delegation routes communication; Gateway mediates operation.
    validation:
    - G18, G19, G70, and G81 prove specialist delegation, trigger behavior, recursion limits, and forged-message resistance.
    dependencies:
    - ACT-001
    - AGREG-005
    - MSG-003
    - AINST-006
    gold_examples:
    - G18
    - G19
    - G70
    - G81
  - id: ACT-008
    title: Implement actuator conformance, simulation, and fault validation
    goal: Prove each effectful driver has honest lifecycle and safety behavior before production use.
    implementation:
    - Generate tests for operation schema, capability scope, no-call-on-deny, idempotency, duplicate requests, timeout before/after
      effect, cancellation, compensation, postconditions, output redaction, and cleanup.
    - Require recorded/simulated/null profiles or an explicit no-simulation declaration with affected test/route restrictions.
    - Use effect sentinels and disposable resources to distinguish no-effect, one-effect, partial, and uncertain cases.
    - For physical drivers, require simulation-harness and local safety tests but label certification outside scope.
    - Publish per-operation conformance/fidelity evidence and quarantine inconsistent behavior.
    anti_drift:
    - Do not certify an irreversible operation without injected uncertain-failure cases.
    - Do not call a mock a faithful physical simulator solely because schemas match.
    - Do not permit skipped postcondition tests to pass maturity.
    integration:
    - Driver Registry/Gate consume reports; Replay resolves non-live profiles.
    validation:
    - G07, G15, G16, G45, and G73 reject intentionally faulty digital and physical actuators.
    dependencies:
    - ACT-001
    - FND-005
    - RPLY-002
    gold_examples:
    - G07
    - G15
    - G16
    - G45
    - G73
  completion_gate:
  - Actuators execute only bounded, verified operations with explicit effect semantics and current target capability.
  - External success, observed outcome, state/world update, reward, and promotion remain distinct.
  - Uncertain and physical effects fail safely and retain local control/evidence.
- id: splendor.model-driver
  name: Model Driver Contract and Reference Drivers
  plane: driver_boundary
  current_status: missing
  current_baseline: Current policy callbacks may call any model in user space, but Splendor has no first-class model identity,
    loading/session lifecycle, structured invocation, local/remote provider abstraction, batching/streaming, multimodal payloads,
    state/cache management, resource accounting, or model-level routing evidence. Model artifacts and activation are not separated
    explicitly.
  owner_package: contract in crates/splendor-types and splendor-gateway; implementations in `adapters/models/*`; optional
    Python helpers in `python/splendor`
  kernel_boundary: Expose inference and model-computation operations for arbitrary neural networks, LLMs, classical learned
    models, or differentiable modules through governed invocations. It owns model runtime/provider interaction and session-local
    compute state; it never decides policy, trains/updates weights, assigns reward, or activates a candidate.
  public_contracts:
  - ModelManifest
  - ModelArtifactBinding
  - ModelOperation
  - InferenceRequest
  - InferenceResult
  - ModelSession
  - BatchPolicy
  - ModelRuntimeProfile
  - AdapterComposition
  tasks:
  - id: MODEL-001
    title: Define model manifests, artifacts, operations, and compatibility
    goal: Represent models from custom PyTorch modules to remote LLM APIs without making “text generation” the universal contract.
    implementation:
    - Define model identity/revision as immutable bundle refs containing architecture/code or provider model ref, weights,
      processor/tokenizer/codec, config, environment/runtime, licence/classification, supported operations, input/output schemas,
      and compatibility.
    - Support operations such as forward, generate, embed, score, classify, value/critic, encode/decode, predict transition,
      custom named tensor/structured operation, and remote provider call.
    - Declare modality/media schemas, batching constraints, statefulness, streaming, determinism class, numerical precision,
      resource envelopes, context/window limits, and allowed adapter composition.
    - Separate logical model artifact from runtime installation/loaded instance/session and from deployment alias.
    - Allow opaque custom payload schemas and artifact-backed tensors while keeping privileged fields typed.
    anti_drift:
    - Do not hard-code Transformer or LLM assumptions in core.
    - Do not identify a model by mutable provider name or filesystem path.
    - Do not treat a model manifest as evidence of quality/alignment.
    integration:
    - Artifact/Lineage store model bundles; Driver Registry publishes runtime operations; Deployment owns aliases.
    validation:
    - G53 and G54 invoke a GPT-style Transformer and a non-language custom neural net through the same envelope.
    - Model/processor/version mismatch fails before loading.
    dependencies:
    - ART-001
    - DRREG-001
    gold_examples:
    - G53
    - G54
  - id: MODEL-002
    title: Implement model load, instance, session, and unload lifecycle
    goal: Control expensive model state and prevent mutable runtime caches from becoming hidden agent state.
    implementation:
    - Define load requests with exact artifact/runtime/device/precision/quantization/adapter refs and resource lease; return
      loaded-instance identity and measured footprint.
    - Support warm pools and instance reuse only when tenant/classification/session isolation permits; pin implementation/model
      digest.
    - Define session state for KV cache, recurrent hidden state, decoder state, or custom opaque state with size/TTL/ownership
      and optional checkpoint/export profile.
    - Make session state explicit as ephemeral, state-service-backed, or artifact-backed; never hide it from lifecycle/evidence
      policy.
    - Implement drain/unload/eviction and OOM/corrupt-load recovery without changing deployment alias implicitly.
    anti_drift:
    - Do not let one tenant/agent inherit another session cache.
    - Do not treat process memory as durable agent memory.
    - Do not unload protected live instances solely to admit background training.
    integration:
    - Node Agent allocates resources; State Service may own durable session refs; Fleet/Deployment manage warm placement.
    validation:
    - G53 tests cold/warm/session isolation and node restart.
    - Memory-pressure tests preserve reserved live service and produce exact eviction evidence.
    dependencies:
    - MODEL-001
    - NODE-003
    - STA-001
    gold_examples:
    - G53
    - G68
  - id: MODEL-003
    title: Implement generic inference request/result and streaming semantics
    goal: Serve structured, tensor, multimodal, and generative model calls with bounded, schema-valid evidence.
    implementation:
    - Define input refs/inline bounds, operation-specific parameters, seed/sampling config, session ref, output schema, resource/deadline/cost
      budgets, and requested evidence detail.
    - Support finite results and ordered streams; attach token/frame/chunk sequence, usage, finish reason, model/runtime refs,
      and bounded confidence/calibration metadata where provided.
    - Validate structured outputs against declared schema but preserve raw output artifact for debugging where policy permits.
    - Support cancellation and report whether provider/local generation ceased; distinguish client truncation, model stop,
      timeout, safety/provider denial, and driver failure.
    - Publish large logits/embeddings/tensors/media as artifacts rather than trace payloads.
    anti_drift:
    - Do not treat model-generated JSON as trusted because it parses.
    - Do not claim provider cancellation guarantees not observed.
    - Do not expose hidden chain-of-thought as a required kernel artifact.
    integration:
    - Route Runtime consumes model results as proposals/facts of computation; Gateway streams; Evidence stores receipts.
    validation:
    - G53–G54 cover text, embedding, value, tensor, structured, streaming, cancellation, and malformed output.
    dependencies:
    - MODEL-001
    - DGW-005
    - FND-009
    gold_examples:
    - G53
    - G54
  - id: MODEL-004
    title: Implement local PyTorch/Transformers and remote-provider reference drivers
    goal: Prove framework/provider neutrality with production-shaped but bounded adapters.
    implementation:
    - Implement a local PyTorch driver that loads a user-provided factory/exported bundle and invokes named operations without
      requiring Transformers.
    - Implement a Hugging Face Transformers reference driver as user-space adapter supporting GPT-2-class causal LM and common
      processor bundles.
    - Implement a provider-neutral remote HTTP model driver with endpoint-specific plugins, secret leases, rate limits, request/response
      schema conversion, and usage receipts.
    - Implement a deterministic tiny-model driver for conformance and CI without network/model downloads.
    - Keep framework imports and provider schemas entirely out of core crates.
    anti_drift:
    - Do not call remote provider models reproducible when provider revision is opaque.
    - Do not make Transformers a dependency of the kernel.
    - Do not allow provider API key scope to exceed exact driver endpoint/operation.
    integration:
    - Sandbox/Node hosts local runtimes; Secret Broker handles remote credentials; Artifact Registry pins local code/weights.
    validation:
    - G53 reproduces tiny/GPT-2 inference locally and runs a recorded remote-provider fixture with honest determinism.
    - Custom module G54 needs no Transformers import.
    dependencies:
    - MODEL-001
    - MODEL-003
    - SBX-004
    - SECR-002
    gold_examples:
    - G53
    - G54
  - id: MODEL-005
    title: Implement batching, admission, quotas, and latency control
    goal: Share model compute efficiently while respecting per-request deadlines, isolation, budgets, and live SLOs.
    implementation:
    - Declare compatible batching keys including model revision, operation, dtype, adapter composition, input shape/context
      class, output constraints, tenant/isolation, and determinism policy.
    - Implement dynamic/static batching with max wait, batch size/token/memory limits, per-request cancellation, and result
      demultiplexing.
    - Account input/output units, accelerator time, memory, provider cost, cache usage, and rejected/queued requests to tenant/workload
      quotas.
    - Reserve capacity for latency-critical routes and expose queue/admission decisions; optionally spill to compatible instances/providers
      through prevalidated route policy.
    - Prevent one oversized/slow request from starving unrelated tenants or physical safety inference.
    anti_drift:
    - Do not batch requests across protected isolation boundaries by default.
    - Do not let batching change sampling seed semantics silently.
    - Do not hide latency caused by queueing behind model execution time.
    integration:
    - Fleet/Node reserve instances; Route Runtime expresses fallback; Observability monitors SLO; Authority enforces quotas.
    validation:
    - G53 and G68 load mixed tenants/requests and assert isolation, accounting, deadlines, and protected latency.
    dependencies:
    - MODEL-002
    - AUTH-004
    - NODE-006
    - OBS-004
    gold_examples:
    - G53
    - G68
  - id: MODEL-006
    title: Implement explicit model routing inputs and outcome evidence
    goal: Give Route Runtime reliable facts for choosing models without embedding routing policy in the driver.
    implementation:
    - Expose static capabilities, schemas, context/resource/cost limits, locality, current health/load, and deployment maturity
      as routing facts.
    - Return actual usage, latency, provider/model revision evidence, finish reason, and output quality signals declared by
      the model—not an aggregate routing score.
    - Support dry-run token/resource estimation as an operation with bounded trust and error measurement.
    - Record fallback/provider changes explicitly and never substitute a model revision outside the frozen allowed set.
    - Allow application evaluators to attach post-hoc quality evidence separately.
    anti_drift:
    - Do not let the model driver choose the “best” model for an agent objective.
    - Do not treat self-reported confidence as calibrated value.
    - Do not silently route protected data to a remote model.
    integration:
    - Route Runtime owns choice; Data-Use controls provider/locality; Eval supplies empirical evidence.
    validation:
    - G24 and G28 route by explicit rules/learned selectors and verify exact selected revision and no hidden fallback.
    dependencies:
    - MODEL-001
    - ROUTE-001
    - DUC-002
    gold_examples:
    - G24
    - G28
  - id: MODEL-007
    title: Implement adapter, ensemble, and composed-model declarations
    goal: Support LoRA/PEFT, heads, critics, encoders, ensembles, and modular agents without losing artifact identity or compatibility.
    implementation:
    - Define ordered composition refs for base model, parameter-efficient adapters, heads, processors, calibration artifacts,
      safety/value modules, and merge strategy.
    - Validate architecture/key/shape/runtime/licence compatibility and compute a composition digest used for loading/invocation/eval.
    - Support pre-merged immutable model artifacts and runtime composition as distinct evidenced modes.
    - Represent ensembles/cascades as Route graphs unless the model driver owns one atomic mathematical operation.
    - Record every component in lineage and prohibit mutable hot injection into loaded production instance.
    anti_drift:
    - Do not call an adapter-only change the same model revision.
    - Do not hide routing/agent architecture inside an opaque model driver unnecessarily.
    - Do not combine components with incompatible data-use/licence obligations.
    integration:
    - Training publishes adapter candidates; Artifact/Lineage track composition; Deployment activates exact bundle.
    validation:
    - G55 trains/evaluates/deploys an adapter composition and detects base/adapter mismatch.
    dependencies:
    - MODEL-001
    - LIN-002
    - TRAIN-014
    gold_examples:
    - G55
  - id: MODEL-008
    title: Enforce inference isolation, data controls, and no-training boundary
    goal: Prevent model runtimes from becoming ambient data collectors or unauthorized online trainers.
    implementation:
    - Mount inputs/model artifacts read-only and permit only declared session/output writes.
    - Require explicit collection policy before prompts/inputs/outputs/activations enter datasets; normal invocation evidence
      stores bounded hashes/summaries.
    - Disable gradients/optimizer/update paths in inference profiles where framework supports it and detect model artifact
      mutation on unload.
    - Separate protected eval, training, and live inference instances/caches according to policy.
    - Scope provider retention/training opt-out requirements through data-use/provider contracts and record unverifiable external
      guarantees honestly.
    anti_drift:
    - Do not assume remote providers do not retain data without a verified contract.
    - Do not let inference code overwrite model weights and publish them as a candidate.
    - Do not route protected eval inputs through a cache visible to training.
    integration:
    - Collection Controller explicitly captures eligible records; Data-Use governs provider use; Node/Gateway enforce mounts/handles.
    validation:
    - G34, G40, G43, and G84 test training/eval/cache separation and attempted model mutation/exfiltration.
    dependencies:
    - MODEL-002
    - DUC-001
    - COLL-001
    - NODE-004
    gold_examples:
    - G34
    - G40
    - G43
    - G84
  - id: MODEL-009
    title: Implement determinism, caching, and reproducibility profiles
    goal: Reuse safe computations and compare behavior without overstating numerical/provider reproducibility.
    implementation:
    - Declare determinism class and capture model/composition/runtime/hardware, operation, inputs, parameters, seeds/random
      streams, and relevant numerical flags.
    - Define cache eligibility only for pure operations with data-classification-safe scope and exact cache key; generative
      stochastic calls require explicit seed/profile.
    - Keep provider-side opaque caching as external behavior and record limited reproducibility.
    - Support recorded-result substitution for replay and bounded numerical/statistical comparison profiles.
    - Invalidate caches on revocation, policy change, or artifact deletion and never make cache hit grant payload access.
    anti_drift:
    - Do not claim bitwise equality across unsupported devices/kernels.
    - Do not cache one tenant’s protected prompt/result for another.
    - Do not use a cache result under a model alias that now points elsewhere.
    integration:
    - Replay/Evidence uses reproducibility graph; Artifact cache stores results; Data-Use controls access.
    validation:
    - G39, G42, G52, and G53 verify exact/bounded/statistical classes and cache isolation.
    dependencies:
    - MODEL-003
    - FND-008
    - RPLY-003
    gold_examples:
    - G39
    - G42
    - G52
    - G53
  - id: MODEL-010
    title: Implement model-driver conformance and conversion examples
    goal: Prove custom and standard models can interoperate without conflating inference support with training/eval support.
    implementation:
    - Generate lifecycle tests for manifest/load/invoke/stream/cancel/session/isolation/resource/error/result schema/replay
      and artifact mutation.
    - Provide conversion/import tools that create a model bundle from a PyTorch state dict/module factory, Transformers directory,
      ONNX-like runtime artifact, or remote provider descriptor as separate adapters.
    - Validate numerical reference cases, shape/schema errors, OOM, corrupt weights, processor mismatch, session leakage,
      and provider timeout.
    - Publish a capability report identifying which operations and determinism claims are actually supported.
    - Keep training compatibility assessment in Trainer/Training components.
    anti_drift:
    - Do not infer trainability from successful inference import.
    - Do not report a model converted when unsupported custom operators were skipped.
    - Do not allow mandatory isolation tests to be waived for production.
    integration:
    - Gold GPT-2 and custom-net examples use the same bundle/driver protocol.
    validation:
    - G07, G53, and G54 pass for tiny Transformer, GPT-2-class, CNN/custom tensor model, and recorded remote provider.
    dependencies:
    - MODEL-001
    - MODEL-004
    - FND-005
    gold_examples:
    - G07
    - G53
    - G54
  completion_gate:
  - Models are immutable addressed artifacts invoked through typed operations; loaded instances and sessions are explicit
    runtime state.
  - Inference never mutates or activates model weights, and model output remains a proposal/computation result.
  - The contract is modality, framework, provider, and architecture agnostic.
- id: splendor.trainer-driver
  name: Trainer Driver Contract and Framework Adapters
  plane: driver_boundary
  current_status: missing
  current_baseline: There is no trainer driver in the current repository. Training is explicitly a prior MVP non-goal, and
    Python has no dependencies. Missing are a framework-neutral worker protocol, project compatibility contract, PyTorch launch
    adapter, distributed parallelism plugins, progress/checkpoint/data-cursor callbacks, failure semantics, and candidate-output
    publication.
  owner_package: contract in crates/splendor-types and splendor-gateway; framework adapters in `adapters/trainers/*`; Python
    integration package `splendor-train`
  kernel_boundary: Run a user-supplied training algorithm inside an admitted worker/group and expose lifecycle, progress,
    checkpoint, and candidate outputs to Splendor. It does not choose data, objectives, hyperparameters, topology, gates,
    or activation; those are controller/application responsibilities.
  public_contracts:
  - TrainerManifest
  - TrainingProjectContract
  - TrainerLaunch
  - WorkerContext
  - ParallelPlan
  - TrainingProgress
  - CheckpointProtocol
  - TrainerResult
  - CompatibilityReport
  tasks:
  - id: TRDRV-001
    title: Define the framework-neutral trainer worker protocol
    goal: Give any training framework a stable contract for launch, progress, checkpoint, cancellation, and result without
      moving the algorithm into kernel code.
    implementation:
    - Define trainer operations inspect-project, validate-plan, prepare, launch-worker, checkpoint, restore, quiesce/cancel,
      finalize, and collect-result.
    - Pass a `WorkerContext` containing workload/task/attempt, role/logical slot/rank for current group epoch, topology, resources,
      input/output handles, seed bundle, data shard/cursor, checkpoint source, progress endpoint, and fencing token.
    - Define structured progress and checkpoint callbacks independent of training metrics names.
    - Require terminal result to enumerate produced model/checkpoint/optimizer/config/report artifacts and exact logical progress.
    - Support single-process and distributed groups through the same contract.
    anti_drift:
    - Do not require a specific loss, optimizer, loop, model class, or dataset API.
    - Do not let trainer workers call deployment or gate APIs.
    - Do not parse stdout as the only checkpoint/progress channel.
    integration:
    - Training Controller creates plan; Workload/Fleet/Node realize group; Gateway mediates trainer operations.
    validation:
    - G52 and G54 run single-process custom loops and pass all lifecycle/failure cases.
    dependencies:
    - DRREG-001
    - WORK-001
    - DGW-001
    gold_examples:
    - G52
    - G54
  - id: TRDRV-002
    title: Define honest project compatibility tiers for arbitrary training projects
    goal: Support arbitrary PyTorch projects without promising impossible automatic distributed conversion.
    implementation:
    - 'Implement tier T0 `opaque`: run the original entrypoint unchanged as one worker; only independent trials/eval/data
      fan-out are automatic.'
    - 'Implement tier T1 `torchrun-compatible`: project already honors distributed environment and checkpoint semantics; Splendor
      forms groups and launches it without rewriting algorithm code.'
    - 'Implement tier T2 `structured project`: project provides model/optimizer/data/step/checkpoint factories or hooks, allowing
      Splendor adapters to apply supported DDP/FSDP/data-sharding wrappers.'
    - 'Implement tier T3 `explicit parallel plan`: project supplies validated tensor/pipeline/expert/custom parallel plugin
      and topology requirements.'
    - Generate a `CompatibilityReport` listing detected framework/version, entrypoints, side effects, state/checkpoint patterns,
      distributed initialization, data-loader behavior, unsupported dynamic code/custom extensions, and exact guarantees available.
    - Require explicit opt-in/manifest selection; never silently transform source code.
    anti_drift:
    - Do not claim T0 has become distributed because multiple copies run.
    - Do not automatically wrap arbitrary dynamic models/optimizers/data pipelines when semantics cannot be proven.
    - Do not fail all unusual projects; preserve single-node/observed execution with honest limits.
    integration:
    - Training Controller uses report to choose/reject a plan; Sandbox Executor builds/runs project; Artifact/Lineage pin
      source/env.
    validation:
    - G60–G64 include T0, T1, T2, and T3 fixtures and verify advertised guarantees.
    - A deliberately unsafe/global-state project remains T0 with actionable reasons.
    dependencies:
    - TRDRV-001
    - SBX-004
    - LIN-004
    gold_examples:
    - G60
    - G61
    - G62
    - G63
    - G64
  - id: TRDRV-003
    title: Implement the PyTorch torchrun/elastic launch adapter
    goal: Launch existing distributed-aware PyTorch projects across Splendor worker groups while respecting PyTorch restart
      semantics.
    implementation:
    - Generate `torchrun`/elastic rendezvous parameters, node rank/local rank/world size for one group epoch, master/rendezvous
      endpoint, restart budget, and error recording from the frozen WorkerGroupPlan.
    - Treat rank/world-size as epoch-local; logical worker identity remains Splendor attempt/slot and is passed separately.
    - Validate homogeneous local worker count and runtime/backend compatibility where required by the selected PyTorch mode.
    - On membership/failure, fence all old workers, create a new group epoch, restore from a compatible checkpoint, and regenerate
      rank/data assignment.
    - Capture per-rank errors, first/root-cause evidence, process group initialization/teardown, and collective timeout diagnostics.
    anti_drift:
    - Do not hard-code stable rank assumptions.
    - Do not leave surviving ranks blocked after one worker fails.
    - Do not use elastic min/max for projects whose batch/data/checkpoint semantics are fixed.
    integration:
    - Fleet Scheduler owns group epochs; Node Agent launches local workers; Training Controller chooses elasticity.
    validation:
    - G64 repeatedly changes membership and validates checkpoint/restart, no stale commits, and declared sample semantics.
    - Collective initialization mismatch fails before training steps where possible.
    dependencies:
    - TRDRV-002
    - FLEET-006
    - NODE-005
    gold_examples:
    - G64
  - id: TRDRV-004
    title: Implement DDP, FSDP, tensor, pipeline, and custom parallel adapters
    goal: Expose a bounded set of real parallelization mechanisms through plugins instead of one magical “distributed=true”
      flag.
    implementation:
    - For T2 projects, implement DDP wrapping with explicit device placement, sampler/data semantics, gradient accumulation,
      unused-parameter/static-graph options, and global batch declaration.
    - Implement modern fully-sharded adapter through version-pinned PyTorch APIs with sharding plan, optimizer state, mixed
      precision, CPU/offload policy, and distributed checkpoint integration.
    - Implement DeviceMesh/tensor-parallel and pipeline-parallel adapters only with identical canonical mesh/partition plan
      on all ranks and project-provided partitionable structure.
    - Define a custom parallel plugin interface for expert/dataflow/domain-specific systems with explicit group/topology/checkpoint/equivalence
      contract.
    - Validate combinations (for example data + tensor + pipeline) as named supported profiles; reject unknown compositions.
    anti_drift:
    - Do not apply tensor or pipeline parallelism by guessing model layer boundaries.
    - Do not combine parallel methods whose optimizer/checkpoint semantics are unvalidated.
    - Do not expose unstable framework details as permanent kernel primitives; keep them in versioned adapter plugins.
    integration:
    - Training Controller selects a `ParallelPlan`; Fleet Scheduler realizes topology; Checkpoint protocol stores topology-independent
      metadata where possible.
    validation:
    - G61–G64 cover DDP and sharded modes plus one explicit 2D mesh fixture; inconsistent mesh is rejected rather than hanging.
    dependencies:
    - TRDRV-002
    - TRDRV-003
    - FLEET-004
    gold_examples:
    - G61
    - G62
    - G63
    - G64
  - id: TRDRV-005
    title: Implement structured progress, metric, and safe-point callbacks
    goal: Observe training and coordinate control without dictating the user loop.
    implementation:
    - Provide a lightweight Python API/context for step/epoch/token/sample progress, named metrics, optimizer-step boundaries,
      safe checkpoint points, evaluation request, and graceful stop checks.
    - Batch/rate-limit metric events and publish detailed histories as artifacts/telemetry rather than controller state.
    - Allow opaque/T1 projects to emit the protocol explicitly or fall back to coarse process/checkpoint evidence with reduced
      guarantees.
    - Bind metric schema/source/rank/aggregation status and prevent worker-reported metrics from directly satisfying gates.
    - Expose checkpoint/preemption/cancel requests cooperatively and define hard-kill fallback.
    anti_drift:
    - Do not monkey-patch arbitrary training loops invisibly.
    - Do not let a worker declare its own metric globally aggregated.
    - Do not block every step on control-plane availability.
    integration:
    - Node Agent hosts local control channel; Training Controller aggregates/decides; Observability stores high-volume metrics.
    validation:
    - G52, G63, and G68 validate progress under backpressure, control-plane reconnect, and preemption.
    dependencies:
    - TRDRV-001
    - DGW-005
    - OBS-004
    gold_examples:
    - G52
    - G63
    - G68
  - id: TRDRV-006
    title: Implement data-shard and cursor integration without owning dataset logic
    goal: Give workers deterministic, purpose-scoped sample streams compatible with restart and elastic group changes.
    implementation:
    - Accept dataset/split refs plus a DataAssignment containing shard/partition, sampling policy digest, epoch/generation,
      global batch semantics, and cursor/checkpoint refs.
    - Provide adapters for map-style and iterable/streaming datasets while requiring application hooks when exact cursor restoration
      is impossible.
    - Record consumed record/shard ranges or privacy-preserving fingerprints according to policy and reconcile with data-use
      leases.
    - On group resize, obtain a new assignment from Training Controller rather than deriving it from unstable rank alone.
    - Support replay buffers/online data streams as explicit source contracts with snapshot/watermark semantics.
    anti_drift:
    - Do not assume `DistributedSampler` solves arbitrary iterable/streaming data exactly.
    - Do not let ranks independently select protected eval data.
    - Do not hide duplicate/skip semantics after failure.
    integration:
    - Data/Training controllers own snapshots/assignments; Node mounts; Lineage records trained-on edges.
    validation:
    - G52, G56, G58, and G64 verify map, stream, replay-buffer, restart, and resize semantics with declared duplication bounds.
    dependencies:
    - TRDRV-001
    - DODRV-007
    - TRAIN-008
    - DUC-003
    gold_examples:
    - G52
    - G56
    - G58
    - G64
  - id: TRDRV-007
    title: Implement distributed checkpoint and restore protocol
    goal: Preserve model, optimizer, scheduler, scaler, RNG, data cursor, and algorithm state across failure/topology changes
      where the project supports it.
    implementation:
    - Define checkpoint component manifests, group epoch/topology, logical progress, framework/adapter versions, determinism
      class, completeness, and compatibility constraints.
    - Support single-file and sharded checkpoints; for PyTorch structured modes integrate distributed checkpoint save/load
      and load-time resharding through adapter code.
    - Coordinate rank-local staging, global manifest commit, asynchronous upload, and only then advertise a durable checkpoint.
    - Restore into same or different supported topology after validating state allocation, optimizer/model compatibility,
      data cursor/global batch policy, and project migration hook.
    - Retain the last N known-good checkpoints and quarantine corrupt/incomplete/newer stale-attempt outputs.
    anti_drift:
    - Do not treat a set of rank files as complete without a committed root manifest.
    - Do not assume checkpoint state_dict compatibility across arbitrary framework versions.
    - Do not resume with reset optimizer/data cursor silently.
    integration:
    - Node Agent uploads; Artifact Registry commits; Training Controller selects and validates resume; Lineage binds inputs.
    validation:
    - G52, G63, G64, and G69 kill ranks during save/load, reshard topology, and validate numerical/behavioral continuity.
    dependencies:
    - TRDRV-004
    - NODE-008
    - ART-002
    - FND-008
    gold_examples:
    - G52
    - G63
    - G64
    - G69
  - id: TRDRV-008
    title: Implement candidate-bundle finalization and publication
    goal: Turn training outputs into immutable candidates without granting them deployment or policy authority.
    implementation:
    - Define trainer result outputs for model/adapters, processor, training config, final/selected checkpoint, optimizer optional
      retention, metric artifacts, environment, and compatibility metadata.
    - Verify output digests, required components, producer receipt, exact dataset/code/environment/parallel plan, and current
      fencing before publication.
    - Run conversion/export hooks as separate evidenced workloads where needed; never mutate the raw checkpoint in place.
    - Publish a `CandidateBundle` in candidate-only state and hand it to Eval/Improvement controllers.
    - Reject or quarantine outputs whose worker declarations disagree with actual mounts/plan or whose checkpoint is incomplete.
    anti_drift:
    - Do not update deployment/model aliases from trainer code.
    - Do not call training metrics evaluation evidence.
    - Do not let a stale rank or compromised worker select the accepted candidate.
    integration:
    - Artifact/Lineage own bundle; Training Controller owns run result; Eval Controller evaluates; Deployment remains separate.
    validation:
    - G50–G59 verify candidate-only publication and complete lineage; G83 rejects forged/stale candidate.
    dependencies:
    - TRDRV-007
    - LIN-002
    - MODEL-001
    gold_examples:
    - G50
    - G51
    - G52
    - G53
    - G54
    - G55
    - G56
    - G57
    - G58
    - G59
    - G83
  - id: TRDRV-009
    title: Provide non-PyTorch and custom trainer adapter path
    goal: Keep Splendor’s kernel contract framework-neutral while PyTorch remains the first deep integration.
    implementation:
    - Implement an executable/OCI trainer adapter using the generic worker/progress/checkpoint/result protocol for JAX, TensorFlow,
      native code, simulators, solvers, or custom systems.
    - Define framework plugin interfaces for project inspection, worker launch, parallel plan validation, checkpoint compatibility,
      and candidate packaging.
    - Keep collective/runtime-specific semantics entirely in plugin manifests and compatibility reports.
    - Support observed external trainers with reduced guarantees through Workload observed mode.
    - Add one non-PyTorch minimal numerical training fixture proving no PyTorch types enter core schemas.
    anti_drift:
    - Do not generalize PyTorch-specific rank/state_dict concepts into foundational objects.
    - Do not claim automatic distribution for a framework without a conformant plugin.
    - Do not require deep integration to run an opaque training executable.
    integration:
    - Training Controller calls framework-neutral contract; Sandbox/Fleet execute.
    validation:
    - G06 and G54 run an opaque custom trainer and compare guarantees with structured PyTorch.
    dependencies:
    - TRDRV-001
    - WORK-008
    - SBX-005
    gold_examples:
    - G06
    - G54
  - id: TRDRV-010
    title: Build trainer conformance and distributed failure matrix
    goal: Prove lifecycle and recovery claims at one, many, elastic, and heterogeneous fleet scales.
    implementation:
    - Generate tests for project tiers, worker context, rank/group epochs, progress, data assignments, checkpoint completeness,
      cancellation, preemption, OOM, collective timeout, node loss, stale output, and candidate publication.
    - Run 1-process, multi-process one-node, multi-node fixed, elastic restart, topology-reshard, and independent heterogeneous
      role cases.
    - Use numerical/behavioral tolerances appropriate to determinism class and compare against single-process reference where
      semantics permit.
    - Measure lost work, restart time, checkpoint overhead, throughput scaling, live-inference interference, and duplicate/skip
      sample bounds.
    - Publish per-version/per-parallel-profile conformance evidence.
    anti_drift:
    - Do not call a driver distributed-conformant after only launching two processes.
    - Do not hide failed/unsupported topology combinations.
    - Do not use speedup alone as correctness evidence.
    integration:
    - Driver Registry maturity, Training Controller plan selection, and gold distributed program consume reports.
    validation:
    - G52 and G60–G69 form the mandatory matrix; injected broken trainer is rejected.
    dependencies:
    - TRDRV-001
    - TRDRV-008
    - FND-005
    gold_examples:
    - G52
    - G60
    - G61
    - G62
    - G63
    - G64
    - G65
    - G66
    - G67
    - G68
    - G69
  completion_gate:
  - Trainer drivers execute user algorithms and report control/evidence; they never choose or activate improvements.
  - Arbitrary projects receive an honest T0–T3 compatibility tier, not source rewriting or false distribution claims.
  - Distributed lifecycle, data, checkpoint, elasticity, and stale-worker semantics are explicit and tested.
- id: splendor.evaluator-driver
  name: Evaluator Driver Contract and Reference Drivers
  plane: driver_boundary
  current_status: missing
  current_baseline: The loop has a minimal `OutcomeEvaluator` returning optional `Feedback` and `Reward`, but there is no
    evaluator driver contract for dataset cases, interactive episodes, simulations, human review, model judges, red teams,
    protected suites, distributed shards, metric artifacts, or statistically valid aggregation.
  owner_package: contract in crates/splendor-types and splendor-gateway; implementations in `adapters/evaluators/*`
  kernel_boundary: Execute one evaluation method/case/episode or aggregation operation against pinned inputs and candidate/baseline
    outputs, then return measured evidence. It does not choose promotion thresholds, derive authoritative reward automatically,
    expose protected cases, or activate changes.
  public_contracts:
  - EvaluatorManifest
  - EvalCaseInput
  - EvalObservation
  - MetricSample
  - SliceKey
  - EvalShardResult
  - AggregationResult
  - HumanReviewRequest
  tasks:
  - id: EVDRV-001
    title: Define evaluator operation and result schemas
    goal: Support deterministic tests, learned judges, human review, simulators, physical trials, and custom metrics without
      one generic score blob.
    implementation:
    - Define operations prepare-case, run-case/episode, score-output/trajectory, aggregate-shard, compare-baseline, and request-human-review.
    - Bind exact evaluator implementation/model/rubric, case/suite ref, candidate/baseline refs, environment/world snapshot,
      seed, sampling, timeout, and protected-data handle.
    - Return per-case observations, metric samples with units/direction/range, categorical findings, failure reason, slice
      attributes, artifacts, and evaluator confidence/limitations.
    - Distinguish task failure, model failure, evaluator failure, invalid case, abstention, and safety abort.
    - Keep gate pass/fail outside evaluator results.
    anti_drift:
    - Do not reduce all evaluation to one scalar.
    - Do not let result payload carry its own gate decision or reward authority.
    - Do not hide evaluator failures as candidate score zero unless suite semantics explicitly require it.
    integration:
    - Eval Controller defines suites/plans; Workload runs shards; Evidence stores results.
    validation:
    - G39–G49 cover deterministic, stochastic, human, learned, interactive, and failure cases.
    dependencies:
    - DRREG-001
    - EVID-001
    gold_examples:
    - G39
    - G40
    - G41
    - G42
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
  - id: EVDRV-002
    title: Implement modality- and domain-agnostic metric plugin interfaces
    goal: Let application code define meaningful metrics while retaining typed provenance, aggregation, and validation.
    implementation:
    - Provide SDKs for scalar/vector/distribution/confusion-matrix/ranking/trajectory/constraint-violation/resource/latency/physical-safety
      metric outputs.
    - Require schema, units, direction, valid range, missingness, aggregation rule, weighting, and version for each metric
      definition.
    - Allow opaque domain artifacts such as proofs, videos, code test reports, simulator traces, or scientific outputs linked
      from metric samples.
    - Separate deterministic programmatic checkers, statistical estimators, and learned/human judgments in metadata.
    - Validate metric values and aggregation compatibility before accepting results.
    anti_drift:
    - Do not bake NLP benchmark assumptions into core.
    - Do not average metrics with incompatible units or undefined missingness.
    - Do not interpret self-reported model confidence as an eval metric without an evaluator.
    integration:
    - Eval Controller owns suite composition and statistical interpretation; Reward Derivation may consume accepted metrics
      explicitly.
    validation:
    - G39, G42, G44, G47, and G57 validate code, language, probabilistic, safety, and world-model metrics.
    dependencies:
    - EVDRV-001
    - FND-001
    gold_examples:
    - G39
    - G42
    - G44
    - G47
    - G57
  - id: EVDRV-003
    title: Implement protected-case execution and blind result protocol
    goal: Evaluate candidates on hidden cases without allowing training, candidate code, or broad operators to read the payloads.
    implementation:
    - Run protected evaluator/candidate interactions in isolated workloads with separate principals, data handles, caches,
      logs, and output channels.
    - Deliver only the minimum case input to the candidate/model path and prevent raw case/label/rubric from appearing in
      training-accessible artifacts or general traces.
    - Return blinded aggregate/per-slice evidence according to disclosure policy and sealed detailed reports for authorized
      reviewers.
    - Record access attempts, case fingerprints, candidate outputs, and evaluator provenance without leaking protected content.
    - Rotate/retire suites and invalidate affected claims on suspected exposure.
    anti_drift:
    - Do not mount protected eval data into trainer workers.
    - Do not reveal labels/rubrics through error messages, cache keys, filenames, or timing where policy forbids.
    - Do not let a candidate invoke the evaluator/judge directly.
    integration:
    - Data-Use/Secret/Node/Gateway enforce isolation; Eval Controller owns split; Incident handles leakage.
    validation:
    - G40, G43, G44, G84, and G86 attempt direct/indirect leakage and reward gaming; all fail while aggregate evidence remains
      useful.
    dependencies:
    - EVDRV-001
    - DUC-006
    - NODE-009
    - DGW-007
    gold_examples:
    - G40
    - G43
    - G44
    - G84
    - G86
  - id: EVDRV-004
    title: Implement distributed case/episode sharding and deterministic aggregation
    goal: Scale evals across arbitrary capable devices without changing suite meaning or biasing results by completion order.
    implementation:
    - Accept exact case manifest and deterministic shard assignment independent of worker rank; support static shards, dynamic
      work queue, and long episode roles.
    - Bind each case result to one current attempt and deduplicate retries; preserve invalid/missing/aborted cases explicitly.
    - Aggregate by case ID and declared metric rule using stable numerical methods and weights; never by arrival order.
    - Support incremental checkpoints for large evals and resume only unfinished/invalidated cases.
    - Run capability-appropriate cases on heterogeneous devices only when environment/hardware is part of or controlled by
      the eval plan.
    anti_drift:
    - Do not double-count retried cases.
    - Do not compare candidate and baseline on different random cases without paired-plan declaration.
    - Do not hide slow/failed cases by timing out and aggregating survivors silently.
    integration:
    - Workload/Fleet schedule shards; Eval Controller validates completeness; Evidence assembles report.
    validation:
    - G42, G61, and G68 compare one-device and fleet aggregation exactly/boundedly and inject retries/stragglers.
    dependencies:
    - EVDRV-001
    - WORK-003
    - FLEET-008
    gold_examples:
    - G42
    - G61
    - G68
  - id: EVDRV-005
    title: Implement statistical, calibration, and uncertainty evaluator helpers
    goal: Provide reliable measurements for stochastic models and long-horizon agents without turning statistics into hidden
      gate policy.
    implementation:
    - Implement reusable estimators for paired differences, confidence/credible intervals, bootstrap, sequential bounds, calibration
      curves, distribution shift, and multiple-comparison metadata.
    - Require sample/episode identity, seed, pairing/stratification, missingness, stopping rule, and estimator version.
    - Support abstention and insufficient-power results rather than forced pass/fail.
    - Record assumptions and raw sufficient statistics/artifact refs so results can be recomputed.
    - Keep threshold/risk decisions in Gate Engine.
    anti_drift:
    - Do not cherry-pick seeds or stop when a desired threshold first appears.
    - Do not report point estimates without uncertainty where suite requires it.
    - Do not make one statistical method mandatory for all domains.
    integration:
    - Eval Controller chooses analysis plan before execution; Gate Engine consumes resulting evidence.
    validation:
    - G42 and G46 use pre-registered paired plans and reproduce intervals; optional-stopping attack fails.
    dependencies:
    - EVDRV-002
    - EVID-003
    gold_examples:
    - G42
    - G46
  - id: EVDRV-006
    title: Implement interactive, world-model, RL, and physical evaluation profiles
    goal: Evaluate agents and learned dynamics in environments where outcomes are trajectories rather than static outputs.
    implementation:
    - Define episode reset/step/observe/terminate contracts using perceptor/actuator or simulator drivers and explicit world/environment
      version.
    - Capture trajectory artifact, actions, constraints/verifier decisions, rewards/feedback refs, safety aborts, and environment
      stochasticity.
    - Support learned-world rollout calibration against observed transitions and branch-specific uncertainty.
    - For physical trials, require simulation pre-gates, local safety authority, bounded test envelope, human/operator policy,
      and independent telemetry.
    - Support multi-agent episode roles and hidden adversary/evaluator agents with isolated authority.
    anti_drift:
    - Do not let eval mode bypass action verification.
    - Do not call simulator improvement proof for real physical behavior without transfer evidence.
    - Do not allow evaluator agents to grant capabilities through messages.
    integration:
    - Replay/World/Route/Agent/Actuator components realize episodes; Eval Controller owns suite.
    validation:
    - G47, G57–G59, G73, and G77 cover code/agent, world model, RL, simulation-to-physical, and multi-agent cases.
    dependencies:
    - EVDRV-001
    - RPLY-005
    - WORLD-007
    - ACT-006
    gold_examples:
    - G47
    - G57
    - G58
    - G59
    - G73
    - G77
  - id: EVDRV-007
    title: Implement learned-judge and human-review protocols with independence evidence
    goal: Use subjective feedback without allowing the candidate and evaluator to collapse into an unaudited self-score.
    implementation:
    - Define learned judge refs, prompt/rubric/version, blinded candidate labels, randomization, calibration set, adjudication,
      and judge output schema.
    - Define human review requests with minimized payload, reviewer qualifications/role, conflict-of-interest, randomized/blinded
      presentation, response schema, confidence, and appeal/adjudication.
    - Support multiple judges/reviewers and disagreement artifacts; keep identities protected where required but auditable.
    - Record shared base-model/context/training-data risk between candidate and judge as an independence attribute.
    - Require programmatic or human holdout cross-checks for gates susceptible to reward hacking.
    anti_drift:
    - Do not treat an LLM judge as ground truth.
    - Do not let candidate-generated explanations reveal treatment or manipulate reviewers unchecked.
    - Do not expose reviewer credentials or protected cases to candidate code.
    integration:
    - Feedback Service ingests human/judge findings; Eval Controller composes; Gate policy enforces independence.
    validation:
    - G41, G44, G48, and G86 demonstrate disagreement, calibration, shared-model reward hacking, and appeal.
    dependencies:
    - EVDRV-001
    - FDBK-002
    - GATE-003
    gold_examples:
    - G41
    - G44
    - G48
    - G86
  - id: EVDRV-008
    title: Implement evaluator conformance and adversarial validation
    goal: Make metric correctness, isolation, determinism, and aggregation testable before evaluator evidence can gate changes.
    implementation:
    - Generate tests for schema/range/units, deterministic fixtures, protected access, case dedup, failure/missingness, aggregation,
      cancellation, seed handling, redaction, and candidate/evaluator isolation.
    - Inject mislabeled cases, leaking error messages, completion-order bias, duplicate retries, judge prompt injection, metric
      overflow/NaN, and forged pass fields.
    - Validate against hand-computed small suites and independent implementation where feasible.
    - Publish conformance evidence per metric/eval profile and list known validity limits separately from interface conformance.
    - Quarantine evaluator versions whose results change without versioned inputs/implementation.
    anti_drift:
    - Do not certify scientific validity solely from software conformance.
    - Do not ignore NaN/missing/failed cases.
    - Do not let evaluator code write directly to gate decisions.
    integration:
    - Driver Registry and Eval Controller require maturity; Gate Engine validates trusted evaluator policy.
    validation:
    - G07 and G39–G49 reject intentionally faulty evaluators and preserve failure evidence.
    dependencies:
    - EVDRV-001
    - FND-005
    gold_examples:
    - G07
    - G39
    - G40
    - G41
    - G42
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
  completion_gate:
  - Evaluators produce typed measurements and findings, never promotion authority or hidden reward.
  - Protected cases, retries, aggregation, uncertainty, and independence are explicit.
  - Static, interactive, physical, human, and learned evaluation share lifecycle but retain domain-specific user-space logic.
- id: splendor.data-operator-driver
  name: Data Operator Driver Contract and Reference Drivers
  plane: driver_boundary
  current_status: missing
  current_baseline: The current kernel can persist percepts/traces/state and work orders carry data refs, but it lacks drivers
    for source extraction, validation, transformation, deduplication, labeling, contamination analysis, splitting, synthesis,
    indexing, and distributed data processing with record-level lineage and purpose controls.
  owner_package: contract in crates/splendor-types and splendor-gateway; implementations in `adapters/data/*`
  kernel_boundary: Execute one declared data operation over governed input snapshots/streams and publish immutable output
    shards/reports with record- or shard-level lineage. It does not decide collection purpose, quality acceptance, train/eval
    use, reward, or model promotion.
  public_contracts:
  - DataOperatorManifest
  - DataOperation
  - RecordEnvelope
  - RecordBatch
  - TransformSpec
  - QualityFinding
  - ContaminationFinding
  - PartitionAssignment
  - DataOperatorResult
  tasks:
  - id: DODRV-001
    title: Define the data operation and record/batch contract
    goal: Support arbitrary modalities and schemas while standardizing lifecycle, identity, lineage, and quality outputs.
    implementation:
    - Define operations extract, normalize, validate, filter, transform, join, deduplicate, label, redact, sample, split,
      shard, synthesize, index, summarize, compare, and contamination-scan.
    - Represent records with stable source/record identity or explicit anonymous fingerprint, schema, payload ref/inline bound,
      provenance, classification, event time, and obligations.
    - Represent batches/shards as manifests with ordering semantics, record count/bytes, schema, partition key/range, digest,
      and completeness.
    - Require transform/config/code/environment refs, input/output schemas, determinism/idempotency, and quality/report outputs.
    - Allow domain-specific opaque payloads; no text-token assumption in core.
    anti_drift:
    - Do not require every source to have a natural stable record ID; make limitations explicit.
    - Do not put raw records in control events.
    - Do not treat a transform output as approved training data automatically.
    integration:
    - Artifact/Lineage store records/shards; Data-Use scopes inputs/outputs; Collection/Data controllers select operations.
    validation:
    - G30 and G31 process text, image metadata, telemetry, structured tables, and custom records through the same envelope.
    dependencies:
    - DRREG-001
    - ART-001
    - LIN-001
    gold_examples:
    - G30
    - G31
  - id: DODRV-002
    title: Implement source connectors, cursors, and snapshot extraction
    goal: Create reproducible datasets from files, object stores, databases, APIs, event streams, percept/event logs, feedback,
      and device buffers.
    implementation:
    - Define connector operations inspect-schema, enumerate/snapshot, read-shard, stream-from-cursor, acknowledge, and close.
    - Capture source version/snapshot/transaction/watermark/cursor and extraction query/config as immutable refs.
    - Support incremental extraction with high-water marks and backfill windows while recording inserts/updates/deletes distinctly.
    - Use secret/data handles and locality constraints; emit source access/row/byte receipts.
    - Declare consistency and replay guarantees honestly for sources lacking snapshots or stable cursors.
    anti_drift:
    - Do not call a mutable URL or database query a reproducible dataset without source version evidence.
    - Do not advance cursor before durable output/decision.
    - Do not embed source credentials in dataset manifests.
    integration:
    - Collection Controller owns plans/cursors; Node Agent mounts/localizes; Data-Use grants access.
    validation:
    - G30 and G38 test snapshot, stream, incremental backfill, deletion, and source reset.
    dependencies:
    - DODRV-001
    - PERC-002
    - DUC-003
    gold_examples:
    - G30
    - G38
  - id: DODRV-003
    title: Implement schema, integrity, validity, and distribution quality operators
    goal: Make data quality measurable and sliceable before training or evaluation.
    implementation:
    - Provide operators for schema/type/range/unit, required fields, corrupt media, encoding/decoding, referential consistency,
      temporal ordering, sensor validity, and custom predicates.
    - Produce per-record findings where permitted plus aggregate counts/rates, severity, affected slices, examples as protected
      refs, and operator version.
    - Add distribution summaries, missingness, class/domain/source coverage, drift, long-tail/rare-group representation, and
      duplicate cluster statistics.
    - Support quarantine/filter/repair proposals as separate outputs; never mutate source snapshots in place.
    - Allow application-defined validators through sandboxed operators and conformance fixtures.
    anti_drift:
    - Do not define one global quality score.
    - Do not delete rare or anomalous records merely because they are outliers.
    - Do not let a validator repair data without preserving original and lineage.
    integration:
    - Data controller composes quality policy; Eval/Training gate dataset use; Evidence stores reports.
    validation:
    - G31 and G32 inject corrupt, missing, biased, drifted, and rare-tail data and verify findings/quarantine.
    dependencies:
    - DODRV-001
    - EVID-001
    gold_examples:
    - G31
    - G32
  - id: DODRV-004
    title: Implement deduplication, similarity, and leakage-safe grouping operators
    goal: Prevent exact/near duplicate leakage across splits and repeated self-generated data while preserving auditable decisions.
    implementation:
    - Implement exact digest/normalized digest plus pluggable modality-specific similarity fingerprints/embeddings.
    - Produce duplicate/similarity clusters with method/version/threshold and representative policy; keep uncertain matches
      explicit.
    - Support group-aware split constraints so related records, conversations, users, trajectories, code repositories, or
      generated variants remain together.
    - Track source/model/generation ancestry for synthetic/augmented examples and detect recursive reuse depth.
    - Publish removal/weighting proposals with reversible manifests and retained cluster evidence.
    anti_drift:
    - Do not rely only on exact string hashes for semantic contamination.
    - Do not drop records without a versioned policy/output snapshot.
    - Do not expose protected eval content through similarity reports.
    integration:
    - Dataset/Eval controllers provide protected fingerprints or sealed scans; Lineage supplies ancestry.
    validation:
    - G32, G33, G36, and G43 cover exact/near duplicates, group leakage, synthetic recursion, and protected matching.
    dependencies:
    - DODRV-001
    - LIN-003
    - DUC-006
    gold_examples:
    - G32
    - G33
    - G36
    - G43
  - id: DODRV-005
    title: Implement contamination, memorization-risk, and overlap scanning
    goal: Detect train/eval and generation-source overlap using multiple methods without claiming perfect decontamination.
    implementation:
    - Define contamination scans comparing candidate training/feedback/synthetic snapshots against protected eval fingerprint
      services, public benchmarks, prior generation outputs, deployment logs, and excluded sources.
    - Support exact/n-gram/code AST/media perceptual hash/embedding/model-assisted detectors as versioned user-space plugins.
    - Return matches or blinded counts/slices/confidence according to protected policy, plus false-positive/false-negative
      limitations.
    - Bind scan inputs/versions/thresholds to dataset/eval reports and rerun when either side changes.
    - Provide canary records and membership/memorization probes as separate evaluators where lawful.
    anti_drift:
    - Do not claim “clean” from one string-matching pass.
    - Do not reveal protected test cases to training operators.
    - Do not equate possible semantic similarity with proven leakage without confidence/evidence.
    integration:
    - Eval Controller owns protected suite interface; Data controller gates snapshot readiness; Incident handles exposure.
    validation:
    - G33, G43, G51, and G86 insert paraphrased, translated, generated, and exact overlaps and require correct bounded findings.
    dependencies:
    - DODRV-004
    - EVDRV-003
    gold_examples:
    - G33
    - G43
    - G51
    - G86
  - id: DODRV-006
    title: Implement labeling, annotation, enrichment, and synthetic-data operators
    goal: Support human, model, programmatic, simulator, and agent-generated labels/data with explicit uncertainty and ancestry.
    implementation:
    - Define label/annotation schemas with target record/span/region/trajectory, annotator principal/model/program, rubric,
      confidence, timestamp, conflicts, and adjudication.
    - Support weak/programmatic supervision and model-generated labels as separate source classes, never indistinguishable
      from human or ground truth.
    - Define synthetic generation manifests with generator model/route/prompt/config/seed/source refs and quality/filter/eval
      reports.
    - Track generation number/ancestry and real-versus-synthetic composition by slice to monitor recursive collapse/tail loss.
    - Provide active-learning request/response interfaces, while selection policy remains application/Collection/Improvement
      code.
    anti_drift:
    - Do not call synthetic labels human feedback.
    - Do not let a generating model approve its own data without independent checks.
    - Do not overwrite conflicting annotations with a silent majority.
    integration:
    - Feedback Service supplies annotations; Model/World/Agent workloads generate candidates; Data controller composes/adjudicates.
    validation:
    - G36, G37, G48, and G56 track synthetic generations, disagreements, tail retention, and independent validation.
    dependencies:
    - DODRV-001
    - FDBK-001
    - MODEL-003
    gold_examples:
    - G36
    - G37
    - G48
    - G56
  - id: DODRV-007
    title: Implement deterministic split, shard, sampling, and data-assignment operators
    goal: Create immutable train/validation/test/protected/online splits and worker assignments that survive retries and fleet
      changes.
    implementation:
    - Define split policies using stable record/group identity, stratification, time/source boundaries, exclusion sets, and
      seed/version.
    - Publish split manifests as record/shard membership refs, not mutable directory convention.
    - Implement deterministic sharding and sampling plans with replacement/weights/curriculum/order semantics and global batch/data
      cursor compatibility.
    - Support protected split membership where clients see only opaque handles/fingerprints.
    - Generate worker DataAssignments independent of unstable rank and record duplicate/skip guarantees.
    anti_drift:
    - Do not randomly split related records independently.
    - Do not create eval/test splits after examining candidate-specific results without versioning/adaptive-eval evidence.
    - Do not derive persistent sample ownership from rank alone.
    integration:
    - Training/Eval controllers request assignments; Trainer/Evaluator drivers consume; Dataset state stores manifests.
    validation:
    - G33, G39, G42, G52, and G64 verify leakage-safe split, deterministic assignment, retry, and resize.
    dependencies:
    - DODRV-004
    - STA-001
    - FND-008
    gold_examples:
    - G33
    - G39
    - G42
    - G52
    - G64
  - id: DODRV-008
    title: Implement distributed data-operation execution and aggregation
    goal: Scale collection preparation and quality work across arbitrary devices while preserving deterministic outputs and
      data locality.
    implementation:
    - Partition input snapshots into immutable work units by source/shard/range and execute operators as Workload tasks.
    - Schedule locality- and capability-aware operations; allow CPUs/edge devices to perform suitable decode/filter/label/quality
      work without joining training collectives.
    - Deduplicate task retries by work-unit identity and merge outputs through deterministic manifests/reducers.
    - Checkpoint stream cursors and long indexing/dedup jobs; preserve partial results explicitly.
    - Enforce per-task data-use leases and prevent reducer/aggregator from reading unauthorized raw payloads when summaries
      suffice.
    anti_drift:
    - Do not assume output ordering equals task completion.
    - Do not move all data to one coordinator by default.
    - Do not count partial shards as a complete dataset.
    integration:
    - Workload/Fleet schedule; Node mounts; Collection/Data controller validates completeness; Artifact publishes.
    validation:
    - G30–G38 and G61/G68 run quality, dedup, contamination, labeling, and incremental work on heterogeneous fleet with failure
      injection.
    dependencies:
    - DODRV-001
    - WORK-003
    - FLEET-008
    gold_examples:
    - G30
    - G31
    - G32
    - G33
    - G34
    - G35
    - G36
    - G37
    - G38
    - G61
    - G68
  - id: DODRV-009
    title: Build data-operator conformance and audit validation
    goal: Make record conservation, lineage, determinism, privacy, and protected-data behavior testable.
    implementation:
    - Generate tests for schema, input/output counts, transform determinism class, lineage completeness, source cursor, duplicate
      retry, partial shard, cancellation, classification, deletion, and protected eval isolation.
    - Inject corrupt records, poison labels, malicious payloads, path traversal, archive bombs, PII, conflicting IDs, source
      reset, and operator crash.
    - Use small hand-computed fixtures and invariants such as every output record maps to declared inputs/generation or explicit
      drop finding.
    - Publish conformance reports per operation/schema and separately document detector scientific validity/limitations.
    - Quarantine operators that emit undeclared records, omit mounted sources, or leak protected payloads.
    anti_drift:
    - Do not certify contamination detector completeness from interface tests.
    - Do not ignore dropped records or count drift.
    - Do not let data operators grant training/eval use themselves.
    integration:
    - Driver Registry/Data controller require reports; Incident handles poisoning/leakage.
    validation:
    - G07 and G30–G38 reject intentionally faulty operators and preserve exact record accounting.
    dependencies:
    - DODRV-001
    - FND-005
    - LIN-005
    gold_examples:
    - G07
    - G30
    - G31
    - G32
    - G33
    - G34
    - G35
    - G36
    - G37
    - G38
  completion_gate:
  - Data operators transform governed inputs into immutable outputs/reports with complete declared lineage.
  - Quality, contamination, labeling, synthetic ancestry, split, and use approval remain distinguishable.
  - Data work scales through workload tasks and locality, not through hidden one-off scripts.
- id: splendor.sandbox-executor-driver
  name: Sandbox and Executor Driver Contract
  plane: driver_boundary
  current_status: partial foundation
  current_baseline: The README describes managed Python and planned shell adapters; a Docker image exists for local runtime
    smoke tests, but there is no general isolated executor contract for restricted argv, explicit shell, locked Python, OCI,
    Kubernetes Jobs, interactive coding, builds, devices, mounts, network, resource accounting, or supply-chain evidence.
  owner_package: contract in crates/splendor-types and splendor-gateway; implementations in `adapters/executors/*` and Node
    Agent host backends
  kernel_boundary: Create and supervise an isolated execution environment for user/provider code from immutable environment/code
    inputs and scoped resources. It owns environment realization and process/container/job lifecycle; it does not decide what
    code is allowed, grant capabilities, interpret algorithm success, or bypass driver/workload controls.
  public_contracts:
  - ExecutorManifest
  - EnvironmentSpec
  - ProcessSpec
  - SandboxProfile
  - MountSpec
  - NetworkPolicy
  - DeviceAllocation
  - ExecutionHandle
  - ProcessResult
  - EnvironmentReceipt
  tasks:
  - id: SBX-001
    title: Define executor operations, environment specs, and isolation profiles
    goal: Provide one explicit contract for process, Python, container, cluster job, and interactive environments without
      pretending they offer equal isolation.
    implementation:
    - Define operations build-environment, start, exec-registered, exec-shell, attach/stream, signal, checkpoint-if-supported,
      stop, inspect, and collect-output.
    - Define environment refs for host runtime, locked Python, OCI image, Kubernetes template, VM/microVM plugin, or custom
      executor; bind exact code/config.
    - Define isolation profiles by filesystem, process/user namespace, network, devices, syscalls/capabilities, secrets, mounts,
      IPC, privilege, and persistence.
    - Declare maturity and guarantee differences for host process, container, Kubernetes pod, and stronger sandbox providers.
    - Require requested profile and host-realized effective profile in evidence.
    anti_drift:
    - Do not call all containers sandboxes.
    - Do not allow an executor profile to grant authority missing from workload/driver invocation.
    - Do not make one Linux-specific primitive mandatory in the abstract contract.
    integration:
    - Node Agent maps profile to host mechanisms; Driver Gateway passes scoped handles; Workload owns lifecycle.
    validation:
    - G10–G14 validate profiles and evidence on reference Linux/container/Kubernetes backends.
    - Unsupported isolation requirements reject rather than downgrade silently.
    dependencies:
    - DRREG-001
    - NODE-005
    - FND-011
    gold_examples:
    - G10
    - G11
    - G12
    - G13
    - G14
  - id: SBX-002
    title: Implement restricted argv process execution
    goal: Provide a safe default for known tools and scripts without a shell parser or ambient host environment.
    implementation:
    - Execute an immutable binary/script ref with structured argv, fixed/validated working directory, allowlisted environment
      keys, scoped mounts, resource limits, and no shell expansion.
    - Resolve executables from signed environment/code bundles rather than host PATH by default.
    - Support registered command templates with typed parameters and explicit allowed exit codes/output artifacts.
    - Capture stdout/stderr with bounds/redaction and exact process/child cleanup.
    - Reject NUL/path traversal/working-directory escape and undeclared executable changes.
    anti_drift:
    - Do not concatenate argv into a shell command.
    - Do not inherit the node agent’s environment or credentials.
    - Do not consider exit code zero sufficient for workload success.
    integration:
    - Actuator driver may expose registered commands; Workload/Node supervise; Artifact stores outputs.
    validation:
    - G10 tests injection, PATH replacement, env leakage, timeout, child process, and output bounds.
    dependencies:
    - SBX-001
    - NODE-009
    gold_examples:
    - G10
  - id: SBX-003
    title: Implement explicit high-risk shell execution
    goal: Support necessary shell/coding workflows while making the security boundary and authority materially stronger than
      restricted argv.
    implementation:
    - Expose `sh -c`/chosen shell only through a distinct operation, side-effect class, capability, approval/risk policy,
      and sandbox profile.
    - Require immutable script artifact or bounded command text, explicit shell/version, working tree, mounts, network destinations,
      secret refs, resource/time/process limits, and output declarations.
    - Record script digest and effective policy; redact secret values while preserving command provenance.
    - Disable host privilege, broad sockets, Docker daemon, device access, and uncontrolled package install by default.
    - Provide disposable workspace and cleanup/forensic retention policy.
    anti_drift:
    - Do not hide shell behind a generic tool call.
    - Do not pass user strings through nested shell interpolation.
    - Do not mount the host repository or home directory read-write by default.
    integration:
    - Authority/Gate enforce risk; Node realizes isolation; Coding agent uses through actuator/workload only.
    validation:
    - G11 and G80–G82 attempt injection, escape, secret theft, network exfiltration, and daemon socket access.
    dependencies:
    - SBX-001
    - AUTH-007
    - DGW-007
    gold_examples:
    - G11
    - G80
    - G81
    - G82
  - id: SBX-004
    title: Implement reproducible locked Python environments
    goal: Run model, trainer, evaluator, data, planner, and coding code with exact dependencies and no ambient package drift.
    implementation:
    - Build environment artifacts from lockfiles/wheels/conda-like specs through a separate build workload with hashes, indexes,
      platform, Python version, and build provenance.
    - Run with read-only environment, isolated user/site packages, explicit entrypoint/module, structured args/config, scoped
      mounts, and network policy.
    - Support PyO3/in-process callbacks only for tightly trusted local compatibility; production arbitrary Python runs out-of-process.
    - Capture Python/framework/native-extension versions and verify environment digest before execution.
    - Cache environments by digest and prevent runtime pip/install mutation unless a new build workload is authorized.
    anti_drift:
    - Do not `pip install` mutable latest inside a training run.
    - Do not share writable virtualenvs across tenants/attempts.
    - Do not make Python the required implementation language for user space.
    integration:
    - Trainer/Model/Evaluator/Data drivers use the executor; Artifact/Lineage own environment build.
    validation:
    - G12, G52–G54 reproduce environments, reject dependency drift, and isolate concurrent attempts.
    dependencies:
    - SBX-001
    - ART-004
    - LIN-002
    gold_examples:
    - G12
    - G52
    - G53
    - G54
  - id: SBX-005
    title: Implement OCI image execution and build workflows
    goal: Run complete arbitrary software stacks with immutable images while retaining Splendor authority and evidence.
    implementation:
    - Execute only digest-pinned images with declared entrypoint/argv, user, filesystem, mounts, network, devices, seccomp/capabilities,
      resource limits, and output paths.
    - Create separate image-build workloads from source/recipe/base-image refs; publish image/SBOM/provenance/signature artifacts.
    - Support container runtime adapters behind Node Agent and record runtime/effective isolation.
    - Prevent image entrypoint or environment from overriding the workload control channel/fencing/mount contracts.
    - Implement image scan/admission hooks and revocation impact without treating scan pass as algorithm safety.
    anti_drift:
    - Do not run floating image tags.
    - Do not expose host Docker/containerd control sockets.
    - Do not allow privileged/root/device access unless an exact high-risk profile and capability requires it.
    integration:
    - Artifact Registry verifies image/build; Node Agent starts container; Driver Registry binds executor backend.
    validation:
    - G13 and G83 test signed build, runtime isolation, tampered image, privileged escape, and revocation.
    dependencies:
    - SBX-001
    - ART-004
    - NODE-009
    gold_examples:
    - G13
    - G83
  - id: SBX-006
    title: Implement Kubernetes Job and workload execution adapter
    goal: Use existing Kubernetes clusters without making Kubernetes the Splendor kernel or losing workload identity/authority.
    implementation:
    - Create digest-pinned Job/PodGroup-compatible manifests from Workload tasks with namespace/service account, resources/devices,
      node constraints, volumes, network/pod security, deadlines, labels, and owner identity.
    - Use scoped cluster credentials and server-side apply/create with immutable workload/attempt labels; watch pod/job lifecycle
      and map failures precisely.
    - Support indexed Jobs for independent shards and an external gang/PodGroup integration where available; keep Splendor
      reservation semantics explicit.
    - Inject control channel, fencing token, artifact/data/secret mounts through secure mechanisms and collect outputs/cleanup.
    - Support observed mode for externally managed CRDs/operators with reduced guarantees.
    anti_drift:
    - Do not grant cluster-admin to workloads.
    - Do not assume a Kubernetes Job provides distributed training semantics or gang scheduling automatically.
    - Do not treat pod Running as worker ready.
    integration:
    - Capacity provider can provision clusters; Node/Workload controller owns semantics; Kubernetes is an executor/provider.
    validation:
    - G14, G61, G63, and G66 cover single Job, indexed shards, gang failure, device plugin resource, cancellation, and observed
      mode.
    dependencies:
    - SBX-001
    - WORK-008
    - FLEET-003
    gold_examples:
    - G14
    - G61
    - G63
    - G66
  - id: SBX-007
    title: Implement filesystem, network, process, syscall, IPC, and device isolation
    goal: Enforce effective least privilege around arbitrary code across host backends.
    implementation:
    - Default filesystem to read-only root/environment/input mounts plus bounded writable scratch/output; deny host paths
      and path traversal.
    - Default network deny; permit exact DNS/IP/domain/service/port/protocol or local driver endpoints with egress accounting
      and optional proxy mediation.
    - Isolate users/process IDs/namespaces/IPC; bound child count, file descriptors, shared memory, and signals; apply syscall/capability
      profiles where supported.
    - Allocate only leased device IDs/resources and prevent direct access to physical actuators or unrelated accelerators.
    - Record effective controls and unsupported host limitations; reject required guarantees that cannot be realized.
    anti_drift:
    - Do not treat application allowlists as kernel isolation.
    - Do not allow loopback/control sockets broadly.
    - Do not pass through all `/dev` for GPU convenience.
    integration:
    - Node Agent performs host enforcement; Gateway supplies allowed endpoints; Authority/Data-Use supply scope.
    validation:
    - G10–G16 and G80–G83 run escape/exfiltration/resource attacks and assert host/control/device isolation.
    dependencies:
    - SBX-001
    - NODE-009
    gold_examples:
    - G10
    - G11
    - G12
    - G13
    - G14
    - G15
    - G16
    - G80
    - G81
    - G82
    - G83
  - id: SBX-008
    title: Implement governed mounts, secrets, data handles, and output publication
    goal: Make environment I/O exact, attributable, and revocable rather than relying on shared directories and environment
      variables.
    implementation:
    - Translate Artifact/Data/Secret handles into read-only mounts, pipes, local proxy endpoints, or short-lived files according
      to profile; never expose backing credentials.
    - Create writable scratch and declared output locations with quotas, classification, and upload sessions.
    - Track mount/read/write/open lifecycle where feasible and emit a mount/output receipt bound to attempt/fencing.
    - Revoke/unmount/scrub on cancellation/expiry and verify no secret values appear in outputs/logs before publication policy.
    - Support large streaming inputs/outputs without staging all bytes when locality/backend allows.
    anti_drift:
    - Do not use a shared `/data` convention as identity or authority.
    - Do not put secret values in command lines or durable environment manifests.
    - Do not publish every workspace file automatically.
    integration:
    - Node Agent artifact cache/data grants/secret broker realize handles; Artifact Registry commits declared outputs.
    validation:
    - G08, G13, G17, G34, and G82 validate mount scope, cleanup, output selection, and leak detection.
    dependencies:
    - SBX-007
    - NODE-004
    - SECR-002
    - ART-002
    gold_examples:
    - G08
    - G13
    - G17
    - G34
    - G82
  - id: SBX-009
    title: Implement resource accounting, limits, deadlines, and cleanup
    goal: Ensure arbitrary code cannot evade fleet quotas or leave resource leaks after failure.
    implementation:
    - Enforce CPU, memory, accelerator/device, storage, I/O, network, process, wall/CPU time, and output/log limits through
      host backend.
    - Measure requested/reserved/allocated/peak/consumed resources and provider cost where available; attribute to tenant/workload/attempt.
    - Support graceful signal/cancel then hard termination, descendant cleanup, mount revocation, upload resolution, and residual
      resource scan.
    - Detect OOM, disk-full, quota, thermal/device reset, and external eviction distinctly.
    - Quarantine resources or node on uncertain device/process cleanup.
    anti_drift:
    - Do not rely only on user-reported usage.
    - Do not return success before child processes and outputs are reconciled.
    - Do not reuse an accelerator after a fatal/reset error without health validation.
    integration:
    - Node Agent allocator owns enforcement; Workload receives outcomes; Fleet accounting updates quota.
    validation:
    - G09–G14, G63, and G68 exceed every limit and verify cleanup/accounting and protected SLOs.
    dependencies:
    - SBX-001
    - NODE-003
    - AUTH-004
    gold_examples:
    - G09
    - G10
    - G11
    - G12
    - G13
    - G14
    - G63
    - G68
  - id: SBX-010
    title: Implement interactive coding and persistent workspace sessions
    goal: Support agents/humans performing iterative code work while retaining snapshots, permissions, and rollback.
    implementation:
    - Define a workspace as an immutable base code artifact plus versioned writable overlay/snapshots, owner, lifetime, mounts,
      network, tools, and resource quota.
    - Support controlled exec/test/build/file-diff/apply-patch operations through executor/actuator contracts; every mutation
      yields a workspace state commit or artifact.
    - Provide session attach/stream without granting host shell; authenticate each participant and record bounded command/diff/test
      evidence.
    - Checkpoint/suspend/resume/migrate a workspace where backend supports it; otherwise rebuild from snapshot/environment.
    - Make generated code changes candidates requiring build/test/eval/change gates before deployment or kernel modification.
    anti_drift:
    - Do not let a coding agent edit the running kernel checkout or deployment directly.
    - Do not persist hidden untracked files as the only state.
    - Do not treat passing self-authored tests as sufficient validation.
    integration:
    - Change/Improvement controllers consume code candidates; Git/provider operations are actuator drivers; Artifact/State
      store snapshots.
    validation:
    - G47 and G76 demonstrate coding feedback, isolated patch/test, rollback, and independent eval without live code mutation.
    dependencies:
    - SBX-002
    - SBX-004
    - STA-001
    - CHG-008
    gold_examples:
    - G47
    - G76
  - id: SBX-011
    title: Implement environment build, cache, and reproducibility receipts
    goal: Make environments reusable and fast without allowing mutable cache or supply-chain ambiguity.
    implementation:
    - Build environment/image artifacts in isolated, network-scoped workloads from exact source/lock/base/toolchain refs.
    - Capture resolved dependencies, native libraries, compiler/runtime, accelerator stack, SBOM, build logs, tests, provenance,
      and signatures.
    - Cache by complete build key/digest and verify bytes/signatures before use; separate trusted and untrusted cache namespaces.
    - Support platform-specific variants under one logical environment collection with exact per-platform refs.
    - Rebuild periodically or on vulnerability/revocation and compare outputs; do not mutate prior environment artifact.
    anti_drift:
    - Do not make a local virtualenv or Docker tag a durable environment identity.
    - Do not execute build scripts with unrestricted secrets/network.
    - Do not call non-reproducible builds reproducible; record class/variance.
    integration:
    - Artifact/Lineage own outputs; Driver Registry/Deployment consume signatures; Incident handles compromised dependencies.
    validation:
    - G12, G13, G52, and G83 test cold/reused build, tampering, dependency revocation, and reproducibility class.
    dependencies:
    - SBX-004
    - SBX-005
    - ART-004
    - LIN-002
    gold_examples:
    - G12
    - G13
    - G52
    - G83
  - id: SBX-012
    title: Implement device image and edge workload deployment executor
    goal: Allow a robot/drone/edge computer to receive and run approved images/services while keeping physical authority local
      and bounded.
    implementation:
    - Define device-compatible deployment bundle with architecture/runtime, signed image/environment, services, resources,
      drivers, local policy, health, rollback, and offline behavior.
    - Stage bytes to node cache, verify signatures/integrity/compatibility, preflight reservations and safety state, then
      activate through Deployment Controller.
    - Run cloud-helper/model/planner containers without direct actuator device mounts; expose high-level actuator endpoint
      only through local gateway.
    - Support A/B slots or equivalent rollback where device platform allows and safe-mode fallback otherwise.
    - Coordinate update with mission/operation state, battery/network/storage, and local operator policy.
    anti_drift:
    - Do not flash firmware or bypass certified safety systems through generic executor.
    - Do not update during unsafe mission phase merely because control plane requests it.
    - Do not give cloud workloads direct motor buses.
    integration:
    - Node Agent and Deployment Controller own activation; physical actuator driver owns effects; Incident handles failed
      update.
    validation:
    - G73–G75 deploy a simulated robot/drone compute image, preserve local safety, operate offline, and roll back failed health.
    dependencies:
    - SBX-005
    - ACT-006
    - DEP-006
    gold_examples:
    - G73
    - G74
    - G75
  - id: SBX-013
    title: Build executor conformance and cross-backend equivalence tests
    goal: Prove claimed isolation/lifecycle semantics for host, Python, OCI, Kubernetes, and edge backends.
    implementation:
    - Generate tests for launch, readiness, streams, signals, timeout, cancellation, child cleanup, mounts, network, secrets,
      devices, resource limits, outputs, crash recovery, and evidence.
    - Run an adversarial fixture attempting path, namespace, socket, credential, device, fork-bomb, disk, network, and control-channel
      abuse.
    - Compare a portable reference workload across backends and record behavioral/environment differences rather than assuming
      equivalence.
    - Publish effective-isolation reports per platform/runtime version and revoke on changed backend/security profile.
    - Require stronger independent review for high-risk shell/privileged/device profiles.
    anti_drift:
    - Do not infer host security from manifest intent only.
    - Do not mark skipped controls pass on a backend lacking them.
    - Do not claim Kubernetes and local containers have identical networking/storage behavior.
    integration:
    - Driver Registry maturity and Node capability advertise exact supported profiles.
    validation:
    - G07, G10–G14, and G80–G83 reject faulty backends and record honest guarantee differences.
    dependencies:
    - SBX-001
    - SBX-009
    - FND-005
    gold_examples:
    - G07
    - G10
    - G11
    - G12
    - G13
    - G14
    - G80
    - G81
    - G82
    - G83
  completion_gate:
  - Arbitrary code runs only in an explicitly selected, measured isolation profile with immutable environment/code and scoped
    I/O.
  - Shell, Python, OCI, Kubernetes, and device execution are providers under one workload/gateway contract, not authority
    bypasses.
  - Environment success, algorithm success, candidate validity, and deployment remain separate decisions.
- id: splendor.agent-registry
  name: Agent Registry
  plane: agent_cognition
  current_status: partial foundation
  current_baseline: The current runtime has `AgentId`, `AgentContext`, per-agent isolation policy, runtime config, state head,
    local registration/delegation records, and work orders. It lacks a versioned immutable AgentSpec describing complete agent
    composition, value/constraint bindings, world/memory partitions, routes, model/driver dependencies, triggers, sub-agent
    templates, deployment compatibility, and revision history.
  owner_package: crates/splendor-agent (registry module)
  kernel_boundary: Own persistent agent definition identity and immutable revisions. It validates references and compatibility
    for the complete agent composition but does not run instances, execute routes, choose changes, train models, or activate
    revisions.
  public_contracts:
  - AgentSpec
  - AgentRevision
  - AgentComponentBinding
  - AgentAuthorityProfile
  - AgentValueProfile
  - AgentWorldProfile
  - SubagentTemplate
  - AgentCompatibilityReport
  tasks:
  - id: AGREG-001
    title: Define AgentSpec and immutable revision semantics
    goal: Represent a complete agent as a versioned composition of kernel-governed primitives and user-space artifacts rather
      than a prompt-plus-tools blob.
    implementation:
    - Define agent identity, tenant/owner, revision ID, objective/role metadata, route refs, model bindings, perceptor/actuator
      bindings, world/state/memory partitions, constraints/value policy refs, feedback/eval links, triggers/schedules, sub-agent
      templates, resource/SLO profile, and deployment compatibility.
    - Require exact immutable artifact/driver/policy refs in a revision; allow mutable aliases only in a separate desired
      deployment/config pointer.
    - Distinguish stable agent identity from revision, deployed configuration, instance, run, workload, and sub-agent identities.
    - Permit arbitrary user-space planner/model/memory/ontology artifacts through typed bindings without interpreting their
      internals.
    - Define draft, validated, candidate, approved-for-target, deprecated, revoked, and retired revision states without conflating
      approval with deployment.
    anti_drift:
    - Do not make an agent equal to one model or one route.
    - Do not store secret values, live endpoints, or mutable state inside AgentSpec.
    - Do not permit a revision to self-declare deployed or aligned.
    integration:
    - Wrap current AgentContext/config as a generated compatibility AgentSpec revision.
    - Artifact/Driver/Authority/World/Route registries validate refs.
    validation:
    - G23 and G29 instantiate the same immutable revision repeatedly and preserve identity distinctions.
    - Cross-language fixtures reject mutable/latest and missing privileged bindings.
    dependencies:
    - FND-001
    - ART-001
    - DRREG-001
    gold_examples:
    - G23
    - G29
  - id: AGREG-002
    title: Define typed component bindings and compatibility validation
    goal: Ensure a revision can actually connect its models, routes, perceptors, actuators, state, world, and policies before
      runtime.
    implementation:
    - Define binding roles and input/output schema contracts between route ports and model/driver/state/world/message operations.
    - Validate schema/version/media compatibility, model processor/composition, route node requirements, driver operations/profiles,
      state/world partition schemas, and resource/runtime requirements.
    - Resolve exact permitted fallback sets but do not select runtime instances/providers.
    - Produce a compatibility report with hard failures, warnings, required migrations, and target-specific constraints.
    - Support extension bindings through named schemas and kernel validation hooks rather than arbitrary code execution during
      registry validation.
    anti_drift:
    - Do not validate compatibility by matching string names only.
    - Do not run untrusted user code in the registry service.
    - Do not silently insert converters or fallback components.
    integration:
    - Route compiler, Model/Driver registries, State/World schemas, and Deployment target facts contribute pure validation.
    validation:
    - G24, G28, G54, and G55 validate compatible and incompatible custom model/route/adapter compositions.
    dependencies:
    - AGREG-001
    - ROUTE-009
    - MODEL-001
    gold_examples:
    - G24
    - G28
    - G54
    - G55
  - id: AGREG-003
    title: Define authority, value, constraint, and data bindings as independent profiles
    goal: Make what an agent may do, what it should optimize, what must never occur, and what data it may use separately replaceable
      and auditable.
    implementation:
    - Bind an `AgentAuthorityProfile` to allowed capability/work-order templates and delegation ceilings without embedding
      grants.
    - Bind an `AgentValueProfile` to versioned objectives/preferences/constitutional or domain policy artifacts, evaluators,
      reward derivations, uncertainty/escalation policy, and protected non-self-modifiable roots.
    - Bind hard/soft constraint/verifier bundles separately from learned value/reward models.
    - Bind collection/data-use purposes, prohibited sources, retention, feedback eligibility, and protected eval policy separately.
    - Define which bindings may be changed at each self-adjustment risk class and which require external approval.
    anti_drift:
    - Do not equate value alignment with one reward scalar or prompt.
    - Do not let a model artifact grant authority.
    - Do not permit a revision change to delete immutable root constraints or its own approval requirements.
    integration:
    - Authority/Gate/Data-Use/Reward services own semantics; Agent Registry stores exact refs/compatibility.
    validation:
    - G27, G40, G78, G79, and G86 attempt value/reward/authority/profile bypass and fail.
    dependencies:
    - AGREG-001
    - AUTH-003
    - GATE-001
    - DUC-001
    gold_examples:
    - G27
    - G40
    - G78
    - G79
    - G86
  - id: AGREG-004
    title: Implement revision derivation, diff, migration, and compatibility history
    goal: Make agent evolution inspectable and reversible across models, routes, world schemas, drivers, and policies.
    implementation:
    - Create new revisions only through a derivation record referencing parent(s), ChangeSet, changed bindings, rationale/hypothesis,
      and evidence.
    - Generate semantic diffs by component role and classify expected impact on state/world schemas, authority, resources,
      data, behavior, physical scope, and deployment targets.
    - Require state/world/session migration refs where schemas change; validate rollback compatibility separately.
    - Retain every historical revision and dependency manifest for replay/audit even after revocation.
    - Support branches and experimental revisions without moving the production desired pointer.
    anti_drift:
    - Do not mutate a revision in place.
    - Do not infer rollback safety from a textual version number.
    - Do not hide a policy/value change inside model metadata.
    integration:
    - Change Controller creates derived revisions; Lineage records ancestry; Deployment activates exact revision.
    validation:
    - G45, G70, G76, and G79 show model/route/code/value changes with exact diffs, migrations, and rollback.
    dependencies:
    - AGREG-001
    - CHG-001
    - LIN-001
    gold_examples:
    - G45
    - G70
    - G76
    - G79
  - id: AGREG-005
    title: Implement sub-agent templates and topology constraints
    goal: Support specialists, peers, supervisors, swarms, trigger agents, and agents-as-actuators without implicit identity
      or permission inheritance.
    implementation:
    - Define template refs, allowed child revisions/dynamic parameter schemas, relationship role, communication schemas, delegated
      capability ceiling, data/state sharing, resource/fan-out/depth/duration limits, and lifecycle policy.
    - Support child per task, persistent specialist, pooled specialist, peer federation, supervisor, evaluator/adversary,
      trigger agent, and external agent bridge as distinct templates.
    - Define parent/child causal and ownership links but retain independent state, authority, workloads, and evidence.
    - Validate topology cycles/recursion and require explicit allowed self-similar templates with bounded depth/fan-out.
    - Separate a sub-agent response/action proposal from trusted verifier/evaluator evidence.
    anti_drift:
    - Do not inherit parent permissions or secrets by default.
    - Do not make every child a nested thread in the parent process.
    - Do not allow a candidate agent to spawn an unbounded evaluator that approves it.
    integration:
    - Agent Instance realizes templates; Message/Delegation attenuates authority; Actuator profile submits child tasks.
    validation:
    - G18, G19, G70, G77, and G81 validate specialist, trigger, swarm, evaluator, recursion, and forged delegation.
    dependencies:
    - AGREG-001
    - AUTH-005
    - MSG-003
    gold_examples:
    - G18
    - G19
    - G70
    - G77
    - G81
  - id: AGREG-006
    title: Implement desired-state pointers, ownership, visibility, and lifecycle policy
    goal: Manage discoverability and intended deployment without turning mutable registry tags into activation.
    implementation:
    - Create separately versioned desired revision pointers per environment/fleet/device class, owned by Deployment Controller
      and protected by change/gate policy.
    - Implement private/tenant/shared/public visibility and explicit sharing grants for AgentSpecs and selected artifacts.
    - Define owner/maintainer/operator/evaluator roles and transfer process without moving tenant/data authority silently.
    - Implement deprecation/revocation notifications and impact queries for running instances/deployments.
    - Support agent retirement while retaining history/evidence and revoking new instance admission.
    anti_drift:
    - Do not let an agent update its own desired production pointer directly.
    - Do not make public visibility grant data/model artifact payload access automatically.
    - Do not kill running instances on deprecation unless policy says revoke.
    integration:
    - Deployment Controller is sole activator; Authority controls roles; Lineage/Incident identify impact.
    validation:
    - G70, G75, and G79 test candidate pointer isolation, revocation, and retirement.
    dependencies:
    - AGREG-001
    - DEP-001
    - AUTH-001
    gold_examples:
    - G70
    - G75
    - G79
  - id: AGREG-007
    title: Implement framework bridges and portable import/export
    goal: Let higher-level agent frameworks consume Splendor primitives without forcing their internal architecture into the
      kernel.
    implementation:
    - Provide SDK builders and import adapters for callback agents, graph/workflow frameworks, planner-tool stacks, model-centric
      agents, and custom event loops.
    - Map external models/tools/memory nodes to explicit model/driver/state/world/route bindings and emit a compatibility/guarantee
      report.
    - Export an AgentSpec bundle with non-secret refs, schemas, lineage, and required external dependencies; imports are untrusted
      until validated.
    - Allow framework-managed internal pure computation while requiring all kernel crossings through SDK handles.
    - Document unsupported opaque behavior and observed/unmanaged modes honestly.
    anti_drift:
    - Do not reimplement every agent framework.
    - Do not wrap arbitrary framework tool calls and claim they are verified if they bypass the gateway.
    - Do not serialize live Python objects as durable AgentSpec.
    integration:
    - Python/TypeScript SDKs provide bridge interfaces; Workload/Sandbox can host framework code.
    validation:
    - G06, G23, G24, and G54 implement the same small agent in callback, graph, and custom-loop styles with identical boundary
      evidence.
    dependencies:
    - AGREG-001
    - WORK-008
    - FND-010
    gold_examples:
    - G06
    - G23
    - G24
    - G54
  - id: AGREG-008
    title: Build AgentSpec conformance and anti-drift fixtures
    goal: Keep the complete agent model stable, explicit, and free of hidden privileged configuration.
    implementation:
    - Generate valid/invalid fixtures for every binding class, revision state, topology, authority/value/data profile, migration,
      target compatibility, and extension rule.
    - Scan manifests for floating refs, secret values, direct endpoints, undeclared tools/drivers, missing schemas, and hidden
      activation flags.
    - Instantiate revisions in dry-run mode and verify all dependencies resolve without executing user code/effects.
    - Compare generated SDK manifests across Rust/Python/TypeScript.
    - Add a minimal and a maximally composed gold AgentSpec to prevent simplification around one use case.
    anti_drift:
    - Do not make validation pass by ignoring unknown component fields.
    - Do not encode runtime mutable state into fixtures.
    - Do not consider a schema-valid agent safe/aligned without eval/gates.
    integration:
    - CI uses Agent Registry validator before gold examples; Change Controller uses semantic diff.
    validation:
    - G00, G23, G29, and G70 pass; malicious hidden-authority manifest fails.
    dependencies:
    - AGREG-001
    - AGREG-003
    - FND-005
    gold_examples:
    - G00
    - G23
    - G29
    - G70
  completion_gate:
  - An AgentSpec is complete enough to reconstruct the governed composition, but contains no live state, secrets, grants,
    or activation authority.
  - Authority, values, constraints, data policy, models, routes, and world bindings remain separate versioned concerns.
  - Every evolution creates an immutable derived revision with explicit diff and evidence.
- id: splendor.agent-instance-controller
  name: Agent Instance Controller
  plane: agent_cognition
  current_status: partial foundation
  current_baseline: The current LoopEngine and cooperative Scheduler run persistent local ticks; daemon run lifecycle, state,
    percept queues, policy cache, approvals, and delegation exist. Missing are a generic durable AgentInstance state machine,
    24/7 supervision across nodes, route-driven concurrency/events, trigger/schedule management, instance migration, revision
    rollout, sub-agent lifecycle, SLO health, and separation between instance/run/workload/session.
  owner_package: crates/splendor-agent (instance module), composed by splendor-kernel
  kernel_boundary: 'Own desired/observed lifecycle for one deployed AgentSpec revision instance: admission, resource/workload
    creation, event consumption, route execution epochs, state/world heads, timers/triggers, health, pause/checkpoint/migration,
    revision updates, and child-agent supervision. It does not implement route nodes, model inference, training, or external
    effects.'
  public_contracts:
  - AgentInstance
  - AgentInstanceSpec
  - InstanceStatus
  - InstanceEpoch
  - RunSession
  - TriggerBinding
  - InstanceCheckpoint
  - InstanceHealth
  - InstanceRevisionTransition
  tasks:
  - id: AINST-001
    title: Implement the durable AgentInstance state machine and identities
    goal: Make a 24/7 agent a recoverable governed service rather than an unbounded loop in one process.
    implementation:
    - Define instance identity separate from AgentSpec revision, deployment, workload, process, run/session, tick, and node
      instance.
    - Implement states proposed, admitted, provisioning, starting, running, degraded, waiting, paused, migrating, updating,
      stopping, stopped, failed, quarantined, and retired.
    - Persist desired revision/replica/node constraints, state/world heads, active run sessions, trigger cursors, child refs,
      resource/SLO policy, and current epoch.
    - Use optimistic concurrency and controller ownership generation for every transition.
    - Represent one or more execution workloads behind the instance without exposing process identity as agent identity.
    anti_drift:
    - Do not overload current `RunId` as permanent agent instance identity.
    - Do not store transient model KV/process handles as durable identity.
    - Do not mark running before required route/models/drivers/state are ready.
    integration:
    - Wrap current daemon Run/LoopEngine as one compatibility run session within one local instance.
    - Workload Controller realizes execution.
    validation:
    - G23 and G29 exercise all transitions, restart, and identity separation.
    - Invalid concurrent revision/state transitions fail deterministically.
    dependencies:
    - AGREG-001
    - WORK-001
    - STA-001
    gold_examples:
    - G23
    - G29
  - id: AINST-002
    title: Implement instance admission and dependency realization
    goal: Start an agent only when its exact revision, authority, routes, drivers, models, state/world, triggers, and resources
      are valid for the target.
    implementation:
    - Resolve/validate AgentSpec revision, deployment plan, work order/capability, policy/value/data bindings, route compilation,
      driver/model availability, state/world schemas, and resource placement.
    - Create or attach required state/world partitions with ownership rules and pin initial heads.
    - Create managed workloads/services for route runtime/model services/framework host and register perceptor subscriptions/timers
      only after readiness.
    - Issue an `InstanceEpoch` binding exact revision/deployment/dependencies and reject mutable drift.
    - Record admission decision and complete dependency graph as evidence.
    anti_drift:
    - Do not start with unresolved latest aliases.
    - Do not acquire source subscriptions or effect capabilities before admission.
    - Do not let framework host choose undeclared drivers/models at runtime.
    integration:
    - Agent Registry/Deployment supply desired config; Workload/Fleet place; Route/Driver/Model/State/World validate.
    validation:
    - G23, G24, G62, and G73 validate local, fleet, neuro-symbolic, and physical admission.
    - Missing/revoked dependency causes denied/degraded behavior per policy.
    dependencies:
    - AINST-001
    - AGREG-002
    - ROUTE-009
    - DEP-002
    gold_examples:
    - G23
    - G24
    - G62
    - G73
  - id: AINST-003
    title: Implement event-driven 24/7 supervision, timers, and triggers
    goal: Run persistent agents continuously without busy loops, duplicate triggers, or losing causal event identity.
    implementation:
    - Register typed perceptor/message/system/timer/schedule/feedback/health triggers with durable consumer cursors and debounce/coalescing/concurrency
      policy.
    - Create a run session/route execution for each accepted trigger or aggregate window, bound to input event/state/world
      heads and instance epoch.
    - Support waiting/sleep/timer semantics as desired state, not blocked worker threads.
    - Handle event storms with bounded mailboxes, priority, dropping/spill policy, and explicit gap evidence.
    - Restore subscriptions/timers/cursors after controller/worker/node restart without duplicate unbounded execution.
    anti_drift:
    - Do not implement 24/7 by `while True` without durable control state.
    - Do not let triggers carry reusable authority.
    - Do not process safety-critical and bulk learning events in one unbounded FIFO.
    integration:
    - Perceptor/Message/Event/Workload services supply streams; Route Runtime executes; State Service stores cursors.
    validation:
    - G19, G22, G29, G38, and G49 validate timers, trigger agents, backpressure, restart, and continuous eval/collection.
    dependencies:
    - AINST-001
    - WORK-007
    - PERC-003
    - MSG-006
    gold_examples:
    - G19
    - G22
    - G29
    - G38
    - G49
  - id: AINST-004
    title: Implement run-session concurrency and state/world consistency policy
    goal: Permit parallel perception/reasoning/tasks where valid while preventing silent state corruption or duplicated effects.
    implementation:
    - Define instance concurrency modes serial, partitioned, optimistic-merge, read-only parallel, and application-coordinated
      with exact state/world partition ownership.
    - Pin state/world heads at session start; route commits use compare-and-set/merge proposals and retry only pure/re-evaluable
      stages on conflict.
    - Serialize or lock effectful critical sections by declared resource/target when required.
    - Preserve causal links among trigger, session, route steps, actions, outcomes, state commits, and feedback.
    - Define maximum concurrent sessions/subtasks and cancellation priority.
    anti_drift:
    - Do not use last-write-wins for agent/world state by default.
    - Do not replay effectful route steps after state conflict.
    - Do not globally serialize all agents when partitions permit safe concurrency.
    integration:
    - State/World services enforce commits; Route compiler marks pure/effectful steps; Gateway handles idempotency.
    validation:
    - G24, G27, G29, and G70 inject concurrent sessions/conflicts and verify no duplicate effects or lost updates.
    dependencies:
    - AINST-003
    - STA-003
    - WORLD-008
    - DGW-004
    gold_examples:
    - G24
    - G27
    - G29
    - G70
  - id: AINST-005
    title: Implement pause, quiesce, checkpoint, resume, migration, and handoff
    goal: Move or stop a persistent agent safely across processes/devices while preserving explicit state and external-effect
      certainty.
    implementation:
    - 'Define quiesce protocol: stop accepting selected triggers, drain/cancel sessions by risk, checkpoint route/framework/model
      session state where supported, commit state/world heads, and close/transfer source cursors.'
    - Build an `InstanceCheckpoint` containing AgentSpec/epoch, state/world refs, trigger/message cursors, child refs, session
      checkpoints, pending approvals/effects, and environment/dependency refs.
    - Validate target compatibility, data locality, driver/model availability, work-order authority, and state handoff before
      migration.
    - Fence old instance epoch before target becomes active; route late events/results to quarantine/reconciliation.
    - Support cold rebuild when ephemeral model/framework state is non-portable and report behavior/reproducibility implications.
    anti_drift:
    - Do not claim migration complete while both epochs can act.
    - Do not serialize secrets/credentials into checkpoint.
    - Do not silently discard pending uncertain physical/digital effects.
    integration:
    - Build on current state handoff; Workload/Fleet/Node move execution; Message/Perceptor transfer cursors.
    validation:
    - G29, G65, G69, G72, and G75 migrate/crash/reconnect with zero duplicate effect and explicit non-portable state.
    dependencies:
    - AINST-001
    - WORK-005
    - STA-007
    - NODE-003
    gold_examples:
    - G29
    - G65
    - G69
    - G72
    - G75
  - id: AINST-006
    title: Implement sub-agent spawn, supervision, delegation, and reaping
    goal: Treat child agents as independently controlled compute while giving parents structured coordination primitives.
    implementation:
    - Validate child template, delegated capabilities/data/state, objective/inputs, resource/time/depth/fan-out budgets, and
      placement before creating child instance/workload.
    - Create explicit parent/child session and causal links; child has independent identity, state, mailbox, traces, and authority
      lease.
    - Support ephemeral task child, persistent specialist, shared pool reservation, external agent bridge, and child-as-actuator
      response patterns.
    - Propagate cancellation/revocation according to template; collect typed result/failure and clean child resources.
    - Prevent parent or child messages from altering delegation scope after issuance.
    anti_drift:
    - Do not clone parent AgentContext/permissions.
    - Do not let child completion automatically commit parent state or action.
    - Do not leave orphan persistent specialists after owner/revision retirement.
    integration:
    - Agent Registry defines templates; Authority attenuates; Message routes; Workload schedules.
    validation:
    - G18, G19, G70, G77, and G81 cover child types, resource exhaustion, recursion, revocation, and forged scope.
    dependencies:
    - AGREG-005
    - MSG-003
    - WORK-003
    gold_examples:
    - G18
    - G19
    - G70
    - G77
    - G81
  - id: AINST-007
    title: Implement instance health, SLO, degraded modes, and circuit-breaker behavior
    goal: Keep persistent agents safe and observable under model, driver, data, state, connectivity, and physical degradation.
    implementation:
    - Define health dimensions dependency readiness, trigger lag, route failure, action denial/failure, state conflicts, model
      latency/error, source freshness, policy/authority freshness, resource pressure, and physical safety status.
    - Compute health from evidenced facts and configurable thresholds; expose current causes and affected capabilities.
    - Define degraded routes/modes that narrow capability, use local fallback model/source, operate read-only, require HIL,
      or pause; each mode is predeclared in AgentSpec/policy.
    - Integrate circuit breakers/kill switches at instance, route, driver, action, data, model, and fleet scopes.
    - Escalate to Incident Controller for persistent/unsafe/uncertain conditions.
    anti_drift:
    - Do not let the agent invent a degraded mode during failure.
    - Do not equate high action-denial rate with permission to relax constraints.
    - Do not keep physical agent active when critical local safety dependencies are uncertain.
    integration:
    - Current circuit-breaker/escalation/governance foundations feed health; Route Runtime selects prevalidated fallback.
    validation:
    - G27, G29, G48, G73–G75, and G88 inject failures and verify narrowing/pause, never boundary weakening.
    dependencies:
    - AINST-003
    - OBS-005
    - INC-002
    gold_examples:
    - G27
    - G29
    - G48
    - G73
    - G74
    - G75
    - G88
  - id: AINST-008
    title: Implement controlled revision transition per instance
    goal: Update models, routes, policies, drivers, or code without turning registry changes into immediate uncontrolled behavior.
    implementation:
    - Receive an approved DeploymentPlan specifying source/target revisions, exact dependency bundle, rollout mode, state/world/session
      migration, health gates, and rollback.
    - Support shadow dual execution with no effects, canary instance subset, quiesced in-place restart, blue/green instance
      handoff, and configuration-only route epoch updates where safe.
    - Fence target effect authority until deployment stage permits it and ensure shadow outputs cannot commit live state/world
      heads.
    - Preserve source checkpoint/state for rollback; validate reverse migration or use old compatible heads.
    - Report transition progress/health/evidence and stop automatically on gate/incident conditions.
    anti_drift:
    - Do not hot-reload arbitrary code/model/policy into a running process without a declared mechanism.
    - Do not let shadow/candidate instance actuate or write live state.
    - Do not call rollback successful if state schema became irreversibly incompatible.
    integration:
    - Deployment Controller orchestrates; Change/Gate authorize; State/World/Workload realize transition.
    validation:
    - G45, G46, G70, G75, and G79 prove shadow/canary/rollback and value-policy protection.
    dependencies:
    - AINST-005
    - DEP-003
    - DEP-004
    - CHG-007
    gold_examples:
    - G45
    - G46
    - G70
    - G75
    - G79
  - id: AINST-009
    title: Migrate the current LoopEngine and Scheduler into the instance architecture
    goal: Preserve working local behavior while replacing agent-only lifecycle ownership incrementally.
    implementation:
    - Implement a Route/Policy compatibility runner that uses current Perceptor, Policy, ConstraintEngine, ActionGateway,
      OutcomeEvaluator, StateGraph, and TraceStore inside an agent workload.
    - Map one current tick to one route execution/session segment and preserve event ordering and fail-closed state commit
      behavior.
    - Move daemon run status and percept queue ownership behind Agent Instance/Workload services while retaining endpoints.
    - Reuse current cooperative Scheduler as a local execution policy, not the future fleet scheduler.
    - Add migration fixtures comparing current and vNext state/trace/action outcomes.
    anti_drift:
    - Do not delete or rewrite the implemented baseline first.
    - Do not maintain divergent state heads or approval slots in compatibility and new controllers.
    - Do not call current round-robin scheduler fleet scheduling.
    integration:
    - Daemon composition chooses compatibility runner; new Route Runtime can replace policy callback incrementally.
    validation:
    - All existing local/multi-agent/governance/physical examples pass; G23/G24 provide equivalent vNext execution.
    dependencies:
    - AINST-001
    - WORK-009
    - DGW-009
    - FND-006
    gold_examples:
    - G23
    - G24
  - id: AINST-010
    title: Validate long-duration, fleet, and chaos behavior
    goal: Prove persistent agents survive realistic operation rather than only short deterministic demos.
    implementation:
    - Run accelerated multi-day simulations with timers, event bursts, model/driver errors, state conflicts, node restarts,
      network partitions, policy expiry, resource pressure, and child-agent churn.
    - Measure duplicate/missed triggers, state conflicts, action effect count, recovery time, mailbox lag, resource leaks,
      and evidence completeness.
    - Run multiple instances/revisions across heterogeneous nodes with migration and rolling deployment.
    - Include physical simulation with local safety and offline periods.
    - Publish reproducibility/chaos report and known limitations.
    anti_drift:
    - Do not equate a 100-tick unit test with 24/7 reliability.
    - Do not suppress recurring failures to keep the agent “healthy”.
    - Do not validate only with allow-all constraints/no-op actuators.
    integration:
    - Gold runner, Fleet, Incident, Observability, and Replay provide faults/evidence.
    validation:
    - G29, G68, G70, G72–G75, and G88 pass configured durability and no-duplicate-effect bounds.
    dependencies:
    - AINST-001
    - AINST-007
    - FND-005
    gold_examples:
    - G29
    - G68
    - G70
    - G72
    - G73
    - G74
    - G75
    - G88
  completion_gate:
  - A persistent agent instance has durable identity, desired/observed state, trigger cursors, exact revision epoch, and recoverable
    state/world heads.
  - Concurrency, migration, sub-agents, degraded modes, and updates never weaken authority or duplicate effects.
  - The controller supervises agent lifecycle; user-space route/model/planner code remains replaceable.
- id: splendor.route-runtime
  name: Neuro-Symbolic Route Runtime
  plane: agent_cognition
  current_status: partial foundation
  current_baseline: The current loop is a fixed sequence Percepts → Policy → Constraints → Gateway → Adapter → Outcome → State
    Commit → Trace. Neural policy and symbolic constraint hooks exist, but there is no versioned typed route graph for multiple
    models, planners/solvers/rules, world/state/memory, sub-agents, branching, loops, parallelism, feedback/eval/training
    triggers, fallbacks, budgets, or user-defined pure nodes.
  owner_package: crates/splendor-agent (route module); user-space node plugins via SDK/workloads
  kernel_boundary: Own validation/compilation and governed execution of typed neuro-symbolic route graphs. It coordinates
    neural computation, symbolic structure, state/world reads/proposals, messages, and verified driver invocations under budgets.
    It does not implement the user’s model, planner, solver, ontology, reward, or external effect.
  public_contracts:
  - RouteGraph
  - RouteRevision
  - RouteNode
  - RouteEdge
  - PortSchema
  - RouteExecution
  - RouteStep
  - RouteBudget
  - RouteDecision
  - RouteCheckpoint
  tasks:
  - id: ROUTE-001
    title: Define typed RouteGraph, nodes, ports, and edges
    goal: Replace a fixed loop with a small compositional control graph that remains explicit and inspectable.
    implementation:
    - Define immutable route revisions with typed input/output ports, schemas/media refs, node kinds, control/data edges,
      entrypoints, terminal outcomes, and required bindings.
    - Provide kernel node kinds for model invocation, symbolic plugin invocation, constraint/verifier request, driver invocation,
      state/world read/proposal, message/delegation, sub-route, branch, join, timer/wait, emit feedback/eval/training proposal,
      and pure user computation.
    - Support named opaque custom payload schemas but keep identity/authority/budget/effect fields outside opaque payloads.
    - Validate graph connectivity, port/schema compatibility, bounded cycles, terminal coverage, and prohibited authority
      flows.
    - Bind route revision to AgentSpec and exact component compatibility.
    anti_drift:
    - Do not encode chain-of-thought or one planning algorithm as a kernel node.
    - Do not let arbitrary node code commit state/effects directly.
    - Do not make every route a DAG; allow explicit bounded/state-machine loops.
    integration:
    - Agent Registry binds route refs; Workload/Sandbox hosts user nodes; Gateway handles driver calls.
    validation:
    - G24 and G28 construct reactive, planner, model-selector, and custom routes; invalid schemas/cycles/authority edges deny.
    dependencies:
    - FND-001
    - AGREG-002
    - DGW-001
    gold_examples:
    - G24
    - G28
  - id: ROUTE-002
    title: Implement neural/model node semantics as proposal-producing computation
    goal: Integrate learned decisions under uncertainty without granting model outputs privileged meaning.
    implementation:
    - Model nodes invoke exact model operations with pinned input/state/world refs, sampling/budgets, and expected output
      schema.
    - Represent output as computation result/proposal with model/runtime evidence, uncertainty/calibration metadata, and no
      inherent authority.
    - 'Support multiple neural modules: policy, router, encoder, critic/value, reward model, world model, anomaly detector,
      or custom network by binding role metadata rather than special kernel classes.'
    - Allow ensembles/cascades through route composition and explicit fallback/aggregation nodes.
    - Prevent model-generated fields from overriding route, capability, gate, or driver selection.
    anti_drift:
    - Do not equate neural policy output with an action.
    - Do not let a model choose an undeclared tool/driver by emitting its name.
    - Do not treat a reward/value model score as a gate decision.
    integration:
    - Model Driver executes; Proposal object flows to symbolic/constraint/gateway nodes; Evidence records.
    validation:
    - G24, G27, G28, and G80 inject malicious/invalid model outputs and prove typed mediation.
    dependencies:
    - ROUTE-001
    - MODEL-003
    - FND-007
    gold_examples:
    - G24
    - G27
    - G28
    - G80
  - id: ROUTE-003
    title: Implement symbolic planner, solver, rule, and state-machine plugin semantics
    goal: Make symbolic structure a first-class runtime participant without selecting a universal logic language.
    implementation:
    - Define a symbolic plugin contract receiving pinned typed facts/goals/constraints and returning plan/proof/explanation/candidate/unsat/unknown
      artifacts.
    - Support user-space rule engines, planners, SAT/SMT/optimization solvers, behavior trees, workflow/state machines, type
      checkers, theorem/test systems, and domain controllers as versioned workloads/drivers.
    - Record input fact refs, plugin/code/env, timeout/resource budget, result status, proof/certificate refs where available,
      and unverifiable claims explicitly.
    - Allow symbolic outputs to compose/filter/rank/decompose neural proposals but require final effect verification.
    - Provide deterministic pure-plugin cache/replay profiles.
    anti_drift:
    - Do not build one DSL/solver into kernel as the only symbolic path.
    - Do not call solver “unknown” an allow.
    - Do not treat an explanation string as a machine-checked proof.
    integration:
    - Sandbox/Workload executes plugins; State/World supply facts; Gate/Constraint validates results.
    validation:
    - G24–G27 run rules, planner, SMT-like constraint fixture, and state machine; timeout/unknown fail according to policy.
    dependencies:
    - ROUTE-001
    - SBX-004
    - EVID-002
    gold_examples:
    - G24
    - G25
    - G26
    - G27
  - id: ROUTE-004
    title: Implement constraint, obligation, verifier, and approval control points
    goal: Place enforceable symbolic/runtime boundaries throughout a route, not only after a final prompt.
    implementation:
    - Allow route nodes/edges to require hard/soft constraints, obligations, evidence, confidence/freshness, approval, quota,
      or local safety before proceeding.
    - Represent decisions as allow, deny, require-obligation, require-approval, require-intervention, uncertain, or advisory
      finding with stable reasons.
    - Track outstanding obligations such as redact-before-store, confirm-after-action, human-review, update-world-only-on-observation,
      or checkpoint-before-preemption.
    - Ensure every effectful driver node still passes Driver Gateway verifiers even if earlier route checks allowed it.
    - Version and bind exact constraint/verifier bundle to route execution.
    anti_drift:
    - Do not allow route ordering to skip gateway verification.
    - Do not convert a soft constraint to hard or vice versa through opaque extensions.
    - Do not let the same candidate satisfy its own approval/evidence obligation.
    integration:
    - Gate/Authority/Gateway supply enforcement; State stores obligations; HIL provides approvals.
    validation:
    - G27, G40, G73, G78, and G79 validate denial, obligation, approval, local safety, and root-policy protection.
    dependencies:
    - ROUTE-001
    - DGW-002
    - GATE-001
    gold_examples:
    - G27
    - G40
    - G73
    - G78
    - G79
  - id: ROUTE-005
    title: Implement state, memory, world, message, and sub-agent nodes
    goal: Make agent modelation explicit without forcing one memory or multi-agent architecture.
    implementation:
    - Provide read nodes that pin state/world/message views by partition/head/cursor and proposal nodes that submit typed
      changes through owning services.
    - Represent memory strategies as user-space computations over explicit episodic/semantic/procedural/scratch partitions,
      not hidden route-global variables.
    - Provide message send/request/await and child-agent delegate/await/cancel nodes with scoped schemas/capabilities.
    - Support context assembly nodes that select/summarize refs under budget and publish their selection evidence.
    - Ensure child/message/model outputs remain observations/proposals until validated/committed.
    anti_drift:
    - Do not give route nodes direct database/store handles.
    - Do not hide mutable memory inside model prompts or framework objects as the only state.
    - Do not accept messages as permission delegation.
    integration:
    - State/World/Message/Agent Instance services own operations; Sandbox may host selection/summarization code.
    validation:
    - G18, G23–G25, G29, and G70 validate explicit memory/world/sub-agent flows and conflict behavior.
    dependencies:
    - ROUTE-001
    - STA-003
    - WORLD-003
    - MSG-001
    - AINST-006
    gold_examples:
    - G18
    - G23
    - G24
    - G25
    - G29
    - G70
  - id: ROUTE-006
    title: Implement branches, joins, bounded loops, parallelism, and budgets
    goal: Support sophisticated agent control while keeping termination, resource, and side-effect behavior bounded.
    implementation:
    - Implement conditional branch on typed predicates/results, fan-out/fan-in, race/first-valid, all/any/quorum joins, retry
      nodes, and bounded iteration/state-machine loops.
    - Require max iterations/depth/fan-out/wall time/model tokens/cost/actions/sub-agents/data bytes and per-node budgets.
    - Distinguish retry of pure computation from retry of driver effects and state commits; effectful retries use invocation
      idempotency/effect rules.
    - Propagate cancellation and budget exhaustion deterministically to child steps/workloads.
    - Checkpoint route execution at declared safe steps for long-lived sessions.
    anti_drift:
    - Do not allow unbounded self-reflection or recursive sub-routes.
    - Do not retry an effectful node by re-running the whole route blindly.
    - Do not let parallel branches commit conflicting state without merge policy.
    integration:
    - Workload executes heavy/parallel nodes; State stores route checkpoint; Authority quotas budgets.
    validation:
    - G24, G28, G29, G70, and G88 test loops, races, fan-out, budget exhaustion, and cancellation storms.
    dependencies:
    - ROUTE-001
    - AUTH-004
    - WORK-003
    gold_examples:
    - G24
    - G28
    - G29
    - G70
    - G88
  - id: ROUTE-007
    title: Implement uncertainty, fallback, escalation, and degraded routing
    goal: Respond safely to unknowns and failures without silently relaxing constraints or changing meaning.
    implementation:
    - Define route outcomes/conditions for low confidence, invalid schema, model unavailable, solver unknown, source stale,
      state conflict, verifier uncertainty, approval needed, quota pressure, and physical local deny.
    - Allow only prevalidated fallback sub-routes/model sets/drivers/degraded modes with explicit capability/data/effect differences.
    - Escalate to human/governance or suspend/wait with durable state and deadline.
    - Record why fallback occurred and compare its behavior/quality/SLO through continuous eval.
    - Prevent fallback from broadening authority, remote data exposure, or physical effect class.
    anti_drift:
    - Do not equate “primary failed” with permission to use any available model/tool.
    - Do not make uncertainty an allow.
    - Do not retry forever under quota or stale source.
    integration:
    - Agent Instance health selects routes; Authority/Gate verifies; HIL/Incident receive escalations.
    validation:
    - G27–G29, G48, and G73–G75 exercise unavailable/uncertain/offline paths and prove capability only narrows.
    dependencies:
    - ROUTE-001
    - AINST-007
    - AUTH-007
    gold_examples:
    - G27
    - G28
    - G29
    - G48
    - G73
    - G74
    - G75
  - id: ROUTE-008
    title: Implement user-space pure node and sub-route SDK
    goal: Keep application code expressive while ensuring it cannot become an implicit privileged kernel module.
    implementation:
    - Provide Rust/Python/TypeScript interfaces for pure/bounded computation nodes with declared input/output schemas, code/environment
      ref, resources, determinism, and optional stateful checkpoint profile.
    - Run untrusted nodes through Workload/Sandbox; trusted in-process callbacks remain a local development/compatibility
      mode with reduced isolation.
    - Expose only proposal/read handles, not stores/registries/secrets/gateway internals.
    - Support sub-route libraries/packages and parameter schemas without macro-expanding mutable code at runtime.
    - Generate local test harness with recorded inputs and no-live-effect driver profiles.
    anti_drift:
    - Do not make every user function a driver.
    - Do not allow pure nodes to open network/filesystem/device outside declared sandbox.
    - Do not serialize arbitrary closures as route revisions.
    integration:
    - Artifact Registry pins code/env; Workload Controller executes; Agent frameworks use SDK bridge.
    validation:
    - G24 and G54 implement custom reasoning/NN nodes; malicious store/network access is denied.
    dependencies:
    - ROUTE-001
    - SBX-001
    - FND-010
    gold_examples:
    - G24
    - G54
    - G80
  - id: ROUTE-009
    title: Implement route validation, compilation, compatibility, and explain plans
    goal: Catch schema, cycle, authority, resource, and deployment errors before a live agent executes.
    implementation:
    - Resolve exact node implementations/bindings/schemas/profiles and compile a normalized route execution plan/digest.
    - Perform type/schema checks, boundedness analysis, effect-path coverage, verifier dominance, authority/data-flow checks,
      state/world ownership, fallback compatibility, and required terminal outcomes.
    - Identify every possible effectful path and prove it crosses Gateway; reject unknown dynamic operation names outside
      declared schemas.
    - Estimate resource/cost/latency envelopes and mark runtime-dependent bounds honestly.
    - Produce access-controlled graph/explanation with nodes, contracts, effects, constraints, and unresolved risks.
    anti_drift:
    - Do not claim formal proof for properties checked heuristically.
    - Do not execute user/plugin code during compilation.
    - Do not allow a route with a hidden direct network/tool path in a framework host.
    integration:
    - Agent Registry and Workload admission require compiled digest; Gate may require analyses by risk class.
    validation:
    - G24, G27, G28, G73, and G80 include deliberately bypassing/unbounded/incompatible routes that fail compile.
    dependencies:
    - ROUTE-001
    - DRREG-003
    - AGREG-002
    gold_examples:
    - G24
    - G27
    - G28
    - G73
    - G80
  - id: ROUTE-010
    title: Implement route execution evidence, checkpoint, and replay comparison
    goal: Make neural-symbolic decisions inspectable without requiring private chain-of-thought or logging every payload.
    implementation:
    - Emit step started/completed/denied/failed events with node/ref, input/output digests, selected branch, budgets, model/solver/driver
      receipts, state/world heads, obligations, and causal parents.
    - Store large/sensitive reasoning artifacts under classification and allow user-space summaries/proofs where available.
    - Checkpoint execution at safe points with ready nodes, completed outputs, budgets, pending waits/approvals, and no reusable
      authority.
    - Replay pure/recorded/simulated steps and compare route revisions on matched inputs while trapping live effects.
    - Generate first-divergence and decision-path reports for eval/change review.
    anti_drift:
    - Do not require hidden model chain-of-thought.
    - Do not serialize live secret handles or provider sessions into route checkpoint.
    - Do not replay effectful steps automatically.
    integration:
    - Event/Evidence/Replay services store and compare; Eval Controller judges behavior.
    validation:
    - G03, G24, G39, G45, and G46 verify evidence, checkpoint/resume, no-effect replay, and route diff.
    dependencies:
    - ROUTE-001
    - EVID-001
    - RPLY-004
    gold_examples:
    - G03
    - G24
    - G39
    - G45
    - G46
  - id: ROUTE-011
    title: Implement controlled route hot-swap and version rollout
    goal: Change routing/planning logic for running agents only through explicit change/deployment semantics.
    implementation:
    - Classify route changes by schema/effect/authority/state/budget impact and require compatible state migration or new
      instance epoch.
    - Support shadow comparison, canary instances, and safe-point epoch transition; bind each session to one route revision.
    - Prevent in-flight execution from mixing node implementations/revisions unless a declared migration protocol exists.
    - Retain source route and checkpoint for rollback; evaluate behavior/regressions before wider activation.
    - Allow R0 parameter/budget changes only within preapproved bounds and still record a new config/route epoch.
    anti_drift:
    - Do not mutate a route graph object in place.
    - Do not let an agent self-select a candidate route into production.
    - Do not call a prompt/parameter change harmless without impact classification.
    integration:
    - Change/Gate/Deployment authorize; Agent Instance applies transition; Eval supplies matched comparisons.
    validation:
    - G45, G46, G70, G76, and G79 demonstrate controlled route evolution and rollback.
    dependencies:
    - ROUTE-009
    - CHG-001
    - DEP-003
    gold_examples:
    - G45
    - G46
    - G70
    - G76
    - G79
  completion_gate:
  - Neural computation proposes; symbolic structure composes/constrains; boundary verification mediates effects; feedback/evaluation
    close later loops.
  - Every effect path is statically or dynamically dominated by the Driver Gateway, and every loop/fan-out has explicit bounds.
  - Routes are user-extensible typed control graphs, not a mandated agent architecture.
- id: splendor.world-state-service
  name: World-State and Memory Service
  plane: agent_cognition
  current_status: missing
  current_baseline: The current `StateGraph` provides explicit versioned agent state and snapshots but not a domain-agnostic
    world model. There is no distinction among observations, facts, beliefs, hypotheses, predictions, goals, plans, simulations,
    memories, external truth claims, shared/private views, temporal validity, coordinate frames, or learned world-model artifacts.
  owner_package: crates/splendor-agent (world module); persistence interfaces in splendor-store
  kernel_boundary: Own versioned world and memory partitions, typed claims and relations, temporal/provenance/confidence metadata,
    conflict-aware commits, views, and simulation branches. It stores and controls representations supplied by application
    code; it does not define the domain ontology, infer truth automatically, select a learned world model, or authorize actions.
  public_contracts:
  - WorldPartition
  - WorldClaim
  - ClaimKind
  - EntityRef
  - RelationRef
  - TemporalExtent
  - UncertaintyRef
  - WorldCommit
  - WorldView
  - MemoryRecord
  - WorldBranch
  tasks:
  - id: WORLD-001
    title: Define world partitions, claims, and truth-status taxonomy
    goal: Represent arbitrary environment models without forcing one ontology or confusing perception, prediction, and fact.
    implementation:
    - Define partition identity/schema/owner/visibility and claim identity with subject/predicate/object-or-payload schema,
      claim kind, provenance, observed/valid/recorded times, confidence/uncertainty ref, status, and causal parents.
    - Provide claim kinds observation-derived assertion, external assertion, verified fact-under-policy, belief, hypothesis,
      prediction, goal, plan, norm/constraint ref, and simulated/counterfactual state.
    - Keep domain payload and ontology references opaque/versioned while kernel owns identity/provenance/time/status fields.
    - Require explicit promotion/supersession/retraction relations; never mutate historical claim meaning in place.
    - Separate agent-local world, shared world, environment truth interface, and simulation branches.
    anti_drift:
    - Do not call every stored statement a fact.
    - Do not build a universal ontology into the kernel.
    - Do not equate confidence with probability unless schema declares it.
    integration:
    - Perceptors supply observations; Route/user-space assimilators propose claims; State/Artifact store payloads.
    validation:
    - G23 and G25 create conflicting observations, beliefs, predictions, and simulated branches while preserving distinctions.
    dependencies:
    - FND-001
    - STA-001
    - PERC-001
    gold_examples:
    - G23
    - G25
  - id: WORLD-002
    title: Implement schema, entity, relation, time, and unit interoperability hooks
    goal: Allow robotics, software, language, scientific, financial, and custom worlds to share kernel lifecycle without a
      lowest-common-denominator JSON blob.
    implementation:
    - Define schema/ontology/unit/coordinate-frame refs and validation hooks executed by trusted schema plugins or user-space
      validators.
    - Support stable entity aliases/identity-resolution proposals while preserving source-local IDs and uncertainty.
    - Represent event, interval, valid-time, transaction-time, recurrence, and causal relation metadata.
    - Support values/media/tensors/graphs as artifact-backed typed payloads.
    - Provide converter declarations with input/output schemas, loss/uncertainty, code/environment, and lineage.
    anti_drift:
    - Do not assume one clock, unit system, coordinate frame, or entity resolver.
    - Do not merge entities because labels match.
    - Do not let a converter silently drop uncertainty/provenance.
    integration:
    - Driver/Data operators implement converters; World Service validates declared refs/commit; Physical routes require frames.
    validation:
    - G21, G23, G25, and G73 validate multimodal payloads, temporal conflicts, units/frames, and conversion lineage.
    dependencies:
    - WORLD-001
    - DODRV-001
    - ART-001
    gold_examples:
    - G21
    - G23
    - G25
    - G73
  - id: WORLD-003
    title: Implement observation assimilation proposals and conflict-aware commits
    goal: Turn observations into world updates through explicit user-space logic and kernel-controlled versioning.
    implementation:
    - Define `WorldUpdateProposal` containing pinned base head, consumed observation/claim refs, additions/retractions/status
      changes, transform/assimilator artifact, and merge/conflict policy.
    - Validate schema, authority, provenance, protected fields, temporal constraints, and compare-and-set head before commit.
    - Detect contradictory claims, stale bases, duplicate observations, and entity/frame ambiguity; preserve alternatives
      or invoke application merge plugin rather than last-write-wins.
    - Allow independent partitions to commit concurrently and create atomic/recoverable multi-partition transaction only where
      explicitly required.
    - Emit commit receipt and lineage without automatically triggering actions.
    anti_drift:
    - Do not let a perceptor or model write world truth directly.
    - Do not discard conflicting evidence to keep one clean state.
    - Do not retry an assimilator after conflict if it performed external effects.
    integration:
    - Route invokes user assimilator; World Service commits; Event/Lineage record.
    validation:
    - G23, G24, G25, and G29 inject stale/conflicting/multi-source updates and verify explicit resolution.
    dependencies:
    - WORLD-001
    - STA-003
    - LIN-002
    - FND-007
    gold_examples:
    - G23
    - G24
    - G25
    - G29
  - id: WORLD-004
    title: Implement uncertainty and belief representation interfaces
    goal: Let agents model incomplete and probabilistic worlds without imposing one Bayesian, fuzzy, neural, or symbolic formalism.
    implementation:
    - Allow a claim to reference an uncertainty artifact/schema and expose bounded common summaries such as confidence interval,
      probability mass, confidence score, set/range, or unknown.
    - Define user-space belief update/fusion plugin contract with exact inputs, method/version, assumptions, and output proposal.
    - Support multiple competing belief models/views over the same observations.
    - Record calibration/eval evidence for uncertainty providers separately from claim values.
    - Allow route/gate predicates to require named uncertainty conditions through schema-specific verifier plugins.
    anti_drift:
    - Do not normalize every confidence to [0,1] and call it probability.
    - Do not let a belief updater hide consumed observations.
    - Do not treat high confidence as authority or safety proof.
    integration:
    - Model/Symbolic drivers may implement estimators; Eval Controller calibrates; Route/Gate consume typed predicates.
    validation:
    - G23, G25, G42, and G57 validate competing uncertainty schemes and calibration evidence.
    dependencies:
    - WORLD-001
    - EVDRV-005
    gold_examples:
    - G23
    - G25
    - G42
    - G57
  - id: WORLD-005
    title: Implement explicit memory partition profiles and retention
    goal: Support episodic, semantic, procedural, working, social, skill, and domain memory as governed representations rather
      than hidden framework stores.
    implementation:
    - Define memory partition profiles as schemas/retention/index/query/access policies over State/World/Artifact records;
      profiles remain extensible.
    - Represent memory entries with source/provenance, time, owner/visibility, importance/quality metadata, supersession,
      and data-use obligations.
    - Provide read/query operation contracts and write proposals; vector/graph/search indexes are derived artifacts with rebuild
      lineage, never canonical truth.
    - Support summarization/consolidation/forgetting as user-space data workloads producing new immutable snapshots and explicit
      drop/supersession findings.
    - Enforce deletion/consent/privacy across derived memories and indexes.
    anti_drift:
    - Do not make vector search the definition of memory.
    - Do not let an index become the only copy of canonical records.
    - Do not allow “forgetting” to erase audit evidence or ignore legal/data obligations.
    integration:
    - Data Operator builds indexes/summaries; Data-Use/Collection controls retention; Route selects context.
    validation:
    - G23, G26, G35, and G38 validate episodic/semantic/index rebuild, forgetting, deletion, and long-running compaction.
    dependencies:
    - WORLD-001
    - DUC-004
    - DODRV-008
    gold_examples:
    - G23
    - G26
    - G35
    - G38
  - id: WORLD-006
    title: Represent learned world models as versioned model bindings
    goal: Make learned dynamics/perception models usable without turning their predictions into authoritative world state.
    implementation:
    - Define a `WorldModelBinding` from partition/schema and model operation to required context, prediction/horizon/latent
      schema, uncertainty/calibration refs, and supported simulation profile.
    - Invoke learned world models through Model Driver; store predictions/latents/rollouts as prediction/simulation claims
      or artifacts.
    - Version training data, model, route, calibration, and deployment separately and support multiple competing world models.
    - Require application assimilator/verifier policy to promote observed-confirmed knowledge; predictions expire/supersede
      explicitly.
    - Track online prediction-versus-observation residuals for evaluation/data collection.
    anti_drift:
    - Do not let a world model commit its predictions as facts.
    - Do not hide latent state in a process without checkpoint/ownership declaration.
    - Do not equate low training loss with calibrated dynamics.
    integration:
    - Model Driver executes; Eval/Feedback/Collection close loop; AgentSpec binds exact model.
    validation:
    - G57 and G59 train, calibrate, deploy, monitor, and roll back a learned world model while maintaining prediction/fact
      separation.
    dependencies:
    - WORLD-001
    - MODEL-001
    - EVAL-006
    gold_examples:
    - G57
    - G59
  - id: WORLD-007
    title: Implement simulation, counterfactual, and rollout branches
    goal: Support planning, RL, testing, and physical rehearsal without contaminating live state.
    implementation:
    - Fork a `WorldBranch` from a pinned live/snapshot head with simulator/world-model/environment refs, interventions, horizon,
      seed, resource budget, and owner.
    - Commit branch-local claims/transitions/actions/outcomes only to branch heads; effectful operations use simulated/recorded
      drivers.
    - Store trajectory/rollout artifacts and compare branches by application-defined metrics/evaluators.
    - Permit validated knowledge proposals back to live world only through explicit evidence/gate/assimilation; never copy
      branch wholesale.
    - Support distributed independent rollouts and deterministic aggregation by rollout identity.
    anti_drift:
    - Do not let branch actions reach live actuators.
    - Do not use a branch state head as live deployment state.
    - Do not present simulated outcomes as observations.
    integration:
    - Replay/Simulation and Workload/Fleet execute; Eval judges; Route/planners consume.
    validation:
    - G25, G57–G59, and G73 validate counterfactual planning, RL/world-model rollouts, and physical simulation isolation.
    dependencies:
    - WORLD-001
    - RPLY-005
    - WORK-003
    gold_examples:
    - G25
    - G57
    - G58
    - G59
    - G73
  - id: WORLD-008
    title: Implement multi-agent shared/private views and consistency
    goal: Support collaboration and partial knowledge without a globally mutable shared memory blob.
    implementation:
    - Define private, team/shared, environment, supervisor, protected evaluator, and public views with field/claim filters
      and write authority.
    - Provide snapshot/read leases and proposal/merge protocols for shared partitions; use single-writer, optimistic, CRDT/application
      merge, or consensus-backed provider as declared profile.
    - Represent agent messages/assertions as claims with source authority/reliability, not direct shared-state mutation.
    - Support redacted/projection views that preserve causal hashes and prevent inference of protected content where required.
    - Detect concurrent conflicts and partition/reconnect divergence explicitly.
    anti_drift:
    - Do not assume arbitrary shared mutable state or consensus is free.
    - Do not let a message grant write authority.
    - Do not expose private/protected world claims through aggregate queries without policy.
    integration:
    - Message/Authority governs sharing; State Service provides storage profiles; Agent Instance pins views.
    validation:
    - G70, G72, G77, and G81 test team views, offline divergence, adversarial messages, and merge policies.
    dependencies:
    - WORLD-001
    - MSG-001
    - AUTH-005
    - STA-004
    gold_examples:
    - G70
    - G72
    - G77
    - G81
  - id: WORLD-009
    title: Implement physical-world frames, local safety state, and latency classes
    goal: Model physical context needed for high-level AI actions while leaving hard real-time control and safety ownership
      local.
    implementation:
    - Represent coordinate/frame/map/zone/calibration refs, validity windows, covariance/uncertainty schemas, and transform
      provenance.
    - Define safety-local partitions for battery, emergency stop, collision risk, actuator state, geofence/privacy zone, and
      freshness indicators with device-local write/read policy.
    - Classify facts by latency/freshness requirement and prevent cloud-stale views from satisfying local physical preconditions.
    - Expose only bounded trace-safe summaries to cloud/control plane where raw sensor/state is restricted.
    - Support simulation frames separately and require explicit sim-to-real mapping/evidence.
    anti_drift:
    - Do not make cloud state authoritative for local emergency/safety conditions.
    - Do not mix coordinate frames without validated transforms.
    - Do not claim motor/firmware safety certification.
    integration:
    - Perceptor/Actuator/Node local verifier consume; Route/Planner use views; Data-Use controls export.
    validation:
    - G73–G75 test frame mismatch, stale cloud view, local safety, privacy zone, and offline operation.
    dependencies:
    - WORLD-002
    - NODE-007
    - ACT-006
    gold_examples:
    - G73
    - G74
    - G75
  - id: WORLD-010
    title: Implement retention, deletion, privacy, and knowledge invalidation
    goal: Allow long-lived agents to forget or invalidate governed world/memory content without rewriting history deceptively.
    implementation:
    - Apply data-use retention/deletion obligations to claim payloads, derived indexes/summaries, model-training lineage,
      and exported views.
    - Use retraction/tombstone/inaccessible placeholders to preserve causal structure and explain degraded reproducibility.
    - Implement source revocation and invalidation propagation to claims/views/predictions/decisions as impact facts, not
      automatic overbroad deletion.
    - Support privacy-preserving redacted views and restricted audit access.
    - Trigger reevaluation/incident/change review when invalidated knowledge materially affected deployed behavior.
    anti_drift:
    - Do not assume hashes/embeddings are non-sensitive.
    - Do not silently keep deleted payloads in vector indexes or checkpoints.
    - Do not erase evidence of why an action was taken while pretending full payload remains available.
    integration:
    - Data-Use, Lineage, Incident, Eval, and Change controllers consume impact.
    validation:
    - G26, G35, G43, and G83 validate consent deletion, derived invalidation, protected data, and compromised source impact.
    dependencies:
    - WORLD-005
    - DUC-004
    - LIN-003
    gold_examples:
    - G26
    - G35
    - G43
    - G83
  - id: WORLD-011
    title: Implement world-schema/model change and rollout controls
    goal: Evolve ontologies, assimilators, memories, and learned world models without corrupting live agent state.
    implementation:
    - Represent schema/ontology/converter/assimilator/world-model changes as ChangeSets with impact on partitions, routes,
      agents, evals, and rollback.
    - Run offline migration to new immutable partition snapshots; validate counts/invariants/provenance and preserve old heads.
    - Shadow new assimilator/world model on duplicated observations without influencing live state/actions.
    - Canary selected agent instances/partitions with comparison and safety gates; support rollback to old heads/model.
    - Require independent eval for calibration, prediction, rare-tail, safety, and downstream action regression.
    anti_drift:
    - Do not migrate a live partition in place without versioned snapshot.
    - Do not let world-model self-score approve its own rollout.
    - Do not remove old schema/model before rollback window.
    integration:
    - Change/Gate/Deployment coordinate; Agent Instance/Route select version by epoch; Eval measures.
    validation:
    - G45, G46, G57, G59, and G70 prove shadow/canary/rollback and downstream behavior comparison.
    dependencies:
    - WORLD-001
    - CHG-001
    - DEP-003
    gold_examples:
    - G45
    - G46
    - G57
    - G59
    - G70
  - id: WORLD-012
    title: Build domain-diverse world-model gold examples
    goal: Prove the abstraction supports software, language/task, physical, multi-agent, and learned dynamics worlds without
      kernel changes.
    implementation:
    - Implement a file/code repository world with observed files/tests/build state and uncertain external changes.
    - Implement a toy grid/robot world with frames, sensor uncertainty, local safety, planner, simulator, and learned transition
      model.
    - Implement a conversational/task world with entities, commitments, temporal facts, private/shared views, and memory retention.
    - Implement a custom tensor/scientific state model using artifact-backed arrays and application-defined uncertainty.
    - Run conflict, simulation, model update, deletion, multi-agent sharing, and rollback scenarios for each.
    anti_drift:
    - Do not optimize the core solely for one example.
    - Do not claim physical-world generality from a gridworld alone.
    - Do not call generated scenarios proof of real-world value alignment.
    integration:
    - Gold catalog uses common world contracts and different user-space schemas/plugins.
    validation:
    - G23–G25, G57, G59, G73, and G77 pass with no domain code in core crates.
    dependencies:
    - WORLD-001
    - WORLD-011
    - FND-005
    gold_examples:
    - G23
    - G24
    - G25
    - G57
    - G59
    - G73
    - G77
  completion_gate:
  - World storage distinguishes observation, assertion, fact-under-policy, belief, hypothesis, prediction, goal, and simulation.
  - Ontology, uncertainty, fusion, planning, and learned world models remain replaceable user-space artifacts.
  - Live, shared, protected, offline, and simulated partitions have explicit ownership, consistency, freshness, and data controls.
- id: splendor.message-delegation-service
  name: Message and Delegation Service
  plane: agent_cognition
  current_status: partial foundation
  current_baseline: Typed local messages, inbox/outbox lifecycle, recipient/schema isolation, local delegation, parent/child
    runs, remote message envelopes/transport reference path, causal replay, and task request/response types are implemented.
    Missing are durable fleet-grade delivery, ordering/dedup/backpressure, capability token attenuation/revocation across
    transports, trigger subscriptions, long-running request workflows, group/broadcast patterns, protected payload refs, and
    adversarial hardening.
  owner_package: crates/splendor-agent (message/delegation module), extending current splendor-kernel message_router/local_delegation/remote_transport
  kernel_boundary: Own typed agent/service communication lifecycle and scoped authority delegation. It stores envelopes/cursors/delivery
    state, enforces sender/recipient/schema/data scope, and issues attenuated delegation references. It never treats message
    content as authority, shared state, verified truth, or successful work by itself.
  public_contracts:
  - MessageV2
  - MessageEnvelopeV2
  - ConversationRef
  - MailboxPolicy
  - DeliveryReceipt
  - DelegationGrant
  - DelegationChain
  - TaskContract
  - Subscription
  tasks:
  - id: MSG-001
    title: Evolve the stable message envelope while preserving 0.1 semantics
    goal: Add payload/artifact, versioning, classification, conversation, expiry, and delivery semantics without breaking
      current typed messages.
    implementation:
    - Retain distinct message/source/target/run identities and add tenant/fleet/instance scope, schema version, bounded inline
      payload or artifact ref, classification, created/expiry time, causal parents, conversation/request refs, priority, and
      delivery policy.
    - Keep payload non-authorizing and validate sender/recipient/schema allowlists at send and delivery.
    - Define message kinds event, command proposal, task request/response, observation, feedback notification, approval notification,
      heartbeat/status, and custom schema without assigning authority from kind alone.
    - Provide deterministic conversion from current `Message`/envelopes and preserve causal replay.
    - Separate message identity from transport attempt/delivery receipt.
    anti_drift:
    - Do not make a message field named capability/approved authoritative.
    - Do not embed large/private payloads in mailbox metadata.
    - Do not change stable 0.1 payload meaning in place.
    integration:
    - Artifact/Data-Use handles protected payloads; Event Log records lifecycle; current router becomes local backend.
    validation:
    - G18, G19, G70, and G81 round-trip old/new messages and reject forged scope.
    dependencies:
    - FND-001
    - FND-006
    - ART-001
    gold_examples:
    - G18
    - G19
    - G70
    - G81
  - id: MSG-002
    title: Implement durable delivery, deduplication, ordering, acknowledgements, and retries
    goal: Provide clear delivery guarantees across local and remote agents without pretending global exactly-once.
    implementation:
    - Use outbox/inbox records and transport attempts with idempotent message ID; persist accepted, queued, sent, delivered,
      acknowledged, expired, rejected, dead-lettered, and cancelled states.
    - Guarantee at-least-once or at-most-once according to schema/policy; offer effect-safe exactly-once processing only through
      recipient state/idempotency transaction where supported.
    - Provide ordering by explicit conversation/partition sequence, not global timestamp; detect gaps/duplicates.
    - Retry only delivery, not recipient effects, with bounded backoff/expiry and transport failure classification.
    - Reconcile after process/node/network failures and preserve one accepted recipient processing receipt.
    anti_drift:
    - Do not claim exactly-once globally.
    - Do not order unrelated messages by wall clock.
    - Do not let transport redelivery rerun an effectful task without recipient idempotency.
    integration:
    - State/Event stores persist; remote transport carries; Agent Instance commits cursor/processing receipt.
    validation:
    - G18, G19, G70, G72, and G81 inject duplicates, reordering, partitions, expiry, and recipient restart.
    dependencies:
    - MSG-001
    - FND-003
    - STA-006
    gold_examples:
    - G18
    - G19
    - G70
    - G72
    - G81
  - id: MSG-003
    title: Implement attenuated delegation grants and chains
    goal: Delegate bounded work authority independently from message content and parent permissions.
    implementation:
    - Define a signed/reference delegation grant with issuer/delegate, parent grant/work order, allowed operations/targets/data
      refs, quotas/resources, purpose, run/task scope, not-before/expiry, depth, re-delegation policy, revocation, and audit
      refs.
    - Validate monotonic attenuation at every chain link; no child can broaden parent authority or lifetime.
    - Bind grant to child instance/task/workload and require it at privileged planning/invocation, not merely at message receipt.
    - Implement revocation propagation and short-lived/offline behavior with fail-closed high-risk semantics.
    - Expose an explanation of effective authority without revealing unrelated parent grants.
    anti_drift:
    - Do not serialize ambient parent credentials to a child.
    - Do not interpret a task request message as delegation.
    - Do not allow a child to mint sibling/parent authority.
    integration:
    - Authority Service owns validation; Agent Instance requests grants; Gateway/Workload enforce.
    validation:
    - G18, G70, G77, G78, and G81 attempt broadening, expiry reuse, and forged delegation; all deny.
    dependencies:
    - AUTH-005
    - MSG-001
    gold_examples:
    - G18
    - G70
    - G77
    - G78
    - G81
  - id: MSG-004
    title: Implement task request/response and long-running conversation contracts
    goal: Coordinate sub-agents/services with explicit objectives, schemas, lifecycle, and cancellation instead of free-form
      text alone.
    implementation:
    - Define task contract with objective/input refs, expected result schema, delegated grant ref, resource/time budget, progress
      schema, acceptance criteria ref, parent causal context, and cancellation policy.
    - Support accepted/rejected/progress/waiting/completed/failed/cancelled responses and separate provider/agent output from
      parent acceptance.
    - Allow multi-turn conversation under bounded request/conversation identity and token/message/time budgets.
    - Bind child result artifacts/evidence to task and prevent response from directly committing parent state/action.
    - Support timeout, cancellation, reassignment, and duplicate response handling.
    anti_drift:
    - Do not use natural-language objective as the only result schema or authority.
    - Do not mark parent task successful solely from child “done”.
    - Do not allow unbounded conversational ping-pong.
    integration:
    - Agent Instance/Actuator nodes realize tasks; Route validates/accepts results; Workload tracks child.
    validation:
    - G18, G70, and G77 test specialist tasks, progress, failure, reassignment, and independent validation.
    dependencies:
    - MSG-003
    - AINST-006
    - WORK-003
    gold_examples:
    - G18
    - G70
    - G77
  - id: MSG-005
    title: Harden remote transport, routing, identity, and offline queues
    goal: Carry messages across fleet/network boundaries without changing identity or authority semantics.
    implementation:
    - Implement mutually authenticated transport endpoints bound to node/instance/fleet identity with schema/version negotiation,
      replay protection, payload limits, and route discovery.
    - Route by logical recipient and current instance location; preserve message identity/causality through forwarding and
      state handoff.
    - Support local durable queues and offline buffering with expiry/storage limits; reconcile after reconnect and avoid duplicate
      delivery.
    - Encrypt/classify payload refs and prevent transport metadata from widening visibility.
    - Quarantine unknown sender/schema/signature or conflicting recipient ownership.
    anti_drift:
    - Do not make transport signature a delegation grant.
    - Do not expose unauthenticated remote message endpoints.
    - Do not deliver expired commands after a device reconnects.
    integration:
    - Build on current RemoteMessageEnvelope/transport, node registry, state handoff, and trace sync.
    validation:
    - G70, G72, G75, and G81 test two-node, migration, offline, replay, and hostile transport.
    dependencies:
    - MSG-002
    - NODE-001
    - STA-007
    gold_examples:
    - G70
    - G72
    - G75
    - G81
  - id: MSG-006
    title: Implement event subscriptions and trigger-agent routing
    goal: Use messages/events as durable triggers without turning every notification into an unbounded new agent run.
    implementation:
    - Define subscriptions by schema/source/target/scope/filter, cursor, delivery policy, debounce/coalesce/window, priority,
      max concurrency, and expiry.
    - Validate filter expressions through a bounded declarative language or trusted plugin; never run arbitrary code in router.
    - Deliver trigger envelope to Agent Instance, which creates a governed session/workload under current authority.
    - Support one-shot, persistent, scheduled, and condition-triggered specialist agents with dedup identities.
    - Record dropped/coalesced/gap events and expose lag/backpressure.
    anti_drift:
    - Do not let a trigger subscription carry perpetual action authority.
    - Do not spawn one child per high-rate event without limits.
    - Do not hide dropped events.
    integration:
    - Event Log/Perceptor feed subscriptions; Agent Instance/Workload enforce concurrency.
    validation:
    - G19, G22, G29, G38, and G49 validate trigger dedup, storm handling, and restart cursors.
    dependencies:
    - MSG-001
    - AINST-003
    - WORK-007
    gold_examples:
    - G19
    - G22
    - G29
    - G38
    - G49
  - id: MSG-007
    title: Implement mailbox quotas, priorities, backpressure, and dead letters
    goal: Protect agents and control plane from message storms, oversized payloads, and stuck recipients.
    implementation:
    - Define per-agent/schema/source quotas for messages, bytes, rate, age, conversation, and priority class.
    - Use bounded queues and explicit reject/drop-oldest/drop-newest/coalesce/spill-to-artifact/dead-letter policies by schema/risk.
    - Reserve capacity for governance, kill-switch, safety, lease, and cancellation control messages separate from bulk agent
      chatter.
    - Expose lag, gaps, dead letters, repeated rejection, and sender abuse to health/incident systems.
    - Require authorized requeue with original message identity and new delivery attempt.
    anti_drift:
    - Do not let bulk training feedback starve emergency control.
    - Do not silently discard messages.
    - Do not permit sender-declared priority outside authority.
    integration:
    - Authority quotas and Agent Instance health consume; Observability exports; Incident rate-limits/quarantines abuse.
    validation:
    - G22, G68, G81, and G88 saturate mailboxes and assert bounded memory/control priority/evidence.
    dependencies:
    - MSG-002
    - AUTH-004
    - OBS-005
    gold_examples:
    - G22
    - G68
    - G81
    - G88
  - id: MSG-008
    title: Implement causal trace, replay, and state-transition integration
    goal: Explain multi-agent behavior without re-executing messages or side effects.
    implementation:
    - Link send/delivery/ack/processing/task/response events to message/conversation/delegation/parent route/session/state
      commit identities.
    - Record recipient processing result and state head transactionally where exactly-once-processing profile is used.
    - Reconstruct causal graph across remote hops, child runs, approvals, denials, migrations, and offline intervals.
    - Replay inspect-only by default; simulated delivery uses isolated mailboxes/instances and new authority.
    - Generate first-divergence reports for multi-agent revision comparisons.
    anti_drift:
    - Do not redeliver historical messages to live recipients during replay.
    - Do not infer permission inheritance from causal parent.
    - Do not omit denied/expired/dead-letter messages from causal explanation.
    integration:
    - Event/Evidence/Replay/State services consume current causal foundations.
    validation:
    - G03, G18, G70, and G72 reconstruct without live effects and detect injected divergence.
    dependencies:
    - MSG-001
    - RPLY-004
    - EVID-002
    gold_examples:
    - G03
    - G18
    - G70
    - G72
  - id: MSG-009
    title: Implement external agent/framework bridges with reduced guarantees
    goal: Communicate with non-Splendor agents and services while preserving clear trust and authority boundaries.
    implementation:
    - Define bridge adapters for webhook/queue/agent protocol/custom transports that map external identities/schemas into
      Splendor messages.
    - Authenticate external principals where possible and classify unauthenticated/externally attested sources explicitly.
    - Never transfer a Splendor delegation grant through a bridge unless the remote boundary supports the exact signed/verified
      contract.
    - Validate/transform payloads through versioned schemas and attach bridge/transport provenance.
    - Expose observed/unmanaged guarantees and require re-verification before external responses cause effects/state changes.
    anti_drift:
    - Do not trust external “role”/“approved” fields.
    - Do not assume another agent framework enforces Splendor capabilities.
    - Do not hide bridge transformation or lost fields.
    integration:
    - Driver Gateway hosts bridge; Agent Registry frameworks use; Route treats outputs as observations/proposals.
    validation:
    - G06, G18, G70, and G81 run trusted and hostile external bridge fixtures.
    dependencies:
    - MSG-001
    - DGW-006
    - WORK-008
    gold_examples:
    - G06
    - G18
    - G70
    - G81
  - id: MSG-010
    title: Build message/delegation adversarial and conformance suite
    goal: Prove schema, routing, delivery, authority attenuation, and backpressure under hostile peers and networks.
    implementation:
    - Inject spoofed sender/recipient, schema confusion, oversized/zip-bomb artifact, replayed delivery, sequence gap, expiry,
      duplicate task, grant broadening, cycle, trigger storm, response forgery, and transport partition.
    - Verify no unauthorized payload read, grant use, state commit, or action invocation occurs.
    - Test local/remote/offline/migration paths and current 0.1 compatibility fixtures.
    - Publish conformance for transports/bridges and retain security incidents separately.
    - Measure queue/recovery throughput at 1,000-device mixed load.
    anti_drift:
    - Do not test only cooperative agents.
    - Do not mark delivery pass if recipient bypassed schema/authority.
    - Do not suppress dead letters or denial evidence.
    integration:
    - Driver Registry/Incident/Gold runner consume; CI retains current multi-agent replay tests.
    validation:
    - G18, G19, G70, G72, G77, G81, and G88 pass the full matrix.
    dependencies:
    - MSG-001
    - MSG-007
    - FND-005
    gold_examples:
    - G18
    - G19
    - G70
    - G72
    - G77
    - G81
    - G88
  completion_gate:
  - Messages carry typed information and causal links, never implicit truth, shared-state mutation, or authority.
  - Delegation is a separate signed/validated attenuated grant bound to task/instance/workload.
  - Local, remote, offline, bridge, and replay paths preserve identity, bounds, and evidence.
- id: splendor.collection-controller
  name: Collection Controller
  plane: data_learning
  current_status: missing
  current_baseline: Percepts, action outcomes, traces, messages, local device buffers, and data refs exist, but there is no
    first-class controller that authorizes and manages ongoing collection plans, source cursors, sampling/coverage, data minimization,
    recordization, quality entry checks, quarantine, device sync, budgets, or immutable dataset snapshot publication.
  owner_package: crates/splendor-learning (collection module)
  kernel_boundary: 'Own desired/observed lifecycle for governed data acquisition and recordization: why to collect, from which
    sources, under which purpose/consent/locality, how to sample/minimize, where cursors live, what entry quality/quarantine
    policy applies, and when to publish a snapshot. It does not implement source connectors/transforms, label truth, training,
    or evaluation.'
  public_contracts:
  - CollectionPlan
  - CollectionSource
  - CollectionCursor
  - SamplingPolicy
  - CoverageTarget
  - RecordizationSpec
  - CollectionBatch
  - CollectionFinding
  - CollectionSnapshotProposal
  tasks:
  - id: COLL-001
    title: Define CollectionPlan and lifecycle state machine
    goal: Make ongoing data acquisition a governed kernel object rather than incidental logging or ad hoc scripts.
    implementation:
    - Define collection identity, owner/principal, purpose, target data product/schema, sources, source capabilities/data-use
      refs, filters/minimization, sampling/coverage, recordization, quality entry checks, quarantine, retention, locality,
      budget, schedule/trigger, output snapshot cadence, and review policy.
    - Implement draft, validating, approved, active, paused, draining, completed, denied, expired, revoked, failed, and quarantined
      states with immutable plan revisions.
    - Separate plan, source subscription/extraction workload, batch, record, snapshot, and dataset identities.
    - Bind exact perceptor/data-operator drivers, schemas, code/environment, and destination classification.
    - Persist desired/observed cursors, volume, coverage, findings, and obligations without embedding raw records.
    anti_drift:
    - Do not make tracing every agent interaction equivalent to approved training collection.
    - Do not allow a broad purpose such as “improve AI” without concrete allowed uses/retention.
    - Do not let a collection plan declare labels or quality valid by itself.
    integration:
    - Data-Use/Authority approve; Perceptor/Data Operator execute; Workload schedules; Artifact/Lineage publish outputs.
    validation:
    - G30 and G38 exercise all lifecycle transitions, schedule/restart, and purpose expiry.
    - A live agent run with no collection plan produces operational evidence but no trainable dataset record.
    dependencies:
    - FND-001
    - DUC-001
    - WORK-007
    gold_examples:
    - G30
    - G38
  - id: COLL-002
    title: Implement source admission, subscriptions, extraction, and cursor ownership
    goal: Read each source under explicit authority with durable progress and honest source consistency.
    implementation:
    - Validate source identity/schema/classification, principal capability, purpose/data-use grant, consent/licence, locality,
      expected consistency/cursor, rate limits, and driver maturity.
    - Create per-source subscription or extraction workloads through Perceptor/Data Operator drivers and bind cursor ownership
      to the collection plan revision.
    - Persist accepted/committed source cursor only after record batch/output durability according to source semantics.
    - Handle backfill, incremental updates/deletes, source reset, replay windows, and unavailable source with explicit findings.
    - Prevent one source’s cursor or credentials from being reused by another plan/purpose.
    anti_drift:
    - Do not read first and seek permission later.
    - Do not call a wall-clock timestamp a reliable cursor.
    - Do not advance cursor on partial failed batch unless source/plan semantics say so explicitly.
    integration:
    - Perceptor pull/push or Data connector supplies batches; Node enforces locality; State stores cursors.
    validation:
    - G30, G35, and G38 inject cursor duplicates/gaps/reset, deletion, source outage, and restart.
    dependencies:
    - COLL-001
    - PERC-002
    - DODRV-002
    - STA-006
    gold_examples:
    - G30
    - G35
    - G38
  - id: COLL-003
    title: Implement sampling, coverage, diversity, and active-acquisition policy
    goal: Collect informative and representative data under budget without hard-coding a domain selection algorithm.
    implementation:
    - Define sampling policies uniform, stratified, temporal, source-weighted, uncertainty/error-driven, novelty/diversity,
      rare-tail preservation, event-triggered, and custom plugin.
    - Represent coverage targets and observed coverage by application-defined slices with minimums/maximums and uncertainty.
    - Allow user-space active-learning/acquisition plugins to propose record/source/query selection from bounded summaries;
      kernel validates purpose, budget, bias constraints, and source capability.
    - Track inclusion probability/selection rationale where feasible so downstream evaluation/training can account for sampling
      bias.
    - Use exploration budgets and holdout/random sampling to detect exploitation blindness.
    anti_drift:
    - Do not let a model collect only examples that maximize its own reward.
    - Do not define diversity as one embedding distance universally.
    - Do not sacrifice protected/rare groups to optimize aggregate volume.
    integration:
    - World/Feedback/Eval signals may trigger proposals; Data Operator applies sampling; Gate may enforce coverage minima.
    validation:
    - G32, G37, G38, and G48 compare random/active/rare-tail policies and detect selection bias/reward exploitation.
    dependencies:
    - COLL-001
    - DODRV-007
    - FDBK-004
    gold_examples:
    - G32
    - G37
    - G38
    - G48
  - id: COLL-004
    title: Implement recordization of observations, actions, outcomes, traces, feedback, and trajectories
    goal: Convert runtime experience into explicit data records without conflating operational evidence and learning data.
    implementation:
    - Define recordization specs mapping source events/artifacts/state/world/route/action/outcome/feedback windows into named
      record schemas through versioned user-space transforms.
    - Pin causal range, time window, state/world heads, model/route/policy revisions, action/effect outcome, and source payload
      refs.
    - Support supervised examples, preference pairs, trajectories, transitions, episodes, tool/action traces, code patches/tests,
      physical sensor-action sequences, and custom records.
    - Apply minimization/redaction before publication and preserve raw restricted refs only where policy permits.
    - Deduplicate by source/causal identity and record transform lineage; late feedback may create a new revision/linked record
      rather than mutate old bytes.
    anti_drift:
    - Do not train directly from mutable trace queries.
    - Do not store hidden chain-of-thought as required learning data.
    - Do not interpret an action executed as an action desirable.
    integration:
    - Event/State/World/Feedback provide refs; Data Operator transforms; Artifact/Lineage publish.
    validation:
    - G30, G37, G47, G56, and G58 produce language, coding, RL, world-model, and physical trajectory records with exact causal
      lineage.
    dependencies:
    - COLL-002
    - FDBK-001
    - LIN-002
    gold_examples:
    - G30
    - G37
    - G47
    - G56
    - G58
  - id: COLL-005
    title: Implement collection entry validation, quarantine, and poisoning defenses
    goal: Stop corrupt, unauthorized, malformed, or suspicious data from silently entering candidate datasets.
    implementation:
    - Run configured schema/integrity/source/authenticity/privacy/malware/content/quality/duplication checks on each batch
      or shard before normal availability.
    - Route failed/suspicious records to classified quarantine with reason, source, detector evidence, and review/retention
      policy.
    - Detect abnormal source volume/distribution/label/reward shifts, repeated model-generated patterns, canary leakage, and
      hostile payloads; escalate rather than auto-delete.
    - Require independent verification for data generated by or directly benefiting the candidate agent where risk policy
      applies.
    - Permit explicit reviewed release or corrected derived snapshot; never rewrite original quarantined data.
    anti_drift:
    - Do not use one generic “quality score” to admit data.
    - Do not let a source/model mark its own records trusted.
    - Do not discard poisoning evidence automatically.
    integration:
    - Data Operator performs checks; Incident handles attacks; Data-Use controls quarantine access.
    validation:
    - G31, G32, G36, G48, G84, and G85 inject corrupt, poison, recursive synthetic, reward, and lineage attacks.
    dependencies:
    - COLL-004
    - DODRV-003
    - INC-002
    gold_examples:
    - G31
    - G32
    - G36
    - G48
    - G84
    - G85
  - id: COLL-006
    title: Implement privacy, consent, retention, deletion, and minimization operations
    goal: Make ongoing collection responsive to human/source rights and legal/data policies throughout its derived lineage.
    implementation:
    - Track consent/licence/purpose/retention/region/subject/source obligations at record or group/shard granularity as appropriate.
    - Apply field/media redaction, pseudonymization, aggregation, on-device feature extraction, and sampling minimization
      through versioned operators.
    - Implement revocation/deletion intake that pauses affected source collection, tombstones payload access, computes derived
      impact, and schedules rebuild/retraining/eval decisions.
    - Keep non-sensitive audit facts and explain unavailable evidence while respecting deletion/legal hold conflicts through
      governance workflow.
    - Prevent snapshots/checkpoints/caches/indexes from evading obligations.
    anti_drift:
    - Do not assume de-identification is universal or irreversible.
    - Do not keep raw data because a derived embedding exists.
    - Do not silently remove training records without impact/evidence and model response policy.
    integration:
    - Data-Use/Lineage/Artifact/World/Training/Incident coordinate impact; Node clears local caches.
    validation:
    - G26, G34, G35, and G83 validate minimization, use separation, deletion propagation, and affected candidate/deployment
      discovery.
    dependencies:
    - COLL-001
    - DUC-004
    - LIN-003
    - ART-003
    gold_examples:
    - G26
    - G34
    - G35
    - G83
  - id: COLL-007
    title: Implement fleet/device-local collection, buffering, and synchronization
    goal: Collect data across 1,000 heterogeneous and intermittently connected devices without centralizing restricted payloads
      or losing provenance.
    implementation:
    - Deploy per-plan local collectors as governed workloads with source/data leases, buffer quota, local quality/minimization
      operators, and sync policy.
    - Assign immutable device/source batch identities and integrity-chain local manifests; upload resumably with cursor/ack
      reconciliation.
    - Support federated summary/feature/gradient-like artifacts as data products without making federated-learning algorithm
      core.
    - Respect device-local/privacy/region constraints and schedule aggregation near data where required.
    - Detect duplicate reconnect uploads, divergent device clocks, offline policy expiry, corrupt buffers, and compromised
      node evidence.
    anti_drift:
    - Do not upload all raw device data by default.
    - Do not trust device wall clock or self-reported buffer completeness alone.
    - Do not call distributed collection federated learning.
    integration:
    - Node Agent buffers/mounts; Fleet/Workload schedule; Artifact/Lineage sync; Data-Use controls locality.
    validation:
    - G38, G61, G68, G72, G74, and G75 simulate large mixed/offline fleet collection with no duplicate records and enforced
      locality.
    dependencies:
    - COLL-002
    - NODE-007
    - DODRV-008
    - FLEET-008
    gold_examples:
    - G38
    - G61
    - G68
    - G72
    - G74
    - G75
  - id: COLL-008
    title: Implement budgets, stopping conditions, rate adaptation, and cost accounting
    goal: Keep data acquisition bounded and aligned with stated coverage/value rather than “collect everything forever.”
    implementation:
    - Enforce records/bytes/source requests/device time/storage/network/currency/privacy-risk/human-label budgets and per-slice/source
      limits.
    - Define stopping conditions target coverage, diminishing information gain, quality floor failure, consent/source expiry,
      drift/change point, budget exhaustion, or external pause.
    - Allow application plugins to propose rate/sampling changes; validate within plan bounds and create a new plan revision
      when semantics change.
    - Account collection, local processing, transfer, quarantine, labeling, and retention costs separately.
    - Emit forecast versus actual and prevent trigger storms from bypassing plan budgets.
    anti_drift:
    - Do not let a collection model increase its own budget.
    - Do not stop solely on aggregate volume if required slices are missing.
    - Do not hide privacy/human/device cost behind compute cost.
    integration:
    - Authority quotas/Gate approvals constrain; Observability supplies usage; Improvement may propose revisions.
    validation:
    - G37, G38, G48, and G68 validate budget, rare-slice, adaptive rate, and trigger-storm behavior.
    dependencies:
    - COLL-001
    - AUTH-004
    - OBS-004
    gold_examples:
    - G37
    - G38
    - G48
    - G68
  - id: COLL-009
    title: Implement immutable collection snapshot and dataset-candidate publication
    goal: Produce exact data artifacts that can be reviewed, quality-checked, split, trained, and invalidated.
    implementation:
    - Close a collection window/source cursor set and assemble root shard manifest, schema, record counts/bytes, source/cursor
      ranges, sampling policy, coverage, obligations, quarantine exclusions, quality findings, and producer lineage.
    - Publish as `collection_snapshot` or `dataset_candidate`, never directly as approved training/eval dataset.
    - Require deterministic completeness accounting and mark partial/missing sources explicitly.
    - Trigger downstream quality/dedup/contamination/split workflows through proposals, not implicit side effects.
    - Retain previous snapshots and incremental parent relation.
    anti_drift:
    - Do not mutate a dataset directory in place.
    - Do not call a snapshot train-ready because collection succeeded.
    - Do not omit excluded/quarantined counts.
    integration:
    - Artifact/Lineage publish; Data controller/eval/training consume after gates.
    validation:
    - G30–G38 inspect complete lineage, counts, exclusions, incremental parents, and use status.
    dependencies:
    - COLL-004
    - COLL-005
    - ART-002
    - LIN-002
    gold_examples:
    - G30
    - G31
    - G32
    - G33
    - G34
    - G35
    - G36
    - G37
    - G38
  - id: COLL-010
    title: Build collection gold examples and long-running fault suite
    goal: Prove collection is a core persistent service across modalities, feedback, physical devices, and agent evolution.
    implementation:
    - Implement web/API text, code/test outcome, human preference, tool trajectory, simulated robot sensor/action, and custom
      numerical-source plans.
    - Run snapshot and continuous modes with source reset, late records, deletion, poison, backpressure, offline device, quota,
      and controller crash.
    - Verify operational traces remain separate from learning datasets until a plan includes them.
    - Demonstrate active acquisition plus random holdout and rare-tail preservation.
    - Publish evidence/lineage and assert no protected eval or unauthorized source enters output.
    anti_drift:
    - Do not use only clean static files.
    - Do not make examples depend on external secrets/network.
    - Do not label synthetic fixtures proof of production data quality.
    integration:
    - Gold runner uses reference perceptors/data operators/fleet simulator.
    validation:
    - G30–G38, G47, G56, G58, and G74 pass fault and lineage assertions.
    dependencies:
    - COLL-001
    - COLL-009
    - FND-005
    gold_examples:
    - G30
    - G31
    - G32
    - G33
    - G34
    - G35
    - G36
    - G37
    - G38
    - G47
    - G56
    - G58
    - G74
  completion_gate:
  - Collection is authorized by purpose before source access and remains bounded by consent, locality, coverage, quality,
    retention, and budget.
  - Operational evidence is not trainable data until explicit recordization and dataset publication occur.
  - Snapshots are immutable, complete-or-explicitly-partial, lineage-bound inputs to later data/eval/training decisions.
- id: splendor.feedback-service
  name: Feedback Service
  plane: data_learning
  current_status: partial foundation
  current_baseline: '`Feedback` is currently only `{kind,payload,recorded_at}` and OutcomeEvaluator can attach one optional
    feedback value per action. There is no stable identity/targeting, source authority, causal attribution, human workflow,
    reliability/disagreement, privacy, correction/supersession, operational-versus-learning use, poisoning defense, or fleet
    ingestion.'
  owner_package: crates/splendor-learning (feedback module)
  kernel_boundary: Own immutable receipt, validation, targeting, provenance, lifecycle, dispute/correction, reliability metadata,
    and governed views of human/automated/environment/model feedback. It does not derive reward by default, declare objective
    truth, train models, or approve changes.
  public_contracts:
  - FeedbackEvent
  - FeedbackTarget
  - FeedbackSource
  - FeedbackKind
  - FeedbackAssessment
  - FeedbackCorrection
  - FeedbackView
  - ReviewTask
  - FeedbackReliability
  tasks:
  - id: FDBK-001
    title: Define FeedbackEvent identity, targets, kinds, and lifecycle
    goal: Make feedback addressable and attributable to exact behavior, artifacts, world claims, data records, or changes.
    implementation:
    - Add feedback ID, tenant/scope, source principal/system/model/environment, target refs, kind/schema, payload ref/inline
      bound, observed/recorded times, causal context, classification, confidence, use restrictions, and event status.
    - Support targets action/invocation/outcome, route step/session/trajectory, model output, data record/snapshot, world
      claim/prediction, agent revision/instance, eval result, deployment/incident, or custom typed target.
    - Define kinds rating, preference, critique/correction, label/annotation, success/failure observation, safety report,
      policy violation, user override, environment reward precursor, and custom.
    - Implement accepted, quarantined, disputed, corrected/superseded, withdrawn, expired, and deleted-payload states while
      preserving immutable history.
    - Map current minimal Feedback into a legacy feedback event with explicit missing attribution.
    anti_drift:
    - Do not let feedback payload grant authority or change target state directly.
    - Do not assume later feedback timestamp is outcome time.
    - Do not overwrite original feedback during correction.
    integration:
    - Event/Artifact/Lineage store; Collection recordizes; Reward/Eval consume accepted views.
    validation:
    - G37 and G41 round-trip all target/kind/status cases and distinguish legacy missing attribution.
    dependencies:
    - FND-001
    - ART-001
    - FND-006
    gold_examples:
    - G37
    - G41
  - id: FDBK-002
    title: Implement human, environment, automated, model-judge, and system feedback channels
    goal: Ingest heterogeneous feedback while preserving source class, trust, and independence.
    implementation:
    - Create channel contracts for authenticated user/operator/reviewer, physical/environment outcome, programmatic checker,
      external service, model judge, peer agent, incident/safety monitor, and imported historical feedback.
    - Bind channel identity/authentication, allowed target/schema, data visibility, rate/quota, review policy, and delivery
      transport.
    - For humans, support review tasks, randomized/blinded presentation, annotations, confidence, abstention, escalation,
      and accessibility/latency metadata.
    - For automated/model sources, pin implementation/model/rubric/data and record shared dependency with target candidate.
    - Classify unauthenticated/imported feedback as untrusted evidence until reviewed.
    anti_drift:
    - Do not call model-judge output human feedback.
    - Do not let an agent impersonate a user/operator through message content.
    - Do not assume authenticated feedback is accurate or unbiased.
    integration:
    - Authority authenticates; Evaluator Driver may create review tasks; Message/Perceptor transports; Data-Use limits views.
    validation:
    - G37, G41, G44, G48, and G81 test all source classes, spoofing, blinding, and independence metadata.
    dependencies:
    - FDBK-001
    - AUTH-001
    - EVDRV-007
    gold_examples:
    - G37
    - G41
    - G44
    - G48
    - G81
  - id: FDBK-003
    title: Implement causal attribution windows and target resolution
    goal: Link feedback to the behavior that plausibly caused it without pretending correlation is proven causation.
    implementation:
    - Resolve explicit target IDs exactly and support bounded user-space attribution proposals for delayed/aggregate feedback
      over sessions, trajectories, actions, model versions, or deployments.
    - Store candidate causal set, temporal window, route/state/world context, attribution method/version, weights/uncertainty,
      and supporting evidence.
    - Allow multiple attribution hypotheses and later correction; keep raw feedback independent from attribution.
    - Reject attribution to inaccessible/mismatched tenant/time/identity targets and detect stale/reused IDs.
    - Expose un-attributed feedback as valid operational input but prevent hidden reward assignment.
    anti_drift:
    - Do not assign delayed user sentiment to the last action by default.
    - Do not let a candidate model choose its own favorable attribution without independent evidence.
    - Do not rewrite feedback payload to encode attribution.
    integration:
    - Route/Event/State provide causal graph; Reward Derivation consumes accepted attribution; user plugins compute hypotheses.
    validation:
    - G37, G47, G48, and G58 include delayed, multi-action, coding, and RL trajectories with known attribution ambiguity.
    dependencies:
    - FDBK-001
    - EVID-002
    - ROUTE-010
    gold_examples:
    - G37
    - G47
    - G48
    - G58
  - id: FDBK-004
    title: Implement reliability, calibration, disagreement, and source-drift metadata
    goal: Use feedback quality intelligently without reducing it to a hidden global trust score.
    implementation:
    - 'Track source-specific reliability evidence by schema/domain/slice/time: agreement, calibration against adjudicated
      cases, consistency, abstention, latency, suspected bias/drift, and conflict-of-interest.'
    - Represent disagreements/conflicting feedback as first-class groups and support adjudication workflows.
    - Allow application policies to produce weighted/filtered views from explicit reliability artifacts; raw events remain
      unchanged.
    - Detect sudden distribution/rating/label shifts, coordinated sources, model-version changes, and reviewer fatigue/automation
      patterns.
    - Expose uncertainty and sample size with every reliability summary.
    anti_drift:
    - Do not create one permanent reputation number across all tasks.
    - Do not suppress minority/disagreeing feedback to improve consistency.
    - Do not let source reliability be updated solely from agreement with current model.
    integration:
    - Eval Controller may maintain calibration sets; Collection sampling uses summaries; Incident handles manipulation.
    validation:
    - G41, G44, G48, and G85 inject disagreement, biased reviewers, judge drift, and coordinated poison.
    dependencies:
    - FDBK-002
    - EVDRV-005
    gold_examples:
    - G41
    - G44
    - G48
    - G85
  - id: FDBK-005
    title: Implement HIL review, correction, appeal, and escalation workflows
    goal: Make humans effective participants in runtime control and learning without bypassing kernel authority or hiding
      burden.
    implementation:
    - Define review queues/tasks with exact target evidence, minimized/redacted context, requested schema, deadline, reviewer
      role, conflict checks, and escalation path.
    - Support approve/deny/comment/correct/label/preference/abstain/escalate results as feedback and, where separately authorized,
      governance approvals.
    - Keep governance approval object distinct from feedback even if one UI collects both.
    - Implement correction/supersession and appeal/adjudication with immutable original, reviewer reasoning artifact, and
      resolution status.
    - Measure queue latency, disagreement, reviewer load, and unreviewed default behavior.
    anti_drift:
    - Do not use a feedback rating as an action approval token.
    - Do not expose more private/protected data than review requires.
    - Do not default to allow when human review times out unless explicit low-risk policy says so.
    integration:
    - Governance/Approval service handles authority; Evaluator creates review; Agent/Route can wait/escalate.
    validation:
    - G40, G41, G48, G73, and G78 validate separate feedback/approval, timeout, appeal, and physical HIL.
    dependencies:
    - FDBK-001
    - AUTH-007
    - EVDRV-007
    gold_examples:
    - G40
    - G41
    - G48
    - G73
    - G78
  - id: FDBK-006
    title: Implement privacy, consent, subject access, and deletion for feedback
    goal: Protect human and operational feedback while preserving necessary audit and learning lineage.
    implementation:
    - Classify feedback payload, reviewer identity, target content, and derived labels separately; apply purpose/retention/access
      controls.
    - Support pseudonymous reviewer IDs and sealed identity mapping where appropriate while retaining conflict/adjudication
      ability.
    - Implement subject/source correction, withdrawal, deletion, legal hold, and derived impact workflows.
    - Prevent feedback payloads from entering training datasets or prompts without an allowed use and minimization transform.
    - Redact feedback in general traces/UI while preserving reason/status and restricted artifact refs.
    anti_drift:
    - Do not assume free-form critiques are non-sensitive.
    - Do not expose reviewer identity to the candidate agent unnecessarily.
    - Do not silently keep deleted feedback in derived preference datasets/reward models.
    integration:
    - Data-Use/Collection/Lineage/Artifact coordinate; Incident protects abuse reports.
    validation:
    - G26, G34, G35, and G41 validate protected reviews, training opt-in, deletion, and redacted evidence.
    dependencies:
    - FDBK-001
    - DUC-004
    - COLL-006
    gold_examples:
    - G26
    - G34
    - G35
    - G41
  - id: FDBK-007
    title: Implement immutable feedback views, aggregation, and export
    goal: Provide application-ready feedback selections without destroying raw provenance or hiding policy choices.
    implementation:
    - Define a FeedbackView by target/source/kind/time/slice/status/reliability/use policy with exact query/version and output
      artifact digest.
    - Support pairwise preference datasets, critiques/corrections, labels, trajectory assessments, safety findings, and operational
      summaries through user-space data operators.
    - Record inclusion/exclusion/weighting/adjudication policy and counts by source/slice/status.
    - Provide protected/aggregated exports with access checks and completeness/withdrawal markers.
    - Version views whenever underlying events/status/policy change; never mutate a published view.
    anti_drift:
    - Do not call a weighted aggregate raw feedback.
    - Do not hide excluded negative/disagreeing sources.
    - Do not let query-time latest changes alter a running training plan.
    integration:
    - Data Operator builds; Reward/Eval/Training consume pinned views; Lineage records.
    validation:
    - G37, G41, G48, and G56 inspect exact membership/weights and reproduce views.
    dependencies:
    - FDBK-004
    - DODRV-001
    - LIN-002
    gold_examples:
    - G37
    - G41
    - G48
    - G56
  - id: FDBK-008
    title: Separate operational control, evaluation, and learning uses
    goal: Route the same feedback event to valid consumers without making one use imply another.
    implementation:
    - Define use eligibility for immediate route/state update proposal, incident/safety response, evaluation measurement,
      reward derivation, data collection, training, product analytics, and governance review.
    - Require separate data-use and algorithm policy for each use; one event may be eligible for some and denied for others.
    - Make urgent safety feedback trigger a governed circuit-breaker/incident proposal without automatically becoming positive/negative
      training reward.
    - Keep live online adaptation disabled unless an approved Improvement/Change plan explicitly consumes the view.
    - Record consumer receipts so impact and deletion can identify every downstream use.
    anti_drift:
    - Do not train on every thumbs-up/down automatically.
    - Do not convert action denial into negative reward without a declared derivation.
    - Do not let feedback directly modify agent model/route/policy.
    integration:
    - Incident/Route/Reward/Eval/Collection/Improvement consume separately; Lineage tracks.
    validation:
    - G37, G40, G48, G70, and G78 prove same event follows distinct allowed/denied paths with no hidden update.
    dependencies:
    - FDBK-001
    - DUC-002
    - LIN-001
    gold_examples:
    - G37
    - G40
    - G48
    - G70
    - G78
  - id: FDBK-009
    title: Implement poisoning, manipulation, collusion, and feedback-loop defenses
    goal: Detect adversarial or self-reinforcing feedback before it drives learning or deployment.
    implementation:
    - Apply source authentication/rate/quota, anomaly/distribution checks, reviewer conflict, duplicate/coordinated pattern,
      sybil/device abuse, prompt injection, and target manipulation detectors.
    - Track candidate-generated/self-referential feedback and shared model/judge dependencies; require independent holdout
      channels for high-risk improvements.
    - Use canary tasks/review consistency checks and preserve random/unoptimized feedback samples.
    - Quarantine suspicious sources/views and open incidents without automatically declaring all negative feedback malicious.
    - Require reward/eval/improvement plans to state defenses and residual risks.
    anti_drift:
    - Do not let the candidate classify inconvenient feedback as poison unilaterally.
    - Do not trust volume/consensus under sybil conditions.
    - Do not optimize solely against the same feedback channel used for promotion.
    integration:
    - Incident, Eval independence, Reward hacking, Collection random holdout, and Gate policy consume findings.
    validation:
    - G48, G84–G86 inject sybil, shared-judge, prompt, reward, and protected-eval attacks.
    dependencies:
    - FDBK-002
    - FDBK-004
    - INC-002
    - EVDRV-007
    gold_examples:
    - G48
    - G84
    - G85
    - G86
  - id: FDBK-010
    title: Build feedback gold examples and end-to-end provenance tests
    goal: Prove feedback works for language, code, RL, world models, multi-agent systems, and physical AI.
    implementation:
    - Implement authenticated user preference/correction, test/build feedback, environment transition/success, model judge,
      human review, safety/operator report, and peer-agent critique examples.
    - Include delayed attribution, disagreement, correction, deletion, poisoning, protected payload, and source drift.
    - Create views for evaluation, reward, and training and assert different membership/authority.
    - Trace one feedback event through operational incident and separately through approved data/reward pipelines.
    - Verify no event changes live model/route/state without owning service proposal/commit.
    anti_drift:
    - Do not use only scalar ratings.
    - Do not conflate mock reviewer output with human evidence.
    - Do not claim alignment improvement from collection alone.
    integration:
    - Gold runner integrates Collection/Reward/Eval/Improvement examples.
    validation:
    - G37, G40–G48, G56, G58, G70, and G73 pass provenance and boundary assertions.
    dependencies:
    - FDBK-001
    - FDBK-009
    - FND-005
    gold_examples:
    - G37
    - G40
    - G41
    - G42
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G56
    - G58
    - G70
    - G73
  completion_gate:
  - Feedback is immutable, targeted, sourced, classified, and independently attributed; it is not truth, reward, approval,
    or model update by itself.
  - Human, environment, automated, model, and peer sources retain distinct reliability and independence evidence.
  - Every operational/eval/reward/training use is separately authorized and lineage-recorded.
- id: splendor.reward-derivation-service
  name: Reward Derivation Service
  plane: data_learning
  current_status: partial foundation
  current_baseline: '`Reward` is currently a scalar value with optional units/context and timestamp. There is no reward definition
    identity/version, vector/constraint signals, derivation lineage from feedback/evals/outcomes, credit assignment, normalization,
    learned reward model separation, reward-hacking controls, or immutable training-view publication.'
  owner_package: crates/splendor-learning (reward module)
  kernel_boundary: Own immutable, versioned transformations from accepted feedback/evaluation/outcome/world evidence into
    reward or objective signals and reward views. It executes no training, grants no authority, and cannot decide deployment;
    reward algorithms remain user-space plugins/models under governed workloads.
  public_contracts:
  - RewardDefinition
  - RewardSignal
  - RewardTarget
  - RewardDerivation
  - CreditAssignment
  - RewardView
  - ObjectiveVector
  - RewardAuditReport
  tasks:
  - id: REWD-001
    title: Define RewardDefinition, RewardSignal, targets, and lifecycle
    goal: Make reward an explicit derived object whose meaning and source can be audited across learning algorithms.
    implementation:
    - Define reward definition ID/version with objective dimensions, units/range/direction, source input schemas, target granularity,
      transform/plugin/model refs, normalization/clipping, missingness, temporal discount/aggregation, and allowed uses.
    - Define signal identity, target step/action/trajectory/model output/data record/agent revision, vector values, constraints/violations,
      source evidence refs, derivation run, confidence/uncertainty, and recorded/valid times.
    - Support scalar, vector, lexicographic, constrained, sparse/dense, categorical, preference, cost, and custom typed signals.
    - Implement accepted, provisional, disputed, superseded, invalidated, and deleted-payload states.
    - Map legacy scalar Reward as a versioned legacy definition with limited provenance.
    anti_drift:
    - Do not make one scalar mandatory.
    - Do not let units-free numbers from different definitions be compared.
    - Do not let a signal grant action/change authority.
    integration:
    - Feedback/Eval/World/Outcome evidence feed derivations; Training/RL consume pinned reward views.
    validation:
    - G48 and G58 round-trip scalar/vector/constrained/delayed signals and reject definition confusion.
    dependencies:
    - FND-001
    - FDBK-001
    - EVID-001
    gold_examples:
    - G48
    - G58
  - id: REWD-002
    title: Implement pure, versioned reward derivation workloads
    goal: Run application-defined reward functions under reproducible inputs without hiding logic in the loop engine.
    implementation:
    - Define derivation plans with exact FeedbackView/EvalReport/outcome/world refs, definition/plugin/code/environment/model,
      seed, target mapping, and output schema.
    - Execute rules/formulas/programs/models through sandbox/model/evaluator drivers as non-effectful workloads.
    - Publish input-to-output lineage, counts, errors/abstentions, distribution summaries, and determinism class.
    - Prevent plugin/model from accessing protected inputs outside handles or writing live state/deployment.
    - Create a new reward signal/view revision whenever logic or inputs change.
    anti_drift:
    - Do not compute reward inside arbitrary action adapter without a definition.
    - Do not overwrite historical rewards after formula changes.
    - Do not let a reward model approve its own output as trusted.
    integration:
    - Workload/Sandbox/Model execute; Artifact/Lineage publish; Data-Use controls input/output.
    validation:
    - G48 and G58 reproduce derivations and detect changed code/input/model.
    - Malicious plugin cannot call deployment or read protected eval labels.
    dependencies:
    - REWD-001
    - WORK-001
    - SBX-004
    - LIN-002
    gold_examples:
    - G48
    - G58
    - G85
  - id: REWD-003
    title: Implement multi-objective, constraints, costs, and value-profile mapping
    goal: Represent useful learning pressure without collapsing safety, user value, capability, cost, and uncertainty into
      an opaque sum.
    implementation:
    - Allow named objective dimensions and hard constraint/violation channels linked to Agent Value/Constraint profiles.
    - Represent scalarization/weights/lexicographic/Pareto policy as a separate versioned consumer artifact, not inherent
      truth in raw signals.
    - Track environment/user/task performance, safety violations, policy compliance, uncertainty/abstention, resource/cost,
      latency, and diversity/coverage dimensions as applicable.
    - Require explicit units, clipping, normalization reference population, and handling of missing/unsafe episodes.
    - Expose per-slice/objective distributions for eval/gates and protect non-negotiable hard constraints from reward tradeoff.
    anti_drift:
    - Do not allow positive task reward to cancel a hard safety violation automatically.
    - Do not hide value choices in normalization constants.
    - Do not claim a universal objective vector for all agents.
    integration:
    - Agent Value profile binds definitions; Gate Engine handles hard constraints; Improvement selects user-space optimization
      objectives.
    validation:
    - G27, G48, G58, G78, and G79 test Pareto tradeoffs and immutable hard constraints.
    dependencies:
    - REWD-001
    - AGREG-003
    - GATE-004
    gold_examples:
    - G27
    - G48
    - G58
    - G78
    - G79
  - id: REWD-004
    title: Implement delayed credit assignment and trajectory attribution hooks
    goal: Support RL and long-horizon agents while keeping attribution method explicit and replaceable.
    implementation:
    - Define a CreditAssignment artifact mapping episode/feedback/eval evidence to action/step/state/option/agent targets
      with weights, uncertainty, horizon, and method.
    - Provide plugin contracts for return/discount, temporal difference, advantage-like, causal/influence, rule-based, counterfactual,
      hierarchical, multi-agent, and custom assignments.
    - Require pinned trajectories/world/state/model/policy refs and prevent plugin from changing recorded actions/outcomes.
    - Allow competing assignments and downstream experiments rather than rewriting raw signal.
    - Handle terminal truncation, missing outcomes, off-policy data, and unresolved uncertain effects explicitly.
    anti_drift:
    - Do not attribute all delayed reward to the final action by default.
    - Do not claim causal assignment from correlation without method limitations.
    - Do not erase negative/unsafe steps during trajectory filtering.
    integration:
    - Feedback attribution provides candidates; Replay/World may generate counterfactuals; RL trainer consumes pinned assignment.
    validation:
    - G58 includes known toy MDP/multi-agent cases and ambiguous real-like trajectories; exact and uncertain assignments behave
      correctly.
    dependencies:
    - REWD-002
    - FDBK-003
    - WORLD-007
    gold_examples:
    - G58
    - G77
  - id: REWD-005
    title: Implement reward normalization, calibration, aggregation, and immutable views
    goal: Prepare stable learning inputs while retaining raw signals and preventing distribution drift from changing meaning
      silently.
    implementation:
    - Define RewardView membership and transforms by target/slice/time/source/status/definition, clipping, normalization population,
      weighting, and aggregation.
    - Compute statistics from pinned reference population and publish them as artifacts with sample count/uncertainty.
    - Support per-task/source/agent normalization and leave-one-group-out/robust methods as plugins.
    - Preserve raw signals and mapping; consumers pin one view revision and cannot follow latest during a run.
    - Detect distribution/source/scale drift and require new view/eval rather than updating constants in place.
    anti_drift:
    - Do not normalize safety violations into harmless small values.
    - Do not mix reward definitions/units without explicit mapping.
    - Do not compute statistics using protected eval data unless allowed.
    integration:
    - Training/Improvement consumes views; Eval/Observability monitors drift; Artifact/Lineage publish.
    validation:
    - G48 and G58 reproduce view membership and detect source/scale drift without changing active run.
    dependencies:
    - REWD-001
    - FDBK-007
    - LIN-002
    gold_examples:
    - G48
    - G58
  - id: REWD-006
    title: Implement learned reward/value model bindings and independence
    goal: Use learned preference/value models as replaceable model components rather than authoritative reward or gate services.
    implementation:
    - Represent reward/value models as ModelBundles with exact training data, eval/calibration, input/output schema, target
      reward definition, and deployment role.
    - Invoke through Model Driver; convert scores into provisional RewardSignals only via a named derivation definition.
    - Record candidate/reward-model shared base/training data/context and require independent channels for high-risk gates.
    - Support ensemble/disagreement/abstention and calibration artifacts.
    - Train/update reward models through normal Training/Eval/Change pipelines, never in-place from live signals.
    anti_drift:
    - Do not treat reward model output as ground truth.
    - Do not let the same candidate model self-score secretly.
    - Do not hot-update reward model weights inside derivation service.
    integration:
    - Model/Training/Eval/Agent Value profiles bind; Gate enforces independence.
    validation:
    - G44, G48, G56, and G86 expose shared-model reward hacking and require independent holdout/human checks.
    dependencies:
    - REWD-002
    - MODEL-001
    - EVDRV-007
    gold_examples:
    - G44
    - G48
    - G56
    - G86
  - id: REWD-007
    title: Implement reward hacking, proxy drift, and tamper monitoring
    goal: Detect when optimized reward diverges from independent value/performance evidence.
    implementation:
    - Compare reward trends against independent eval/human/programmatic/environment measures, constraint violations, slice/tail
      behavior, and unoptimized random holdouts.
    - Detect sudden score distribution changes, evaluator/reward model exploitation, feedback-channel manipulation, target
      leakage, repeated edge cases, and reward-source tampering.
    - Track reward versus true/independent objective gap where a trusted proxy exists and record uncertainty where it does
      not.
    - Trigger quarantine, evaluation expansion, improvement pause, or incident under explicit policy; do not automatically
      edit reward weights.
    - Require every self-evolution experiment to include anti-reward-hacking evidence appropriate to its optimization channel.
    anti_drift:
    - Do not let the optimizing agent define the sole hacking detector.
    - Do not call disagreement proof of hacking without investigation.
    - Do not optimize the detector and evaluator on the same exposed cases indefinitely.
    integration:
    - Eval/Feedback/Incident/Gate/Improvement consume findings.
    validation:
    - G48, G84–G86 produce rising reward with stagnant/regressing independent quality and must block promotion.
    dependencies:
    - REWD-003
    - EVAL-010
    - FDBK-009
    - INC-002
    gold_examples:
    - G48
    - G84
    - G85
    - G86
  - id: REWD-008
    title: Implement reward access, privacy, and protected-signal handling
    goal: Prevent reward/labels/eval outcomes from leaking into candidate inputs or unauthorized training channels.
    implementation:
    - Classify raw feedback, labels, protected eval outcomes, reward model internals, and aggregate signals separately.
    - Issue task-specific reward views/handles to trainers/learners; candidates receive only environment signals permitted
      by the learning protocol.
    - Prevent protected test reward/labels from entering model prompts, replay buffers, logs, caches, or collection snapshots.
    - Apply deletion/withdrawal/invalidated-source impact to reward views and dependent candidates.
    - Expose redacted aggregate reward evidence to operators while retaining sealed detail.
    anti_drift:
    - Do not pass protected eval labels as dense training reward.
    - Do not expose reviewer identity/free-form private feedback in generic RL buffers.
    - Do not make possession of reward ID grant payload access.
    integration:
    - Data-Use/Artifact/Node/Sandbox enforce; Training consumes scoped views; Lineage tracks.
    validation:
    - G40, G43, G58, G84, and G86 attempt label/reward leakage and verify denial/impact.
    dependencies:
    - REWD-005
    - DUC-006
    - NODE-004
    gold_examples:
    - G40
    - G43
    - G58
    - G84
    - G86
  - id: REWD-009
    title: Build reward/RL gold examples and invariance tests
    goal: Prove reward interoperability across supervised preferences, environment RL, coding, world models, multi-agent,
      and value constraints.
    implementation:
    - Implement toy MDP and continuous-control/simulation reward derivations with known returns and delayed credit.
    - Implement code agent reward from independent tests, review, regression, cost, and safety dimensions.
    - Implement language preference/reward-model signals with human holdout and reward-hacking case.
    - Implement multi-agent shared/individual rewards and contribution/credit ambiguity.
    - Run deletion, definition change, normalization drift, source poisoning, and protected-label tests; publish complete
      derivation lineage.
    anti_drift:
    - Do not claim toy RL demonstrates general alignment.
    - Do not use reward alone as the novelty success criterion.
    - Do not hide negative/safety dimensions in aggregate plots.
    integration:
    - Training/Eval/Improvement gold programs consume the same RewardSignal/View contracts.
    validation:
    - G47, G48, G56, G58, G77, and G86 pass exact and adversarial cases.
    dependencies:
    - REWD-001
    - REWD-008
    - FND-005
    gold_examples:
    - G47
    - G48
    - G56
    - G58
    - G77
    - G86
  completion_gate:
  - Reward is a versioned, lineage-complete derivation from evidence, not raw feedback, truth, approval, or authority.
  - Multiple objectives, hard constraints, credit assignment, learned reward models, and normalization remain explicit and
    replaceable.
  - Independent evaluation and anti-hacking evidence can block optimization even when reward rises.
- id: splendor.eval-controller
  name: Evaluation Controller
  plane: data_learning
  current_status: missing
  current_baseline: There is no first-class EvalSuite, EvalPlan, EvalRun, protected split service, candidate/baseline matched
    execution, distributed aggregation, regression/safety/value evidence, contamination monitoring, online/shadow evaluation,
    or continuous evaluation scheduler. Current OutcomeEvaluator is per-action and cannot serve these responsibilities.
  owner_package: crates/splendor-learning (eval module)
  kernel_boundary: Own evaluation definitions, immutable case/split bindings, matched candidate/baseline plans, evaluator
    independence, distributed execution/completeness, statistical analysis, reports, continuous scheduling, and evidence publication.
    It measures and compares; it does not train, derive reward implicitly, set deployment authority, or reveal protected cases.
  public_contracts:
  - EvalSuite
  - EvalSuiteRevision
  - EvalPlan
  - EvalRun
  - EvalCaseManifest
  - EvalSplit
  - MetricDefinition
  - AnalysisPlan
  - EvalReport
  - RegressionFinding
  tasks:
  - id: EVAL-001
    title: Define EvalSuite, EvalPlan, EvalRun, and lifecycle
    goal: Make evaluation a reproducible kernel-controlled workload rather than a callback after an action.
    implementation:
    - Define immutable suite revision with purpose, case manifests/splits, environment/world/simulator refs, evaluator operations,
      metric definitions, slices, analysis plan, baseline policy, protected disclosure, resources, and validity/expiry.
    - Define run binding exact candidate(s), baseline(s), model/agent/route/deployment refs, code/env/drivers, cases, seeds,
      repetitions, budgets, and output policy.
    - Implement proposed, validating, admitted, running, aggregating, analysing, complete, incomplete, failed, denied, invalidated,
      and quarantined states.
    - Separate suite, split, plan, run, shard, case/episode, metric sample, report, and gate decision identities.
    - Require pre-registered analysis/stopping rules for promotion-critical adaptive/stochastic evals.
    anti_drift:
    - Do not let a candidate choose its own cases after seeing results.
    - Do not make evaluator process success equal eval validity.
    - Do not put gate threshold/decision inside raw suite measurements.
    integration:
    - Evaluator Driver executes cases; Workload/Fleet schedule; Evidence/Artifact/Lineage publish.
    validation:
    - G39–G49 exercise lifecycle, incomplete/invalid cases, and identity separation.
    dependencies:
    - FND-001
    - EVDRV-001
    - WORK-001
    gold_examples:
    - G39
    - G40
    - G41
    - G42
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
  - id: EVAL-002
    title: Implement immutable case manifests, splits, and protected holdouts
    goal: Preserve valid comparison and prevent evaluation data from becoming training or candidate-visible context.
    implementation:
    - Publish case manifests and split membership as immutable artifacts with source/creation/quality/contamination/licence/classification
      lineage.
    - Support public development, validation, private test, protected one-time/fresh, canary, adversarial, safety, and online
      shadow splits as explicit roles.
    - Issue opaque protected handles and isolate evaluator/candidate/trainer caches/principals/environments.
    - Version suite/split when cases or labels/rubrics change and invalidate affected prior claims according to policy.
    - Track candidate exposure and adaptive-use count for reusable benchmarks.
    anti_drift:
    - Do not use file paths/directories as split authority.
    - Do not make validation and protected test the same repeatedly optimized set.
    - Do not reveal protected labels through reports/errors/timing/caches.
    integration:
    - Data-Use/Artifact/Evaluator/Incident enforce; Training plans exclude eval split refs.
    validation:
    - G40, G43, G51, G84, and G86 prove isolation, exposure accounting, and contamination invalidation.
    dependencies:
    - EVAL-001
    - DODRV-007
    - EVDRV-003
    - DUC-006
    gold_examples:
    - G40
    - G43
    - G51
    - G84
    - G86
  - id: EVAL-003
    title: Implement paired candidate/baseline execution plans
    goal: Attribute behavioral differences to the candidate/change rather than unmatched inputs, environments, or randomness.
    implementation:
    - Build matched plans pinning case/episode identity, environment/world branch, seeds/random streams, model sampling, resource
      class, driver versions, and route/state initialization.
    - Support paired sequential, parallel shadow, replay/simulation, and live canary comparisons with declared interference/order
      controls.
    - Randomize/blind candidate labels for human/learned judges where appropriate.
    - Record unavoidable asymmetries and choose paired/unpaired analysis explicitly.
    - Prevent baseline mutable alias or live state drift during plan.
    anti_drift:
    - Do not compare candidate and baseline on different cases/seeds silently.
    - Do not call a replay-only comparison proof of live external behavior.
    - Do not let one variant affect the other’s shared world/state unless experimental design requires it.
    integration:
    - Replay/World/Agent/Deployment create isolated branches/shadows; Evaluator runs.
    validation:
    - G42, G45, and G46 reproduce paired differences and expose deliberately unmatched confounders.
    dependencies:
    - EVAL-001
    - RPLY-004
    - WORLD-007
    gold_examples:
    - G42
    - G45
    - G46
  - id: EVAL-004
    title: Implement distributed evaluation, case accounting, and aggregation
    goal: Evaluate at fleet scale while preserving exact case membership, retry deduplication, and completeness.
    implementation:
    - Expand EvalPlan into immutable case/episode work units and reducers using Evaluator Driver declarations.
    - Schedule by data locality, modality/hardware/environment requirements, protected isolation, and live capacity reservations.
    - Accept one current result per case/repetition/variant; quarantine late/stale duplicates and preserve failed/aborted/invalid
      cases.
    - Aggregate only when required completeness/minimum sample policy is met; expose missingness/failure by slice.
    - Checkpoint/resume long runs and permit incremental reports marked non-final.
    anti_drift:
    - Do not drop slow/failed cases to improve scores.
    - Do not aggregate by completion order.
    - Do not run protected cases on untrusted or incompatible nodes.
    integration:
    - Workload/Fleet/Node/Evaluator execute; Evidence assembles; Gate requires final/valid status.
    validation:
    - G42, G61, G68, and G83 test retries, stragglers, node loss, protected placement, and compromised worker results.
    dependencies:
    - EVAL-001
    - EVDRV-004
    - FLEET-008
    gold_examples:
    - G42
    - G61
    - G68
    - G83
  - id: EVAL-005
    title: Implement metric validation, slices, uncertainty, and analysis plans
    goal: Produce statistically and semantically valid reports rather than one aggregate score.
    implementation:
    - Validate metric schema/units/direction/range/missingness and evaluator version before accepting samples.
    - Compute per-case, aggregate, per-slice, tail/worst-group, distribution, calibration, resource/SLO, and safety/constraint
      findings according to predeclared analysis.
    - Use paired differences, intervals/effect sizes, multiple-comparison metadata, power/insufficient-evidence, and sequential
      stopping where specified.
    - Record slice definitions and membership derivation; protect sensitive slices and avoid tiny-group disclosure.
    - Publish raw-access-controlled samples plus redacted aggregate report.
    anti_drift:
    - Do not hide regressions behind a global average.
    - Do not report statistical significance without effect magnitude/assumptions.
    - Do not change slice definitions after seeing candidate results without a new exploratory report.
    integration:
    - Evaluator helpers compute; Evidence stores; Gate consumes named findings.
    validation:
    - G39, G42, G46, G47, and G57 validate deterministic/statistical/slice/calibration/safety reports.
    dependencies:
    - EVAL-001
    - EVDRV-002
    - EVDRV-005
    gold_examples:
    - G39
    - G42
    - G46
    - G47
    - G57
  - id: EVAL-006
    title: Implement capability, regression, safety, value, robustness, and resource eval classes
    goal: Evaluate complete agent changes across more than task accuracy or loss.
    implementation:
    - Define suite composition roles for task/capability, generalization, regression, hard constraints/safety, value/preference,
      robustness/adversarial, uncertainty/calibration, long-horizon stability, physical safety, privacy/data, cost/latency/resource,
      and interoperability.
    - Bind named critical slices and non-regression budgets to Agent Value/Constraint and Deployment target policies.
    - Support agent-level trajectories and subsystem-level model/route/world/data tests; prevent subsystem pass from substituting
      for end-to-end evidence.
    - Include abstention/uncertainty and denial correctness, not only successful action outcomes.
    - Version benchmark scope and residual known gaps.
    anti_drift:
    - Do not call perplexity or task score alignment.
    - Do not infer physical safety from simulation alone.
    - Do not require one universal metric set across domains.
    integration:
    - AgentSpec/Value profile references suites; Gate policy maps required evidence; Improvement uses results.
    validation:
    - G39–G49, G57–G59, G73, G77, and G78 cover the classes with explicit gaps.
    dependencies:
    - EVAL-005
    - AGREG-003
    gold_examples:
    - G39
    - G40
    - G41
    - G42
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
    - G57
    - G58
    - G59
    - G73
    - G77
    - G78
  - id: EVAL-007
    title: Implement contamination, memorization, overfitting, and adaptive-eval checks
    goal: Detect when apparent improvement comes from exposure or repeated optimization rather than generalization.
    implementation:
    - Run exact/near/semantic/code/media overlap scans between all candidate training/feedback/synthetic data and suite fingerprints
      through protected interfaces.
    - Track suite exposure count, candidate/query history, evaluator feedback returned, and adaptive optimization budget.
    - Include fresh/rotating/one-time cases, perturbations, distribution-shift sets, train-like controls, and memorization
      probes where appropriate.
    - Compare validation, public, protected, fresh, and live shadow performance for widening gaps and slice-specific overfit.
    - Invalidate or downgrade claims when contamination/exposure exceeds policy; preserve the result as evidence rather than
      deleting it.
    anti_drift:
    - Do not claim decontaminated from exact matching alone.
    - Do not repeatedly expose detailed protected failures to the improvement loop.
    - Do not call every high train/test gap memorization without analysis.
    integration:
    - Data Operator contamination, Collection/Lineage data refs, Incident leakage, Gate validity policy integrate.
    validation:
    - G33, G43, G51, G56, and G86 introduce exact/paraphrase/generated/adaptive contamination and require correct block/downgrade.
    dependencies:
    - EVAL-002
    - DODRV-005
    - LIN-003
    gold_examples:
    - G33
    - G43
    - G51
    - G56
    - G86
  - id: EVAL-008
    title: Implement online, shadow, canary, and post-deployment evaluation
    goal: Measure real operating behavior safely and feed controlled rollback/improvement without turning live traffic into
      unrestricted training data.
    implementation:
    - Define shadow evaluation with duplicated/minimized inputs, no effect/live state commits, exact candidate/baseline revision,
      and latency/resource isolation.
    - Define canary/post-deployment observations with exposure allocation, user/traffic/device slices, guardrail metrics,
      incident linkage, and rollback thresholds.
    - Use privacy-preserving/aggregated online metrics and explicit collection plans for any retained records.
    - Separate product/runtime telemetry from evaluation samples and reward/training eligibility.
    - Support delayed outcomes and evaluation windows; update reports immutably as windows close.
    anti_drift:
    - Do not let shadow agent actuate.
    - Do not train directly on all canary traffic without collection/data-use plan.
    - Do not let candidate route choose which live outcomes are evaluated.
    integration:
    - Deployment creates exposure; Agent/Route shadow; Feedback/Collection capture; Incident/Deployment rollback.
    validation:
    - G45, G46, G49, G70, G73, and G75 validate shadow/canary delayed outcomes, privacy, physical boundaries, and rollback.
    dependencies:
    - EVAL-003
    - DEP-003
    - DEP-004
    - COLL-001
    gold_examples:
    - G45
    - G46
    - G49
    - G70
    - G73
    - G75
  - id: EVAL-009
    title: Implement human, multi-agent, world-model, and physical eval orchestration
    goal: Coordinate complex evaluation protocols whose environment/evaluators are agents, people, simulators, or devices.
    implementation:
    - Create role-isolated workload graphs for candidate agents, environment/simulator, adversary/peer agents, learned/human
      evaluators, and local safety monitors.
    - Bind exact world state/simulation/device/test envelope and keep evaluator/delegation authority isolated.
    - Support human queue deadlines/blinding/adjudication and physical simulation-before-live/staged envelope policy.
    - Capture trajectories, interventions, safety aborts, operator burden, transfer/calibration evidence, and multi-agent
      externalities.
    - Mark unexecuted unsafe/unsupported live tests and residual uncertainty honestly.
    anti_drift:
    - Do not give evaluator/adversary agents production capabilities.
    - Do not treat no accident in a small physical test as proof of safety.
    - Do not force human reviewers to expose protected context to candidate.
    integration:
    - Evaluator Driver profiles, Agent Instance, World/Actuator, HIL, Workload graph coordinate.
    validation:
    - G41, G57–G59, G73, and G77 execute role isolation, safety abort, and human/multi-agent cases.
    dependencies:
    - EVAL-001
    - EVDRV-006
    - EVDRV-007
    - AGREG-005
    gold_examples:
    - G41
    - G57
    - G58
    - G59
    - G73
    - G77
  - id: EVAL-010
    title: Implement evaluator independence and reward-hacking analysis
    goal: Prevent self-evolution from optimizing a single shared or gameable evaluator.
    implementation:
    - 'Compute independence attributes for candidate and evaluator: shared base model, code, training/feedback data, prompt/context,
      provider, author/team, environment, and optimized exposure.'
    - Require a configured mix of programmatic, human, environment, holdout model, and fresh data channels by change risk;
      allow exceptions only with explicit residual-risk decision.
    - Compare optimized proxy/reward metrics with independent measures and detect divergence across cycles.
    - Blind/randomize variants and include adversarial attempts to influence judge/reviewer/eval tools.
    - Publish an independence/reward-hacking report consumed by Gate Engine.
    anti_drift:
    - Do not call two prompts to the same shared model independent.
    - Do not let the candidate write/modify its evaluator or tests in the same uncontrolled change.
    - Do not treat evaluator agreement as value truth without source/coverage analysis.
    integration:
    - Reward/Feedback/Lineage provide dependency graph; Gate enforces; Incident handles tampering.
    validation:
    - G44, G48, G76, G84–G86 block candidates that improve only shared/gameable evaluators.
    dependencies:
    - EVAL-006
    - REWD-007
    - LIN-003
    gold_examples:
    - G44
    - G48
    - G76
    - G84
    - G85
    - G86
  - id: EVAL-011
    title: Publish EvalReport, regression findings, and gate-ready evidence
    goal: Produce immutable, complete, access-controlled evidence without embedding the final promotion decision.
    implementation:
    - Assemble exact suite/plan/run, candidates/baselines, case completeness, metric/slice analysis, uncertainty, contamination/exposure,
      independence, resource/environment, failures, and known limitations.
    - Emit typed regression/improvement/constraint/safety/insufficient-evidence findings with supporting sample/report refs.
    - Sign/integrity-bind report to evaluator versions, case manifests, outputs, analysis code, and event range.
    - Provide redacted summaries and protected detailed views; report missing/inaccessible evidence explicitly.
    - Invalidate/supersede report on compromised evaluator/data/worker or discovered contamination rather than editing it.
    anti_drift:
    - Do not include a mutable “approved=true” field.
    - Do not omit failed cases or negative slices.
    - Do not let report signature imply scientific validity or deployment safety alone.
    integration:
    - Evidence/Lineage store; Gate/Improvement/Change/Deployment consume.
    validation:
    - G39, G42, G45–G49, G83, and G86 validate completeness, redaction, invalidation, and no embedded gate.
    dependencies:
    - EVAL-004
    - EVAL-005
    - EVAL-007
    - EVAL-010
    - EVID-003
    gold_examples:
    - G39
    - G42
    - G45
    - G46
    - G47
    - G48
    - G49
    - G83
    - G86
  - id: EVAL-012
    title: Implement continuous evaluation scheduling and drift response
    goal: Reassess live agents/models/routes/world/data as environments and evidence change over time.
    implementation:
    - Define continuous eval policies by schedule/event/change/deployment/data drift/incident/model age and minimum cadence.
    - Pin each run to current deployed revision and suite revision; preserve trends across comparable versions with compatibility
      markers.
    - Detect performance/value/safety/calibration/resource/data drift and trigger review, rollback proposal, data collection,
      or improvement proposal according to policy.
    - Use rate/budget controls, rotating samples, and holdout preservation to avoid exhausting protected suites.
    - Pause/adjust continuous eval when data/use/evaluator validity expires and expose coverage gaps.
    anti_drift:
    - Do not automatically retrain or relax gates on drift.
    - Do not repeatedly optimize against the same exposed continuous cases.
    - Do not hide missing eval coverage during outages.
    integration:
    - Workload recurrence executes; Deployment/Incident/Collection/Improvement receive proposals; Observability supplies triggers.
    validation:
    - G49, G59, G70, G75, and G88 run repeated drift/eval cycles with bounded load and correct proposals.
    dependencies:
    - EVAL-001
    - WORK-007
    - OBS-005
    gold_examples:
    - G49
    - G59
    - G70
    - G75
    - G88
  completion_gate:
  - Evaluation cases, splits, candidates, baselines, environments, randomness, metrics, and analysis are pinned before execution.
  - Reports expose completeness, slices, uncertainty, contamination, independence, and limitations; gates remain separate.
  - Protected, distributed, live, human, multi-agent, world, and physical evaluation retain explicit isolation and validity.
- id: splendor.training-controller
  name: Training Controller
  plane: data_learning
  current_status: missing
  current_baseline: No end-to-end training control exists. Work orders, placement v0, state/trace, and fleet identity are
    foundations only. Missing are TrainingSpec/Run, arbitrary-project inspection and honest compatibility, immutable environment/data/checkpoint
    plans, parallel topology selection, rendezvous/group epochs, global batch/data semantics, distributed checkpoint/recovery,
    live-service reservations, sweeps, continual/RL workflows, candidate-only publication, and 1,000-device scale.
  owner_package: crates/splendor-learning (training module); PyTorch/framework algorithms stay in trainer adapters and user
    code
  kernel_boundary: 'Own the framework-neutral flow control of a training process: exact inputs/objective/config, project compatibility,
    task/worker-group plan, data assignment, resource/topology request, progress/checkpoint/retry semantics, candidate outputs,
    and isolation. It orchestrates compute but never implements the optimizer/loss/model algorithm, chooses promotion, or
    activates weights.'
  public_contracts:
  - TrainingSpec
  - TrainingRun
  - TrainingStage
  - ProjectCompatibility
  - DataPlan
  - ParallelPlan
  - BatchSemantics
  - CheckpointPolicy
  - TrainingReport
  - CandidateBundle
  tasks:
  - id: TRAIN-001
    title: Define TrainingSpec, TrainingRun, stage graph, and lifecycle
    goal: Make all training and adjustment methods governed workloads with immutable inputs and explicit outputs.
    implementation:
    - Define training identity/owner/purpose, project/code/environment refs, trainer/framework profile, initial model/checkpoint,
      dataset/reward/feedback/world refs, algorithm/config artifacts, data plan, parallel plan, resources, checkpoint/retry,
      eval hooks, output candidate declarations, and evidence policy.
    - Implement draft, inspecting, invalid, validated, admitted, queued, preparing, running, checkpointing, paused, resuming,
      finalizing, succeeded, failed, cancelled, denied, expired, and quarantined states.
    - Support stages data prepare, environment build, train/fit/update, checkpoint convert, intermediate eval, select, package
      candidate as explicit task graph.
    - Separate training run, stage, task, worker group/epoch, attempt, checkpoint, trial, and candidate identities.
    - Support supervised/self-supervised/RL/preference/distillation/continual/world-model/custom profiles as non-authorizing
      typed extensions.
    anti_drift:
    - Do not put optimizer/loss equations in core.
    - Do not let a trainer worker mutate the TrainingSpec or final state.
    - Do not call a successful training process a promoted model.
    integration:
    - Workload/Trainer realize; Artifact/Lineage store; Eval/Improvement consume.
    validation:
    - G50–G59 and G60–G69 exercise lifecycle and profiles.
    dependencies:
    - FND-001
    - WORK-001
    - TRDRV-001
    gold_examples:
    - G50
    - G51
    - G52
    - G53
    - G54
    - G55
    - G56
    - G57
    - G58
    - G59
    - G60
    - G61
    - G62
    - G63
    - G64
    - G65
    - G66
    - G67
    - G68
    - G69
  - id: TRAIN-002
    title: Implement arbitrary project intake and static/dynamic inspection
    goal: Turn a source repository/bundle into an exact compatibility and risk report before distributed execution.
    implementation:
    - Accept immutable source revision/archive, environment declaration, entrypoint(s), config schema, expected outputs, licences,
      build policy, and optional Splendor project manifest.
    - Inspect dependencies/framework versions, imports/native extensions, global/process state, filesystem/network/subprocess
      use, distributed initialization, device assumptions, data loading, checkpoint calls, argument/env interface, and test
      commands.
    - Run a sandboxed dry-run/smoke probe on tiny synthetic data where authorized to discover runtime behavior without protected
      data or effects.
    - Detect existing torchrun/DDP/FSDP/framework support and structured hooks; generate actionable blockers/required user
      changes.
    - Pin inspector version and classify findings as observed/static/declared/unknown.
    anti_drift:
    - Do not execute untrusted setup/import on the control plane.
    - Do not promise static analysis fully understands dynamic Python.
    - Do not modify the project automatically to make it compatible.
    integration:
    - Sandbox builds/probes; Trainer Driver owns framework inspection plugin; Artifact/Lineage pin results.
    validation:
    - G60 includes conventional, custom loop, dynamic, side-effectful, unsupported extension, and already-distributed PyTorch
      projects with correct reports.
    dependencies:
    - TRAIN-001
    - TRDRV-002
    - SBX-004
    gold_examples:
    - G60
  - id: TRAIN-003
    title: Implement and enforce T0–T3 project compatibility tiers
    goal: Provide a precise support ladder from arbitrary opaque code to deeply integrated distributed training.
    implementation:
    - 'T0 opaque: one training worker/process; Splendor controls environment/resources/data mounts/checkpoints only if externally
      declared; parallelism limited to independent trials/stages.'
    - 'T1 distributed-aware: launch project under conformant framework runner/torchrun; project owns distributed model/data/checkpoint
      semantics and declares them in compatibility contract.'
    - 'T2 structured: require model/optimizer/data/step/state/checkpoint factories/hooks; permit automatic supported DDP/FSDP
      wrappers and controlled data assignment.'
    - 'T3 explicit parallel plugin: require project-supplied validated mesh/partition/group/checkpoint semantics for tensor/pipeline/expert/custom
      modes.'
    - Record per-guarantee support (elasticity, exact resume, topology change, sample semantics, mixed hardware, checkpoint,
      intermediate eval) rather than one tier badge alone.
    - Fail or downgrade planning explicitly when requested guarantees exceed report; never silently run a different training
      semantics.
    anti_drift:
    - Do not call multiple T0 trials distributed training of one model.
    - Do not auto-wrap arbitrary projects with unproven optimizer/data semantics.
    - Do not make T2/T3 mandatory for all useful training.
    integration:
    - Trainer Driver implements tiers; Workload modes host; SDK documents required hooks.
    validation:
    - G60–G64 request supported and unsupported combinations and compare advertised versus actual guarantees.
    dependencies:
    - TRAIN-002
    - TRDRV-002
    gold_examples:
    - G60
    - G61
    - G62
    - G63
    - G64
  - id: TRAIN-004
    title: Implement reproducible build and runtime environment planning
    goal: Convert project source into exact runnable environment variants across fleet nodes before reserving expensive training
      groups.
    implementation:
    - Resolve/build locked Python or OCI environment artifacts per target architecture/accelerator/runtime using isolated
      build workloads.
    - Validate framework/compiler/accelerator/collective/runtime versions and custom extension compatibility against candidate
      nodes.
    - Run import/model-construction/tiny-step/checkpoint smoke tests for each selected compatibility profile.
    - Publish environment/build provenance, SBOM, tests, platform variants, and cache keys; pin exact refs in TrainingPlan.
    - Separate build/network secrets from training runtime and disallow runtime package mutation.
    anti_drift:
    - Do not reserve a large fleet before proving the environment starts on each target class.
    - Do not use mutable base images/index packages.
    - Do not assume one binary wheel works across all accelerator stacks.
    integration:
    - Sandbox Executor builds; Artifact/Lineage store; Fleet filters nodes; Trainer validates.
    validation:
    - G52, G60–G62, and G83 test multi-platform build, cache, incompatibility, and compromised dependency.
    dependencies:
    - TRAIN-002
    - SBX-011
    - FLEET-004
    gold_examples:
    - G52
    - G60
    - G61
    - G62
    - G83
  - id: TRAIN-005
    title: Implement immutable data, feedback, reward, and split plan admission
    goal: Freeze exactly what learning may consume and prevent eval/protected/unauthorized data leakage.
    implementation:
    - Require dataset snapshot/split refs, schema, quality/contamination reports, data-use purpose/grants, sampling/order/curriculum,
      feedback/reward view refs, replay buffer/stream semantics, and exclusion/protected fingerprints.
    - Validate licences/consent/retention/locality, train/eval split separation, data/model processor compatibility, coverage/quality
      minima, contamination policy, and revoked/deleted source impact.
    - Generate a `DataPlan` with logical sample population, shard manifests, global assignment policy, expected volume, cursor/checkpoint
      semantics, and allowed transformations/augmentations.
    - Pin all refs for the run; online/streaming additions require an explicitly versioned rolling plan/window and evidence.
    - Prevent trainer workers from discovering arbitrary filesystem/source data outside issued assignments.
    anti_drift:
    - Do not train from a mutable directory/query/latest dataset.
    - Do not treat feedback/reward IDs as payload authority.
    - Do not permit protected eval cases or labels in the training plan.
    integration:
    - Collection/Data/Feedback/Reward/Data-Use/Eval services validate; Node mounts assignments.
    validation:
    - G33–G37, G40, G43, G51, G52, G56, and G58 validate clean/denied/streaming/contamination/deletion cases.
    dependencies:
    - TRAIN-001
    - COLL-009
    - DODRV-007
    - FDBK-007
    - REWD-005
    - EVAL-002
    gold_examples:
    - G33
    - G34
    - G35
    - G36
    - G37
    - G40
    - G43
    - G51
    - G52
    - G56
    - G58
  - id: TRAIN-006
    title: Implement framework-neutral parallel and topology planning
    goal: Select a real supported execution strategy from project, model, data, and fleet facts rather than a generic device
      count.
    implementation:
    - Build candidate plans for single worker, independent trials, data parallel, sharded data parallel, tensor parallel,
      pipeline parallel, hybrid meshes, actor/learner/evaluator pools, or custom plugin.
    - Validate trainer/project tier, model size/structure, optimizer/checkpoint support, global batch target, data locality,
      device memory/dtype, collective backend, network topology, min/max group, and live reservations.
    - Choose by explicit user policy/objective (correctness first, then time/cost/energy/utilization preferences) and publish
      alternatives/rejection reasons.
    - Create canonical worker roles/groups/mesh and bind identical plan digest to every worker lease.
    - Use heterogeneous devices through complementary roles/independent jobs; synchronous groups remain compatibility-valid
      unless an explicit plugin supports heterogeneity.
    anti_drift:
    - Do not set `distributed=true` and infer everything else.
    - Do not select tensor/pipeline partition boundaries without project/plugin contract.
    - Do not maximize device use at the cost of invalid collective or live SLO.
    integration:
    - Trainer validates modes; Fleet Scheduler realizes topology; Workload graph carries roles.
    validation:
    - G61–G64 compare one/many/topology/heterogeneous plans and reject inconsistent unsupported meshes.
    dependencies:
    - TRAIN-003
    - TRDRV-004
    - FLEET-004
    - FLEET-008
    gold_examples:
    - G61
    - G62
    - G63
    - G64
  - id: TRAIN-007
    title: Implement worker-group, rendezvous, launch, and epoch orchestration
    goal: Coordinate distributed workers through failure and membership changes without depending on stable ranks.
    implementation:
    - Request gang/elastic reservations for roles/groups, then create worker group epoch with logical slots, rank mapping,
      rendezvous, topology, environment, data assignments, checkpoint, and seed derivation.
    - Launch via Trainer/Node and wait for readiness/collective initialization with group deadline; fail/restart whole synchronous
      group on partial failure unless profile says otherwise.
    - Track heartbeats/progress/errors by attempt/slot and fence old epochs before restart.
    - Regenerate rank/world size and assignments on each epoch; preserve logical progress/checkpoint semantics.
    - Coordinate multiple groups for actor/learner/evaluator or pipeline services with explicit channels and backpressure.
    anti_drift:
    - Do not use rank as durable identity.
    - Do not start training steps before all required roles are ready.
    - Do not leave surviving collective ranks alive after group epoch failure.
    integration:
    - Fleet/Workload/Node/Trainer own respective layers; Event/Evidence record.
    validation:
    - G63/G64 kill workers/nodes at startup/midstep/checkpoint and verify fencing/recovery.
    dependencies:
    - TRAIN-006
    - FLEET-003
    - FLEET-006
    - TRDRV-003
    gold_examples:
    - G63
    - G64
  - id: TRAIN-008
    title: Implement global batch, optimizer-step, sample, and data-cursor semantics
    goal: Preserve learning meaning across gradient accumulation, group-size changes, retries, and streaming data.
    implementation:
    - 'Define `BatchSemantics`: per-device microbatch, accumulation steps, data-parallel degree, effective global batch, loss
      reduction/weighting, drop/pad policy, optimizer step count, token/sample units, and schedule scaling policy.'
    - Bind data assignment/generation/cursor and seed derivation to group epoch/logical slot, not rank alone.
    - 'Require explicit policy on world-size change: preserve global batch by adjusting microbatch/accumulation, preserve
      per-device batch and change optimizer semantics, restart stage, or reject elasticity.'
    - Track consumed/committed sample ranges, duplicated/skipped bounds after failure, and exact optimizer/checkpoint progress.
    - For iterable/online data, require project/source cursor capabilities and report weaker semantics honestly.
    anti_drift:
    - Do not let world-size changes silently alter global batch/learning-rate schedule.
    - Do not assume an epoch is a stable unit for streams.
    - Do not report samples seen from per-rank counters without dedup semantics.
    integration:
    - Trainer DataAssignment implements; Reward/RL may use trajectory cursors; Checkpoint captures.
    validation:
    - G52 and G64 assert reference equivalence or declared divergence across 1/2/N workers and membership changes.
    dependencies:
    - TRAIN-005
    - TRAIN-007
    - TRDRV-006
    gold_examples:
    - G52
    - G64
  - id: TRAIN-009
    title: Implement checkpoint schedule, completeness, restore, and topology resharding control
    goal: Bound lost work and make resume a verified plan transition, not “load newest file.”
    implementation:
    - Select checkpoint triggers by steps/time/tokens/cost/preemption/quality/safe point and retention based on workload risk/lost-work
      budget.
    - Coordinate trainer checkpoint protocol, collect all required shards/components, commit root manifest/lineage, validate
      read-back, and only then mark durable/current.
    - Select restore checkpoint by accepted current run lineage/completeness/compatibility rather than timestamp; quarantine
      stale/corrupt outputs.
    - For supported adapters, plan load-time resharding/topology change and run a validation step/eval before continuing;
      otherwise require same topology or new run.
    - Track checkpoint overhead and adapt schedule within approved bounds without changing learning semantics silently.
    anti_drift:
    - Do not accept partially uploaded rank files.
    - Do not resume optimizer/model/data from inconsistent points.
    - Do not assume framework state compatibility across version changes.
    integration:
    - Trainer/Node/Artifact/Lineage implement; Workload handles pause/preempt; Eval can validate.
    validation:
    - G52, G63, G64, and G69 fault every save/load stage and prove only complete compatible resume.
    dependencies:
    - TRAIN-007
    - TRAIN-008
    - TRDRV-007
    - ART-002
    gold_examples:
    - G52
    - G63
    - G64
    - G69
  - id: TRAIN-010
    title: Implement failure classification, retry, preemption, straggler, and recovery policy
    goal: Recover infrastructure failures while surfacing algorithm/data failures and avoiding restart loops.
    implementation:
    - Classify environment/build, data, user code, numerical divergence/NaN, OOM, accelerator/collective/network, worker/node,
      checkpoint, quota/preemption, cancellation, and control-plane failures.
    - Map each class to no retry, same-plan retry, adjusted resource retry, checkpoint resume/new epoch, quarantine node/driver/data,
      or intervention; changes to hyperparameters/algorithm require new plan/run revision.
    - Detect stragglers via progress/collective evidence and permit wait, rebalance independent tasks, checkpoint/restart
      group, or investigate; never drop one synchronous rank’s contribution silently.
    - Bound retries/lost work/cost and use failure-domain backoff/quarantine.
    - Preserve partial artifacts/logs/checkpoints and root-cause evidence.
    anti_drift:
    - Do not auto-reduce batch size/precision after OOM and call it same run without declared policy.
    - Do not retry deterministic user-code error indefinitely.
    - Do not ignore data corruption/poison as generic worker failure.
    integration:
    - Workload/Fleet/Node error taxonomy; Incident; Improvement may propose a new experiment.
    validation:
    - G63, G65, G69, G83, and G88 inject every failure class and verify exact action/budget.
    dependencies:
    - TRAIN-001
    - FND-004
    - FLEET-007
    - INC-002
    gold_examples:
    - G63
    - G65
    - G69
    - G83
    - G88
  - id: TRAIN-011
    title: Implement live-inference and physical-service coexistence controls
    goal: Use spare fleet/device compute for training without harming live agents, model services, or local safety.
    implementation:
    - Request only residual/preemptible resources on nodes with protected services unless dedicated capacity is allocated.
    - Declare training phase interference profile including model load, compilation, data transfer, checkpoint, collective,
      memory, bandwidth, and thermal peaks.
    - Consume Node/Fleet SLO/reservation feedback and checkpoint/throttle/preempt/replan independent stages before live thresholds
      breach.
    - Support device opt-in windows, battery/power/thermal/network constraints, and immediate local reclaim for physical safety.
    - Measure training progress and live SLO impact together and include interference evidence in reports.
    anti_drift:
    - Do not run background training on an actuator device because utilization appears low.
    - Do not let checkpoint/upload saturate live network/storage.
    - Do not lower live safety/inference priority to meet training deadline.
    integration:
    - Fleet/Node enforce; Model/Agent/Observability expose protected SLO; Workload checkpoints.
    validation:
    - G68 and G74 run mixed loads at 1,000-device simulation and physical edge, asserting SLO and bounded training progress.
    dependencies:
    - TRAIN-006
    - FLEET-005
    - NODE-006
    - OBS-004
    gold_examples:
    - G68
    - G74
  - id: TRAIN-012
    title: Implement trials, sweeps, population, and independent experiment fan-out
    goal: Use arbitrary devices for independent training/eval searches without confusing them with one distributed model run.
    implementation:
    - Define trial identity and immutable parameter/config proposal within an experiment, with shared source/data/base model
      and independent seeds/resources.
    - Expand grid/random/Bayesian/evolutionary/population/custom search proposals from user-space plugin into bounded trial
      Workloads after validation.
    - Schedule independent trials heterogeneously where compatible, early-stop only under predeclared analysis, and preserve
      all results/failures.
    - Evaluate candidates on pinned validation and select through Improvement policy; protected test remains separate.
    - Track search budget/exposure/adaptive overfit and publish trial lineage/Pareto report.
    anti_drift:
    - Do not call a sweep one distributed training run.
    - Do not select on protected test repeatedly.
    - Do not let search plugin increase trial/resource budget or hide failed trials.
    integration:
    - Improvement defines search; Fleet uses devices; Eval compares; Gate protects holdout.
    validation:
    - G55, G56, G61, and G67 run sweeps/population across heterogeneous devices with fairness and exposure accounting.
    dependencies:
    - TRAIN-001
    - WORK-003
    - FLEET-008
    - EVAL-007
    gold_examples:
    - G55
    - G56
    - G61
    - G67
  - id: TRAIN-013
    title: Implement continual, online, parameter-efficient, RL, and world-model training flows
    goal: Support evolving agents through explicit staged protocols rather than one batch supervised assumption.
    implementation:
    - Represent parameter-efficient adaptation, continual replay/rehearsal, online windows, reward/preference learning, RL
      actor-learner, world-model fit, distillation, and custom updates as stage/profile graphs.
    - Pin baseline/candidate, data/reward window, replay/anchor data, update scope, optimizer state, cadence, stop criteria,
      and catastrophic-forgetting/non-regression eval requirements.
    - For actor-learner, separate rollout actors, environment/world/simulator, learner, reward derivation, evaluator, and
      candidate checkpoints with bounded staleness/channels.
    - Keep live deployed model immutable; online data/update produces candidate checkpoints evaluated/gated before deployment.
    - Support partial component changes (adapter, reward model, world model, route policy) with exact bundle lineage.
    anti_drift:
    - Do not update live weights in-place from user feedback.
    - Do not let rollout actors/evaluator share unrestricted authority or protected labels.
    - Do not call continual learning safe without forgetting/contamination/feedback-loop checks.
    integration:
    - Collection/Feedback/Reward/World/Eval/Improvement coordinate; Trainer algorithms remain plugins.
    validation:
    - G55–G59 and G70 perform PEFT, preference, continual, world model, RL, and complete agent changes with candidate-only
      outputs.
    dependencies:
    - TRAIN-005
    - REWD-005
    - WORLD-006
    - EVAL-006
    gold_examples:
    - G55
    - G56
    - G57
    - G58
    - G59
    - G70
  - id: TRAIN-014
    title: Implement candidate bundle validation and candidate-only publication
    goal: Produce interoperable model/agent component candidates while structurally preventing training from activating them.
    implementation:
    - Validate required model/adapter/processor/config/checkpoint/environment/training-report components and exact producer/input
      lineage.
    - Run load/inference/schema/checkpoint smoke tests in isolated workload and verify no artifact mutation.
    - Publish `CandidateBundle` with intended component role, compatibility, known limitations, training metrics, data/reward
      refs, and required eval suites.
    - Set status candidate/invalid/quarantined only; no deployment alias, policy cache, AgentSpec desired pointer, or live
      instance changes are permitted from Training Controller.
    - Notify Eval/Improvement through an event/proposal after durable publication.
    anti_drift:
    - Do not equate lowest training loss with selected candidate.
    - Do not permit trainer code to write deployment registry.
    - Do not hide missing data/eval lineage inside metadata.
    integration:
    - Trainer finalizes; Artifact/Lineage publish; Eval evaluates; Change/Deployment later activate.
    validation:
    - G50–G59 and G83 assert candidate-only status and block forged/missing-lineage outputs.
    dependencies:
    - TRAIN-001
    - TRDRV-008
    - MODEL-001
    - LIN-005
    gold_examples:
    - G50
    - G51
    - G52
    - G53
    - G54
    - G55
    - G56
    - G57
    - G58
    - G59
    - G83
  - id: TRAIN-015
    title: Implement framework plugin and non-PyTorch orchestration boundary
    goal: Keep flow control reusable for future architectures/frameworks while giving PyTorch a deep first implementation.
    implementation:
    - Define controller-to-trainer plugin interface for compatibility report, task/group proposal, data/checkpoint semantics,
      progress, failure policy capabilities, and candidate packaging.
    - Make framework-specific parallel/checkpoint/rendezvous details opaque versioned artifacts validated by plugin/driver.
    - Support generic OCI/executable single or multi-role workloads and observed external training with honest reduced guarantees.
    - Add a custom numerical/non-PyTorch gold trainer demonstrating core schemas contain no PyTorch-only fields.
    - Version plugin compatibility and require conformance per advertised mode.
    anti_drift:
    - Do not put `state_dict`, CUDA, NCCL, or torchrun fields in foundational WorkloadSpec.
    - Do not imply framework independence without a working non-PyTorch fixture.
    - Do not duplicate Training Controller per framework.
    integration:
    - Trainer Driver plugins and Sandbox/Workload realize; Driver Registry manages.
    validation:
    - G06 and G54 run generic executable/custom trainer and compare guarantees.
    dependencies:
    - TRAIN-003
    - TRDRV-009
    - WORK-008
    gold_examples:
    - G06
    - G54
  - id: TRAIN-016
    title: Implement training security, data isolation, and evaluator separation
    goal: Prevent arbitrary training code from exfiltrating data, forging evidence, reading protected evals, or activating
      outputs.
    implementation:
    - Run training workers in sandbox profiles with read-only code/env/data/model inputs, scoped data/reward handles, declared
      network, no deployment/gate/registry write credentials, and output sessions only.
    - Separate trainer, evaluator, protected suite, reward derivation, and deployment principals/services/caches.
    - Reconcile actual mounts/reads/outputs with TrainingPlan and lineage; quarantine undeclared access or omitted inputs.
    - Detect secret/data leakage in logs/checkpoints/output manifests and inspect unsafe serialized objects according to policy.
    - Require trusted controller signatures/fencing for candidate/checkpoint acceptance, not worker claims.
    anti_drift:
    - Do not give training containers control-plane service tokens.
    - Do not mount protected eval labels or live deployment secrets.
    - Do not trust pickled checkpoints blindly in privileged processes.
    integration:
    - Sandbox/Node/Gateway/Data-Use/Artifact/Lineage/Incident enforce.
    validation:
    - G40, G43, G82–G86 attempt exfiltration, forged lineage/result, unsafe checkpoint, reward/eval tampering.
    dependencies:
    - TRAIN-005
    - SBX-007
    - DGW-007
    - LIN-005
    gold_examples:
    - G40
    - G43
    - G82
    - G83
    - G84
    - G85
    - G86
  - id: TRAIN-017
    title: Build PyTorch 1→N equivalence, recovery, and project compatibility gold matrix
    goal: Prove real flexible-fleet control from a PyTorch project rather than only a toy scheduler diagram.
    implementation:
    - Create tiny deterministic Transformer/CNN/custom-loop projects for T0/T1/T2/T3 and a GPT-2-class structured project
      with exact source/environment/data artifacts.
    - Run CPU/GPU where available, 1 process, multi-process one node, multi-node simulated/real CI, DDP, sharded, explicit
      mesh, independent trials, and heterogeneous complementary roles.
    - Compare loss/parameter/update/data-consumption/checkpoint outputs under appropriate exact/numerical/statistical tolerances.
    - Inject startup failure, worker death, node loss, collective timeout, OOM, preemption, membership resize, checkpoint
      corruption, and control-plane failover.
    - Assert no live inference SLO regression beyond policy, no stale output acceptance, complete lineage, and candidate-only
      publication.
    - Publish unsupported combinations and required user changes; never mark skipped hardware cases passed.
    anti_drift:
    - Do not use speedup as the only success criterion.
    - Do not hide lack of hardware/network coverage.
    - Do not call T0 fan-out automatic model distribution.
    integration:
    - Gold runner, fleet simulator, optional hardware CI, Trainer/Model/Eval all integrate.
    validation:
    - G52 and G60–G69 pass the mandatory matrix with truthful unavailable status.
    dependencies:
    - TRAIN-001
    - TRAIN-016
    - TRDRV-010
    - FND-005
    gold_examples:
    - G52
    - G60
    - G61
    - G62
    - G63
    - G64
    - G65
    - G66
    - G67
    - G68
    - G69
  - id: TRAIN-018
    title: Validate 1,000-device mixed training/eval/data orchestration and control-plane scale
    goal: Demonstrate fleet utilization and flow control at the target operating scale without claiming one 1,000-device synchronous
      model job.
    implementation:
    - Simulate or run a 1,000-node inventory with multiple compatible accelerator pools, CPUs, edge devices, inference reservations,
      offline devices, and physical-control nodes.
    - Schedule several fixed/elastic training groups plus independent trials, eval shards, data operators, rollouts, artifact
      transfer, persistent agents, and maintenance.
    - Measure admission/placement latency, queue fairness, group start, checkpoint/recovery, utilization by valid role, data
      locality, control traffic, and live SLOs.
    - Inject correlated node/rack/network failures, heartbeat storms, scheduler/controller failover, artifact backend slowdown,
      and mass preemption.
    - Verify incompatible devices are assigned complementary work or explained idle—not forced into invalid collectives.
    - Publish scale limits and bottlenecks honestly.
    anti_drift:
    - Do not claim 1,000-device training from a scheduler simulation alone.
    - Do not sacrifice correctness/evidence for utilization percentage.
    - Do not omit idle reasons or failed workloads from results.
    integration:
    - Fleet/Workload/Node/Artifact/Observability/Incident integrate; actual hardware scale remains a separately labelled validation
      tier.
    validation:
    - G68 and G88 meet defined simulation/control-plane budgets and preserve live SLO/fencing; hardware evidence is labelled
      by actual node count.
    dependencies:
    - TRAIN-017
    - FLEET-011
    - WORK-010
    - OBS-008
    gold_examples:
    - G68
    - G88
  completion_gate:
  - Training Controller controls exact projects, data, topology, groups, checkpoints, retries, and candidate outputs; algorithms
    remain user code/driver plugins.
  - Arbitrary PyTorch support is tiered and honest, with automatic distribution only where project contracts make semantics
    explicit.
  - No training run can read protected eval data or activate a model/agent revision, and live inference/physical reservations
    remain protected.
- id: splendor.improvement-controller
  name: Improvement and Evolution Controller
  plane: data_learning
  current_status: missing
  current_baseline: There is no component that turns observed gaps into bounded hypotheses/experiments across data, model,
    route, world, reward, evaluator, code, memory, or agent topology. Current governance can approve actions, but no self-improvement
    cycle, experiment registry, candidate portfolio, convergence/stability logic, anti-self-approval separation, or novelty
    evidence exists.
  owner_package: crates/splendor-learning (improvement module); optimization/search algorithms remain user-space plugins
  kernel_boundary: 'Own bounded improvement programs: goals/hypotheses, input evidence, experiment graphs, candidate portfolios,
    optimization budgets, independence requirements, stopping, and proposals to Change Controller. It never edits live components,
    runs algorithms itself, approves its own candidate, or activates deployment.'
  public_contracts:
  - ImprovementGoal
  - ImprovementProgram
  - Hypothesis
  - Experiment
  - CandidateRecord
  - OptimizationBudget
  - ImprovementCycle
  - ConvergenceReport
  - ImprovementProposal
  tasks:
  - id: IMPR-001
    title: Define improvement goals, hypotheses, programs, and lifecycle
    goal: Make agent evolution a falsifiable sequence of governed experiments instead of a recursive “improve yourself” command.
    implementation:
    - Define goal with target agent/component/scope, baseline, desired metrics/objectives, hard constraints/non-regression
      budgets, affected slices/environments, evidence inputs, time/resource/data/human/exposure budgets, and termination criteria.
    - Define hypothesis with proposed mechanism, expected directional effects, risk/failure modes, required experiment/ablations,
      and falsification criteria.
    - Define program/cycle/experiment/candidate identities and states proposed, reviewed, admitted, running, evaluating, selected,
      rejected, inconclusive, paused, terminated, and completed.
    - Support model, adapter, data, reward, route, planner, world model, memory, tool/driver, code, topology, and policy/value
      candidate classes with risk-specific controls.
    - Pin exact baseline/dependencies/eval suites before a cycle.
    anti_drift:
    - Do not accept “become better/aligned” without measurable goal and constraints.
    - Do not let a candidate redefine success mid-cycle.
    - Do not make an experiment state equivalent to deployment state.
    integration:
    - Eval/Feedback/Incident/Observability may propose goals; Training/Data/Sandbox execute experiments; Change receives selected
      proposal.
    validation:
    - G70 and G76 create complete programs with falsifiable hypotheses and rejected/inconclusive paths.
    dependencies:
    - FND-001
    - EVAL-011
    - AGREG-003
    gold_examples:
    - G70
    - G76
  - id: IMPR-002
    title: Implement evidence-triggered opportunity and failure proposal intake
    goal: Turn drift, regressions, feedback, incidents, data gaps, and research ideas into reviewable proposals without automatic
      self-modification.
    implementation:
    - Accept proposals from humans, agents, continuous eval, feedback/collection, incidents, data drift, resource/SLO analysis,
      and external research adapters.
    - Require source evidence refs, affected deployed revision/slices, severity/uncertainty, candidate scope, and requested
      budget.
    - Deduplicate/correlate overlapping proposals and retain conflicting diagnoses/hypotheses.
    - Classify immediate containment versus research/improvement; incidents/kill switches take precedence.
    - Apply authority/risk/budget review before creating a program.
    anti_drift:
    - Do not let low reward alone trigger unrestricted retraining.
    - Do not auto-accept an agent’s explanation of its own failure.
    - Do not use improvement work to bypass incident containment.
    integration:
    - Feedback/Eval/Incident/Observability/Event connect; Authority/Gate admit.
    validation:
    - G48, G49, G59, G70, and G88 generate competing/drift/incident proposals and verify triage.
    dependencies:
    - IMPR-001
    - FDBK-008
    - EVAL-012
    - INC-002
    gold_examples:
    - G48
    - G49
    - G59
    - G70
    - G88
  - id: IMPR-003
    title: Implement experiment DAG construction and kernel validation
    goal: Compose collection, data work, training, evaluation, simulation, coding, and candidate packaging into bounded reproducible
      experiments.
    implementation:
    - Allow user-space optimizer/research plugins to propose a task graph with exact inputs, transforms, trials, training,
      eval, ablations, and outputs.
    - Validate authority/data flow/protected eval separation, resources, cycles/fan-out, candidate classes, evaluator independence,
      and no activation path.
    - Freeze experiment plan/digest; resolve every mutable ref and parameter search domain.
    - Support control/baseline, ablations, repeated seeds, holdouts, and counterfactual branches as first-class experiment
      roles.
    - Execute through Workload/Fleet and preserve all failed/negative/inconclusive results.
    anti_drift:
    - Do not put a generic unrestricted AutoML loop in the kernel.
    - Do not let an optimizer dynamically spawn unbounded trials.
    - Do not let experiment graph access deployment or protected evaluator internals.
    integration:
    - Workload graph realizes; Training/Data/Eval/Replay/Sandbox controllers own stages.
    validation:
    - G55–G59, G70, and G76 execute multi-stage/ablation plans and reject hidden eval/activation edges.
    dependencies:
    - IMPR-001
    - WORK-003
    - TRAIN-001
    - EVAL-001
    gold_examples:
    - G55
    - G56
    - G57
    - G58
    - G59
    - G70
    - G76
  - id: IMPR-004
    title: Implement candidate portfolio, selection, and Pareto evidence
    goal: Select proposals using explicit objectives/constraints and uncertainty without erasing alternatives or failed experiments.
    implementation:
    - Maintain immutable candidate records with producing experiment, component diff, train/data/reward lineage, eval reports,
      risk, cost, and status.
    - 'Apply user-space selection policy over validated gate-ready findings: Pareto, lexicographic, constrained, robust/worst-case,
      Bayesian/custom, with exact policy artifact.'
    - Keep dominated/rejected/inconclusive candidates and rationale; allow human review and alternative selection under policy.
    - Require independent protected/fresh confirmation before final high-risk proposal and account for adaptive search/exposure.
    - Produce an ImprovementProposal to Change Controller; no aliases/instances are modified.
    anti_drift:
    - Do not select solely on training/validation metric.
    - Do not hide safety/tail/resource regressions in a weighted average.
    - Do not let the same optimizer change selection rules after seeing protected results.
    integration:
    - Eval reports and Agent Value profile feed; Gate may prequalify; Change controls mutation.
    validation:
    - G55, G56, G70, and G76 show Pareto tradeoffs, rejected high-score unsafe candidates, and independent confirmation.
    dependencies:
    - IMPR-003
    - EVAL-011
    - REWD-003
    gold_examples:
    - G55
    - G56
    - G70
    - G76
  - id: IMPR-005
    title: Define self-adjustment risk classes and allowed mutation envelopes
    goal: Permit useful autonomy while making increasingly consequential self-change require stronger independent control.
    implementation:
    - Define R0 ephemeral within preapproved runtime bounds (cache, scheduling, context selection); R1 reversible config/route
      parameter; R2 model/adapter/data/reward/world component candidate; R3 code/architecture/tool/agent topology/constraint-adjacent
      change; R4 authority/value-root/kernel/governance/safety-boundary change.
    - For each class define allowed proposers, sandbox/eval/approval requirements, shadow/canary, rollback, evidence retention,
      and maximum autonomous budget.
    - Bind immutable protected roots that no self-proposed program may remove, including gateway, authority separation, protected
      eval, gate, and rollback requirements.
    - Classify combined changes by highest risk/interaction and prohibit splitting a high-risk change into many low-risk changes
      to evade review.
    - Record risk classifier version and allow human escalation upward, not unauthorized downward.
    anti_drift:
    - Do not call prompt changes always low risk.
    - Do not permit self-change to modify its own risk/gate/evaluator policy in the same autonomous chain.
    - Do not imply R4 is impossible; require external governance/research process.
    integration:
    - Change/Gate/Authority enforce; AgentSpec value profile defines roots; Incident can freeze.
    validation:
    - G70, G76, G78, G79, and G80 test risk classification and attempted decomposition/root bypass.
    dependencies:
    - IMPR-001
    - AGREG-003
    - GATE-004
    gold_examples:
    - G70
    - G76
    - G78
    - G79
    - G80
  - id: IMPR-006
    title: Enforce proposer–trainer–evaluator–gate–deployer separation
    goal: Prevent a self-improving agent from becoming its own unchecked judge and operator.
    implementation:
    - Assign distinct service principals/capabilities to proposal, experiment execution, candidate publication, protected
      evaluation, gate decision, approval, and deployment.
    - Compute dependency/independence graph and require non-self-produced evidence channels by risk.
    - Prevent candidate code/routes/models from editing eval suites, reward definitions, gate policies, deployment pointers,
      or evidence stores within the same authority chain.
    - Allow the agent to propose evaluators/tests as candidates, but validate them separately before use for its own promotion.
    - Record all role overlaps/exceptions and require explicit higher-level approval.
    anti_drift:
    - Do not assume separate processes imply independent authority.
    - Do not let a coding agent commit both code and tests/evaluator/gate unnoticed.
    - Do not give the Improvement Controller deployment credentials.
    integration:
    - Authority/Eval/Gate/Change/Deployment principals enforce; Lineage computes shared dependencies.
    validation:
    - G44, G48, G76, G84–G86 attempt self-score/test/evidence/deployment capture and fail.
    dependencies:
    - IMPR-005
    - AUTH-002
    - EVAL-010
    - LIN-003
    gold_examples:
    - G44
    - G48
    - G76
    - G84
    - G85
    - G86
  - id: IMPR-007
    title: Implement multi-cycle convergence, stability, regression, and diversity tracking
    goal: Judge whether repeated evolution is making durable progress rather than chasing one metric or oscillating.
    implementation:
    - Track each cycle’s baseline/candidate, data composition, reward/evaluator versions, train/validation/protected/live
      metrics, slices, constraints, resource cost, uncertainty, and deployment outcomes.
    - 'Define user-space convergence/stability analyses with predeclared windows: improvement slope, variance, plateau, oscillation,
      forgetting, tail loss, calibration, reward–independent gap, and rollback rate.'
    - Maintain anchor/legacy suites and fresh/rotating suites; track regression budget consumption across cumulative changes.
    - Track data/model/output diversity and real-versus-synthetic/ancestry distributions to expose recursive narrowing.
    - Stop/pause or broaden investigation when gains are not robust, constraints degrade, or evidence becomes invalid.
    anti_drift:
    - Do not claim convergence from monotonically decreasing training loss.
    - Do not reset baseline each cycle to hide cumulative regression.
    - Do not optimize the convergence detector on the same exposed suite only.
    integration:
    - Eval/Reward/Data/Deployment/Incident provide evidence; Evidence service materializes longitudinal report.
    validation:
    - G56, G59, G70, and novelty GPT-2 program run multiple cycles with deliberate plateau/regression/reward-hacking cases.
    dependencies:
    - IMPR-004
    - EVAL-007
    - REWD-007
    gold_examples:
    - G56
    - G59
    - G70
    - G86
  - id: IMPR-008
    title: Implement bounded autonomous operation, stop, freeze, and rollback proposal semantics
    goal: Allow self-management to run unattended while preserving hard control and safe termination.
    implementation:
    - Enforce maximum cycles/trials/wall time/compute/data/human/exposure/deployment scope and per-risk autonomous envelope.
    - 'Check stop conditions before spawning work and at stage boundaries: budget, no progress, regression, safety/value violation,
      evidence invalidity, incident, policy revocation, operator freeze, or uncertainty.'
    - Cancel/checkpoint active experiments through Workload Controller and preserve partial/negative evidence.
    - On deployed regression, propose/trigger policy-authorized rollback through Incident/Deployment—not direct pointer mutation.
    - Require new external authorization to resume after high-risk freeze or protected-root violation.
    anti_drift:
    - Do not let the improvement agent increase its own budget or ignore stop.
    - Do not delete failed candidates/experiments to resume cleanly.
    - Do not make rollback depend on the failing candidate’s cooperation.
    integration:
    - Authority/Gate/Incident/Workload/Deployment enforce.
    validation:
    - G70, G75, G78–G80, and G88 stop runaway cycles, preserve evidence, and roll back independently.
    dependencies:
    - IMPR-005
    - WORK-005
    - INC-003
    - DEP-007
    gold_examples:
    - G70
    - G75
    - G78
    - G79
    - G80
    - G88
  - id: IMPR-009
    title: Implement optimizer/research plugin interface without algorithm lock-in
    goal: Support future AutoML, RL, evolutionary search, program synthesis, scientific optimization, and human research workflows
      as user space.
    implementation:
    - Define plugin input as bounded goal, baseline/evidence summaries, allowed candidate schemas/search space, budget, and
      available experiment templates.
    - Define output as hypotheses, experiment/candidate proposals, acquisition/selection suggestions, and stop recommendation—never
      committed changes.
    - Run plugins in sandbox/model/route workloads with no protected eval/deployment/gate access beyond redacted handles.
    - Version plugin/code/model/prompt/data and measure its own proposal quality/cost/bias over time.
    - Provide deterministic simple grid/random and rule-based reference plugins plus agentic research plugin example.
    anti_drift:
    - Do not put a favored optimizer in kernel core.
    - Do not let plugins emit arbitrary WorkloadSpecs without validation.
    - Do not claim agentic hypothesis generation scientific novelty without experimental comparison.
    integration:
    - Workload validates experiment graph; Model/Sandbox executes; Artifact/Lineage publish.
    validation:
    - G55, G56, G70, and G76 run interchangeable plugins and reject budget/protected-eval bypass.
    dependencies:
    - IMPR-003
    - SBX-001
    - MODEL-003
    gold_examples:
    - G55
    - G56
    - G70
    - G76
  - id: IMPR-010
    title: Publish complete improvement, convergence, and novelty evidence bundles
    goal: Make claims about self-evolution inspectable, repeatable, and bounded by actual evidence.
    implementation:
    - Assemble goal/hypothesis, baseline, experiment plans, all candidates/failures, data/reward/evaluator lineage, ablations,
      repeated seeds, protected/fresh/live results, constraints/slices, costs, risk/independence, deployment/rollback outcomes,
      and limitations.
    - Distinguish engineering demonstration, controlled benchmark result, statistical evidence, real-world evidence, and unverified
      hypothesis.
    - Record novelty baseline comparisons and identify which contribution is architecture/interoperability/control versus
      learning algorithm.
    - Require reproducibility graph and executable gold manifest; unavailable hardware/human/physical evidence remains explicitly
      missing.
    - Sign/integrity-bind bundle and invalidate when dependent data/evaluator/worker is compromised.
    anti_drift:
    - Do not claim value alignment from reward improvement alone.
    - Do not claim first-of-kind or scientific novelty without literature/baseline review and independent evidence.
    - Do not omit negative cycles, rollback, or failed ablations.
    integration:
    - Evidence/Lineage/Novelty program consumes; Change/Gate review selected proposal.
    validation:
    - G70/G76 plus novelty programs produce complete bundles and block claim wording when evidence tier is insufficient.
    dependencies:
    - IMPR-004
    - IMPR-007
    - LIN-004
    - EVID-004
    gold_examples:
    - G70
    - G76
    - G83
    - G86
  completion_gate:
  - Improvement is a bounded experiment program producing candidate/change proposals; it never mutates live systems or approves/deploys
    itself.
  - Goals, hypotheses, baselines, ablations, budgets, independent eval, regression, convergence, and stop criteria are explicit.
  - Novelty and alignment claims are evidence-tiered and include negative results, limitations, and anti-reward-hacking checks.
- id: splendor.change-controller
  name: Change Controller
  plane: change_governance
  current_status: Missing; candidate artifacts and governance objects exist separately, but there is no canonical immutable
    change unit or dependency-aware change state machine.
  current_baseline: The repository already has policy bundles, approval objects, work orders, state lineage, governance state,
    circuit breakers, and trace-linked runtime changes. Those are compatibility anchors. What is missing is one object that
    says exactly what revision is proposed, which subjects it changes, which evidence applies, how it can be validated, and
    how it can be rolled back.
  owner_package: crates/splendor-change
  kernel_boundary: Owns the immutable proposal-to-change state machine, normalized diffs, impact classification, dependency
    order, required evidence declarations, validation receipts, and handoff to gates. It does not generate candidates, run
    training/evaluation algorithms, approve itself, mutate activation pointers, or execute side effects.
  public_contracts:
  - ChangeSet
  - ChangeSubject
  - SubjectRevision
  - NormalizedDiff
  - ImpactReport
  - RiskClass
  - ValidationRequirement
  - RollbackContract
  - ChangeStatus
  - ChangeReceipt
  tasks:
  - id: CHG-001
    title: Define the immutable ChangeSet and subject revision grammar
    goal: Make every proposed mutation a content-addressed, reviewable object instead of an implicit pointer update or mutable
      configuration edit.
    implementation:
    - Define `ChangeSet` with `change_id`, proposer principal, tenant/scope, objective/hypothesis reference, ordered `ChangeSubject`s,
      base revisions, candidate revisions, normalized diffs, causal evidence refs, requested risk class, dependencies, incompatibilities,
      required gates, deployment intent, rollback contract, timestamps, expiry, and extensions.
    - Define typed subjects for model, checkpoint, tokenizer/processor, dataset/view/split, policy, route graph, world-model
      component, agent spec, driver, environment image, code bundle, evaluator/reward definition, constraint pack, deployment
      configuration, and schema migration.
    - Require immutable base and candidate artifact references. For structured configuration, store canonical field-level
      diffs; for opaque binaries, store artifact identity plus declared semantic metadata rather than pretending to derive
      a meaningful textual diff.
    - Support atomic multi-subject changes because model/tokenizer/route/policy/evaluator versions often must move together;
      define whether subjects are all-or-nothing or staged by an explicit dependency graph.
    - Bind every ChangeSet to the exact schema versions and compatibility range used to interpret it and derive a deterministic
      content hash.
    anti_drift:
    - Do not use a Git commit as the universal change identity; non-code artifacts and runtime state need first-class subjects.
    - Do not permit in-place edits to a registered subject revision.
    - Do not infer approval or deployment authority from authorship, repository ownership, or artifact possession.
    integration:
    - Artifact/Lineage resolve revisions; Improvement/Training/Data/Eval can propose candidate subjects; Gate consumes ChangeSet;
      Deployment consumes only approved revision.
    validation:
    - Round-trip fixtures cover every subject type, multi-subject atomic changes, base mismatch, missing artifact, duplicate
      subject, incompatible schema, and tampered diff.
    - G70, G71, G72, G76, and G87 create candidate-only changes without activation.
    dependencies:
    - FND-001
    - ART-001
    - LIN-001
    gold_examples:
    - G70
    - G71
    - G72
    - G76
    - G87
  - id: CHG-002
    title: Implement canonical diff adapters and semantic change descriptors
    goal: Give reviewers and gates enough structured information to reason about a change without forcing the kernel to understand
      every model or domain architecture.
    implementation:
    - Define a `DiffAdapter` extension contract that receives two immutable subject descriptors and returns a typed, deterministic,
      non-authorizing semantic delta plus unsupported/unknown fields.
    - Implement core adapters for JSON/YAML configuration, AgentSpec, RouteGraph, policy/constraint bundles, dataset manifests,
      evaluation manifests, environment manifests, driver manifests, and deployment plans.
    - Implement provider adapters in user space for PyTorch state dict summaries, model configuration/parameter topology,
      tokenizer vocabulary/normalization, OCI image SBOM/package changes, and code repository diffs.
    - Represent model weight changes with hashes, tensor schema/statistical summaries, architecture/config deltas, source
      lineage, and checkpoint ancestry; never serialize full weights into a ChangeSet.
    - Mark uninspectable, partially inspectable, and semantically unknown regions explicitly so gates can require stronger
      evidence rather than assuming no change.
    anti_drift:
    - Do not put framework-specific checkpoint parsers in `splendor-change`.
    - Do not claim two opaque artifacts are equivalent because sizes or filenames match.
    - Do not allow semantic diff metadata to carry executable code or authority.
    integration:
    - Driver Registry discovers signed diff adapters; Sandbox runs provider diff tooling; Gate policies may require specific
      adapter/evidence versions by risk.
    validation:
    - Golden diffs are deterministic across machines; malformed adapters are sandboxed and their output treated as evidence,
      not truth.
    - G57, G70, G72, and G84 cover model, route, dataset, and code changes.
    dependencies:
    - CHG-001
    - DRREG-001
    - SBX-003
    gold_examples:
    - G57
    - G70
    - G72
    - G84
  - id: CHG-003
    title: Implement dependency, compatibility, and blast-radius analysis
    goal: Compute what a candidate can affect before evaluation and rollout so coupled changes and hidden consumers are not
      missed.
    implementation:
    - Traverse lineage, active deployment references, agent specs, route graphs, driver compatibility, dataset/evaluator dependencies,
      state schema versions, and physical capability bindings from every changed subject.
    - Emit an `ImpactReport` containing direct and transitive dependents, affected tenants/agents/cohorts/devices, data and
      locality domains, active workload classes, physical authority surfaces, rollback dependencies, and unresolved references.
    - Detect required companion changes such as tokenizer with model, route output schema with actuator input schema, world-state
      schema with state migration, optimizer/checkpoint format with resume plan, or code image with driver API version.
    - Detect incompatible concurrent ChangeSets and establish deterministic serialization, merge, rebase, or rejection behavior.
    - Estimate impact conservatively; any unknown active consumer raises the impact/risk requirement rather than silently
      excluding it.
    anti_drift:
    - Do not equate artifact lineage with runtime reachability; use active references and fleet inventory too.
    - Do not allow a proposer to suppress dependents from the report.
    - Do not turn impact estimation into an ML guess without explicit uncertainty and conservative policy.
    integration:
    - Lineage, Agent Registry, Deployment, Fleet, Driver Registry, Data Use, and World State expose read-only dependency indexes.
    validation:
    - Fixture graphs cover shared models, sub-agents, offline devices, stale inventory, coupled schemas, concurrent changes,
      and cycles.
    - G70, G72, G73, G80, and G88 prove hidden dependents and physical blast radius are found.
    dependencies:
    - CHG-001
    - LIN-003
    - AGREG-006
    - DRREG-005
    gold_examples:
    - G70
    - G72
    - G73
    - G80
    - G88
  - id: CHG-004
    title: Implement deterministic risk classification and anti-splitting rules
    goal: Translate concrete subject/impact facts into a review level without letting self-improving systems lower their own
      controls.
    implementation:
    - Implement policy-driven R0–R4 classification using subject type, authority surface, physical side effects, protected
      roots, data sensitivity, fleet exposure, reversibility, evaluator/reward/gate changes, code execution, and impact report.
    - Classify a multi-subject or dependent sequence at the highest applicable risk plus interaction escalations; retain all
      contributing reason codes.
    - Detect temporal or graph-based split attacks where multiple nominally low-risk changes collectively alter a protected
      evaluator, authority boundary, gate, constraint, route-to-actuator path, or rollback mechanism.
    - Allow authorized governance to escalate risk or add obligations. Lowering an automatically derived class requires a
      distinct, explicit exception object and cannot be proposed/approved by the affected agent.
    - Version the classifier and persist both requested and computed classes so later policy changes do not rewrite historical
      decisions.
    anti_drift:
    - Do not classify prompt, data filter, route, reward, or evaluator changes as intrinsically low risk.
    - Do not let the Improvement Controller supply the final risk class.
    - Do not hide an R4 authority/value-root change inside an image or code bundle.
    integration:
    - Improvement supplies intent; Impact supplies facts; Gate/Authority enforce computed class and exception rules.
    validation:
    - Table-driven and property tests cover every subject/risk interaction and split sequences.
    - G70, G76, G78, G79, G80, G84, and G85 attempt class evasion.
    dependencies:
    - CHG-003
    - IMPR-005
    - AUTH-005
    gold_examples:
    - G70
    - G76
    - G78
    - G79
    - G80
    - G84
    - G85
  - id: CHG-005
    title: Implement ChangeSet lifecycle, optimistic concurrency, and immutable validation receipts
    goal: Make concurrent proposal, validation, supersession, rejection, and approval behavior explicit and recoverable.
    implementation:
    - Define states `draft`, `submitted`, `analyzing`, `awaiting_evidence`, `ready_for_gate`, `gated`, `approved`, `rejected`,
      `expired`, `superseded`, `deployment_requested`, `deployed`, `rolled_back`, and `quarantined` with legal transitions.
    - Require expected base revision and expected active deployment revision when submitting; reject or explicitly rebase
      stale proposals rather than applying them to a different system.
    - Store each analysis/evidence/gate/deployment handoff as an immutable receipt linked to the exact ChangeSet hash and
      policy versions.
    - Support cancellation before deployment, but preserve the object and all negative evidence. Superseding creates a new
      ChangeSet with lineage rather than mutating the old one.
    - Use idempotency keys and reconciliation so retries cannot duplicate gate/deployment requests or create conflicting terminal
      states.
    anti_drift:
    - Do not edit a ChangeSet after evidence begins; issue a successor.
    - Do not allow “approved” to mean “currently deployed.”
    - Do not delete rejected, expired, or rolled-back changes.
    integration:
    - Event Log/State persist lifecycle; Gate and Deployment return signed receipts; Incident can quarantine.
    validation:
    - State-machine model tests and crash injection cover every transition, duplicate command, stale base, concurrent approval,
      expiry, and quarantine.
    - G02, G47, G70, G75, and G87 validate recovery.
    dependencies:
    - CHG-001
    - FND-003
    - EVT-004
    gold_examples:
    - G02
    - G47
    - G70
    - G75
    - G87
  - id: CHG-006
    title: Define validation requirements and evidence binding for each changed subject
    goal: Ensure evidence is planned from the actual change and cannot be substituted with unrelated successful tests.
    implementation:
    - Derive a versioned `ValidationRequirement` set from risk, subjects, impact, tenant policy, physical capability, and
      deployment intent.
    - Requirements name evidence type, evaluator/test manifest identity, minimum trust/freshness, required slices/environments/seeds/devices,
      comparison baseline, thresholds, statistical rule, independence class, and expiration.
    - Bind produced EvidenceBundles to exact candidate/base artifacts, environment, data snapshot, code, worker attestation,
      and requirement ID.
    - Distinguish static validation, sandbox tests, simulation, offline eval, distributed eval, HIL review, shadow/live observation,
      physical certification evidence, and operational rollback drill.
    - Recompute unmet requirements when the ChangeSet, impact, evaluator, policy, or evidence dependency changes.
    anti_drift:
    - Do not accept “CI passed” or one aggregate metric as an untyped validation result.
    - Do not reuse stale evidence after candidate or evaluator dependencies change.
    - Do not let the proposer choose a weaker evaluator than policy requires.
    integration:
    - Eval Controller, Sandbox, Evidence, Gate, Physical Simulation, and Deployment produce typed evidence.
    validation:
    - G43–G49, G60–G70, G76, and G81–G89 cover valid, stale, mismatched, dependent, and missing evidence.
    dependencies:
    - CHG-004
    - EVID-003
    - EVAL-001
    gold_examples:
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
    - G60
    - G61
    - G62
    - G63
    - G64
    - G65
    - G66
    - G67
    - G68
    - G69
    - G70
    - G76
    - G81
    - G82
    - G83
    - G84
    - G85
    - G86
    - G87
    - G88
    - G89
  - id: CHG-007
    title: Define forward, backward, state, and rollback compatibility contracts
    goal: Prevent deployments that cannot coexist with current agents, stored state, checkpoints, routes, devices, or offline
      nodes.
    implementation:
    - 'For each subject type define compatibility claims: reader/writer schema range, state migration, checkpoint load/resume,
      route/message/percept/action schemas, driver API, hardware capability, environment/runtime, and old/new coexistence.'
    - Require executable compatibility probes or declared unsupported status; never infer compatibility solely from semantic
      version strings.
    - Define expand–migrate–contract sequencing for state/data/schema changes and dual-read/dual-write only where explicitly
      justified and bounded.
    - 'Require rollback compatibility: last-known-good must still read state/data produced during canary, or the plan must
      include tested compensation/restore boundaries.'
    - Track offline/edge compatibility windows and prevent central contract removal while enrolled nodes still require it
      unless they are quarantined/decommissioned.
    anti_drift:
    - Do not call destructive data migration reversible because code can be rolled back.
    - Do not require every change to be backward compatible forever; require explicit support window and migration.
    - Do not let an untested checkpoint conversion become the only rollback path.
    integration:
    - State, Artifact, Driver Registry, Agent Registry, Fleet, and Deployment run compatibility probes.
    validation:
    - G15, G57, G66, G73, G75, and G88 test rolling coexistence, offline nodes, checkpoint/state migration, and rollback.
    dependencies:
    - CHG-003
    - STA-006
    - DRREG-005
    gold_examples:
    - G15
    - G57
    - G66
    - G73
    - G75
    - G88
  - id: CHG-008
    title: Implement governed code, environment, driver, and kernel change preparation
    goal: Treat executable changes as first-class candidates with stronger build, provenance, and privilege boundaries.
    implementation:
    - Accept source revision plus reproducible build manifest, dependency lockfiles, toolchain identity, tests, SBOM/provenance,
      signatures, environment image, and declared runtime capabilities.
    - Build in isolated sandbox workloads with no deployment credentials; publish immutable code/image/driver artifacts and
      build evidence.
    - For adapter/driver changes, run driver conformance, capability non-escalation, schema compatibility, fault containment,
      and resource accounting tests.
    - For kernel/core changes, require a separate upgrade path with compatibility suite, migration plan, rollback binary,
      control-plane quorum/HA plan, and external human governance; an agent cannot hot-patch its running kernel.
    - Generate a ChangeSet only after build outputs are immutable and attributable; source-only proposals are not deployable
      revisions.
    anti_drift:
    - Do not run self-generated code in the controller process.
    - Do not trust image tags or mutable package indexes as revision identity.
    - Do not advertise autonomous kernel self-modification as a supported self-evolution path.
    integration:
    - Sandbox Executor builds; Artifact/Lineage attest; Driver Registry validates; Gate requires higher risk evidence.
    validation:
    - G19–G25 and G84–G89 cover shell/Python/OCI/Kubernetes code changes, malicious build output, driver capability escalation,
      and kernel-change rejection without external governance.
    dependencies:
    - CHG-001
    - SBX-004
    - ART-005
    - DRREG-004
    gold_examples:
    - G19
    - G20
    - G21
    - G22
    - G23
    - G24
    - G25
    - G84
    - G85
    - G86
    - G87
    - G88
    - G89
  - id: CHG-009
    title: Implement rollback and compensation contract validation
    goal: Require every deployable change to state what can actually be reversed and what only can be contained or compensated.
    implementation:
    - Define rollback operations for activation-pointer restore, old workload/image restore, route/policy restore, state snapshot
      restore, schema down-migration, data quarantine, message drain, physical safe-state, and external compensation.
    - Classify effects as reversible, restorable with data loss window, compensatable, containable only, or irreversible;
      require operator acknowledgement and stronger gates for the latter classes.
    - Validate that referenced last-known-good artifacts exist, are trusted, remain compatible, and can be scheduled on current
      fleet hardware.
    - 'Require rehearsal evidence at the appropriate level: local, simulation, staging, canary, physical test rig, or documented
      impossible/irreversible handling.'
    - Bind rollback triggers and maximum detection/activation time to DeploymentPlan and incident policy.
    anti_drift:
    - Do not use “rollback” as a label for an untested forward fix.
    - Do not promise undo of a physical, financial, external, privacy, or data-deletion effect that cannot be undone.
    - Do not garbage-collect last-known-good dependencies before rollback expiry.
    integration:
    - Deployment executes rollback; Incident triggers containment; Artifact retention and State snapshots preserve recovery
      material.
    validation:
    - G15, G18, G25, G67, G73, G75, G80, and G88 perform rollback/compensation drills including irreversible-effect classification.
    dependencies:
    - CHG-007
    - ART-007
    - STA-005
    gold_examples:
    - G15
    - G18
    - G25
    - G67
    - G73
    - G75
    - G80
    - G88
  completion_gate:
  - A ChangeSet is immutable, base/candidate exact, multi-subject capable, impact/risk classified, compatibility checked,
    and evidence-bound.
  - No ChangeSet can approve or deploy itself; lifecycle receipts are durable and idempotent.
  - Every deployable change has honest rollback/compensation semantics and tested recovery material.
- id: splendor.gate-engine
  name: Gate Engine
  plane: change_governance
  current_status: Missing as a general evidence-to-promotion engine; current approval verifiers, policy TTL/revocation, constraints,
    and circuit breakers provide valuable enforcement primitives.
  current_baseline: Existing governance and verifier objects should be reused as low-level facts and approval evidence. The
    missing component is a deterministic, separately authorized decision engine that evaluates a ChangeSet against explicit
    evidence, value/safety roots, statistical thresholds, operational obligations, and human approvals without generating
    the candidate.
  owner_package: crates/splendor-change
  kernel_boundary: Owns gate policy evaluation, evidence resolution, independence/freshness checks, hard-root enforcement,
    obligations, exceptions, and immutable GateDecision receipts. It never trains, optimizes, edits candidates, fabricates
    missing evidence, or deploys.
  public_contracts:
  - GatePolicy
  - GateClause
  - EvidenceRequirement
  - ValueRoot
  - ApprovalRequirement
  - ExceptionGrant
  - GateInput
  - GateDecision
  - GateObligation
  - GatePolicyBundle
  tasks:
  - id: GATE-001
    title: Define a typed, deterministic GatePolicy language
    goal: Express promotion requirements precisely enough to evaluate and replay without embedding arbitrary privileged code.
    implementation:
    - Define typed clauses for artifact identity, risk/subject/impact predicates, evidence presence and trust, metric comparisons,
      slices, uncertainty, statistical tests, regression budgets, constraint satisfaction, approvals, compatibility, rollback
      rehearsal, operational SLOs, and deployment scope.
    - Support boolean composition, quantified requirements over slices/cohorts/devices, bounded arithmetic/comparisons, temporal
      freshness, and explicit `unknown` semantics.
    - Separate hard denial, soft advisory, required obligation, escalation, and manual-review outcomes.
    - Version policy bundles and canonicalize evaluation order/output so the same inputs produce the same decision and reason
      graph.
    - Provide a safe extension interface for domain-specific evaluators that emits signed facts; extension code cannot mutate
      gate state or directly return an unexamined “allow.”
    anti_drift:
    - Do not use general Python/JavaScript evaluation in the privileged gate process.
    - Do not make policy text/prompt interpretation authoritative.
    - Do not hide defaults for missing metrics, NaN, empty slices, or unavailable evaluators.
    integration:
    - Authority distributes signed policy bundles; Change supplies risk/requirements; Evidence supplies facts; Deployment
      consumes decision/obligations.
    validation:
    - Parser/typechecker/fuzzer and golden decision tests cover every operator, NaN/unknown/empty input, extension failure,
      and version migration.
    - G43–G49 and G70 validate deterministic decisions.
    dependencies:
    - FND-001
    - AUTH-006
    - CHG-006
    gold_examples:
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
    - G70
  - id: GATE-002
    title: Implement evidence resolution, exact binding, freshness, and trust checks
    goal: Ensure the gate judges the exact candidate with valid evidence rather than accepting plausible but unrelated reports.
    implementation:
    - Resolve each requirement to immutable EvidenceBundle IDs and verify candidate/base, code, environment, dataset/split,
      evaluator, reward, worker, seed, and policy bindings.
    - Verify signatures/integrity, issuer authority, trust class, independence class, completion status, sample/slice coverage,
      timestamps/TTL, and invalidation/revocation state.
    - Reject ambiguous “latest” references and evidence generated before a relevant dependency changed.
    - Detect duplicate evidence aliases and shared underlying samples/runs so replicated references do not count as independent
      evidence.
    - Emit a reason graph showing satisfied, failed, missing, stale, conflicting, dependent, or unverifiable requirements.
    anti_drift:
    - Do not copy metrics from dashboards or logs into gate input without EvidenceBundle identity.
    - Do not count missing/failed/skipped evaluation as a pass.
    - Do not allow a candidate to supply unsigned trust labels.
    integration:
    - Evidence Service and Lineage expose verification APIs; Data Use reports protected-split access; Incident can invalidate.
    validation:
    - G44–G49, G64–G70, G76, and G86 submit mismatched, stale, leaked, duplicated, or compromised evidence and must fail closed.
    dependencies:
    - GATE-001
    - EVID-005
    - LIN-004
    - DUC-006
    gold_examples:
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
    - G64
    - G65
    - G66
    - G67
    - G68
    - G69
    - G70
    - G76
    - G86
  - id: GATE-003
    title: Enforce role independence and correlated-evidence policy
    goal: Prevent a self-improving system from producing, scoring, approving, and deploying the same change under superficially
      different process identities.
    implementation:
    - Evaluate principal, code/model, data, infrastructure, funding/ownership metadata where available, and causal lineage
      overlap between proposer, trainer, evaluator, evidence signer, approver, gate operator, and deployer.
    - Define independence classes such as same-process, same-agent, same-code, same-model-family, same-data, same-team/authority,
      independent automated, human reviewer, and external/certified.
    - Require stronger independent channels as risk increases and surface correlated failures rather than treating multiple
      runs of one evaluator as independent confirmation.
    - Allow transparent exceptions only through separately authorized, expiring `ExceptionGrant`s with bounded scope and explicit
      residual risk.
    - Record why evidence meets or fails independence requirements in the GateDecision.
    anti_drift:
    - Do not infer independence from different run IDs, containers, or prompts alone.
    - Do not require impossible organizational independence for every low-risk change; make it risk-based.
    - Do not allow the affected agent to approve an independence exception.
    integration:
    - Authority Principal graph, Lineage, Evidence, HIL approval adapters, and Change risk feed checks.
    validation:
    - G44, G48, G70, G76, G84–G86 test self-evaluation, shared model/data, colluding principals, and authorized exception.
    dependencies:
    - GATE-002
    - IMPR-006
    - AUTH-002
    gold_examples:
    - G44
    - G48
    - G70
    - G76
    - G84
    - G85
    - G86
  - id: GATE-004
    title: Implement immutable value, safety, authority, privacy, and physical roots
    goal: Make non-negotiable constraints runtime-enforced roots rather than optimization preferences that can be traded for
      reward.
    implementation:
    - Define signed `ValueRoot` objects for prohibited/required outcomes, authority boundaries, protected populations/slices,
      privacy/data-use rules, physical safety envelopes, human control, evidence retention, evaluator protection, and rollback
      availability.
    - Separate universal/system roots, tenant roots, agent mission constraints, domain constraints, and deployment-specific
      roots with explicit precedence and conflict handling.
    - Evaluate roots against static change facts, evaluation evidence, route/world/action schemas, deployment plan, and runtime/physical
      safety evidence.
    - Prohibit a ChangeSet from weakening/removing its own applicable roots, gate policy, evidence independence, gateway,
      incident, or rollback controls in the same authority chain.
    - Support root evolution only through R4 external governance with migration, compatibility, historical audit, and independent
      validation.
    anti_drift:
    - Do not represent values only as a scalar reward.
    - Do not claim universal value alignment from one tenant policy or benchmark.
    - Do not let a soft metric override a hard root.
    integration:
    - Authority distributes roots; Constraint/Route/Gateway enforce runtime aspects; Eval provides behavioral evidence; Change
      classifies modifications.
    validation:
    - G47, G61–G70, G76, G78–G80, and G85 attempt reward/root conflict, protected-slice regression, route bypass, and root
      self-modification.
    dependencies:
    - GATE-001
    - CHG-004
    - AUTH-006
    gold_examples:
    - G47
    - G61
    - G62
    - G63
    - G64
    - G65
    - G66
    - G67
    - G68
    - G69
    - G70
    - G76
    - G78
    - G79
    - G80
    - G85
  - id: GATE-005
    title: Implement statistical, uncertainty, regression, and slice gate clauses
    goal: Make model and agent promotion robust to noise, small samples, cherry-picked aggregates, and hidden regressions.
    implementation:
    - Support predeclared paired/unpaired comparisons, confidence/credible intervals, practical effect thresholds, multiple-comparison
      policy, bootstrap/permutation plugins, and non-inferiority/superiority/equivalence decisions.
    - Treat point estimates without sample counts/distributions/uncertainty as insufficient when policy requires statistical
      evidence.
    - Evaluate global metrics together with mandatory safety/value/domain slices, worst-case/tail bounds, calibration, variance,
      and regression budgets.
    - Support repeated seeds/environments/devices and distinguish deterministic conformance from stochastic performance evidence.
    - Require user-space statistical plugins to publish method/version/assumptions and signed results; the gate verifies declared
      facts and policy, not raw domain algorithms.
    anti_drift:
    - Do not embed one statistical doctrine for every modality/task.
    - Do not let aggregate improvement compensate for a protected hard-slice failure.
    - Do not silently drop NaN, empty, low-power, or failed runs.
    integration:
    - Eval reports distributions/slices; Evidence stores samples/summary; Gate applies declared rule.
    validation:
    - G45–G49, G56–G70, G76, and G83 exercise low power, variance, slice regression, multiple metrics, and repeated seeds.
    dependencies:
    - GATE-002
    - EVAL-007
    gold_examples:
    - G45
    - G46
    - G47
    - G48
    - G49
    - G56
    - G57
    - G58
    - G59
    - G60
    - G61
    - G62
    - G63
    - G64
    - G65
    - G66
    - G67
    - G68
    - G69
    - G70
    - G76
    - G83
  - id: GATE-006
    title: Implement human-in-the-loop approval and intervention requirements
    goal: Integrate humans as scoped evidence/authority participants without turning approval into an unaudited bypass.
    implementation:
    - Define approval requirements by role, competency/certification, separation, quorum, scope, action/change/deployment
      binding, reason, expiry, revocation, and maximum exposure.
    - Create provider-neutral adapter contracts for review UIs, ticket systems, safety boards, domain experts, and emergency
      operators.
    - Present a bounded review packet containing diff, risk/impact, evidence summary, unknowns, conflicts, rollback, deployment
      scope, and machine-readable decision choices.
    - Support approve, deny, request-more-evidence, narrow-scope, add-obligation, and emergency-containment decisions; approval
      never bypasses hard roots or gateway verification.
    - Handle timeout, unavailable reviewer, conflicting decisions, revocation, and stale candidate explicitly.
    anti_drift:
    - Do not treat a chat response or UI button without authenticated binding as approval.
    - Do not overload one approval to cover later candidate revisions.
    - Do not ask humans to inspect unbounded raw traces instead of a defined evidence packet.
    integration:
    - Existing Approval/Governance objects remain compatible; External Governance adapters map provider decisions into canonical
      evidence.
    validation:
    - G12, G43, G47, G70, G75, G80, and G88 test approval binding, quorum, timeout, revocation, and emergency containment.
    dependencies:
    - GATE-001
    - AUTH-004
    - EVID-006
    gold_examples:
    - G12
    - G43
    - G47
    - G70
    - G75
    - G80
    - G88
  - id: GATE-007
    title: Define fail-closed behavior for unknown, conflicting, unavailable, and invalid evidence
    goal: Eliminate optimistic promotion when the system cannot establish required facts.
    implementation:
    - Define four-valued clause outcomes `pass`, `fail`, `unknown`, and `error`, plus policy mapping to deny, intervention,
      wait, retry, or bounded degraded mode.
    - Detect conflicting evidence with shared candidate/metric semantics and require reconciliation policy rather than choosing
      the favorable value.
    - Set bounded retry/deadline/backoff for temporarily unavailable evidence providers and preserve terminal failures.
    - Treat evidence corruption, signature failure, protected split exposure, evaluator compromise, and worker attestation
      failure as invalidation, not ordinary metric failure.
    - Emit actionable reason codes and unmet obligation list without leaking protected payloads.
    anti_drift:
    - Do not coerce unknown to false/zero and then accidentally satisfy a comparison.
    - Do not retry forever while a deployment waits.
    - Do not make degraded mode available for hard safety/value/authority roots unless explicitly designed and bounded.
    integration:
    - Incident handles compromise; Change waits/reconciles; Deployment cannot consume non-pass decision.
    validation:
    - G45–G49, G66, G70, G75, G79, G80, and G86 cover provider loss, conflicting reports, corruption, and hard-root unknown.
    dependencies:
    - GATE-002
    - FND-004
    gold_examples:
    - G45
    - G46
    - G47
    - G48
    - G49
    - G66
    - G70
    - G75
    - G79
    - G80
    - G86
  - id: GATE-008
    title: Implement signed policy distribution, TTL, revocation, cache, and historical replay
    goal: Make gate behavior consistent across control-plane replicas and offline/edge sites while retaining fail-closed update
      semantics.
    implementation:
    - Package GatePolicy, ValueRoots, evaluator trust rules, approval requirements, and exception issuers into signed versioned
      bundles.
    - Validate issuer, audience/tenant/scope, not-before/expiry, revocation epoch, compatibility range, and monotonic anti-rollback
      version.
    - Maintain local verified cache for bounded operation; define what can continue under stale policy by risk and which changes
      must stop.
    - Record exact bundle hashes in every GateDecision and retain historical bundles needed to replay decisions.
    - Propagate emergency revocation/freeze through fleet channels with acknowledgement and quarantine for unreachable nodes.
    anti_drift:
    - Do not fetch policy during historical replay unless explicitly simulating current policy.
    - Do not let offline nodes promote high-risk changes on expired policy.
    - Do not overwrite historical bundles with same version label.
    integration:
    - Reuse PolicyBundle cache/signature/revocation foundations; Fleet/Node Agent distribute and report status.
    validation:
    - G13, G14, G47, G70, G73, G75, and G88 cover stale, rollback, revoked, offline, and historical policy.
    dependencies:
    - GATE-001
    - AUTH-006
    - NODE-005
    gold_examples:
    - G13
    - G14
    - G47
    - G70
    - G73
    - G75
    - G88
  - id: GATE-009
    title: Produce explainable, signed, appealable GateDecision receipts
    goal: Make every promotion denial or approval attributable to exact policy and evidence rather than opaque controller
      behavior.
    implementation:
    - Emit `GateDecision` with decision ID, ChangeSet hash, policy/root versions, evaluated clauses, evidence bindings, reason
      graph, approvals/exceptions, obligations, residual risks, scope, validity, and signature.
    - Provide machine-readable minimal unsatisfied sets and human-readable redacted explanation generated from structured
      reasons, not an unconstrained LLM summary.
    - Support appeal/re-evaluation as a new decision with added/corrected evidence or policy—not mutation of history.
    - Expose inspect and replay APIs that can evaluate recorded inputs without contacting live providers or granting authority.
    - Record policy evaluation resource limits and guard against adversarially large reason/evidence graphs.
    anti_drift:
    - Do not expose protected eval inputs or secrets in explanations.
    - Do not make explanations authoritative beyond the structured decision.
    - Do not erase an earlier denial when an appeal succeeds.
    integration:
    - Evidence stores receipt; Change advances lifecycle; Deployment validates signature/scope/expiry.
    validation:
    - G43–G49, G70, G76, and G86 compare live and replayed decisions and inspect redaction/appeal history.
    dependencies:
    - GATE-007
    - EVID-004
    gold_examples:
    - G43
    - G44
    - G45
    - G46
    - G47
    - G48
    - G49
    - G70
    - G76
    - G86
  - id: GATE-010
    title: Implement adversarial gate and evaluator-gaming conformance tests
    goal: Continuously prove that common self-improvement shortcuts cannot manufacture promotion.
    implementation:
    - Create attacks for metric spoofing, sample dropping, evaluator tampering, protected-set access, stale evidence replay,
      duplicate evidence, principal aliasing, risk splitting, reward/eval co-change, poisoned reviewer packet, policy downgrade,
      reason-graph exhaustion, and deployment-scope widening.
    - Run these against every GatePolicy version and provider extension in CI and before R3/R4 policy activation.
    - Generate synthetic malformed EvidenceBundles and real end-to-end compromised workloads to test both parser and system
      boundaries.
    - Maintain regression corpus from incidents and red-team findings without exposing protected eval answers to candidate
      agents.
    - Publish coverage and unresolved attack assumptions as evidence; passing this suite does not prove universal alignment.
    anti_drift:
    - Do not reduce adversarial validation to schema fuzzing only.
    - Do not let the candidate agent author and exclusively score its own red-team suite.
    - Do not claim absence of reward hacking from a finite test set.
    integration:
    - Incident lessons feed corpus; Eval/Data/Authority/Sandbox provide attack fixtures; Evidence records results.
    validation:
    - G44, G48, G64, G69, G70, G76, G78–G80, and G84–G89 are mandatory negative cases.
    dependencies:
    - GATE-003
    - GATE-004
    - GATE-007
    gold_examples:
    - G44
    - G48
    - G64
    - G69
    - G70
    - G76
    - G78
    - G79
    - G80
    - G84
    - G85
    - G86
    - G87
    - G88
    - G89
  completion_gate:
  - Gate evaluation is deterministic, exact-candidate/evidence bound, fail-closed, independently authorized, and replayable.
  - Hard value/safety/authority/privacy/physical roots cannot be traded against reward or modified in the same autonomous
    chain.
  - Statistical, slice, HIL, exception, and adversarial behavior is explicit; missing evidence never becomes success.
- id: splendor.deployment-controller
  name: Deployment Controller
  plane: change_governance
  current_status: Missing as a general progressive deployment service; current run lifecycle, policy cache, state handoff,
    placement, circuit breakers, and physical offline behavior are foundations only.
  current_baseline: Current Splendor can start/pause/resume local runs, distribute policy foundations, place reference work,
    and mediate actions. It cannot yet activate coordinated model/route/policy/agent/data/world/code revisions across fleets
    with shadow/canary controls and tested rollback.
  owner_package: crates/splendor-change
  kernel_boundary: Owns deployment plans, cohort assignment, activation pointers, rollout state, health observation, stop
    conditions, quarantine, rollback, and last-known-good retention. It never trains/evaluates candidates, weakens gates,
    edits artifacts, or treats irreversible external effects as reversible.
  public_contracts:
  - DeploymentPlan
  - DeploymentTarget
  - DeploymentCohort
  - ActivationSet
  - DeploymentRevision
  - RolloutStep
  - HealthContract
  - StopCondition
  - RollbackExecution
  - DeploymentReceipt
  tasks:
  - id: DEP-001
    title: Define DeploymentPlan and rollout state machine
    goal: Make activation a separately authorized, resumable operation with exact target, cohort, scope, health, and rollback
      semantics.
    implementation:
    - Define `DeploymentPlan` with approved ChangeSet/GateDecision, target environment/fleet/tenant/agent/device selectors,
      exact ActivationSet, rollout strategy, cohorts, concurrency, timing, prerequisites, state migration, health contract,
      stop/rollback conditions, exposure budget, approvals, and expiry.
    - Define states `planned`, `validating`, `ready`, `shadowing`, `canarying`, `progressing`, `paused`, `rolling_back`, `rolled_back`,
      `completed`, `failed`, `cancelled`, and `quarantined` with idempotent transitions.
    - Treat activation as a versioned pointer/set change; store desired and observed revisions separately and retain previous
      known-good.
    - Support model-only, route/policy, complete AgentSpec, driver/image, world-model/state-schema, evaluator/reward service,
      and coordinated multi-subject deployments.
    - Bind every plan to the exact decision scope and reject widened targets, changed candidates, expired approval, or modified
      health criteria.
    anti_drift:
    - Do not equate artifact publication with deployment.
    - Do not let deployment infer “all devices” from an ambiguous selector.
    - Do not mutate an in-flight plan to point to a new candidate.
    integration:
    - Change/Gate authorize; Fleet/Agent/Node reconcile; Event/State persist; Incident can pause/quarantine.
    validation:
    - Model-based state-machine tests cover every transition, retry, cancellation, stale decision, widened scope, and controller
      failover.
    - G67, G70, G73, G75, G80, and G88 exercise rollout lifecycle.
    dependencies:
    - CHG-005
    - GATE-009
    - WORK-006
    gold_examples:
    - G67
    - G70
    - G73
    - G75
    - G80
    - G88
  - id: DEP-002
    title: Implement exact activation sets and atomic coordinated revision switching
    goal: Keep model, tokenizer, route, policy, constraints, code, drivers, world schemas, and agent configuration mutually
      compatible during rollout.
    implementation:
    - Define `ActivationSet` as a content-addressed mapping of logical roles to immutable artifacts/config revisions with
      compatibility assertions.
    - Resolve all aliases before plan approval; nodes receive exact refs and verify signatures/hashes locally.
    - Implement prepare/validate/activate phases and atomic local pointer swap where the target supports it; for distributed
      sets use staged generation numbers and explicit mixed-version compatibility.
    - Prevent partial activation of an all-or-nothing subject group and expose partial/uncertain state for intervention rather
      than claiming success.
    - Retain and pin last-known-good activation set plus required environment, schema, and state migration artifacts through
      rollback window.
    anti_drift:
    - Do not use mutable “latest”, image tags, model registry stages, or branch names at node activation time.
    - Do not assume a distributed multi-node switch is globally atomic.
    - Do not garbage-collect old tokenizer/driver/schema dependencies prematurely.
    integration:
    - Artifact/Lineage validate; Node Agent stages; Agent Instance Controller and Route Runtime switch local generations.
    validation:
    - G15, G57, G67, G70, G73, and G75 test coordinated revisions, mixed versions, partial failure, and exact rollback.
    dependencies:
    - DEP-001
    - CHG-007
    - ART-007
    gold_examples:
    - G15
    - G57
    - G67
    - G70
    - G73
    - G75
  - id: DEP-003
    title: Implement shadow execution with side-effect suppression and comparable evidence
    goal: Observe candidate behavior on realistic inputs before exposure without allowing shadow output to affect the world.
    implementation:
    - Fork eligible percept/message/state references to shadow agent/model/route instances under distinct identities and resource
      budgets.
    - Route every candidate action to simulation/dry-run adapters or deny it at gateway with explicit shadow status; never
      reuse live actuator credentials.
    - Record paired baseline/candidate decisions, latency, resource use, constraints, value/safety indicators, and divergence
      while protecting user/privacy policy.
    - Handle non-determinism with repeated/paired analysis and declare where live state or external outcomes cannot be faithfully
      shadowed.
    - Publish shadow EvidenceBundles bound to candidate and deployment cohort; shadow success can satisfy only policy-declared
      requirements.
    anti_drift:
    - Do not call a request mirror “shadow” if candidate actions can reach side effects.
    - Do not silently double sensitive data use without authorization.
    - Do not infer real physical safety solely from simulation/shadow.
    integration:
    - Route Runtime forks; Gateway enforces no-effect; Data Use authorizes; Eval compares; Fleet reserves inference capacity.
    validation:
    - G60, G67, G70, G73, G80, and G88 prove zero shadow side effects, paired evidence, privacy denial, and realistic divergence
      handling.
    dependencies:
    - DEP-002
    - ROUTE-008
    - ACT-006
    - DUC-003
    gold_examples:
    - G60
    - G67
    - G70
    - G73
    - G80
    - G88
  - id: DEP-004
    title: Implement canary cohorts and exposure accounting
    goal: Bound real-world risk while collecting live evidence from a small, representative, explicitly authorized cohort.
    implementation:
    - Create deterministic/randomized/stratified cohort assignment using stable identity and policy-declared protected strata
      without exposing sensitive labels unnecessarily.
    - Track users/agents/devices/actions/tokens/time/physical missions and irreversible-effect classes as separate exposure
      budgets.
    - Preserve control/baseline assignment and avoid contamination from shared mutable state unless the plan explicitly models
      interference.
    - Support holdout, crossover, paired, device-ring, geography/locality, tenant, and physical test-site canaries through
      pluggable assignment policy.
    - Emit cohort assignment and exposure receipts for every affected run/action and stop before exceeding limits.
    anti_drift:
    - Do not select only easy/healthy devices and claim fleet representativeness.
    - Do not use protected attributes without data-use authorization.
    - Do not widen canary due to retry or controller restart.
    integration:
    - Fleet/Agent route assignments; Gateway counts side effects; Eval analyzes; Data Use controls cohort fields.
    validation:
    - G67, G70, G73, G75, G80, G83, and G88 test stable assignment, stratification, interference, exposure fencing, and restart.
    dependencies:
    - DEP-003
    - FLEET-006
    - DUC-004
    gold_examples:
    - G67
    - G70
    - G73
    - G75
    - G80
    - G83
    - G88
  - id: DEP-005
    title: Implement progressive fleet rollout with health-based pause and promotion
    goal: Expand only when each cohort meets predeclared technical, behavioral, safety, value, and operational conditions.
    implementation:
    - Execute ordered rings/cohorts with maximum concurrency, dwell/sample requirements, health/evidence checkpoints, and
      explicit promotion commands.
    - Reconcile desired/observed node and agent revision, handling disconnected, drained, busy, incompatible, stale-policy,
      and quarantined targets.
    - Reserve live inference and physical control resources before update; schedule downloads/prewarm outside critical windows
      and rate-limit network/storage pressure.
    - Pause automatically on stop conditions or insufficient evidence; require new decision when evidence window expires or
      scope changes.
    - Support rollback by cohort, full plan, or affected compatibility group while retaining traceable mixed-state status.
    anti_drift:
    - Do not make rollout a timer-only percentage loop.
    - Do not evict live inference or physical control to accelerate update.
    - Do not report completion while offline selected nodes remain unknown without explicit policy disposition.
    integration:
    - Fleet Scheduler places update/prewarm workloads; Node Agent reports; Observability/Eval feed health; Incident contains.
    validation:
    - G66, G67, G70, G73, G75, G80, and G88 run 1,000-node rollout with offline nodes, SLO pressure, and cohort regression.
    dependencies:
    - DEP-004
    - FLEET-007
    - NODE-006
    - OBS-005
    gold_examples:
    - G66
    - G67
    - G70
    - G73
    - G75
    - G80
    - G88
  - id: DEP-006
    title: Implement physical/edge deployment safety protocol
    goal: Update robot/drone/edge agents without creating unsafe control gaps or central authority bypass.
    implementation:
    - Require device profile, safety envelope, local verifier version, firmware/driver compatibility, battery/power/network
      state, mission state, safe landing/park state, and local rollback artifact before activation.
    - Separate cloud helper/advisory models from device-local actuator authority; updating a cloud planner cannot grant direct
      actuator capability.
    - Schedule maintenance windows or safe-state transitions and prohibit restart/update while executing a non-interruptible
      physical action unless certified handover exists.
    - Stage artifacts, validate locally, switch generation, run self-tests/simulation where available, and retain autonomous
      safe fallback for disconnection.
    - Use hardware/vendor certification adapters as evidence where required; Splendor does not claim motor/firmware hard-real-time
      certification.
    anti_drift:
    - Do not reboot or replace a controller mid-flight/motion by default.
    - Do not let central rollout disable local emergency stop/safety verifier.
    - Do not claim a software canary proves hardware safety across untested devices.
    integration:
    - Device Profile/Safety Gateway, Node Agent, Fleet, Gate, Incident, and physical adapter integrate.
    validation:
    - G73, G74, G75, G79, G80, and G88 use simulated drone/robot plus hardware-in-loop contract fixtures for disconnect, stale
      policy, unsafe state, and rollback.
    dependencies:
    - DEP-005
    - ACT-007
    - NODE-009
    - GATE-004
    gold_examples:
    - G73
    - G74
    - G75
    - G79
    - G80
    - G88
  - id: DEP-007
    title: Implement rollback, restore, compensation, and post-rollback verification
    goal: Return to a known safe revision quickly and honestly when rollout fails.
    implementation:
    - Trigger from automatic stop condition, incident command, authorized operator, policy revocation, or failed rollout step;
      fence further candidate exposure first.
    - Restore activation set by cohort and reconcile every selected target; account for offline nodes and quarantine those
      that cannot confirm rollback.
    - Execute declared state/schema/data restore or compensation steps in dependency order with idempotent receipts and explicit
      irreversible residual effects.
    - Run post-rollback health, compatibility, state-integrity, and physical-safe-state checks before declaring success.
    - Preserve failed candidate/evidence/incident lineage and prevent automatic re-promotion without a successor ChangeSet
      and new evidence.
    anti_drift:
    - Do not call rollback complete when only control-plane desired state changed.
    - Do not overwrite evidence or state that explains the failure.
    - Do not retry a failed candidate automatically after rollback.
    integration:
    - Incident initiates; Node/Agent/State/Artifact execute; Gate invalidates old approval as policy dictates.
    validation:
    - G15, G18, G67, G70, G73, G75, G80, G87, and G88 inject failure at every rollback stage.
    dependencies:
    - DEP-002
    - CHG-009
    - INC-003
    gold_examples:
    - G15
    - G18
    - G67
    - G70
    - G73
    - G75
    - G80
    - G87
    - G88
  - id: DEP-008
    title: Implement deployment health contracts and multi-source stop conditions
    goal: Use predeclared operational and behavioral evidence to pause/rollback rather than improvised dashboard judgment.
    implementation:
    - Define health clauses for availability, latency, errors, resource saturation, queueing, action denials/failures, constraint/value/safety
      violations, model quality, data drift, reward/eval divergence, physical telemetry, incident count, and evidence completeness.
    - Specify window, baseline/cohort comparison, minimum samples, uncertainty, slice, severity, action (observe/pause/rollback/kill),
      and maximum reaction time.
    - Evaluate authoritative EvidenceBundles/events, not exporter dashboards; tolerate bounded telemetry delay while failing
      closed for critical local physical signals.
    - Handle correlated fleet failures, missing telemetry, and metric schema/version changes explicitly.
    - Record every stop evaluation and action so later analysis can distinguish false alarm, real regression, and controller
      failure.
    anti_drift:
    - Do not optimize solely for system SLOs while ignoring behavior/value/safety.
    - Do not permit a deployed candidate to suppress its own health signal.
    - Do not use one global threshold for every heterogeneous device without declared normalization.
    integration:
    - Observability exports non-authoritative views; Event/Evidence/Eval/Incident provide authoritative inputs.
    validation:
    - G67, G70, G73, G75, G80, G83, and G88 test missing/corrupt telemetry, slice regression, local physical stop, and reaction
      deadlines.
    dependencies:
    - DEP-001
    - EVID-003
    - OBS-001
    - INC-002
    gold_examples:
    - G67
    - G70
    - G73
    - G75
    - G80
    - G83
    - G88
  - id: DEP-009
    title: Implement safe state migration and mixed-version operation
    goal: Support evolving persistent agents and world models without corrupting long-lived state or forcing fleet-wide downtime.
    implementation:
    - Execute declared expand/migrate/contract plans as separate workloads with checkpoints, bounded batches, validation,
      backpressure, and rollback/restore points.
    - Version StateNode/world/message/percept/action schemas and require old/new readers/writers to declare compatibility
      during mixed rollout.
    - Support lazy migration on read only when deterministic, idempotent, resource-bounded, and separately evidenced; otherwise
      use explicit migration workload.
    - Fence writes during non-concurrent-safe migrations or route them through a compatibility layer with auditable transforms.
    - Verify semantic invariants, counts/hashes/slices, and application-specific migration evaluators before contracting old
      schema.
    anti_drift:
    - Do not hide migration inside startup code with unbounded runtime.
    - Do not delete old fields/state before all selected offline nodes and rollback windows are resolved.
    - Do not pretend byte-level success proves semantic state correctness.
    integration:
    - State Service owns commits/snapshots; user-space migration driver transforms; Workload/Fleet run; Eval validates; Change
      sequences.
    validation:
    - G15, G31, G57, G70, G73, and G75 cover agent/world-state migration, concurrent writes, offline nodes, and semantic failure.
    dependencies:
    - DEP-001
    - STA-006
    - CHG-007
    - DODRV-006
    gold_examples:
    - G15
    - G31
    - G57
    - G70
    - G73
    - G75
  - id: DEP-010
    title: Implement offline and intermittently connected deployment policy
    goal: Keep edge agents safe and auditable when central rollout coordination is unavailable.
    implementation:
    - Distribute signed deployment intents, activation sets, policy/root bundles, expiry, prerequisites, rollback, and local
      stop rules to node cache.
    - Require monotonic generation/anti-rollback checks, local hash/signature validation, and device-local safety/authority
      verification.
    - 'Define allowed actions on expiry or loss of central evidence by risk: continue known-good, degrade, stop selected capabilities,
      return safe state, or require operator.'
    - Buffer activation/health/evidence events with integrity and synchronize on reconnect; detect conflicting central/local
      decisions and quarantine uncertainty.
    - Prevent a disconnected node from autonomously promoting a new candidate unless a narrowly scoped preauthorized plan
      explicitly allows it.
    anti_drift:
    - Do not assume wall-clock accuracy on disconnected devices; use signed validity plus monotonic/local policy.
    - Do not silently accept central revision rollback on reconnect.
    - Do not let offline availability override physical safety roots.
    integration:
    - Node Agent policy cache/trace buffer; Gate bundle; Fleet registry; Incident reconcile.
    validation:
    - G13, G14, G73, G75, G79, G80, and G88 test expiry, reconnect, generation conflict, clock skew, and safe fallback.
    dependencies:
    - DEP-006
    - GATE-008
    - NODE-005
    gold_examples:
    - G13
    - G14
    - G73
    - G75
    - G79
    - G80
    - G88
  - id: DEP-011
    title: Harden deployment control plane for production availability and security
    goal: Ensure rollout authority cannot be lost, duplicated, or forged during failover or network partition.
    implementation:
    - Run replicated controllers with leader/lease fencing or equivalent single-writer semantics per deployment scope and
      durable desired state.
    - Authenticate/mTLS all node/control connections, authorize each command, rotate credentials, validate audience, and audit
      operator/service actions.
    - Use idempotent commands and generation fencing so stale controllers cannot activate or roll back after failover.
    - Implement rate limits, admission quotas, queue isolation, backpressure, and disaster recovery for deployment metadata.
    - Exercise backup/restore, controller loss, partial region loss, split brain, clock skew, and compromised credential containment.
    anti_drift:
    - Do not expose the current local insecure daemon as production rollout control.
    - Do not rely on eventual last-write-wins for activation authority.
    - Do not let availability failover bypass policy/gate verification.
    integration:
    - Identity/Authority/Secret Broker/Event/State/Incident provide foundations; daemon becomes API facade.
    validation:
    - G66, G70, G73, G75, G87, and G88 include controller failover, stale leader, credential revocation, and regional outage.
    dependencies:
    - DEP-001
    - AUTH-007
    - SECR-005
    - EVT-007
    gold_examples:
    - G66
    - G70
    - G73
    - G75
    - G87
    - G88
  - id: DEP-012
    title: Publish deployment, rollback, and real-world outcome evidence
    goal: Close the evolution loop with exact proof of what reached which agents/devices and what happened afterward.
    implementation:
    - Produce DeploymentEvidence with selected/actual cohorts, activation receipts, exposure, health evaluations, stop decisions,
      incidents, rollback/compensation, residual mixed state, and final outcome.
    - Link live feedback/evals to deployment revision and cohort while preserving privacy/data-use rules and delayed outcomes.
    - Separate engineering deployment success from behavioral improvement, value-alignment evidence, physical safety evidence,
      and scientific novelty claims.
    - Retain enough node/local receipts to audit offline and partially failed rollouts without central logs being the sole
      truth.
    - Feed outcome evidence back to Improvement Controller only as authorized data/evidence; deployment does not derive reward
      or retrain.
    anti_drift:
    - Do not declare success from desired-state completion only.
    - Do not treat absence of incident reports as evidence of safety.
    - Do not train on live deployment data without collection/data-use/feedback contracts.
    integration:
    - Evidence/Lineage/Feedback/Improvement consume; Incident may invalidate; Observability exports redacted views.
    validation:
    - G67, G70, G73, G75, G80, G83, and G88 produce complete successful and failed deployment bundles.
    dependencies:
    - DEP-005
    - DEP-007
    - EVID-004
    - FDBK-006
    gold_examples:
    - G67
    - G70
    - G73
    - G75
    - G80
    - G83
    - G88
  completion_gate:
  - Only an exact, approved, non-expired ChangeSet/ActivationSet can deploy, and deployment authority is fenced.
  - Shadow, canary, progressive rollout, SLO/value/safety stop, mixed-version handling, physical/offline policy, and honest
    rollback are implemented.
  - Actual exposure and outcomes—not desired state—produce durable deployment evidence and feed controlled improvement.
- id: splendor.incident-controller
  name: Incident Controller
  plane: change_governance
  current_status: 'Partial foundations only: escalation, circuit breakers, interventions, action denials, trace durability
    state, and physical safety outcomes exist, but there is no cross-plane incident lifecycle.'
  current_baseline: The current runtime can fail closed and record intervention/denial conditions. The missing service must
    correlate safety, value, data, evaluation, training, fleet, deployment, security, and physical failures; contain them
    through existing authority/gateway mechanisms; preserve evidence; and coordinate recovery.
  owner_package: crates/splendor-change
  kernel_boundary: Owns incident identity, classification, correlation, containment requests, investigation evidence, recovery
    criteria, closure, and lessons. It does not silently alter models/data/reward, execute unverified actions, or use incident
    payloads for training without declared collection and data-use policy.
  public_contracts:
  - Incident
  - IncidentSignal
  - IncidentClass
  - Severity
  - ContainmentPlan
  - ContainmentAction
  - AffectedScope
  - InvestigationRecord
  - RecoveryPlan
  - IncidentLesson
  tasks:
  - id: INC-001
    title: Define incident taxonomy, identity, severity, and lifecycle
    goal: Give failures across agent, learning, data, fleet, security, and physical planes one explicit management object.
    implementation:
    - Define classes for safety/value violation, unauthorized action, privacy/data-use breach, data poisoning/contamination,
      reward/evaluator compromise, model/agent regression, physical hazard/near miss, fleet availability, resource starvation,
      checkpoint/state corruption, supply-chain/driver compromise, credential breach, evidence integrity failure, and control-plane
      split brain.
    - Define severity using actual/potential harm, affected scope, reversibility, authority exposure, physical risk, data
      sensitivity, uncertainty, and time criticality.
    - Define states `detected`, `triaged`, `containing`, `contained`, `investigating`, `recovering`, `monitoring`, `closed`,
      and `reopened` with legal transitions and ownership/acknowledgement deadlines.
    - Represent suspected, confirmed, disproven, and unknown facts separately and maintain causal links to signals, runs,
      actions, changes, deployments, data, evidence, nodes, and principals.
    - Support incident merging/splitting with immutable lineage and prevent duplicate alerts from creating conflicting containment.
    anti_drift:
    - Do not use free-form ticket text as the canonical incident state.
    - Do not downgrade severity because no harm is yet observed when evidence is missing.
    - Do not assume every failed workload is an incident; use policy/classification.
    integration:
    - Event Log supplies signals; Authority assigns roles; Deployment/Gateway/Fleet/Data/Eval link affected objects.
    validation:
    - Taxonomy fixtures and state-machine tests cover duplicates, merge/split, severity escalation, reopening, unknown scope,
      and clock skew.
    - G47, G64, G69, G70, G73, G75, G80, G86–G89 generate incidents.
    dependencies:
    - FND-001
    - EVT-003
    - AUTH-002
    gold_examples:
    - G47
    - G64
    - G69
    - G70
    - G73
    - G75
    - G80
    - G86
    - G87
    - G88
    - G89
  - id: INC-002
    title: Implement signal ingestion, correlation, and bounded detection rules
    goal: Detect cross-plane failures without making telemetry exporters or opaque anomaly models authoritative.
    implementation:
    - Ingest typed authoritative events/evidence from gateway, constraints, physical safety, data use, collection, feedback/reward/eval,
      training, fleet/node, state/trace, change/gate/deployment, secret/authority, and external monitors.
    - Implement deterministic threshold/sequence/correlation rules for known hazards and a plugin interface for anomaly detectors
      whose outputs remain signals requiring policy evaluation.
    - Correlate by causal IDs, deployment/cohort, artifact/data/evaluator lineage, time window, node/fleet, agent/route, principal,
      and shared dependency.
    - Deduplicate storms while retaining counts/samples and protect critical local physical events from central backpressure.
    - Record detector/rule version, inputs, uncertainty, latency, and missed-data state for every created incident.
    anti_drift:
    - Do not let an ML anomaly detector directly execute containment without policy.
    - Do not depend on high-cardinality dashboards as source of truth.
    - Do not sample away safety/security/authority events.
    integration:
    - Event/Evidence are sources; Observability can provide non-authoritative signals; Gate/Deployment health rules can open
      incidents.
    validation:
    - G66, G67, G69, G70, G73, G75, G80, G87–G89 test storms, missing telemetry, correlated fleet failure, and local physical
      detection.
    dependencies:
    - INC-001
    - EVT-006
    - EVID-003
    gold_examples:
    - G66
    - G67
    - G69
    - G70
    - G73
    - G75
    - G80
    - G87
    - G88
    - G89
  - id: INC-003
    title: Implement policy-authorized containment and kill-switch orchestration
    goal: Stop harm quickly through existing enforcement points without granting the incident service arbitrary side effects.
    implementation:
    - 'Define containment actions: deny/fence actions or capability scopes, pause agents/workloads/training/collection, revoke
      work orders/policy/secrets/drivers/artifacts, freeze change/deployment, stop rollout, rollback activation, quarantine
      node/data/evidence/model, isolate network/environment, require physical safe state, and request human/emergency service.'
    - Map incident class/severity/scope to preauthorized actions and required approvals; emergency authority is narrow, time-limited,
      traceable, and cannot broaden capability.
    - Issue signed containment commands through Authority/Gateway/Fleet/Deployment/Data Use rather than directly editing their
      stores.
    - Use generation/fencing tokens and acknowledgement tracking; unreachable affected nodes remain explicitly uncontained
      and may be quarantined on reconnect.
    - Prioritize local device emergency stop/safe envelope over central coordination when latency/connectivity is inadequate.
    anti_drift:
    - Do not create a universal root credential in Incident Controller.
    - Do not call a database flag a kill switch unless all enforcement points acknowledge it.
    - Do not let containment destroy evidence by default.
    integration:
    - Reuse KillSwitch/CircuitBreaker/Intervention foundations; Authority, Gateway, Deployment, Fleet, Node, Data Use execute.
    validation:
    - G12–G14, G47, G70, G73, G75, G79, G80, G87, and G88 verify propagation, partial acknowledgement, local safety, expiry,
      and stale-controller fencing.
    dependencies:
    - INC-001
    - AUTH-005
    - DGW-007
    - DEP-007
    gold_examples:
    - G12
    - G13
    - G14
    - G47
    - G70
    - G73
    - G75
    - G79
    - G80
    - G87
    - G88
  - id: INC-004
    title: Implement evidence preservation, forensic snapshots, and chain of custody
    goal: Retain enough trustworthy state to investigate without leaking protected data or allowing a compromised component
      to rewrite history.
    implementation:
    - Capture immutable references to relevant event ranges, state heads/snapshots, workload/worker leases, artifact/data/model/eval
      lineage, deployment/gate decisions, driver receipts, policy/authority versions, and node-local buffers.
    - Request bounded forensic snapshots through service APIs with data minimization, redaction, legal/retention policy, encryption,
      and role-scoped access.
    - Hash/sign manifests, record collector principal/time/tool versions, and distinguish unavailable, suspected-compromised,
      and verified evidence.
    - Freeze garbage collection for implicated artifacts/evidence while avoiding unbounded retention through explicit holds
      and review.
    - Support offline device evidence synchronization and conflict/quarantine if local chain integrity is broken.
    anti_drift:
    - Do not copy every raw payload into incident storage.
    - Do not let an investigator mutate the original evidence object.
    - Do not expose protected eval answers, secrets, or personal data in general incident views.
    integration:
    - Evidence/Artifact/State/Event/Secret/Data Use/Node expose snapshot/ref APIs; Incident stores manifest only.
    validation:
    - G14, G47, G64, G70, G73, G75, G80, G86–G89 test redaction, compromised store, missing node, retention hold, and chain
      verification.
    dependencies:
    - INC-002
    - EVID-005
    - EVT-005
    - SECR-006
    gold_examples:
    - G14
    - G47
    - G64
    - G70
    - G73
