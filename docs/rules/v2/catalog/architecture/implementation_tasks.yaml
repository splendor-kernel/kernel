- id: INT-011
  title: Implement federated, data-local, and privacy-preserving learning orchestration profiles
  goal: Support learning across edge/private domains while keeping algorithms pluggable and authority/data boundaries explicit.
  implementation:
  - Define federated round/workload contracts for participant eligibility, data purpose/locality, model/base revision, algorithm
    plugin, secure aggregation/privacy plugin, local budget, update schema, attestation, dropout, and candidate publication.
  - Keep federated averaging, personalization, secure aggregation, differential privacy, compression, and robustness algorithms
    in trainer/aggregation adapters; kernel owns participant selection authorization, work dispatch, leases, artifact routing,
    evidence, and state machine.
  - Prevent raw local data from leaving the declared locality; represent local dataset views by scoped handles and verify
    egress at sandbox/network/driver boundaries.
  - Account privacy budget/parameters and client participation as evidence, while refusing universal privacy claims without
    formal mechanism assumptions and implementation validation.
  - Handle intermittent/offline participants, stale updates, malicious/poisoned workers, heterogeneous local compute, and
    live inference reservations.
  - Evaluate global and local/personalized slices independently and route only a candidate into normal Change/Gate/Deployment.
