- id: INT-004
  title: Implement arbitrary PyTorch project intake and compatibility analysis
  goal: Turn an arbitrary PyTorch project into an explicit, honest execution plan without pretending every project can be
    automatically distributed.
  implementation:
  - Accept a source/artifact reference, environment manifest or lockfile, declared entrypoint/arguments, datasets/artifact
    outputs, expected checkpoint contract, resource hints, and optional Splendor integration hooks.
  - Run static and sandboxed dynamic probes to identify Python/PyTorch/CUDA versions, entrypoint, import side effects, data
    loading, model/optimizer construction, checkpointing, randomness, device assumptions, distributed API use, launcher assumptions,
    native extensions, network/filesystem dependencies, and unsupported global/process state.
  - Emit a signed `PyTorchCompatibilityReport` assigning T0 opaque single-process, T1 torchrun-compatible, T2 structured hooks/wrappable,
    or T3 explicit parallel plugin, with exact supported operations, required user changes, risk, reproducibility gaps, and
    test evidence.
  - 'Generate a non-destructive suggested manifest/adapter scaffold for T1/T2: `splendor_project.py` hooks for build model/data/optimizer,
    train step, eval step, save/load checkpoint, batch semantics, and health progress.'
  - Reject or keep single-process projects that rely on unsupported cross-rank side effects, non-shardable state, hidden external
    writes, incompatible devices, or missing resumable checkpoints; never silently patch source and claim equivalence.
  - Verify the project in a locked sandbox on one worker before any distributed attempt and publish environment/build/checkpoint
    artifacts.
  anti_drift:
  - Do not use AST rewriting as a universal DDP converter.
  - Do not label multi-process replication as distributed training if gradients/state are not coordinated.
  - Do not execute arbitrary setup/import code in the control plane.
  integration:
  - Sandbox/Data Use/Artifact/Lineage/Trainer Driver/Training Controller consume the report; project-specific logic remains
    user space.
  validation:
  - Corpus includes simple scripts, dynamic control flow, custom autograd/extensions, torchrun/DDP, FSDP-style hooks, streaming
    data, side-effectful training, and deliberately unsupported cases.
  - G63–G66 and G83 validate honest classification and isolation.
  dependencies:
  - SBX-013
  - TRDRV-001
  - TRAIN-001
  - ART-005
  - DUC-003
  gold_examples:
  - G63
  - G64
  - G65
  - G66
  - G83
- id: INT-005
  title: Implement flexible-fleet PyTorch execution from compatibility report
  goal: Convert supported PyTorch projects into governed distributed workloads over an arbitrary number of compatible available
    devices while preserving project semantics and live-service priorities.
  implementation:
  - For T0, schedule one training worker or independent hyperparameter/eval/data fan-out only; for T1, form a homogeneous
    compatibility group and launch the project with an explicit torchrun-compatible rendezvous; for T2, apply declared DDP/FSDP/checkpoint/data
    hooks; for T3, delegate topology to a signed parallelism plugin.
  - Translate TrainingRun into worker-group WorkloadSpecs with role, rank/world, device type, environment, artifact/data locality,
    resource lease, communication domain, restart policy, checkpoint generation, progress contract, and output publication.
  - Form synchronous groups only from devices satisfying accelerator/backend/dtype/model-memory/network/runtime compatibility.
    Use heterogeneous nodes for complementary preprocessing, evaluation, checkpoint conversion, serving, or independent trials
    unless a T3 plugin explicitly proves cross-device collective semantics.
  - Own rendezvous, membership epoch, rank assignment, lease fencing, retries, gang/elastic placement, network policy, checkpoint
    request/commit, global sample/token accounting, and failure reconciliation. Trainer code owns model/loss/optimizer/step.
  - On membership change, stop/fence old epoch, restore from a committed distributed checkpoint, establish new world/ranks,
    recompute per-rank data assignment and accumulation to maintain declared global-batch semantics, and resume with evidence.
    Never assume rank stability.
  - Use distributed checkpoint providers capable of parallel save/load and topology-aware resharding where supported; otherwise
    constrain restart topology and state that limitation.
  - Protect live inference/physical workloads through reservations, preemption/checkpoint deadlines, thermal/power/network/storage
    budgets, and SLO feedback. A training run can slow, shrink, checkpoint, or pause, never steal protected capacity.
  - Publish worker/collective/checkpoint/data/optimizer/model state receipts and one CandidateBundle; no worker or trainer
    can activate the result.
  anti_drift:
  - Do not mix arbitrary accelerators into one synchronous group because they are idle.
  - Do not retry after partial optimizer update without restoring a known committed checkpoint/epoch.
  - Do not derive global training progress from rank zero logs alone.
  - Do not hide reproducibility changes caused by world-size/global-batch/resume decisions.
  integration:
  - Training Controller orchestrates; Fleet leases; Node executes; Trainer Driver hosts project; Artifact/Data/Lineage manage
    state; Model/Eval later consume candidate.
  validation:
  - Two-node, elastic 2→4→1, worker death during collective/checkpoint, data-worker failure, rank change, topology reshard,
    incompatible device, inference SLO pressure, and full 1,000-node simulation are mandatory.
  - G60–G69 and G83 are blocking.
