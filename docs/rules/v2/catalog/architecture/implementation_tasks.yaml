  - id: OBS-006
    title: Implement exporter driver interfaces and reference providers
    goal: Support OpenTelemetry-compatible and provider-specific backends without importing them into kernel core.
    implementation:
    - Define `ExporterDriver` capabilities for metrics, traces, logs/events, evidence/audit refs, delivery guarantees, batch
      limits, auth method, health, and backpressure.
    - Implement reference OTLP exporter plus local JSONL/test sink; add Prometheus pull/export and common providers as adapter
      crates, not core.
    - Run exporters in isolated processes/workloads with scoped destination secrets and network policy; a compromised exporter
      cannot query arbitrary kernel data.
    - Require conformance for dedup IDs, schema/version preservation, redaction, retry, receipt, and failure isolation.
    - Expose provider health separately from kernel health and support hot failover through governed config without losing
      cursor ownership.
    anti_drift:
