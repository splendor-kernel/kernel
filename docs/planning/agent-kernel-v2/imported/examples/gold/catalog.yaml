schema_version: splendor.gold.catalog.v1
source: 09_gold_examples_catalog.md
result_schema: schemas/gold-result.schema.json
status_semantics:
  specified_not_implemented: The contract and acceptance criteria exist; no passing executable gold directory is
    claimed.
  implemented_not_exercised: Executable assets exist but the case did not run in the current evidence set.
  passed: The exact catalog revision ran and all required assertions passed.
  failed: The case ran and at least one required assertion failed.
  not_exercised: Requirements were unavailable or the case was intentionally not selected; this is never pass.
graduation_tiers:
  A: 'Local contract: deterministic positive and negative paths on one machine.'
  B: 'Fault: crash, timeout, cancellation, partial output, store failure, and recovery.'
  C: 'Distributed: identity, leases, partitions, retries, aggregation, and fencing.'
  D: 'Adversarial: authority, injection, data, secret, reward, eval, and rollback abuse.'
  E: 'Sustained: drift, pressure, rotation, upgrade, and long-running recovery.'
resource_classes:
  local_cpu: Runs on one ordinary CPU host.
  local_gpu_optional: Runs locally; a GPU accelerates but is not semantically required.
  local_container: Requires an OCI-compatible local container executor.
  local_kubernetes: Requires a disposable Kubernetes test namespace or provider emulator.
  human_in_the_loop: Requires authenticated human input or adjudication fixtures.
  multi_node_simulated: Requires a deterministic simulated multi-node topology.
  multi_node_gpu: Requires two or more compatible accelerator workers or a faithful emulator.
  heterogeneous_fleet: Requires heterogeneous node capabilities, leases, and placement.
  edge_simulated: Requires a simulated edge/device runtime and local safety boundary.
  physical_hardware_optional: Simulation is mandatory; representative hardware is an optional higher tier.
  sustained_fleet: Requires a long-running fleet or faithful pressure/drift simulation.
duration_classes:
  smoke: Expected target under five minutes.
  short: Expected target under thirty minutes.
  medium: Expected target under four hours.
  sustained: Extended soak, pressure, drift, or recovery run.
assertion_definitions:
  case.result.explicit: The result is exactly pass, fail, or not_exercised; skip is never pass.
  events.causal_chain.complete: Required events have identities, ordering, and causal links sufficient for independent
    reconstruction.
  state.transition.valid: Every durable state-head transition follows the declared state machine and compare-and-swap
    rules.
  artifacts.lineage.complete: Every governed output identifies immutable code, data, environment, configuration,
    and producer inputs.
  authority.fail_closed: Missing, expired, revoked, mismatched, or widened authority prevents the governed operation.
  effects.gateway_mediated: All governed side effects pass proposal, verification, invocation, and outcome boundaries.
  effects.forbidden.none: No forbidden driver, adapter, actuator, network, or external side effect occurred.
  resources.bounds.enforced: Quota, deadline, reservation, locality, and interference policies are enforced and
    evidenced.
  cleanup.complete: Ephemeral processes, sandboxes, leases, mounts, secrets, and temporary artifacts are released
    or explicitly quarantined.
  recovery.evidenced: Failure, retry, resume, cancellation, or rollback creates a distinct evidenced attempt without
    overwriting history.
  driver.contract.conformant: Driver manifest, schemas, lifecycle, cancellation, health, timeout, and idempotency
    behavior pass conformance.
  secrets.non_disclosure: Secret material is brokered by scope and is absent from public traces, logs, artifacts,
    and prompts where forbidden.
  data.provenance.complete: Records retain source, collection purpose, timestamps, transforms, consent/license,
    and immutable lineage.
  data.quality_gate.enforced: Quality, quarantine, split, contamination, and use-policy decisions are explicit and
    cannot be interpreted as pass when incomplete.
  data.protected_eval.isolated: Training and candidate-controlled code cannot read protected evaluation cases, labels,
    or hidden answers.
  feedback.target.exact: Feedback identifies the exact subject revision, causal context, source trust, confidence,
    and permitted use.
  reward.derivation.versioned: Raw feedback remains immutable and any reward/learning signal records a versioned
    derivation.
  eval.report.complete: Candidate, baseline, suite, data, environment, slices, uncertainty, failures, and limitations
    are present in the report.
  eval.independence.declared: Evaluator relationship and trust class are declared; related/self evaluation cannot
    satisfy an independent gate alone.
  training.candidate_only: Training may publish checkpoints and a candidate bundle but has no operation that activates
    deployment.
  deployment.gated: Activation requires a ChangeSet, policy-selected evidence, gate decision, bounded rollout plan,
    and authority.
  deployment.rollback.proven: Stop conditions halt new exposure and eligible cohorts return to a known-good version
    with incident evidence.
  fleet.lease.fenced: Only a current fenced execution lease may commit attempts, checkpoints, state, or outputs.
  fleet.inference_reservation.preserved: Background work yields before online inference or physical-control reservations
    and SLOs are violated.
  agent.route.trace.complete: Typed route steps preserve neural proposals, symbolic decisions, state reads/writes,
    model calls, and action proposals.
  world.assertion.provenance: Facts, beliefs, hypotheses, predictions, confidence, evidence, and conflicts remain
    distinct and versioned.
  physical.local_veto.enforced: Remote or cloud decisions cannot override device-local safety veto, emergency stop,
    or mission reservation.
  self_change.non_self_granting: An improving component cannot widen authority, lower its risk class, select protected
    judges, or activate itself.
  security.attack.denied_or_limited: The attack is denied with evidence, or a precise tested limitation is recorded
    without claiming protection.
