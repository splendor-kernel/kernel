openapi: 3.1.0
info:
  title: Splendor Runtime Daemon API
  version: 0.03-dev
  description: Local-only runtime daemon API with 0.03 signed work-order authority and kernel E2E schema coverage. The 0.1 SDK/API stability docs define compatibility expectations, but the current daemon implementation does not actively negotiate unsupported X-Splendor-API-Version headers.
  x-splendor-compatibility:
    stable_docs: docs/spec/0.1/api-stability.md
    compatibility_line: '0.1'
    version_negotiation: documented-not-enforced
servers:
  - url: http://127.0.0.1:8077
    description: Explicit local development listener only.
paths:
  /runs:
    post:
      summary: Create a local run from a signed work order.
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '200':
          description: Run created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{run_id}:
    get:
      summary: Inspect a local run.
      operationId: inspectRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Run metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/start:
    post:
      summary: Execute one local scheduler tick.
      operationId: startRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Tick executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{run_id}/pause:
    post:
      summary: Pause a local run.
      operationId: pauseRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/resume:
    post:
      summary: Resume a paused run and execute one tick.
      operationId: resumeRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Tick executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/stop:
    post:
      summary: Stop a local run.
      operationId: stopRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/cancel:
    post:
      summary: Cancel a local run without deleting trace or state evidence.
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/percepts:
    post:
      summary: Append a percept to the daemon queue for the next tick.
      operationId: appendPercept
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendPerceptRequest'
      responses:
        '200':
          description: Percept accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendPerceptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/policies/sync:
    post:
      summary: Sync or record failure for a run policy bundle cache.
      operationId: syncPolicy
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySyncRequest'
      responses:
        '200':
          description: Policy sync status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/state-head:
    get:
      summary: Read the latest committed state node metadata.
      operationId: getStateHead
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: State head metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateHeadResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/traces:
    get:
      summary: Read ordered trace records.
      operationId: getRunTraces
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
        - name: start
          in: query
          schema:
            type: integer
            minimum: 0
        - name: end
          in: query
          schema:
            type: integer
            minimum: 0
        - name: redaction_policy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ordered trace records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracePageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/traces/export:
    post:
      summary: Export ordered trace records with explicit redaction policy and integrity metadata.
      operationId: exportTraces
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceExportRequest'
      responses:
        '200':
          description: Trace export package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/replay:
    post:
      summary: Start inspect-only replay.
      operationId: replayRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: Replay summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /actions:
    post:
      summary: Submit an action through the local run gateway.
      operationId: submitAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActionRequest'
      responses:
        '200':
          description: Gateway action outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOutcome'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health:
    get:
      summary: Read daemon health.
      operationId: getHealth
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /version:
    get:
      summary: Read daemon/runtime/schema compatibility metadata.
      operationId: getVersion
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Version and compatibility metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /capabilities:
    get:
      summary: Read local daemon capabilities.
      operationId: getCapabilities
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Capability list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallerCredentialHeader:
      name: X-Splendor-Caller-Credential
      in: header
      required: false
      description: JSON-encoded CallerCredential for non-dev health/capability reads. Explicit local-dev mode may omit it only on loopback or Unix-socket transports.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing authenticated caller outside explicit local dev mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Security validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Run or state resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Run state, duplicate ID, or trace ordering conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Runtime unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details: true
    RunStatus:
      type: string
      enum:
        - pending
        - running
        - paused
        - waiting_for_approval
        - interrupted
        - resuming
        - completed
        - failed
        - cancelled
        - denied
        - expired
    EndpointScope:
      type: string
      enum:
        - runs_create
        - runs_start
        - runs_read
        - runs_pause
        - runs_resume
        - runs_stop
        - percepts_append
        - actions_submit
        - traces_read
        - state_read
        - replay_create
        - messages_send
        - health_read
        - capabilities_read
        - policies_sync
        - nodes_register
        - instances_register
        - nodes_heartbeat
        - instances_heartbeat
    JsonValue: true
    ClientPrincipal:
      type: object
      required: [app, client_principal_id, label]
      properties:
        app:
          type: object
          required: [app_principal_id, label]
          properties:
            app_principal_id:
              type: string
            label:
              type: [string, 'null']
        client_principal_id:
          type: string
        label:
          type: [string, 'null']
    RevocationStatus:
      oneOf:
        - type: string
          enum: [active]
        - type: object
          required: [revoked]
          properties:
            revoked:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
    CallerCredential:
      type: object
      required: [credential_id, principal, scopes, binding, audience, expires_at, revocation]
      properties:
        credential_id:
          type: string
        principal:
          $ref: '#/components/schemas/ClientPrincipal'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/EndpointScope'
        binding: true
        audience: true
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
    WorkOrderAuthorization:
      type: object
      required: [work_order_id, tenant_id, agent_id, run_id, allowed_scopes, signature, expires_at, revocation]
      properties:
        work_order_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
        allowed_scopes:
          type: array
          items:
            $ref: '#/components/schemas/EndpointScope'
        signature:
          oneOf:
            - type: 'null'
            - type: object
              required: [key_id, signature]
              properties:
                key_id:
                  type: string
                signature:
                  type: string
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
    WorkOrderSignature:
      type: object
      required: [key_id, signature]
      properties:
        key_id:
          type: string
        signature:
          type: string
    WorkOrderQuotaPolicy:
      type: object
      required: []
      properties:
        max_actions_per_tick:
          type: [integer, 'null']
          minimum: 0
        max_action_duration_ms:
          type: [integer, 'null']
          minimum: 0
        max_filesystem_read_bytes:
          type: [integer, 'null']
          minimum: 0
        max_filesystem_write_bytes:
          type: [integer, 'null']
          minimum: 0
        max_network_read_bytes:
          type: [integer, 'null']
          minimum: 0
        max_network_write_bytes:
          type: [integer, 'null']
          minimum: 0
        max_http_requests_per_minute:
          type: [integer, 'null']
          minimum: 0
    WorkOrderPlacement:
      type: object
      required: [target, data_locality, requires_gpu, dedicated_instance, required_capabilities, max_runtime_ms]
      properties:
        target:
          type: string
        data_locality:
          type: [string, 'null']
        requires_gpu:
          type: [boolean, 'null']
        dedicated_instance:
          type: [boolean, 'null']
        required_capabilities:
          type: array
          items:
            type: string
        max_runtime_ms:
          type: [integer, 'null']
          minimum: 0
    WorkOrderEnvelope:
      type: object
      required:
        - schema_version
        - work_order_id
        - tenant_id
        - agent_id
        - run_id
        - objective
        - allowed_actions
        - allowed_adapters
        - allowed_permissions
        - data_refs
        - quotas
        - placement
        - issued_at
        - expires_at
        - revocation
        - signature
      properties:
        schema_version:
          type: string
        work_order_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
        objective:
          type: string
        allowed_actions:
          type: array
          items:
            type: string
        allowed_adapters:
          type: array
          items:
            type: string
        allowed_permissions:
          type: array
          items:
            type: string
        data_refs:
          type: array
          items:
            type: string
        quotas:
          $ref: '#/components/schemas/WorkOrderQuotaPolicy'
        placement:
          $ref: '#/components/schemas/WorkOrderPlacement'
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
        signature:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WorkOrderSignature'
    AuditAttribution:
      type: object
      required: [principal, credential_id, requested_at]
      properties:
        principal:
          $ref: '#/components/schemas/ClientPrincipal'
        credential_id:
          type: [string, 'null']
        requested_at:
          type: string
          format: date-time
    Percept:
      type: object
      required: [schema, payload, provenance, timestamp]
      properties:
        schema:
          type: string
        payload:
          $ref: '#/components/schemas/JsonValue'
        provenance:
          type: object
          required: [source, detail]
          properties:
            source:
              type: string
            detail:
              type: [string, 'null']
        timestamp:
          type: string
          format: date-time
    Action:
      type: object
      required: [name, params, side_effect_class, cost_estimate, required_permissions, preconditions, postconditions]
      properties:
        name:
          type: string
        params:
          $ref: '#/components/schemas/JsonValue'
        side_effect_class: true
        cost_estimate: true
        required_permissions:
          type: array
          items:
            type: string
        preconditions:
          type: array
          items:
            type: string
        postconditions:
          type: array
          items:
            type: string
    QuotaUsage:
      type: object
      required: [actions, action_duration_ms, filesystem_read_bytes, filesystem_write_bytes, network_read_bytes, network_write_bytes, http_requests]
      properties:
        actions:
          type: integer
          minimum: 0
        action_duration_ms:
          type: integer
          minimum: 0
        filesystem_read_bytes:
          type: integer
          minimum: 0
        filesystem_write_bytes:
          type: integer
          minimum: 0
        network_read_bytes:
          type: integer
          minimum: 0
        network_write_bytes:
          type: integer
          minimum: 0
        http_requests:
          type: integer
          minimum: 0
    VerificationResult:
      type: object
      required: [allowed, reasons, artifacts]
      properties:
        allowed:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        artifacts:
          $ref: '#/components/schemas/JsonValue'
    ApprovalDecision:
      type: string
      enum: [Granted, Denied]
    ApprovalPolicy:
      type: object
      required: [schema_version, policy_id, tenant_id, agent_id, action_name, adapter, required_permission, side_effect_class, risk_level, reason, expires_at]
      properties:
        schema_version:
          type: string
        policy_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: [string, 'null']
          format: uuid
        action_name:
          type: [string, 'null']
        adapter:
          type: [string, 'null']
        required_permission:
          type: [string, 'null']
        side_effect_class: true
        risk_level:
          type: [string, 'null']
        reason:
          type: string
        expires_at:
          type: [string, 'null']
          format: date-time
    ApprovalEvidence:
      type: object
      required: [schema_version, approval_id, tenant_id, agent_id, run_id, action_id, action_name, adapter, decision, reason, issued_at, expires_at, revoked, trace_event_id]
      properties:
        schema_version:
          type: string
        approval_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        action_id:
          type: [string, 'null']
          format: uuid
        action_name:
          type: [string, 'null']
        adapter:
          type: [string, 'null']
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        reason:
          type: [string, 'null']
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        trace_event_id:
          type: [string, 'null']
          format: uuid
    ApprovalTraceContext:
      type: object
      required: [approval_id, tenant_id, agent_id, run_id, action_id, action_name, adapter, decision, reason, policy_id, risk_level, issued_at, expires_at, revoked]
      properties:
        approval_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        action_id:
          type: [string, 'null']
          format: uuid
        action_name:
          type: string
        adapter:
          type: [string, 'null']
        decision:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ApprovalDecision'
        reason:
          type: [string, 'null']
        policy_id:
          type: [string, 'null']
        risk_level:
          type: [string, 'null']
        issued_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked:
          type: boolean
    ActionOutcome:
      type: object
      required: [action_id, status, verification, post_verification, output, error, completed_at]
      properties:
        action_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Executed, Denied, NeedsApproval, NeedsIntervention, Failed]
        verification:
          $ref: '#/components/schemas/VerificationResult'
        post_verification:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/VerificationResult'
        output:
          $ref: '#/components/schemas/JsonValue'
        error:
          type: [string, 'null']
        completed_at:
          type: string
          format: date-time
    DaemonActionCandidate:
      type: object
      required: [action, adapter, quota_usage, satisfied_preconditions]
      properties:
        action:
          $ref: '#/components/schemas/Action'
        adapter:
          type: [string, 'null']
        quota_usage:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/QuotaUsage'
        satisfied_preconditions:
          type: array
          items:
            type: string
    RegisteredAction:
      type: object
      required: [name, adapter]
      properties:
        name:
          type: string
        adapter:
          type: string
    TraceRecord:
      type: object
      required: [run_id, sequence, payload, recorded_at, event_hash, prev_event_hash]
