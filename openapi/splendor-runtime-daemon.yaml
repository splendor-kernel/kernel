openapi: 3.1.0
info:
  title: Splendor Runtime Daemon API
  version: 0.03-dev
  description: Local-only runtime daemon API with 0.03 signed work-order authority and kernel E2E schema coverage. The 0.1 SDK/API stability docs define compatibility expectations, but the current daemon implementation does not actively negotiate unsupported X-Splendor-API-Version headers.
  x-splendor-compatibility:
    stable_docs: docs/spec/0.1/api-stability.md
    compatibility_line: '0.1'
    version_negotiation: documented-not-enforced
servers:
  - url: http://127.0.0.1:8077
    description: Explicit local development listener only.
paths:
  /runs:
    post:
      summary: Create a local run from a signed work order.
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '200':
          description: Run created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{run_id}:
    get:
      summary: Inspect a local run.
      operationId: inspectRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Run metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/start:
    post:
      summary: Execute one local scheduler tick.
      operationId: startRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Tick executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{run_id}/pause:
    post:
      summary: Pause a local run.
      operationId: pauseRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/resume:
    post:
      summary: Resume a paused run and execute one tick.
      operationId: resumeRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Tick executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/stop:
    post:
      summary: Stop a local run.
      operationId: stopRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/cancel:
    post:
      summary: Cancel a local run without deleting trace or state evidence.
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/percepts:
    post:
      summary: Append a percept to the daemon queue for the next tick.
      operationId: appendPercept
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendPerceptRequest'
      responses:
        '200':
          description: Percept accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendPerceptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/policies/sync:
    post:
      summary: Sync or record failure for a run policy bundle cache.
      operationId: syncPolicy
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySyncRequest'
      responses:
        '200':
          description: Policy sync status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/governance/circuit-breakers/sync:
    post:
      summary: Sync manager-issued circuit breakers into one run gateway evaluator.
      operationId: syncCircuitBreakers
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerSyncRequest'
      responses:
        '200':
          description: Circuit breaker sync accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerSyncResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/state-head:
    get:
      summary: Read the latest committed state node metadata.
      operationId: getStateHead
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: State head metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateHeadResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/traces:
    get:
      summary: Read ordered trace records.
      operationId: getRunTraces
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
        - name: start
          in: query
          schema:
            type: integer
            minimum: 0
        - name: end
          in: query
          schema:
            type: integer
            minimum: 0
        - name: redaction_policy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ordered trace records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracePageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/traces/export:
    post:
      summary: Export ordered trace records with explicit redaction policy and integrity metadata.
      operationId: exportTraces
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceExportRequest'
      responses:
        '200':
          description: Trace export package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/replay:
    post:
      summary: Start inspect-only replay.
      operationId: replayRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: Replay summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /actions:
    post:
      summary: Submit an action through the local run gateway.
      operationId: submitAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActionRequest'
      responses:
        '200':
          description: Gateway action outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOutcome'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health:
    get:
      summary: Read daemon health.
      operationId: getHealth
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /version:
    get:
      summary: Read daemon/runtime/schema compatibility metadata.
      operationId: getVersion
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Version and compatibility metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /capabilities:
    get:
      summary: Read local daemon capabilities.
      operationId: getCapabilities
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Capability list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /state-snapshots/export:
    post:
      summary: Export an explicit state handoff snapshot.
      operationId: exportStateSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportStateSnapshotRequest'
      responses:
        '200':
          description: State handoff snapshot exported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStateSnapshotResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /state-snapshots/import:
    post:
      summary: Import an explicit state handoff snapshot.
      operationId: importStateSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStateSnapshotRequest'
      responses:
        '200':
          description: State handoff snapshot imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStateSnapshotResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /fleet/nodes:
    post:
      summary: Register a fleet node.
      operationId: registerNode
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterNodeRequest' } } } }
      responses:
        '200': { description: Node registered., content: { application/json: { schema: { $ref: '#/components/schemas/NodeRegistration' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/nodes/list:
    post:
      summary: List fleet nodes.
      operationId: listNodes
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Registry projection., content: { application/json: { schema: { $ref: '#/components/schemas/FleetNodeListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/instances:
    post:
      summary: Register a runtime instance.
      operationId: registerInstance
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInstanceRequest' } } } }
      responses:
        '200': { description: Instance registered., content: { application/json: { schema: { $ref: '#/components/schemas/InstanceRegistration' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/nodes/{node_id}/heartbeat:
    post:
      summary: Record node heartbeat.
      operationId: heartbeatNode
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatNodeRequest' } } } }
      responses:
        '200': { description: Heartbeat recorded., content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedTraceResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/nodes/{node_id}/capabilities:
    post:
      summary: Advertise node capabilities.
      operationId: advertiseCapabilities
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdvertiseCapabilitiesRequest' } } } }
      responses:
        '200': { description: Capabilities advertised., content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedNodeResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/placement/evaluate:
    post:
      summary: Evaluate placement against registered capabilities.
      operationId: evaluatePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlacementEvaluationRequest' } } } }
      responses:
        '200': { description: Placement decision., content: { application/json: { schema: { $ref: '#/components/schemas/PlacementDecision' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /work-orders:
    post:
      summary: Submit a signed work order to the manager.
      operationId: submitWorkOrder
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitWorkOrderRequest' } } } }
      responses:
        '200': { description: Work order accepted., content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderValidationReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /work-orders/{work_order_id}/revoke:
    post:
      summary: Revoke a submitted work order.
      operationId: revokeWorkOrder
      parameters:
        - name: work_order_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeWorkOrderRequest' } } } }
      responses:
        '200': { description: Work order revoked., content: { application/json: { schema: { $ref: '#/components/schemas/RevokedWorkOrderResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /work-orders/{work_order_id}/dispatch:
    post:
      summary: Dispatch an accepted work order to a resident daemon.
      operationId: dispatchWorkOrder
      parameters:
        - name: work_order_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DispatchWorkOrderRequest' } } } }
      responses:
        '200': { description: Dispatch report., content: { application/json: { schema: { $ref: '#/components/schemas/DispatchReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/telemetry/read:
    post:
      summary: Read observational fleet telemetry.
      operationId: getFleetTelemetry
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Fleet telemetry., content: { application/json: { schema: { $ref: '#/components/schemas/FleetTelemetrySnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/traces/sync:
    post:
      summary: Sync local trace buffer into central trace index.
      operationId: syncTraceBuffer
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncTraceBufferRequest' } } } }
      responses:
        '200': { description: Trace sync report., content: { application/json: { schema: { $ref: '#/components/schemas/TraceSyncReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages:
    post:
      summary: Send a typed remote message.
      operationId: sendMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageRequest' } } } }
      responses:
        '200': { description: Message status., content: { application/json: { schema: { $ref: '#/components/schemas/MessageStatusReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages/{message_id}/read:
    post:
      summary: Read message delivery status.
      operationId: getMessage
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageReadRequest' } } } }
      responses:
        '200': { description: Message status., content: { application/json: { schema: { $ref: '#/components/schemas/MessageStatusReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages/{message_id}/ack:
    post:
      summary: Acknowledge message delivery/consumption metadata without mutating payload or granting authority.
      operationId: ackMessage
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageDeliveryUpdateRequest' } } } }
      responses:
        '200': { description: Message acknowledgement recorded., content: { application/json: { schema: { $ref: '#/components/schemas/MessageStatusReport' } } } }
        '400': { description: message_payload_mutation_forbidden; ack cannot mutate payload., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{message_id}/nack:
    post:
      summary: Record message delivery failure metadata without mutating payload or granting authority.
      operationId: nackMessage
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageDeliveryUpdateRequest' } } } }
      responses:
        '200': { description: Message negative acknowledgement recorded., content: { application/json: { schema: { $ref: '#/components/schemas/MessageStatusReport' } } } }
        '400': { description: message_payload_mutation_forbidden; nack cannot mutate payload., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{agent_id}/inbox:
    get:
      summary: List messages delivered to an agent inbox under caller tenant/agent scope.
      operationId: listInbox
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageReadRequest' } } } }
      responses:
        '200': { description: Agent inbox messages., content: { application/json: { schema: { $ref: '#/components/schemas/MessageListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agents/{agent_id}/outbox:
    get:
      summary: List messages sent by an agent outbox under caller tenant/agent scope.
      operationId: listOutbox
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageReadRequest' } } } }
      responses:
        '200': { description: Agent outbox messages., content: { application/json: { schema: { $ref: '#/components/schemas/MessageListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /runs/{run_id}/messages/causal-graph:
    get:
      summary: Read the non-authoritative message causal graph for a run.
      operationId: getMessageCausalGraph
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageReadRequest' } } } }
      responses:
        '200': { description: Message causal graph., content: { application/json: { schema: { $ref: '#/components/schemas/MessageCausalGraphResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /message-schemas/validate:
    post:
      summary: Validate a message schema/payload without delivering it or granting authority.
      operationId: validateMessageSchema
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageSchemaValidationRequest' } } } }
      responses:
        '200': { description: Message schema validation result., content: { application/json: { schema: { $ref: '#/components/schemas/MessageSchemaValidationReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /message-schemas:
    get:
      summary: List stable supported message schemas; the list is non-authoritative for delivery.
      operationId: listMessageSchemas
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Supported message schemas., content: { application/json: { schema: { $ref: '#/components/schemas/MessageSchemaListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /policies:
    post:
      summary: Publish and sign a governance policy bundle for acceptance runtimes.
      operationId: publishPolicyBundle
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublishPolicyBundleRequest' } } } }
      responses:
        '200': { description: Policy bundle published., content: { application/json: { schema: { $ref: '#/components/schemas/PolicyBundleStatusReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /policies/{policy_id}/read:
    post:
      summary: Read policy bundle status without granting runtime authority.
      operationId: getPolicyStatus
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Policy bundle status., content: { application/json: { schema: { $ref: '#/components/schemas/PolicyBundleStatusReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /policies/{policy_id}/revoke:
    post:
      summary: Revoke a policy bundle so high-risk side effects fail closed.
      operationId: revokePolicyBundle
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokePolicyBundleRequest' } } } }
      responses:
        '200': { description: Policy bundle revoked., content: { application/json: { schema: { $ref: '#/components/schemas/PolicyBundleStatusReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals:
    post:
      summary: Record a trace-linked approval request from runtime evidence.
      operationId: requestApproval
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestPayload' } } } }
      responses:
        '200': { description: Approval requested., content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceApprovalRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals/{approval_id}/grant:
    post:
      summary: Grant scoped approval evidence for one action.
      operationId: grantApproval
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' } } } }
      responses:
        '200': { description: Approval granted., content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceApprovalRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals/{approval_id}/deny:
    post:
      summary: Deny a pending approval request.
      operationId: denyApproval
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' } } } }
      responses:
        '200': { description: Approval denied., content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceApprovalRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals/{approval_id}/revoke:
    post:
      summary: Revoke approval evidence before it authorizes execution.
      operationId: revokeApproval
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' } } } }
      responses:
        '200': { description: Approval revoked., content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceApprovalRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /governance/circuit-breakers:
    post:
      summary: Create a scoped circuit breaker.
      operationId: createCircuitBreaker
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CircuitBreakerRequest' } } } }
      responses:
        '200': { description: Circuit breaker tripped., content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceCircuitBreakerRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /governance/circuit-breakers/{breaker_id}/clear:
    post:
      summary: Clear a scoped circuit breaker with governance authority.
      operationId: clearCircuitBreaker
      parameters:
        - name: breaker_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClearCircuitBreakerRequest' } } } }
      responses:
        '200': { description: Circuit breaker cleared., content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceCircuitBreakerRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /governance/kill-switches:
    post:
      summary: Activate a kill switch and record propagation evidence.
      operationId: activateKillSwitch
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KillSwitchRequest' } } } }
      responses:
        '200': { description: Kill switch status., content: { application/json: { schema: { $ref: '#/components/schemas/KillSwitchReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /governance/audit/export:
    post:
      summary: Export governance audit evidence linking policies, approvals, circuit breakers, kill switches, and runs.
      operationId: exportGovernanceAudit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceAuditExportRequest' } } } }
      responses:
        '200': { description: Governance audit exported., content: { application/json: { schema: { $ref: '#/components/schemas/GovernanceAuditExportReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/audit/read:
    post:
      summary: Read manager audit events for acceptance replay/audit evidence.
      operationId: managerAudit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Audit events., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManagerAuditEvent' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/profiles:
    post:
      summary: Register a resident physical/edge device profile.
      operationId: registerDeviceProfile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDeviceProfileRequest' } } } }
      responses:
        '200': { description: Device profile registered., content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDeviceProfileResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/{node_id}/status:
    get:
      summary: Read device safety and runtime status; never authorizes actions.
      operationId: getDeviceStatus
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200': { description: Device status., content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRuntimeProfile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{node_id}/policy-cache:
    get:
      summary: Read local policy cache status; expired high-risk offline actions fail closed.
      operationId: getPolicyCacheStatus
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200': { description: Policy cache status., content: { application/json: { schema: { $ref: '#/components/schemas/DevicePolicyCacheStatus' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{node_id}/actions:
    post:
      summary: Submit a high-level bounded physical action through gateway and safety verification.
      operationId: submitPhysicalAction
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitPhysicalActionRequest' } } } }
      responses:
        '200': { description: Physical action outcome., content: { application/json: { schema: { $ref: '#/components/schemas/ActionOutcome' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /operator/interventions:
    post:
      summary: Request local operator intervention for an ambiguous physical action.
      operationId: requestOperatorIntervention
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorInterventionRequest' } } } }
      responses:
        '200': { description: Operator intervention requested., content: { application/json: { schema: { $ref: '#/components/schemas/OperatorInterventionRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operator/interventions/{intervention_id}/grant:
    post:
      summary: Grant scoped expiring local operator intervention.
      operationId: grantOperatorIntervention
      parameters:
        - name: intervention_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorDecisionRequest' } } } }
      responses:
        '200': { description: Operator intervention granted., content: { application/json: { schema: { $ref: '#/components/schemas/OperatorInterventionRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /operator/interventions/{intervention_id}/deny:
    post:
      summary: Deny scoped local operator intervention.
      operationId: denyOperatorIntervention
      parameters:
        - name: intervention_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorDecisionRequest' } } } }
      responses:
        '200': { description: Operator intervention denied., content: { application/json: { schema: { $ref: '#/components/schemas/OperatorInterventionRecord' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{node_id}/trace-buffer/sync:
    post:
      summary: Sync an offline device trace buffer with ordering and tamper checks.
      operationId: syncDeviceTraceBuffer
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceTraceBufferSyncRequest' } } } }
      responses:
        '200': { description: Device trace sync result., content: { application/json: { schema: { $ref: '#/components/schemas/DeviceTraceBufferSyncResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallerCredentialHeader:
      name: X-Splendor-Caller-Credential
      in: header
      required: false
      description: JSON-encoded CallerCredential for non-dev health/capability reads. Explicit local-dev mode may omit it only on loopback or Unix-socket transports.
      schema:
        type: string
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing authenticated caller outside explicit local dev mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Security validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Run or state resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Run state, duplicate ID, or trace ordering conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Runtime unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    RegisterDeviceProfileRequest:
      type: object
      required: [credential, audit_attribution, profile]
      properties:
        credential: { $ref: '#/components/schemas/CallerCredential' }
        audit_attribution: { $ref: '#/components/schemas/AuditAttribution' }
        profile: { $ref: '#/components/schemas/DeviceRuntimeProfile' }
    RegisterDeviceProfileResponse:
      type: object
      required: [profile, trace_event_id]
      properties:
        profile: { $ref: '#/components/schemas/DeviceRuntimeProfile' }
        trace_event_id: { type: string, format: uuid }
    DeviceRuntimeProfile:
      type: object
      required: [node_id, tenant_id, device_kind, capabilities, allowed_physical_actions, forbidden_action_classes, safety_constraints, runtime_mode, safety_status, policy_cache, trace_buffer, registered_at]
      properties:
        node_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        device_kind:
          type: string
          enum: [drone_sim]
        capabilities:
          type: array
          items: { type: string }
        allowed_physical_actions:
          type: array
          items:
            type: string
            enum: [read_battery, read_sensor_summary, read_map, move_to_waypoint, return_to_base, dock, inspect_zone, capture_image, pause_mission, resume_mission, request_operator_override, notify_operator, upload_trace_summary]
        forbidden_action_classes:
          type: array
          items:
            type: string
            enum: [set_motor_pwm, raw_actuator_write, disable_firmware_safety, bypass_collision_avoidance, modify_flight_controller_internals, ignore_emergency_stop, hard_real_time_stabilization]
        safety_constraints: { type: object, additionalProperties: true }
        runtime_mode:
          type: string
          enum: [resident]
        safety_status: { type: object, additionalProperties: true }
        policy_cache: { $ref: '#/components/schemas/DevicePolicyCacheStatus' }
        trace_buffer: { $ref: '#/components/schemas/DeviceTraceBufferStatus' }
        registered_at: { type: string, format: date-time }
    DevicePolicyCacheStatus:
      type: object
      required: [policy_id, loaded, ttl_seconds, expires_at, expired]
      properties:
        policy_id: { type: string }
        loaded: { type: boolean }
        ttl_seconds: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }
    DeviceTraceBufferStatus:
      type: object
      required: [enabled, buffered_records, integrity]
      properties:
        enabled: { type: boolean }
        buffered_records: { type: integer, minimum: 0 }
        integrity: { type: string }
    SubmitPhysicalActionRequest:
      allOf:
        - $ref: '#/components/schemas/SubmitActionRequest'
        - type: object
          required: [safety_context]
          properties:
            safety_context: { $ref: '#/components/schemas/SafetyContext' }
            operator_intervention_evidence: { $ref: '#/components/schemas/OperatorInterventionEvidence' }
    SafetyContext:
      type: object
      required: [allowed_zone_refs, privacy_clear, human_proximity_clear, emergency_stop_clear, offline, policy_cache_expired, high_risk, cloud_helper_direct_authority]
      properties:
        allowed_zone_refs: { type: array, items: { type: string } }
        zone_ref: { type: string }
        altitude_m: { type: number }
        max_altitude_m: { type: number }
        battery_percent: { type: number, minimum: 0, maximum: 1 }
        privacy_clear: { type: boolean }
        human_proximity_clear: { type: boolean }
        emergency_stop_clear: { type: boolean }
        offline: { type: boolean }
        policy_cache_expired: { type: boolean }
        high_risk: { type: boolean }
        cloud_helper_direct_authority: { type: boolean }
        cloud_helper_proposal_id: { type: string }
    OperatorInterventionRequest:
      type: object
      required: [credential, audit_attribution, intervention_id, tenant_id, agent_id, run_id, node_id, action_name, reason, expires_at]
      properties:
        credential: { $ref: '#/components/schemas/CallerCredential' }
        audit_attribution: { $ref: '#/components/schemas/AuditAttribution' }
        intervention_id: { type: string }
        tenant_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        action_name: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
    OperatorDecisionRequest:
      type: object
      required: [credential, audit_attribution, reason]
      properties:
        credential: { $ref: '#/components/schemas/CallerCredential' }
        audit_attribution: { $ref: '#/components/schemas/AuditAttribution' }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
    OperatorInterventionEvidence:
      type: object
      required: [intervention_id, tenant_id, run_id, action_name, decision, expires_at]
      properties:
        intervention_id: { type: string }
        tenant_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        action_name: { type: string }
        decision: { type: string, enum: [granted, denied] }
        expires_at: { type: string, format: date-time }
    OperatorInterventionRecord:
      type: object
      required: [intervention_id, tenant_id, agent_id, run_id, node_id, action_name, status, reason, expires_at, trace_event_id]
      properties:
        intervention_id: { type: string }
        tenant_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        action_name: { type: string }
        status: { type: string, enum: [requested, granted, denied] }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
        trace_event_id: { type: string, format: uuid }
        evidence: { $ref: '#/components/schemas/OperatorInterventionEvidence' }
    DeviceTraceBufferSyncRequest:
      type: object
      required: [credential, audit_attribution, run_id, records]
      properties:
        credential: { $ref: '#/components/schemas/CallerCredential' }
        audit_attribution: { $ref: '#/components/schemas/AuditAttribution' }
        run_id: { type: string, format: uuid }
        records:
          type: array
          items: { $ref: '#/components/schemas/TraceRecord' }
        simulate_tamper: { type: boolean, default: false }
    DeviceTraceBufferSyncResponse:
      type: object
      required: [accepted, accepted_records, trace_event_id]
      properties:
        accepted: { type: boolean }
        accepted_records: { type: integer, minimum: 0 }
        trace_event_id: { type: string, format: uuid }
        reason_code:
          type: string
          enum: [trace_sync_hash_chain_mismatch, trace_sync_order_mismatch, trace_sync_tamper_simulated, run_not_found, node_not_found]
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details: true
    RunStatus:
      type: string
      enum:
        - pending
        - running
        - paused
        - waiting_for_approval
        - interrupted
        - resuming
        - completed
        - failed
        - cancelled
        - denied
        - expired
    EndpointScope:
      type: string
      enum:
        - runs_create
        - runs_start
        - runs_read
        - runs_pause
        - runs_resume
        - runs_stop
        - percepts_append
        - actions_submit
        - traces_read
        - state_read
        - replay_create
        - messages_send
        - messages_read
        - work_orders_submit
        - work_orders_revoke
        - fleet_read
        - fleet_dispatch
        - state_handoff
        - health_read
        - capabilities_read
        - policies_sync
        - policies_publish
        - policies_revoke
        - approvals_manage
        - governance_control
        - device_register
        - device_read
        - operator_intervene
        - nodes_register
        - instances_register
        - nodes_heartbeat
        - instances_heartbeat
    JsonValue: true
    ClientPrincipal:
      type: object
      required: [app, client_principal_id, label]
      properties:
        app:
          type: object
          required: [app_principal_id, label]
          properties:
            app_principal_id:
              type: string
            label:
              type: [string, 'null']
        client_principal_id:
          type: string
        label:
          type: [string, 'null']
    RevocationStatus:
      oneOf:
        - type: string
          enum: [active]
        - type: object
          required: [revoked]
          properties:
            revoked:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
    CallerCredential:
      type: object
      required: [credential_id, principal, scopes, binding, audience, expires_at, revocation]
      properties:
        credential_id:
          type: string
        principal:
          $ref: '#/components/schemas/ClientPrincipal'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/EndpointScope'
        binding: true
        audience: true
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
    WorkOrderAuthorization:
      type: object
      required: [work_order_id, tenant_id, agent_id, run_id, allowed_scopes, signature, expires_at, revocation]
      properties:
        work_order_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
        allowed_scopes:
          type: array
          items:
            $ref: '#/components/schemas/EndpointScope'
        signature:
          oneOf:
            - type: 'null'
            - type: object
              required: [key_id, signature]
              properties:
                key_id:
                  type: string
                signature:
                  type: string
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
    WorkOrderSignature:
      type: object
      required: [key_id, signature]
      properties:
        key_id:
          type: string
        signature:
          type: string
    WorkOrderQuotaPolicy:
      type: object
      required: []
      properties:
        max_actions_per_tick:
          type: [integer, 'null']
          minimum: 0
        max_action_duration_ms:
          type: [integer, 'null']
          minimum: 0
        max_filesystem_read_bytes:
          type: [integer, 'null']
          minimum: 0
        max_filesystem_write_bytes:
          type: [integer, 'null']
          minimum: 0
        max_network_read_bytes:
          type: [integer, 'null']
          minimum: 0
        max_network_write_bytes:
          type: [integer, 'null']
          minimum: 0
        max_http_requests_per_minute:
          type: [integer, 'null']
          minimum: 0
    WorkOrderPlacement:
      type: object
      required: [target, data_locality, requires_gpu, dedicated_instance, required_capabilities, max_runtime_ms]
      properties:
        target:
          type: string
        data_locality:
          type: [string, 'null']
        requires_gpu:
          type: [boolean, 'null']
        dedicated_instance:
          type: [boolean, 'null']
        required_capabilities:
          type: array
          items:
            type: string
        max_runtime_ms:
          type: [integer, 'null']
          minimum: 0
    WorkOrderEnvelope:
      type: object
      required:
        - schema_version
        - work_order_id
        - tenant_id
        - agent_id
        - run_id
        - objective
        - allowed_actions
        - allowed_adapters
        - allowed_permissions
        - data_refs
        - quotas
        - placement
        - issued_at
        - expires_at
        - revocation
        - signature
      properties:
        schema_version:
          type: string
        work_order_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
        objective:
          type: string
        allowed_actions:
          type: array
          items:
            type: string
        allowed_adapters:
          type: array
          items:
            type: string
        allowed_permissions:
          type: array
          items:
            type: string
        data_refs:
          type: array
          items:
            type: string
        quotas:
          $ref: '#/components/schemas/WorkOrderQuotaPolicy'
        placement:
          $ref: '#/components/schemas/WorkOrderPlacement'
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
        signature:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WorkOrderSignature'
    AuditAttribution:
      type: object
      required: [principal, credential_id, requested_at]
      properties:
        principal:
          $ref: '#/components/schemas/ClientPrincipal'
        credential_id:
          type: [string, 'null']
        requested_at:
          type: string
          format: date-time
    ManagerSecurityFields:
      type: object
      required: [credential, audit_attribution]
      properties:
