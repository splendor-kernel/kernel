openapi: 3.1.0
info:
  title: Splendor Runtime Daemon API
  version: 0.03-dev
  description: Local-only runtime daemon API with 0.03 signed work-order authority and kernel E2E schema coverage. The 0.1 SDK/API stability docs define compatibility expectations, but the current daemon implementation does not actively negotiate unsupported X-Splendor-API-Version headers.
  x-splendor-compatibility:
    stable_docs: docs/spec/0.1/api-stability.md
    compatibility_line: '0.1'
    version_negotiation: documented-not-enforced
servers:
  - url: http://127.0.0.1:8077
    description: Explicit local development listener only.
paths:
  /runs:
    post:
      summary: Create a local run from a signed work order.
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '200':
          description: Run created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{run_id}:
    get:
      summary: Inspect a local run.
      operationId: inspectRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Run metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/start:
    post:
      summary: Execute one local scheduler tick.
      operationId: startRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Tick executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{run_id}/pause:
    post:
      summary: Pause a local run.
      operationId: pauseRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/resume:
    post:
      summary: Resume a paused run and execute one tick.
      operationId: resumeRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Tick executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/stop:
    post:
      summary: Stop a local run.
      operationId: stopRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/cancel:
    post:
      summary: Cancel a local run without deleting trace or state evidence.
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInspectResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /runs/{run_id}/percepts:
    post:
      summary: Append a percept to the daemon queue for the next tick.
      operationId: appendPercept
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendPerceptRequest'
      responses:
        '200':
          description: Percept accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendPerceptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/policies/sync:
    post:
      summary: Sync or record failure for a run policy bundle cache.
      operationId: syncPolicy
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySyncRequest'
      responses:
        '200':
          description: Policy sync status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/state-head:
    get:
      summary: Read the latest committed state node metadata.
      operationId: getStateHead
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: State head metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateHeadResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/traces:
    get:
      summary: Read ordered trace records.
      operationId: getRunTraces
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CallerCredentialHeader'
        - name: start
          in: query
          schema:
            type: integer
            minimum: 0
        - name: end
          in: query
          schema:
            type: integer
            minimum: 0
        - name: redaction_policy
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ordered trace records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracePageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/traces/export:
    post:
      summary: Export ordered trace records with explicit redaction policy and integrity metadata.
      operationId: exportTraces
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceExportRequest'
      responses:
        '200':
          description: Trace export package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/replay:
    post:
      summary: Start inspect-only replay.
      operationId: replayRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: Replay summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /actions:
    post:
      summary: Submit an action through the local run gateway.
      operationId: submitAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActionRequest'
      responses:
        '200':
          description: Gateway action outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOutcome'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health:
    get:
      summary: Read daemon health.
      operationId: getHealth
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /version:
    get:
      summary: Read daemon/runtime/schema compatibility metadata.
      operationId: getVersion
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Version and compatibility metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /capabilities:
    get:
      summary: Read local daemon capabilities.
      operationId: getCapabilities
      parameters:
        - $ref: '#/components/parameters/CallerCredentialHeader'
      responses:
        '200':
          description: Capability list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /state-snapshots/export:
    post:
      summary: Export an explicit state handoff snapshot.
      operationId: exportStateSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportStateSnapshotRequest'
      responses:
        '200':
          description: State handoff snapshot exported.
        '403':
          $ref: '#/components/responses/Forbidden'
  /state-snapshots/import:
    post:
      summary: Import an explicit state handoff snapshot.
      operationId: importStateSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStateSnapshotRequest'
      responses:
        '200':
          description: State handoff snapshot imported.
        '403':
          $ref: '#/components/responses/Forbidden'
  /fleet/nodes:
    post:
      summary: Register a fleet node.
      operationId: registerNode
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterNodeRequest' } } } }
      responses:
        '200': { description: Node registered., content: { application/json: { schema: { $ref: '#/components/schemas/NodeRegistration' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/nodes/list:
    post:
      summary: List fleet nodes.
      operationId: listNodes
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Registry projection., content: { application/json: { schema: { $ref: '#/components/schemas/FleetNodeListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/instances:
    post:
      summary: Register a runtime instance.
      operationId: registerInstance
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInstanceRequest' } } } }
      responses:
        '200': { description: Instance registered., content: { application/json: { schema: { $ref: '#/components/schemas/InstanceRegistration' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/nodes/{node_id}/heartbeat:
    post:
      summary: Record node heartbeat.
      operationId: heartbeatNode
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatNodeRequest' } } } }
      responses:
        '200': { description: Heartbeat recorded., content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedTraceResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/nodes/{node_id}/capabilities:
    post:
      summary: Advertise node capabilities.
      operationId: advertiseCapabilities
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdvertiseCapabilitiesRequest' } } } }
      responses:
        '200': { description: Capabilities advertised., content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedNodeResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/placement/evaluate:
    post:
      summary: Evaluate placement against registered capabilities.
      operationId: evaluatePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlacementEvaluationRequest' } } } }
      responses:
        '200': { description: Placement decision., content: { application/json: { schema: { $ref: '#/components/schemas/PlacementDecision' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /work-orders:
    post:
      summary: Submit a signed work order to the manager.
      operationId: submitWorkOrder
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitWorkOrderRequest' } } } }
      responses:
        '200': { description: Work order accepted., content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderValidationReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /work-orders/{work_order_id}/revoke:
    post:
      summary: Revoke a submitted work order.
      operationId: revokeWorkOrder
      parameters:
        - name: work_order_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeWorkOrderRequest' } } } }
      responses:
        '200': { description: Work order revoked., content: { application/json: { schema: { $ref: '#/components/schemas/RevokedWorkOrderResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /work-orders/{work_order_id}/dispatch:
    post:
      summary: Dispatch an accepted work order to a resident daemon.
      operationId: dispatchWorkOrder
      parameters:
        - name: work_order_id
          in: path
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DispatchWorkOrderRequest' } } } }
      responses:
        '200': { description: Dispatch report., content: { application/json: { schema: { $ref: '#/components/schemas/DispatchReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/telemetry/read:
    post:
      summary: Read observational fleet telemetry.
      operationId: getFleetTelemetry
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Fleet telemetry. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/traces/sync:
    post:
      summary: Sync local trace buffer into central trace index.
      operationId: syncTraceBuffer
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncTraceBufferRequest' } } } }
      responses:
        '200': { description: Trace sync report., content: { application/json: { schema: { $ref: '#/components/schemas/TraceSyncReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages:
    post:
      summary: Send a typed remote message.
      operationId: sendMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageRequest' } } } }
      responses:
        '200': { description: Message status., content: { application/json: { schema: { $ref: '#/components/schemas/MessageStatusReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages/{message_id}/read:
    post:
      summary: Read message delivery status.
      operationId: getMessage
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Message status., content: { application/json: { schema: { $ref: '#/components/schemas/MessageStatusReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /fleet/audit/read:
    post:
      summary: Read manager audit events for acceptance replay/audit evidence.
      operationId: managerAudit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerReadRequest' } } } }
      responses:
        '200': { description: Audit events., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManagerAuditEvent' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallerCredentialHeader:
      name: X-Splendor-Caller-Credential
      in: header
      required: false
      description: JSON-encoded CallerCredential for non-dev health/capability reads. Explicit local-dev mode may omit it only on loopback or Unix-socket transports.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing authenticated caller outside explicit local dev mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Security validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Run or state resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Run state, duplicate ID, or trace ordering conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Runtime unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details: true
    RunStatus:
      type: string
      enum:
        - pending
        - running
        - paused
        - waiting_for_approval
        - interrupted
        - resuming
        - completed
        - failed
        - cancelled
        - denied
        - expired
    EndpointScope:
      type: string
      enum:
        - runs_create
        - runs_start
        - runs_read
        - runs_pause
        - runs_resume
        - runs_stop
        - percepts_append
        - actions_submit
        - traces_read
        - state_read
        - replay_create
        - messages_send
        - messages_read
        - work_orders_submit
        - work_orders_revoke
        - fleet_read
        - fleet_dispatch
        - state_handoff
        - health_read
        - capabilities_read
        - policies_sync
        - nodes_register
        - instances_register
        - nodes_heartbeat
        - instances_heartbeat
    JsonValue: true
    ClientPrincipal:
      type: object
      required: [app, client_principal_id, label]
      properties:
        app:
          type: object
          required: [app_principal_id, label]
          properties:
            app_principal_id:
              type: string
            label:
              type: [string, 'null']
        client_principal_id:
          type: string
        label:
          type: [string, 'null']
    RevocationStatus:
      oneOf:
        - type: string
          enum: [active]
        - type: object
          required: [revoked]
          properties:
            revoked:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
    CallerCredential:
      type: object
      required: [credential_id, principal, scopes, binding, audience, expires_at, revocation]
      properties:
        credential_id:
          type: string
        principal:
          $ref: '#/components/schemas/ClientPrincipal'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/EndpointScope'
        binding: true
        audience: true
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
    WorkOrderAuthorization:
      type: object
      required: [work_order_id, tenant_id, agent_id, run_id, allowed_scopes, signature, expires_at, revocation]
      properties:
        work_order_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
        allowed_scopes:
          type: array
          items:
            $ref: '#/components/schemas/EndpointScope'
        signature:
          oneOf:
            - type: 'null'
            - type: object
              required: [key_id, signature]
              properties:
                key_id:
                  type: string
                signature:
                  type: string
        expires_at:
          type: string
          format: date-time
        revocation:
          $ref: '#/components/schemas/RevocationStatus'
    WorkOrderSignature:
      type: object
      required: [key_id, signature]
      properties:
        key_id:
          type: string
        signature:
          type: string
    WorkOrderQuotaPolicy:
      type: object
      required: []
      properties:
        max_actions_per_tick:
          type: [integer, 'null']
          minimum: 0
        max_action_duration_ms:
          type: [integer, 'null']
          minimum: 0
        max_filesystem_read_bytes:
          type: [integer, 'null']
          minimum: 0
        max_filesystem_write_bytes:
          type: [integer, 'null']
          minimum: 0
        max_network_read_bytes:
          type: [integer, 'null']
          minimum: 0
        max_network_write_bytes:
          type: [integer, 'null']
          minimum: 0
        max_http_requests_per_minute:
          type: [integer, 'null']
          minimum: 0
    WorkOrderPlacement:
      type: object
      required: [target, data_locality, requires_gpu, dedicated_instance, required_capabilities, max_runtime_ms]
      properties:
        target:
          type: string
        data_locality:
          type: [string, 'null']
        requires_gpu:
          type: [boolean, 'null']
        dedicated_instance:
          type: [boolean, 'null']
        required_capabilities:
          type: array
          items:
            type: string
        max_runtime_ms:
          type: [integer, 'null']
          minimum: 0
    WorkOrderEnvelope:
      type: object
      required:
        - schema_version
        - work_order_id
        - tenant_id
        - agent_id
        - run_id
        - objective
        - allowed_actions
        - allowed_adapters
