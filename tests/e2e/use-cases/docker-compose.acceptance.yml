# S0-compatible acceptance topology.
#
# S0 runs the acceptance runner, local daemon public health/capabilities path,
# required role placeholders, and deterministic fake boundary services. The
# runner shares the daemon network namespace so the daemon can remain bound to
# loopback-only TCP. Daemon ports are not published.
services:
  e2e-runner:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: acceptance-runner
    working_dir: /workspace
    user: root
    environment:
      SPLENDOR_E2E_MODE: acceptance
      SPLENDOR_E2E_REPORT_DIR: /workspace/target/splendor-e2e/use-case-acceptance
      SPLENDOR_E2E_NO_COMPOSE: "1"
      SPLENDOR_E2E_SOURCE_REV: ${SPLENDOR_E2E_SOURCE_REV:-unknown-source-revision}
      SPLENDOR_E2E_SOURCE_TREE_DIGEST: ${SPLENDOR_E2E_SOURCE_TREE_DIGEST:-unknown-source-tree-digest}
      SPLENDOR_DAEMON_URL: http://127.0.0.1:8077
      SPLENDOR_MANAGER_URL: http://central-manager:8081
      SPLENDOR_RESIDENT_AUTH_DIR: /run/splendor-auth
      SPLENDOR_RESIDENT_CA_FILE: /run/splendor-auth/resident-root-ca.pem
      SPLENDOR_VPC_NODE_URL: https://resident-vpc-node:8092
      SPLENDOR_CLOUD_NODE_URL: https://resident-cloud-node:8091
      SPLENDOR_EDGE_NODE_URL: https://resident-edge-node:8093
      SPLENDOR_HTTP_FIXTURE_URL: http://fake-http-service:8082
      SPLENDOR_ACTION_PROVIDER_URL: http://acceptance-action-provider:8086
      SPLENDOR_ACCEPTANCE_EVIDENCE_CREDENTIAL_FILE: /run/splendor-provider-evidence/action-provider-evidence-credential.json
      SPLENDOR_ACCEPTANCE_RECEIPT_PUBLIC_KEY_FILE: /run/splendor-provider-evidence/receipt-public-key.raw
      SPLENDOR_GOVERNANCE_FIXTURE_URL: http://fake-governance-plane:8084
      SPLENDOR_TELEMETRY_FIXTURE_URL: http://fake-telemetry-sink:8085
      SPLENDOR_E2E_SCENARIO: ${SPLENDOR_E2E_SCENARIO:-UC-E2E-S0}
      SPLENDOR_E2E_MODE_ARG: ${SPLENDOR_E2E_MODE_ARG:-scenario}
    command:
      - bash
      - -lc
      - |
        python3 tests/e2e/use-cases/fixtures/acceptance_provider_evidence.py \
          --smoke-url "$${SPLENDOR_ACTION_PROVIDER_URL}"
        if [[ "$${SPLENDOR_E2E_MODE_ARG:-scenario}" == "all" ]]; then
          exec bash scripts/e2e/verify-use-case-acceptance.sh --inside-compose --all --reuse-build
        fi
        exec bash scripts/e2e/verify-use-case-acceptance.sh --inside-compose --scenario "$${SPLENDOR_E2E_SCENARIO:-UC-E2E-S0}" --reuse-build
    depends_on:
      - splendor-daemon-local
      - central-manager
      - resident-cloud-node
      - resident-vpc-node
      - resident-edge-node
      - fake-http-service
      - acceptance-action-provider
      - fake-governance-plane
      - fake-telemetry-sink
      - toxiproxy
    network_mode: service:splendor-daemon-local
    volumes:
      - ../../..:/workspace
      - e2e-runner-auth:/run/splendor-auth:ro
      - e2e-provider-runner-auth:/run/splendor-provider-evidence:ro

  resident-auth-fixture:
    profiles: ["setup"]
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: acceptance-runner
    working_dir: /workspace
    user: root
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        chown -R root:root \
          /run/splendor-manager-auth \
          /run/splendor-runner-auth \
          /run/splendor-vpc-auth \
          /run/splendor-cloud-auth \
          /run/splendor-edge-auth \
          /run/splendor-provider-auth \
          /run/splendor-provider-runner-auth \
          /run/splendor-provider-local-auth \
          /run/splendor-provider-cloud-auth \
          /run/splendor-provider-vpc-auth \
          /run/splendor-provider-edge-auth
        chmod 700 \
          /run/splendor-manager-auth \
          /run/splendor-runner-auth \
          /run/splendor-vpc-auth \
          /run/splendor-cloud-auth \
          /run/splendor-edge-auth \
          /run/splendor-provider-auth \
          /run/splendor-provider-runner-auth \
          /run/splendor-provider-local-auth \
          /run/splendor-provider-cloud-auth \
          /run/splendor-provider-vpc-auth \
          /run/splendor-provider-edge-auth
        python3 tests/e2e/use-cases/fixtures/resident_auth_fixture.py init \
          --manager-out /run/splendor-manager-auth \
          --runner-out /run/splendor-runner-auth \
          --vpc-out /run/splendor-vpc-auth \
          --cloud-out /run/splendor-cloud-auth \
          --edge-out /run/splendor-edge-auth
        python3 tests/e2e/use-cases/fixtures/acceptance_provider_auth.py \
          --provider-out /run/splendor-provider-auth \
          --runner-out /run/splendor-provider-runner-auth \
          --local-out /run/splendor-provider-local-auth \
          --cloud-out /run/splendor-provider-cloud-auth \
          --vpc-out /run/splendor-provider-vpc-auth \
          --edge-out /run/splendor-provider-edge-auth
        chown -R splendor:splendor \
          /run/splendor-manager-auth \
          /run/splendor-vpc-auth \
          /run/splendor-cloud-auth \
          /run/splendor-edge-auth \
          /run/splendor-provider-auth \
          /run/splendor-provider-local-auth \
          /run/splendor-provider-cloud-auth \
          /run/splendor-provider-vpc-auth \
          /run/splendor-provider-edge-auth
        chown -R root:root \
          /run/splendor-runner-auth \
          /run/splendor-provider-runner-auth
        chmod 700 \
          /run/splendor-runner-auth \
          /run/splendor-provider-runner-auth
    volumes:
      - ../../..:/workspace:ro
      - e2e-manager-auth:/run/splendor-manager-auth
      - e2e-runner-auth:/run/splendor-runner-auth
      - e2e-vpc-auth:/run/splendor-vpc-auth
      - e2e-cloud-auth:/run/splendor-cloud-auth
      - e2e-edge-auth:/run/splendor-edge-auth
      - e2e-action-provider-auth:/run/splendor-provider-auth
      - e2e-provider-runner-auth:/run/splendor-provider-runner-auth
      - e2e-provider-local-auth:/run/splendor-provider-local-auth
      - e2e-provider-cloud-auth:/run/splendor-provider-cloud-auth
      - e2e-provider-vpc-auth:/run/splendor-provider-vpc-auth
      - e2e-provider-edge-auth:/run/splendor-provider-edge-auth

  fake-http-service:
    image: python:3.12-slim
    working_dir: /fixtures
    command: ["python", "-m", "http.server", "8082"]
    volumes:
      - ./fixtures:/fixtures:ro

  acceptance-action-provider:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: acceptance-action-provider
    working_dir: /opt/splendor-provider
    environment:
      SPLENDOR_ACCEPTANCE_ONLY: "1"
      SPLENDOR_ACCEPTANCE_REQUEST_KEYRING_FILE: /run/splendor-provider-auth/action-provider-request-keyring.json
      SPLENDOR_ACCEPTANCE_EVIDENCE_KEYRING_FILE: /run/splendor-provider-auth/action-provider-evidence-keyring.json
      SPLENDOR_ACCEPTANCE_RECEIPT_SIGNING_KEY_FILE: /run/splendor-provider-auth/receipt-signing-key.pk8
      SPLENDOR_ACCEPTANCE_SIGNER: /usr/local/bin/resident_auth_key_tool
    command: ["python3", "action_provider.py"]
    volumes:
      - e2e-action-provider-auth:/run/splendor-provider-auth:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30

  fake-governance-plane:
    image: python:3.12-slim
    working_dir: /fixtures
    command: ["python", "-m", "http.server", "8084"]
    volumes:
      - ./fixtures:/fixtures:ro

  fake-telemetry-sink:
    image: python:3.12-slim
    working_dir: /var/lib/splendor-telemetry
    command: ["python", "-m", "http.server", "8085"]
    volumes:
      - e2e-state:/var/lib/splendor-telemetry

  splendor-daemon-local:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: acceptance-action-host
    working_dir: /opt/splendor
    environment:
      SPLENDOR_ACCEPTANCE_ONLY: "1"
      SPLENDOR_ACCEPTANCE_PROVIDER_ENDPOINT: http://acceptance-action-provider:8086/actions
      SPLENDOR_ACCEPTANCE_REQUEST_CREDENTIAL_FILE: /run/splendor-provider-client/action-provider-request-credential.json
      SPLENDOR_ACCEPTANCE_RECEIPT_PUBLIC_KEY_FILE: /run/splendor-provider-client/receipt-public-key.raw
      SPLENDOR_INSTANCE_ID: 00000000-0000-4000-8000-000000000300
      SPLENDOR_DAEMON_MODE: local_dev
      SPLENDOR_AUTHORITY_OBLIGATION_RECEIPT_CONFIG_FILE: /run/splendor-auth/authority-obligation-receipt-config.json
    command: ["splendor-acceptance-action-host"]
    depends_on:
      acceptance-action-provider:
        condition: service_healthy
    volumes:
      - e2e-state:/var/lib/splendor
      - e2e-manager-auth:/run/splendor-auth:ro
      - e2e-provider-local-auth:/run/splendor-provider-client:ro

  central-manager:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: runtime
    working_dir: /opt/splendor
    environment:
      SPLENDOR_MANAGER_MODE: local_acceptance
      SPLENDOR_MANAGER_BIND_ADDR: 0.0.0.0:8081
      SPLENDOR_MANAGER_ALLOW_NON_LOOPBACK_DEV: "1"
      SPLENDOR_MANAGER_ID: central-manager
      SPLENDOR_FLEET_ID: 00000000-0000-4000-8000-000000000104
      SPLENDOR_MANAGER_CALLER_ISSUER: urn:splendor:manager:central-manager
      SPLENDOR_MANAGER_CALLER_APP_PRINCIPAL_ID: central-manager
      SPLENDOR_MANAGER_CALLER_CLIENT_PRINCIPAL_ID: resident-dispatch-client
      SPLENDOR_MANAGER_CALLER_KEY_ID: manager-resident-acceptance
      SPLENDOR_MANAGER_CALLER_SIGNING_KEY_FILE: /run/splendor-auth/caller-signing-key.pk8
      SPLENDOR_MANAGER_WORK_ORDER_KEYRING_FILE: /run/splendor-auth/work-order-keyring.json
      SPLENDOR_AUTHORITY_OBLIGATION_RECEIPT_CONFIG_FILE: /run/splendor-auth/authority-obligation-receipt-config.json
      SPLENDOR_MANAGER_APPROVAL_CALLER_TRUST_FILE: /run/splendor-auth/approval-caller-trust.json
      SPLENDOR_MANAGER_RESIDENT_ROOT_CA_FILE: /run/splendor-auth/resident-root-ca.pem
      SPLENDOR_MANAGER_RESIDENT_ALLOWED_ORIGINS: https://resident-cloud-node:8091,https://resident-vpc-node:8092,https://resident-edge-node:8093
    command: ["splendor-manager"]
    volumes:
      - e2e-state:/var/lib/splendor
      - e2e-manager-auth:/run/splendor-auth:ro

  resident-cloud-node:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: acceptance-action-host
    working_dir: /opt/splendor
    environment:
      SPLENDOR_ACCEPTANCE_ONLY: "1"
      SPLENDOR_ACCEPTANCE_PROVIDER_ENDPOINT: http://acceptance-action-provider:8086/actions
      SPLENDOR_ACCEPTANCE_REQUEST_CREDENTIAL_FILE: /run/splendor-provider-client/action-provider-request-credential.json
      SPLENDOR_ACCEPTANCE_RECEIPT_PUBLIC_KEY_FILE: /run/splendor-provider-client/receipt-public-key.raw
      SPLENDOR_DAEMON_MODE: resident
      SPLENDOR_DAEMON_BIND_ADDR: 0.0.0.0:8091
      SPLENDOR_INSTANCE_ID: 00000000-0000-4000-8000-000000000304
      SPLENDOR_CALLER_TRUST_FILE: /run/splendor-auth/caller-trust.json
      SPLENDOR_WORK_ORDER_KEYRING_FILE: /run/splendor-auth/work-order-keyring.json
      SPLENDOR_POLICY_KEYRING_FILE: /run/splendor-auth/policy-keyring.json
      SPLENDOR_AUTHORITY_OBLIGATION_RECEIPT_CONFIG_FILE: /run/splendor-auth/authority-obligation-receipt-config.json
      SPLENDOR_TLS_CERT_FILE: /run/splendor-auth/resident-tls-cert.pem
      SPLENDOR_TLS_KEY_FILE: /run/splendor-auth/resident-tls-key.pem
    command: ["splendor-acceptance-action-host"]
    depends_on:
      acceptance-action-provider:
        condition: service_healthy
    volumes:
      - e2e-state:/var/lib/splendor
      - e2e-cloud-auth:/run/splendor-auth:ro
      - e2e-provider-cloud-auth:/run/splendor-provider-client:ro

  resident-vpc-node:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: acceptance-action-host
    working_dir: /opt/splendor
    environment:
      SPLENDOR_ACCEPTANCE_ONLY: "1"
      SPLENDOR_ACCEPTANCE_PROVIDER_ENDPOINT: http://acceptance-action-provider:8086/actions
      SPLENDOR_ACCEPTANCE_REQUEST_CREDENTIAL_FILE: /run/splendor-provider-client/action-provider-request-credential.json
      SPLENDOR_ACCEPTANCE_RECEIPT_PUBLIC_KEY_FILE: /run/splendor-provider-client/receipt-public-key.raw
      SPLENDOR_DAEMON_MODE: resident
      SPLENDOR_DAEMON_BIND_ADDR: 0.0.0.0:8092
      SPLENDOR_INSTANCE_ID: 00000000-0000-4000-8000-000000000302
      SPLENDOR_CALLER_TRUST_FILE: /run/splendor-auth/caller-trust.json
      SPLENDOR_WORK_ORDER_KEYRING_FILE: /run/splendor-auth/work-order-keyring.json
      SPLENDOR_POLICY_KEYRING_FILE: /run/splendor-auth/policy-keyring.json
      SPLENDOR_AUTHORITY_OBLIGATION_RECEIPT_CONFIG_FILE: /run/splendor-auth/authority-obligation-receipt-config.json
      SPLENDOR_TLS_CERT_FILE: /run/splendor-auth/resident-tls-cert.pem
      SPLENDOR_TLS_KEY_FILE: /run/splendor-auth/resident-tls-key.pem
    command: ["splendor-acceptance-action-host"]
    depends_on:
      acceptance-action-provider:
        condition: service_healthy
    volumes:
      - e2e-state:/var/lib/splendor
      - e2e-vpc-auth:/run/splendor-auth:ro
      - e2e-provider-vpc-auth:/run/splendor-provider-client:ro

  resident-edge-node:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: acceptance-action-host
    working_dir: /opt/splendor
    environment:
      SPLENDOR_ACCEPTANCE_ONLY: "1"
      SPLENDOR_ACCEPTANCE_PROVIDER_ENDPOINT: http://acceptance-action-provider:8086/actions
      SPLENDOR_ACCEPTANCE_REQUEST_CREDENTIAL_FILE: /run/splendor-provider-client/action-provider-request-credential.json
      SPLENDOR_ACCEPTANCE_RECEIPT_PUBLIC_KEY_FILE: /run/splendor-provider-client/receipt-public-key.raw
      SPLENDOR_DAEMON_MODE: resident
      SPLENDOR_DAEMON_BIND_ADDR: 0.0.0.0:8093
      SPLENDOR_INSTANCE_ID: 00000000-0000-4000-8000-000000000306
      SPLENDOR_CALLER_TRUST_FILE: /run/splendor-auth/caller-trust.json
      SPLENDOR_WORK_ORDER_KEYRING_FILE: /run/splendor-auth/work-order-keyring.json
      SPLENDOR_POLICY_KEYRING_FILE: /run/splendor-auth/policy-keyring.json
      SPLENDOR_AUTHORITY_OBLIGATION_RECEIPT_CONFIG_FILE: /run/splendor-auth/authority-obligation-receipt-config.json
      SPLENDOR_TLS_CERT_FILE: /run/splendor-auth/resident-tls-cert.pem
      SPLENDOR_TLS_KEY_FILE: /run/splendor-auth/resident-tls-key.pem
    command: ["splendor-acceptance-action-host"]
    depends_on:
      acceptance-action-provider:
        condition: service_healthy
    volumes:
      - e2e-state:/var/lib/splendor
      - e2e-edge-auth:/run/splendor-auth:ro
      - e2e-provider-edge-auth:/run/splendor-provider-client:ro

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest

volumes:
  e2e-manager-auth:
  e2e-runner-auth:
  e2e-vpc-auth:
  e2e-cloud-auth:
  e2e-edge-auth:
  e2e-action-provider-auth:
  e2e-provider-runner-auth:
  e2e-provider-local-auth:
  e2e-provider-cloud-auth:
  e2e-provider-vpc-auth:
  e2e-provider-edge-auth:
  e2e-state:
