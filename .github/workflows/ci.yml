name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository without default token
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: C03 secret contract and fixture guard
        run: |
          /usr/bin/python3 -I scripts/security/check-secret-contracts.py --git-tree "${GITHUB_SHA}"
          sandbox="$(mktemp -d)"
          trap 'rm -rf "${sandbox}"' EXIT
          git archive "${GITHUB_SHA}" | tar -x -C "${sandbox}"
          (
            cd "${sandbox}"
            git init -q
            git add --all
            env -i HOME="${sandbox}" PATH="/usr/bin:/bin" /usr/bin/python3 -I scripts/security/check-secret-contracts.py --self-test
          )

  rust:
    needs: secret-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without default token
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default stable
      - name: FND-002 architecture dependency guard
        run: |
          python3 scripts/architecture/check-dependency-policy.py --self-test
          python3 scripts/architecture/check-dependency-policy.py
          python3 scripts/architecture/check-secret-provider-release-closure.py --self-test
          python3 scripts/architecture/check-secret-provider-release-closure.py
      - name: Rust fmt
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: 0.01 baseline local runtime conformance
        run: bash scripts/verify-0.01-baseline.sh
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Rust coverage
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 95

  python:
    needs: secret-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without default token
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python -m pip install --upgrade pip
      - name: Install Splendor SDK
        run: python -m pip install -e python/ pytest pytest-cov
      - name: Python tests
        run: pytest python/tests --cov=splendor --cov-fail-under=95

  typescript:
    needs: secret-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without default token
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install TypeScript deps
        run: npm ci
      - name: TypeScript tests
        run: npm test
      - name: TypeScript coverage
        run: npm run coverage

  docker:
    needs: secret-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without default token
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Docker deployment image smoke test
        run: bash scripts/container-tests.sh
